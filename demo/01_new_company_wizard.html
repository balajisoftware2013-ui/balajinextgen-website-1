<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Company Wizard — Balaji NextGen ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--orange:#f97316;--orange-dark:#ea580c;--blue:#1e3a8a;--green:#22c55e;--red:#ef4444;--bg:#dbeafe;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif;}
body{background:linear-gradient(135deg,#dbeafe,#eff6ff,#f8fafc);min-height:100vh;}
.top-header{background:white;border-bottom:1px solid #e2e8f0;padding:10px 24px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 10px rgba(0,0,0,.06);position:sticky;top:0;z-index:100;}
.header-logo{display:flex;align-items:center;gap:12px;}
.logo-icon{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#0f172a,#1e3a8a);display:flex;align-items:center;justify-content:center;font-size:18px;color:white;overflow:hidden;}
.logo-icon img{width:36px;height:36px;object-fit:contain;border-radius:8px;}
.brand h1{font-size:18px;font-weight:800;color:#0f172a;line-height:1.1;}
.brand h1 span{color:#ef4444;}
.brand p{font-size:8px;letter-spacing:2px;color:#64748b;font-weight:600;}
.header-right{display:flex;gap:8px;align-items:center;}
.live-dot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:pulse 1.5s infinite;}
.live-badge{display:flex;align-items:center;gap:5px;font-size:11px;color:#64748b;font-weight:600;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.hdr-btn{padding:7px 13px;border-radius:9px;border:none;font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:5px;transition:.2s;}
.hdr-btn:hover{opacity:.85;transform:translateY(-1px);}
.btn-dash{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:white;}
.btn-logout{background:linear-gradient(135deg,#ef4444,#dc2626);color:white;}
.status-bar{background:white;border-bottom:1px solid #e2e8f0;padding:6px 24px;display:flex;align-items:center;justify-content:space-between;font-size:11px;font-weight:600;}
.status-left{display:flex;gap:18px;flex-wrap:wrap;}
.status-item{display:flex;align-items:center;gap:5px;color:#64748b;}
.dot{width:7px;height:7px;border-radius:50%;}
.dot-green{background:#22c55e;}.dot-orange{background:#f59e0b;}.dot-gray{background:#94a3b8;}
.security-badge{background:#dcfce7;color:#166534;padding:3px 10px;border-radius:20px;font-size:10px;font-weight:700;}
.api-status{font-size:10px;font-weight:700;padding:3px 10px;border-radius:20px;}
.api-ok{background:#dcfce7;color:#166534;}
.api-err{background:#fee2e2;color:#991b1b;}
.api-wait{background:#fff7ed;color:#9a3412;}
.offline-badge{display:none;align-items:center;gap:5px;background:#fff7ed;border:1px solid #fed7aa;border-radius:7px;padding:3px 10px;font-size:10px;font-weight:700;color:#ea580c;}
.offline-badge.show{display:flex;}
.pending-pill{background:#f97316;color:white;border-radius:20px;padding:0 7px;font-size:10px;font-weight:800;margin-left:4px;}
.page-wrap{max-width:1400px;margin:0 auto;padding:15px 20px;}
.client-master-bar{background:white;border-radius:12px;border:1px solid #e2e8f0;padding:11px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 1px 6px rgba(0,0,0,.04);}
.cm-info{display:flex;align-items:center;gap:12px;}
.cm-badge{background:linear-gradient(135deg,#f97316,#ea580c);color:white;padding:5px 12px;border-radius:8px;font-size:11px;font-weight:800;}
.cm-text{font-size:11px;color:#64748b;font-weight:500;}
.cm-text strong{color:#0f172a;}
.cm-count{background:#eff6ff;color:#1e40af;padding:4px 10px;border-radius:7px;font-size:11px;font-weight:700;}
.wizard-banner{background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #bfdbfe;border-radius:14px;padding:12px 18px;display:flex;align-items:center;gap:10px;margin-bottom:18px;}
.wizard-banner h2{font-size:14px;font-weight:700;color:#1e3a8a;}
.stepper{background:white;border-radius:14px;padding:16px 20px;margin-bottom:18px;box-shadow:0 2px 8px rgba(0,0,0,.05);display:flex;align-items:center;overflow-x:auto;}
.step{display:flex;align-items:center;flex-shrink:0;}
.step-inner{display:flex;align-items:center;gap:7px;cursor:pointer;}
.step-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;transition:.3s;}
.step-num.done{background:#22c55e;color:white;}
.step-num.active{background:#f97316;color:white;box-shadow:0 0 0 3px rgba(249,115,22,.2);}
.step-num.pending{background:#e2e8f0;color:#94a3b8;}
.step-label{font-size:11px;font-weight:600;color:#64748b;white-space:nowrap;}
.step-label.active{color:#f97316;}.step-label.done{color:#22c55e;}
.step-connector{width:24px;height:2px;background:#e2e8f0;flex-shrink:0;margin:0 3px;}
.step-connector.done{background:#22c55e;}
.step-card{background:white;border-radius:18px;border:2px solid #fed7aa;box-shadow:0 4px 20px rgba(249,115,22,.08);padding:24px 28px 20px;}
.step-header{display:flex;align-items:center;gap:12px;margin-bottom:22px;}
.step-badge{width:36px;height:36px;border-radius:50%;background:#f97316;color:white;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.step-title h3{font-size:15px;font-weight:700;color:#0f172a;}
.step-title p{font-size:12px;color:#64748b;margin-top:2px;}
.form-grid{display:grid;gap:14px;}
.cols-4{grid-template-columns:repeat(4,1fr);}
.cols-3{grid-template-columns:repeat(3,1fr);}
.cols-2{grid-template-columns:repeat(2,1fr);}
.cols-1{grid-template-columns:1fr;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:12px;font-weight:700;color:#374151;}
.field label .req{color:#ef4444;}
.field input,.field select,.field textarea{padding:9px 12px;border:1.5px solid #e2e8f0;border-radius:10px;font-size:12px;background:#f8fafc;outline:none;transition:.2s;font-family:'Poppins',sans-serif;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:#f97316;background:white;box-shadow:0 0 0 3px rgba(249,115,22,.08);}
.field input[readonly]{background:#f0fdf4;border-color:#86efac;color:#166534;font-weight:700;cursor:default;}
.field input.field-error{border-color:#ef4444 !important;background:#fff5f5;}
.field .err-msg{font-size:10px;color:#ef4444;font-weight:600;display:none;}
.field .err-msg.show{display:block;}
.field textarea{resize:vertical;min-height:70px;}
.auto-tag{display:inline-flex;align-items:center;gap:4px;background:#dcfce7;border:1px solid #86efac;border-radius:7px;padding:2px 8px;font-size:10px;font-weight:700;color:#166534;margin-top:2px;}
.pick-grid{display:grid;gap:10px;}
.pick-grid.cols-4{grid-template-columns:repeat(4,1fr);}
.pick-grid.cols-6{grid-template-columns:repeat(6,1fr);}
.pick-card{border:2px solid #e2e8f0;border-radius:14px;padding:13px 10px;cursor:pointer;transition:.25s;text-align:center;background:#fafafa;}
.pick-card:hover{border-color:#f97316;background:#fff7ed;transform:translateY(-2px);}
.pick-card.selected{border-color:#f97316;background:linear-gradient(135deg,#fff7ed,#ffedd5);box-shadow:0 4px 14px rgba(249,115,22,.15);}
.pick-card .icon{font-size:26px;margin-bottom:5px;}
.pick-card h4{font-size:12px;font-weight:700;color:#0f172a;}
.pick-card p{font-size:10px;color:#64748b;margin-top:2px;line-height:14px;}
.pick-card .check{display:none;width:20px;height:20px;border-radius:50%;background:#22c55e;color:white;font-size:11px;align-items:center;justify-content:center;margin:5px auto 0;}
.pick-card.selected .check{display:flex;}
.ind-section-label{display:flex;align-items:center;gap:8px;background:linear-gradient(135deg,#fff7ed,#ffedd5);border:1.5px solid #fed7aa;border-radius:10px;padding:8px 14px;margin-bottom:12px;font-size:12px;font-weight:700;color:#ea580c;}
.ind-section-icon{width:24px;height:24px;border-radius:7px;background:#f97316;color:white;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;}
.ind-chosen-tag{margin-left:auto;background:#1e40af;color:white;padding:2px 10px;border-radius:20px;font-size:10px;font-weight:700;}
.mod-badge{position:absolute;top:-7px;right:8px;padding:2px 8px;border-radius:20px;font-size:9px;font-weight:800;letter-spacing:.5px;}
.mod-badge-fast{background:#f97316;color:white;}
.mod-badge-suite{background:#1e40af;color:white;}
.mod-badge-ai{background:linear-gradient(135deg,#7c3aed,#6d28d9);color:white;}
.mod-badge-card{padding-top:20px;}
.mod-card{position:relative;}
.mod-card .mod-sel-num{display:none;position:absolute;top:6px;left:6px;width:19px;height:19px;border-radius:50%;background:linear-gradient(135deg,#1e40af,#1d4ed8);color:white;font-size:10px;font-weight:800;align-items:center;justify-content:center;}
.mod-card.mod-selected{border-color:#1e40af !important;background:linear-gradient(135deg,#eff6ff,#dbeafe) !important;box-shadow:0 4px 14px rgba(30,64,175,.18) !important;}
.mod-card.mod-selected .mod-sel-num{display:flex;}
.mod-card.mod-selected .check{display:flex;background:#1e40af;}
.mod-card.mod-selected h4{color:#1e40af;}
.mod-counter-bar{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1.5px solid #bfdbfe;border-radius:10px;padding:8px 14px;margin-bottom:12px;}
.mod-counter-left{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:#1e40af;}
.mod-counter-pill{background:#1e40af;color:white;border-radius:20px;padding:1px 10px;font-size:11px;font-weight:800;min-width:24px;text-align:center;}
.mod-counter-right{display:flex;gap:6px;}
.mod-counter-btn{padding:4px 12px;border-radius:7px;border:1.5px solid #bfdbfe;background:white;font-size:10px;font-weight:700;cursor:pointer;color:#374151;transition:.2s;}
.mod-counter-btn:hover{border-color:#1e40af;color:#1e40af;background:#eff6ff;}
.plan-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
.plan-card{border:2px solid #e2e8f0;border-radius:14px;padding:14px 10px;cursor:pointer;text-align:center;background:#fafafa;position:relative;transition:.25s;}
.plan-card:hover{border-color:#f97316;background:#fff7ed;transform:translateY(-2px);}
.plan-card.selected{border-color:#f97316;background:linear-gradient(135deg,#fff7ed,#ffedd5);box-shadow:0 4px 14px rgba(249,115,22,.15);}
.plan-badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);color:white;font-size:9px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap;}
.plan-icon{font-size:26px;margin-bottom:5px;}
.plan-name{font-size:12px;font-weight:700;color:#0f172a;}
.plan-desc{font-size:9px;color:#64748b;margin:3px 0 6px;line-height:13px;}
.plan-price{font-size:15px;font-weight:800;}
.plan-check{display:none;width:20px;height:20px;border-radius:50%;background:#22c55e;color:white;font-size:11px;align-items:center;justify-content:center;margin:6px auto 0;}
.plan-card.selected .plan-check{display:flex;}
.db-visual{background:linear-gradient(135deg,#0f172a,#1e3a8a);border-radius:14px;padding:22px;text-align:center;color:white;margin-bottom:14px;}
.db-visual .db-icon{font-size:42px;margin-bottom:8px;}
.db-visual h3{font-size:15px;font-weight:700;}
.db-visual p{font-size:12px;color:#93c5fd;margin-top:4px;}
.progress-bar-wrap{background:#1e3a8a;border-radius:30px;height:10px;overflow:hidden;margin-top:14px;}
.progress-bar{height:100%;background:linear-gradient(135deg,#22c55e,#16a34a);border-radius:30px;transition:width .4s ease;width:0%;}
.db-steps-list{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
.db-step-item{display:flex;align-items:center;gap:8px;padding:8px 12px;border-radius:9px;font-size:12px;font-weight:600;background:#f8fafc;color:#64748b;border:1.5px solid #e2e8f0;}
.db-step-item.done{background:#dcfce7;color:#166534;border-color:#bbf7d0;}
.db-step-item.active{background:#fff7ed;color:#ea580c;border-color:#fed7aa;animation:blink .9s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.6;}}
.admin-avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#f97316,#ea580c);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 16px;color:white;font-weight:800;}
.step7-wrap{background:linear-gradient(135deg,#f0fdf4,#ecfdf5);border-radius:14px;padding:18px;border:1px solid #bbf7d0;}
.step7-success{text-align:center;padding:14px 0 8px;background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-radius:12px;margin-bottom:14px;border:1px solid #bbf7d0;}
.big-check{width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,#22c55e,#16a34a);color:white;font-size:28px;display:flex;align-items:center;justify-content:center;margin:0 auto 10px;box-shadow:0 6px 22px rgba(34,197,94,.3);}
.step7-success h2{font-size:18px;font-weight:800;color:#15803d;}
.step7-success p{font-size:12px;color:#166534;margin-top:4px;}
.step7-cred-box{background:linear-gradient(135deg,#eff6ff,#dbeafe);border-radius:16px;padding:20px;margin-bottom:14px;border:1.5px solid #bfdbfe;}
.step7-cred-box h3{font-size:14px;font-weight:700;margin-bottom:12px;color:#1e40af;}
.step7-cred-row{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:white;border-radius:9px;margin-bottom:7px;border:1px solid #e0f2fe;}
.step7-cred-label{font-size:10px;color:#0369a1;font-weight:600;}
.step7-cred-value{font-size:12px;font-weight:700;color:#0f172a;}
.step7-copy{background:#dbeafe;border:none;color:#1e40af;padding:3px 9px;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;}
.step7-send-options{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px;}
.step7-send-btn{padding:9px;border-radius:10px;border:2px solid #bfdbfe;background:#eff6ff;font-size:10px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;transition:.25s;color:#1e40af;}
.step7-send-btn:hover{border-color:#0ea5e9;background:#e0f2fe;}
.modules-summary{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;}
.mod-tag{display:inline-flex;align-items:center;gap:4px;background:#eff6ff;border:1px solid #bfdbfe;color:#1e40af;border-radius:20px;padding:2px 10px;font-size:10px;font-weight:700;}
.save-status{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:12px;font-weight:600;display:none;align-items:center;gap:7px;}
.save-status.saving{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;display:flex;}
.save-status.saved{background:#dcfce7;border:1px solid #86efac;color:#166534;display:flex;}
.save-status.error{background:#fee2e2;border:1px solid #fca5a5;color:#991b1b;display:flex;}
.save-status.offline{background:#fefce8;border:1px solid #fde047;color:#92400e;display:flex;}
.dup-banner{display:none;align-items:center;gap:10px;background:#fff7ed;border:1.5px solid #fed7aa;border-radius:12px;padding:12px 16px;margin-bottom:14px;font-size:12px;font-weight:600;color:#9a3412;}
.dup-banner.show{display:flex;}
.dup-banner .dup-icon{font-size:20px;flex-shrink:0;}
.open-dash-btn{width:100%;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#7c3aed,#6d28d9);color:white;font-size:13px;font-weight:800;cursor:pointer;margin-top:8px;transition:.2s;box-shadow:0 5px 18px rgba(124,58,237,.25);}
.open-module-btn{width:100%;padding:12px;border-radius:12px;border:none;background:linear-gradient(135deg,#0ea5e9,#0284c7);color:white;font-size:13px;font-weight:800;cursor:pointer;margin-top:8px;transition:.2s;box-shadow:0 5px 18px rgba(14,165,233,.25);display:flex;align-items:center;justify-content:center;gap:7px;}
.open-dash-btn:hover,.open-module-btn:hover{transform:translateY(-2px);}
.wizard-nav{display:flex;align-items:center;justify-content:space-between;margin-top:18px;}
.btn-prev{padding:10px 20px;border-radius:10px;border:2px solid #e2e8f0;background:white;font-size:12px;font-weight:700;cursor:pointer;color:#374151;transition:.2s;display:flex;align-items:center;gap:7px;}
.btn-prev:hover{border-color:#94a3b8;background:#f8fafc;}
.btn-next{padding:10px 24px;border-radius:10px;border:none;background:linear-gradient(135deg,#f97316,#ea580c);color:white;font-size:12px;font-weight:700;cursor:pointer;transition:.2s;display:flex;align-items:center;gap:7px;box-shadow:0 4px 12px rgba(249,115,22,.3);}
.btn-next:hover{opacity:.9;transform:translateY(-1px);}
.btn-next:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-finish{background:linear-gradient(135deg,#22c55e,#16a34a) !important;box-shadow:0 4px 12px rgba(34,197,94,.3) !important;}
.toast{position:fixed;bottom:20px;right:20px;background:#0f172a;color:white;padding:10px 16px;border-radius:10px;font-size:12px;font-weight:600;display:none;z-index:9999;box-shadow:0 6px 22px rgba(0,0,0,.2);animation:slideUp .3s ease;}
@keyframes slideUp{from{transform:translateY(20px);opacity:0;}to{transform:translateY(0);opacity:1;}}
@media(max-width:900px){
  .cols-4,.cols-3{grid-template-columns:repeat(2,1fr);}
  .pick-grid.cols-4,.pick-grid.cols-6{grid-template-columns:repeat(2,1fr);}
  .plan-grid{grid-template-columns:repeat(2,1fr);}
}
@media(max-width:600px){
  .page-wrap{padding:12px;}
  .step-card{padding:16px 14px;}
  .cols-4,.cols-3,.cols-2{grid-template-columns:1fr;}
  .plan-grid{grid-template-columns:1fr 1fr;}
  .top-header{padding:8px 12px;flex-wrap:wrap;gap:6px;}
}
</style>
</head>
<body>

<!-- HEADER -->
<div class="top-header">
  <div class="header-logo">
    <div class="logo-icon"><img src="assets/logos/logo.png" alt="Logo" onerror="this.style.display='none';this.parentElement.textContent='⚡';"></div>
    <div class="brand"><h1>BALAJI <span>NEXTGEN</span></h1><p>ENTERPRISE ERP ECOSYSTEM</p></div>
  </div>
  <div class="header-right">
    <div class="live-badge"><div class="live-dot"></div>Live · <span id="clock">--:--:-- --</span></div>
    <div class="offline-badge" id="offlineBadge">📴 Offline · <span class="pending-pill" id="pendingCount">0</span> pending</div>
    <button class="hdr-btn btn-dash" onclick="window.open('02_client_master_dashboard.html','_blank')">📊 Dashboard</button>
    <button class="hdr-btn btn-logout" onclick="logoutUser()">🚪 Logout</button>
  </div>
</div>

<!-- STATUS BAR -->
<div class="status-bar">
  <div class="status-left">
    <div class="status-item"><div class="dot dot-green"></div>System: <span id="netStatus">ONLINE</span></div>
    <div class="status-item"><div class="dot dot-orange"></div>Google Sheets: <span id="sheetStatus">Checking…</span></div>
    <div class="status-item"><div class="dot dot-green"></div>Auth: Active</div>
    <div class="status-item">API: <span class="api-status api-wait" id="apiStatusBadge">Connecting…</span></div>
  </div>
  <div><span style="font-size:11px;font-weight:600;color:#64748b;">Security:</span> <span class="security-badge">MAXIMUM</span></div>
</div>

<!-- MAIN -->
<div class="page-wrap">
  <div class="client-master-bar">
    <div class="cm-info">
      <span class="cm-badge">📋 CLIENT MASTER</span>
      <div class="cm-text">Next Auto ID: <strong id="nextClientId">Loading…</strong> &nbsp;|&nbsp; Last Registered: <strong id="lastClient">—</strong></div>
    </div>
    <span class="cm-count" id="totalClients">0 Clients</span>
  </div>

  <div class="wizard-banner">
    <div style="font-size:18px;">⚙️</div>
    <h2>New Company Setup Wizard</h2>
  </div>

  <div class="stepper" id="stepper"></div>
  <div class="step-card" id="stepCard"></div>
  <div class="wizard-nav">
    <button class="btn-prev" id="btnPrev" onclick="prevStep()">← Back</button>
    <button class="btn-next" id="btnNext" onclick="nextStep()">Next Step →</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════════════════
//  CONFIG — PASTE YOUR DEPLOYED APPS SCRIPT URL HERE
// ══════════════════════════════════════════════════════════════════
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz39r1zo4LGqHJXpwDsQFulHdp3qsjiLRxRiSIEBBObI_3310_n2izF_gAjofaIHgSJ/exec';

// ══════════════════════════════════════════════════════════════════
//  OFFLINE / ONLINE ENGINE
// ══════════════════════════════════════════════════════════════════
const OFFLINE_PREFIX = 'BALAJI_PENDING_';

async function saveData(payload) {
  try {
    const response = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(payload),
    });
    if (!response.ok) throw new Error('Server ' + response.status);
    const result = await response.json();
    removeOfflineData(payload.clientData?.CLIENT_ID || payload.clientId);
    return { ...result, mode: 'ONLINE' };
  } catch (err) {
    console.warn('[OFFLINE] Saving locally:', err.message);
    saveOfflineData(payload);
    return { success: true, mode: 'OFFLINE', offline: true };
  }
}

function saveOfflineData(payload) {
  const id = payload.clientData?.CLIENT_ID || payload.clientId || ('ID' + Date.now());
  localStorage.setItem(OFFLINE_PREFIX + id, JSON.stringify(payload));
  updateOfflineBadge();
}

function removeOfflineData(id) {
  if (!id) return;
  localStorage.removeItem(OFFLINE_PREFIX + id);
  updateOfflineBadge();
}

function getPendingCount() {
  let count = 0;
  for (let i = 0; i < localStorage.length; i++) {
    if (localStorage.key(i).startsWith(OFFLINE_PREFIX)) count++;
  }
  return count;
}

function updateOfflineBadge() {
  const count   = getPendingCount();
  const badge   = document.getElementById('offlineBadge');
  const pill    = document.getElementById('pendingCount');
  const netStat = document.getElementById('netStatus');
  if (!navigator.onLine || count > 0) {
    badge.classList.add('show');
    pill.textContent = count;
    netStat.textContent = navigator.onLine ? 'ONLINE (' + count + ' pending)' : 'OFFLINE';
  } else {
    badge.classList.remove('show');
    netStat.textContent = 'ONLINE';
  }
}

async function syncPendingData() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const k = localStorage.key(i);
    if (k && k.startsWith(OFFLINE_PREFIX)) keys.push(k);
  }
  if (!keys.length) return;
  for (const key of keys) {
    try {
      const payload = JSON.parse(localStorage.getItem(key));
      const res = await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify(payload),
      });
      if (res.ok) {
        const r = await res.json();
        if (r.status === 'success' || r.success) {
          localStorage.removeItem(key);
          toast('✅ Synced offline record');
        }
      }
    } catch (e) { console.warn('[SYNC] Failed:', e.message); }
  }
  updateOfflineBadge();
}

window.addEventListener('online',  () => { updateOfflineBadge(); syncPendingData(); });
window.addEventListener('offline', () => { updateOfflineBadge(); });
window.addEventListener('load',    () => { setTimeout(syncPendingData, 3000); updateOfflineBadge(); });

function logoutUser() {
  const token = sessionStorage.getItem('erp_token') || localStorage.getItem('erpToken');
  if (token) {
    const payload = JSON.stringify({ action: 'LOGOUT', token });
    navigator.sendBeacon(APPS_SCRIPT_URL, new Blob([payload], { type: 'text/plain' }));
  }
  localStorage.removeItem('erpUser');
  localStorage.removeItem('erpToken');
  sessionStorage.clear();
  window.location.replace('../index.html');
}

function updateClock(){
  const n=new Date();let h=n.getHours(),m=n.getMinutes(),s=n.getSeconds(),a=h>=12?'PM':'AM';
  h=h%12||12;document.getElementById('clock').textContent=`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} ${a}`;
}
setInterval(updateClock,1000); updateClock();

function toast(msg,dur=2500){
  const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';
  clearTimeout(window._toastTm);window._toastTm=setTimeout(()=>t.style.display='none',dur);
}

async function api(action,payload={}){
  try{
    const res=await fetch(APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify({action,...payload})});
    return await res.json();
  }catch(e){return{success:false,error:e.message};}
}

async function loadStats(){
  const badge=document.getElementById('apiStatusBadge');
  const r=await api('GET_CLIENT_STATUS');

  if(r.status === 'success' || r.success){
    badge.className='api-status api-ok'; badge.textContent='Connected ✓';
    document.getElementById('sheetStatus').textContent='Connected';
    autoClientId=r.nextClientId||'CL00001';
    totalClientCount=r.total||0;
    document.getElementById('nextClientId').textContent=autoClientId;
    document.getElementById('totalClients').textContent=totalClientCount+' Clients';
    document.getElementById('lastClient').textContent=r.lastClient||'—';
    data.clientId=autoClientId;
    renderAll();
  }else{
    badge.className='api-status api-err'; badge.textContent='No Connection';
    document.getElementById('sheetStatus').textContent='Not Connected';
    const pending=getPendingCount();
    autoClientId='CL'+String(totalClientCount+pending+1).padStart(5,'0');
    data.clientId=autoClientId;
    document.getElementById('nextClientId').textContent=autoClientId+' (offline)';
    renderAll();
  }
}
loadStats();

function renderStepper(){
  document.getElementById('stepper').innerHTML=STEPS.map((s,i)=>{
    const cls=i<current?'done':i===current?'active':'pending';
    const lCls=i<current?'done':i===current?'active':'';
    const conn=i<STEPS.length-1?`<div class="step-connector ${i<current?'done':''}"></div>`:'';
    return `<div class="step"><div class="step-inner" onclick="jumpTo(${i})"><div class="step-num ${cls}">${i<current?'✓':i+1}</div><div class="step-label ${lCls}">${s.label}</div></div>${conn}</div>`;
  }).join('');
}
function jumpTo(i){if(i<=current){current=i;renderAll();}}
function renderAll(){renderStepper();renderStep();renderNav();}
function renderNav(){
  document.getElementById('btnPrev').style.display=current===0?'none':'flex';
  const btn=document.getElementById('btnNext');
  btn.textContent=current===6?'🎉 Complete Setup':'Next Step →';
  current===6?btn.classList.add('btn-finish'):btn.classList.remove('btn-finish');
}
function renderStep(){
  const renders=[r1,r2,r3,r4,r5,r6,r7];
  document.getElementById('stepCard').innerHTML=renders[current]();
  if(current===4)startDbGeneration();
}

//  VALIDATION & NAVIGATION
// ══════════════════════════════════════════════════════════════════
function setErr(id, msg){
  const el=document.getElementById(id); if(el) el.classList.add('field-error');
}
function clearErr(input){ input.classList.remove('field-error'); }

function validate(){
  if(current===0 && (!data.contactName || !data.phone || !data.email)) return false;
  if(current===1 && !data.companyName) return false;
  if(current===2 && (!data.industry || data.modules.length===0)) return false;
  if(current===3 && !data.plan) return false;
  return true;
}

async function nextStep(){
  if(!validate()){ toast('⚠️ Please complete all required fields'); return; }
  if(current===6) return;
  current++; renderAll();
  window.scrollTo(0,0);
}
function prevStep(){
  if(current===0)return;
  current--; renderAll();
}

async function saveToSheets(){
  const ss=document.getElementById('saveStatus');
  ss.className='save-status saving'; ss.textContent='⏳ Uploading to Google Sheets...';

  const payload={
    action:'REGISTER_CLIENT',
    clientData:{
      CLIENT_ID: data.clientId,
      COMPANY_NAME: data.companyName,
      CONTACT_NAME: data.contactName,
      PHONE: data.phone,
      EMAIL: data.email,
      INDUSTRY: data.industry,
      MODULES: data.modules.join(', '),
      PLAN: data.plan,
      ADMIN_USERNAME: data.adminUsername,
      ADMIN_PASSWORD: data.adminPassword,
      STATUS: 'ACTIVE',
      REGISTERED_AT: new Date().toISOString()
    }
  };

  const r = await saveData(payload);
  if(r.status==='success' || r.success){
    ss.className='save-status saved';
    ss.textContent='✅ Successfully Registered!';
    toast('🎉 Setup Complete!');
    setTimeout(()=> window.location.reload(), 3000);
  } else {
    ss.className='save-status error';
    ss.textContent='❌ Error: ' + (r.message || 'Check Connection');
  }
}
