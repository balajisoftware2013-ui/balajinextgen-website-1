<!-- PROGRESS MODAL -->
<div id="importProgressModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:9999; display:flex; align-items:center; justify-content:center;">
  <div style="background:white; border-radius:12px; padding:32px; width:90%; max-width:500px; box-shadow:0 10px 40px rgba(0,0,0,0.3);">
    
    <!-- HEADER -->
    <div style="margin-bottom:24px;">
      <h2 id="progressTitle" style="margin:0 0 8px 0; color:#333; font-size:20px; font-weight:600;">Importing Data</h2>
      <p id="progressStatus" style="margin:0; color:#666; font-size:14px;">Initializing...</p>
    </div>

    <!-- PROGRESS BAR -->
    <div style="background:#f0f0f0; border-radius:8px; height:28px; overflow:hidden; margin-bottom:16px;">
      <div id="progressBar" style="background:linear-gradient(90deg, #ff9800, #f57c00); height:100%; width:0%; transition:width 0.3s ease; display:flex; align-items:center; justify-content:center; color:white; font-size:12px; font-weight:600;">
        <span id="progressPercent">0%</span>
      </div>
    </div>

    <!-- DETAILS -->
    <div id="progressDetails" style="background:#f9f9f9; border-radius:8px; padding:16px; margin-bottom:16px; font-size:13px; color:#333; max-height:120px; overflow-y:auto;">
      <div id="progressLog" style="line-height:1.6;"></div>
    </div>

    <!-- SUMMARY (shown after import) -->
    <div id="progressSummary" style="display:none; background:#e8f5e9; border-radius:8px; padding:16px; margin-bottom:16px; border-left:4px solid #4caf50;">
      <div style="font-weight:600; color:#2e7d32; margin-bottom:8px;">✓ Import Summary</div>
      <div style="font-size:13px; color:#333; line-height:1.8;">
        <div>Invoices: <span id="summaryInvoices">0</span></div>
        <div>Items: <span id="summaryItems">0</span></div>
        <div>New Parties: <span id="summaryParties">0</span></div>
        <div style="margin-top:8px; color:#d32f2f;" id="summaryErrors" style="display:none;">Errors: <span id="errorCount">0</span></div>
      </div>
    </div>

    <!-- ACTION BUTTONS -->
    <div style="display:flex; gap:12px;">
      <button id="progressRetryBtn" style="display:none; flex:1; padding:12px; background:#2196F3; color:white; border:none; border-radius:6px; cursor:pointer; font-size:14px; font-weight:600;" onclick="location.reload();">Retry Import</button>
      <button id="progressCloseBtn" style="display:none; flex:1; padding:12px; background:#4caf50; color:white; border:none; border-radius:6px; cursor:pointer; font-size:14px; font-weight:600;" onclick="closeImportProgress(); loadData();">Done</button>
    </div>
  </div>
</div>

<!-- CONFIRMATION MODAL (for success) -->
<div id="importConfirmModal" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.5); z-index:10000; display:flex; align-items:center; justify-content:center;">
  <div style="background:white; border-radius:12px; padding:40px; width:90%; max-width:500px; box-shadow:0 10px 40px rgba(0,0,0,0.3); text-align:center;">
    
    <div id="confirmIcon" style="font-size:56px; margin-bottom:16px;">✓</div>
    <h2 id="confirmTitle" style="margin:0 0 16px 0; color:#333; font-size:24px; font-weight:600;">Import Successful</h2>
    <p id="confirmMessage" style="margin:0 0 24px 0; color:#666; font-size:14px; line-height:1.6;"></p>
    
    <button id="confirmActionBtn" style="width:100%; padding:14px; background:#4caf50; color:white; border:none; border-radius:6px; cursor:pointer; font-size:15px; font-weight:600;" onclick="confirmAction();">Reload Data</button>
  </div>
</div>

<!-- ════════════════════════════════════════════════════════════════════════════════
     JAVASCRIPT FUNCTIONS - Add these to your script section
     ════════════════════════════════════════════════════════════════════════════════ -->

<script>
// Show import progress modal with initial state
function showImportProgress(title = 'Importing Data') {
  document.getElementById('importProgressModal').style.display = 'flex';
  document.getElementById('progressTitle').textContent = title;
  updateImportProgress(0, 'Initializing...');
  document.getElementById('progressDetails').innerHTML = '';
  document.getElementById('progressLog').innerHTML = '';
  document.getElementById('progressSummary').style.display = 'none';
  document.getElementById('progressRetryBtn').style.display = 'none';
  document.getElementById('progressCloseBtn').style.display = 'none';
}

// Update progress bar and status
function updateImportProgress(percentage, status) {
  const progressBar = document.getElementById('progressBar');
  const progressPercent = document.getElementById('progressPercent');
  const progressStatus = document.getElementById('progressStatus');
  
  // Smooth animation to new percentage
  progressBar.style.width = percentage + '%';
  progressPercent.textContent = Math.round(percentage) + '%';
  progressStatus.textContent = status;
  
  // Add log entry
  const logDiv = document.getElementById('progressLog');
  const timestamp = new Date().toLocaleTimeString();
  const logEntry = document.createElement('div');
  logEntry.textContent = `[${timestamp}] ${status}`;
  logEntry.style.color = percentage >= 100 ? '#4caf50' : '#666';
  logDiv.appendChild(logEntry);
  logDiv.parentElement.scrollTop = logDiv.parentElement.scrollHeight;
}

// Show completion with summary
function showImportCompletion(result) {
  // Update progress bar to 100%
  document.getElementById('progressBar').style.width = '100%';
  document.getElementById('progressPercent').textContent = '100%';
  
  const { success, summary = {}, errors = [] } = result;
  
  // Show summary section
  const summaryDiv = document.getElementById('progressSummary');
  summaryDiv.style.display = 'block';
  
  document.getElementById('summaryInvoices').textContent = summary.invoicesProcessed || 0;
  document.getElementById('summaryItems').textContent = summary.lineItemsProcessed || 0;
  document.getElementById('summaryParties').textContent = (summary.suppliersCreated || 0) + (summary.customersCreated || 0);
  
  if (errors.length > 0) {
    document.getElementById('summaryErrors').style.display = 'block';
    document.getElementById('errorCount').textContent = errors.length;
  }
  
  // Show action buttons
  if (success) {
    document.getElementById('progressTitle').textContent = '✓ Import Complete';
    document.getElementById('progressStatus').textContent = 'All data imported successfully';
    document.getElementById('progressStatus').style.color = '#4caf50';
    document.getElementById('progressCloseBtn').style.display = 'block';
  } else {
    document.getElementById('progressTitle').textContent = '✗ Import Failed';
    document.getElementById('progressStatus').textContent = result.message || 'An error occurred';
    document.getElementById('progressStatus').style.color = '#d32f2f';
    document.getElementById('progressRetryBtn').style.display = 'block';
  }
}

// Close progress modal
function closeImportProgress() {
  document.getElementById('importProgressModal').style.display = 'none';
}

// Show confirmation modal
function showConfirmation(title, message) {
  document.getElementById('confirmTitle').textContent = title;
  document.getElementById('confirmMessage').textContent = message;
  document.getElementById('importConfirmModal').style.display = 'flex';
}

// Execute confirmation action
function confirmAction() {
  document.getElementById('importConfirmModal').style.display = 'none';
  loadData();
}

// For PURCHASES import
async function handlePurchaseFileImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  
  showImportProgress('Importing Purchases');
  
  try {
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        // Parse Excel file
        updateImportProgress(15, 'Parsing Excel file...');
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(worksheet);
        
        updateImportProgress(30, 'Preparing data...');
        const prepResp = await google.script.run.withSuccessHandler(handlePrepSuccess)
          .withFailureHandler(handlePrepError)
          .PREPARE_PURCHASE_DATA_FROM_EXCEL({ rawData: jsonData });
        
        updateImportProgress(45, 'Sending to backend...');
        const importResp = await google.script.run.withSuccessHandler(handleImportSuccess)
          .withFailureHandler(handleImportError)
          .IMPORT_PURCHASES_BATCH({
            sheetId: CLIENT_SHEET_ID,
            purchaseData: prepResp.prepared
          });
        
        // Show completion
        showImportCompletion(importResp);
        
      } catch (err) {
        console.error('Import error:', err);
        updateImportProgress(0, 'Error: ' + err.message);
        showImportCompletion({ success: false, message: err.message });
      }
    };
    reader.readAsArrayBuffer(file);
    
  } catch (err) {
    console.error('File read error:', err);
    closeImportProgress();
    alert('Error reading file: ' + err.message);
  }
}

  if (!file) return;
  
  showImportProgress('Importing Sales');
  
  try {
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        updateImportProgress(15, 'Parsing Excel file...');
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
        const jsonData = XLSX.utils.sheet_to_json(worksheet);
        
        updateImportProgress(30, 'Preparing data...');
        const prepResp = await google.script.run.withSuccessHandler(handlePrepSuccess)
          .withFailureHandler(handlePrepError)
          .PREPARE_SALES_DATA_FROM_EXCEL({ rawData: jsonData });
        
        updateImportProgress(45, 'Sending to backend...');
        const importResp = await google.script.run.withSuccessHandler(handleImportSuccess)
          .withFailureHandler(handleImportError)

        showImportCompletion(importResp);
        
      } catch (err) {
        console.error('Import error:', err);

// Handle prep success
function handlePrepSuccess(result) {
  console.log('Prep success:', result);
  return result;
}

// Handle prep error
function handlePrepError(error) {
  console.error('Prep error:', error);
  updateImportProgress(0, 'Preparation failed: ' + error.message);
  showImportCompletion({ success: false, message: error.message });
}

// Handle import success
function handleImportSuccess(result) {
  console.log('Import success:', result);
  return result;
}

// Handle import error
function handleImportError(error) {
  console.error('Import error:', error);
  updateImportProgress(0, 'Import failed: ' + error.message);
  showImportCompletion({ success: false, message: error.message });
}

// Data reset with progress confirmation
async function resetAllDataWithConfirmation() {
  const confirmed = confirm('⚠️ WARNING: This will DELETE ALL DATA from this database.\n\nAre you absolutely sure? This cannot be undone!');
  if (!confirmed) return;
  
  const doubleCheck = prompt('Type "DELETE ALL" (exactly) to confirm complete data deletion:');
  if (doubleCheck !== 'DELETE ALL') {
    alert('Reset cancelled.');
    return;
  }
  
  showImportProgress('Resetting Database');
  updateImportProgress(20, 'Clearing data tables...');
  
  try {
    const result = await google.script.run.withSuccessHandler(onResetSuccess)
      .withFailureHandler(onResetError)
      .RESET_ALL_DATA({ sheetId: CLIENT_SHEET_ID });
    
    console.log('Reset result:', result);
    
  } catch (err) {
    console.error('Reset error:', err);
    updateImportProgress(0, 'Reset failed: ' + err.message);
  }
}

function onResetSuccess(result) {
  if (result.success) {
    updateImportProgress(100, `✓ Database reset complete — ${result.clearedTabs.length} tables cleared`);
    showConfirmation(
      '✓ Reset Complete',
      `All data has been successfully deleted.\n\nCleared tables:\n${result.clearedTabs.join(', ')}`
    );
    setTimeout(() => {
      closeImportProgress();
      location.reload();
    }, 2000);
  } else {
    updateImportProgress(0, 'Reset failed: ' + result.message);
  }
}

function onResetError(error) {
  console.error('Reset error:', error);
  updateImportProgress(0, 'Reset failed: ' + error.message);
}

</script>
