<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Balaji Service360 - AI-Powered Service Marketplace Platform">
<meta name="keywords" content="service booking, gig economy, home services, urban company alternative">
<title>Balaji Service360 | Connect. Book. Pay. Done.</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#b85e1c">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Service360">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  :root {
    --ink: #3f2c1c;
    --paper: #fdf5e8;
    --card: #fffdf9;
    --line: #f0dcb8;
    --brand: #e2812f;
    --brand-dark: #b85e1c;
    --brand-soft: #fce8d1;
    --gold: #d9a441;
    --danger: #c0392b;
    --success: #27ae60;
    --warning: #f39c12;
    --muted: #8c7457;
    --light-bg: #f9f7f3;
    --radius: 14px;
    --shadow: 0 2px 8px rgba(0,0,0,0.08);
    --shadow-lg: 0 8px 24px rgba(0,0,0,0.12);
    font-size: 16px;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow-x: hidden;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 80px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3, h4, h5, h6 {
    font-family: 'Georgia', 'Times New Roman', serif;
    font-weight: 700;
    line-height: 1.2;
  }

  /* ===== TOPBAR ===== */
  .topbar {
    background: var(--brand-dark);
    color: #fff;
    padding: 12px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 50;
    box-shadow: var(--shadow);
  }

  .topbar .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
  }

  .topbar .mark {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background: rgba(255,255,255,0.1);
  }

  .topbar .title {
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 0.3px;
  }

  .topbar .sub {
    font-size: 10px;
    opacity: 0.75;
    margin-top: -2px;
  }

  .topbar .actions {
    display: flex;
    gap: 8px;
    align-items: center;
  }

  .topbar button.linklike {
    background: none;
    border: 1px solid rgba(255,255,255,0.35);
    color: #fff;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    transition: 0.2s;
  }

  .topbar button.linklike:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.6);
  }

  /* ===== MAIN CONTAINER ===== */
  .wrap {
    max-width: 540px;
    margin: 0 auto;
    padding: 16px;
  }

  /* ===== HERO ===== */
  .hero {
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
    color: #fff;
    border-radius: var(--radius);
    padding: 24px 20px;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
  }

  .hero::after {
    content: "";
    position: absolute;
    right: -30px;
    bottom: -40px;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: rgba(201,138,44,0.15);
  }

  .hero h1 {
    font-size: 22px;
    line-height: 1.3;
    position: relative;
    z-index: 1;
  }

  .hero p {
    font-size: 13px;
    opacity: 0.85;
    margin-top: 6px;
    max-width: 340px;
    position: relative;
    z-index: 1;
  }

  /* ===== ROLE GRID ===== */
  .role-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 16px;
  }

  .role-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 12px;
    text-align: center;
    cursor: pointer;
    transition: 0.15s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: var(--shadow);
  }

  .role-card:active {
    transform: scale(0.98);
  }

  .role-card:hover {
    border-color: var(--brand);
    transform: translateY(-2px);
    box-shadow: var(--shadow-lg);
  }

  .role-card .icon {
    font-size: 32px;
    margin-bottom: 8px;
  }

  .role-card .label {
    font-weight: 700;
    font-size: 14px;
    color: var(--ink);
  }

  .role-card .sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
  }

  /* ===== CARDS ===== */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
    box-shadow: var(--shadow);
  }

  .card h2 {
    font-size: 17px;
    margin-bottom: 14px;
    color: var(--brand-dark);
  }

  .card h3 {
    font-size: 15px;
    margin-bottom: 12px;
    color: var(--ink);
  }

  /* ===== FIELDS ===== */
  .field {
    margin-bottom: 12px;
  }

  .field label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 5px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .field input,
  .field select,
  .field textarea {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--line);
    border-radius: 9px;
    font-size: 14.5px;
    background: #fcfcfa;
    color: var(--ink);
    font-family: inherit;
    transition: 0.2s;
  }

  .field input:focus,
  .field select:focus,
  .field textarea:focus {
    outline: 2px solid var(--brand);
    outline-offset: 1px;
    border-color: var(--brand);
    background: #fff;
  }

  .field input::placeholder,
  .field textarea::placeholder {
    color: #aaa;
  }

  .field textarea {
    resize: vertical;
    min-height: 80px;
  }

  .field.error input,
  .field.error select {
    border-color: var(--danger);
  }

  .field-error {
    font-size: 11px;
    color: var(--danger);
    margin-top: 4px;
  }

  /* ===== GRID HELPERS ===== */
  .row2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .row3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
  }

  .row4 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 6px;
  }

  /* ===== BUTTONS ===== */
  .btn {
    display: inline-block;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 10px;
    background: var(--brand);
    color: #fff;
    font-size: 14.5px;
    font-weight: 700;
    cursor: pointer;
    letter-spacing: 0.2px;
    text-align: center;
    transition: 0.2s;
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .btn:hover {
    background: var(--brand-dark);
    box-shadow: var(--shadow-lg);
  }

  .btn:active {
    transform: scale(0.98);
  }

  .btn.ghost {
    background: none;
    border: 1.5px solid var(--brand);
    color: var(--brand);
    box-shadow: none;
  }

  .btn.ghost:hover {
    background: var(--brand-soft);
  }

  .btn.gold {
    background: var(--gold);
    color: #3a2705;
  }

  .btn.gold:hover {
    background: #c9942b;
  }

  .btn.danger {
    background: var(--danger);
  }

  .btn.danger:hover {
    background: #a03122;
  }

  .btn.success {
    background: var(--success);
  }

  .btn.success:hover {
    background: #1e8449;
  }

  .btn.small {
    width: auto;
    padding: 8px 14px;
    font-size: 12.5px;
  }

  .btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
  }

  .btn-row {
    display: flex;
    gap: 10px;
    width: 100%;
  }

  .btn-row .btn {
    flex: 1;
  }

  .linkbtn {
    background: none;
    border: none;
    color: var(--brand);
    font-weight: 600;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    padding: 0;
  }

  .linkbtn:hover {
    color: var(--brand-dark);
  }

  /* ===== HELPER TEXT ===== */
  .helper {
    font-size: 12px;
    color: var(--muted);
    margin-top: 8px;
    text-align: center;
  }

  /* ===== STATUS PILLS ===== */
  .status-pill {
    display: inline-block;
    font-size: 10px;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 20px;
    background: var(--brand-soft);
    color: var(--brand-dark);
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }

  .status-pill.pending {
    background: #fbe9d0;
    color: #8a5a12;
  }

  .status-pill.active {
    background: #d4edda;
    color: #155724;
  }

  .status-pill.completed {
    background: #d4edda;
    color: #155724;
  }

  .status-pill.cancelled {
    background: #f8d7da;
    color: #721c24;
  }

  .status-pill.rejected {
    background: #f8d7da;
    color: #721c24;
  }

  /* ===== PROFILE ===== */
  .profile-head {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }

  .avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--brand) 0%, var(--brand-dark) 100%);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: var(--shadow);
  }

  .profile-head .name {
    font-weight: 700;
    font-size: 16px;
  }

  .profile-head .meta {
    font-size: 12px;
    color: var(--muted);
  }

  .profile-head .role-badge {
    display: inline-block;
    background: var(--gold);
    color: #3a2705;
    padding: 3px 8px;
    border-radius: 12px;
    font-size: 10px;
    font-weight: 700;
    margin-top: 3px;
  }

  /* ===== STATS ===== */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 12px;
  }

  .stat-grid.three {
    grid-template-columns: 1fr 1fr 1fr;
  }

  .stat {
    background: var(--brand-soft);
    border-radius: 10px;
    padding: 14px;
    text-align: center;
    border: 1px solid var(--line);
  }

  .stat .num {
    font-size: 22px;
    font-weight: 800;
    color: var(--brand-dark);
    font-family: Georgia, serif;
  }

  .stat .lbl {
    font-size: 11px;
    color: var(--muted);
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.2px;
  }

  /* ===== EMPTY STATE ===== */
  .empty {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
    font-size: 13.5px;
  }

  .empty-icon {
    font-size: 48px;
    margin-bottom: 12px;
    opacity: 0.6;
  }

  /* ===== LIST ITEMS ===== */
  .list-item {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: 0.15s;
    background: var(--card);
  }

  .list-item:active {
    transform: scale(0.98);
  }

  .list-item:hover {
    border-color: var(--brand);
    box-shadow: var(--shadow);
  }

  .list-item .li-title {
    font-weight: 700;
    font-size: 13.5px;
  }

  .list-item .li-sub {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 2px;
  }

  .list-item .li-right {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .list-item .li-badge {
    background: var(--brand-soft);
    color: var(--brand-dark);
    padding: 4px 8px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 700;
  }

  /* ===== BOTTOM NAV ===== */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
    border-top: 1px solid var(--line);
    display: flex;
    z-index: 50;
    box-shadow: 0 -2px 8px rgba(0,0,0,0.08);
    padding-bottom: max(0px, env(safe-area-inset-bottom));
  }

  .bottom-nav button {
    flex: 1;
    background: none;
    border: none;
    padding: 10px 4px 8px;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: 0.15s;
    text-transform: uppercase;
    letter-spacing: 0.2px;
  }

  .bottom-nav button.active {
    color: var(--brand);
    font-weight: 700;
  }

  .bottom-nav .ic {
    font-size: 20px;
  }

  /* ===== TOAST ===== */
  .toast {
    position: fixed;
    top: 70px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--brand-dark);
    color: #fff;
    padding: 12px 20px;
    border-radius: 10px;
    font-size: 13px;
    z-index: 200;
    box-shadow: var(--shadow-lg);
    max-width: 90%;
    text-align: center;
    animation: slideDown 0.3s ease-out;
  }

  .toast.error {
    background: var(--danger);
  }

  .toast.success {
    background: var(--success);
  }

  @keyframes slideDown {
    from {
      opacity: 0;
      transform: translateX(-50%) translateY(-20px);
    }
    to {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  }

  .hidden {
    display: none !important;
  }

  /* ===== KYC UPLOAD ===== */
  .kyc-upload {
    border: 1.5px dashed var(--line);
    border-radius: 10px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--muted);
    background: #fcfcfa;
    transition: 0.2s;
  }

  .kyc-upload:hover {
    border-color: var(--brand);
    background: var(--brand-soft);
  }

  .kyc-upload.filled {
    border-color: var(--brand);
    color: var(--brand-dark);
    background: var(--brand-soft);
  }

  .kyc-upload input[type="file"] {
    display: none;
  }

  /* ===== BACKLINK ===== */
  .backlink {
    font-size: 13px;
    color: var(--brand);
    cursor: pointer;
    margin-bottom: 12px;
    display: inline-block;
    font-weight: 600;
    transition: 0.15s;
  }

  .backlink:hover {
    color: var(--brand-dark);
  }

  /* ===== SPINNER ===== */
  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: #fff;
    border-radius: 50%;
    display: inline-block;
    animation: spin 0.7s linear infinite;
    vertical-align: middle;
    margin-right: 6px;
  }

  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  /* ===== TIMELINE ===== */
  .timeline {
    display: flex;
    justify-content: space-between;
    margin: 14px 0 6px;
    position: relative;
  }

  .timeline::before {
    content: "";
    position: absolute;
    top: 9px;
    left: 5%;
    right: 5%;
    height: 2px;
    background: var(--line);
    z-index: 0;
  }

  .tl-step {
    flex: 1;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .tl-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--line);
    margin: 0 auto 6px;
    border: 3px solid var(--paper);
    transition: 0.2s;
  }

  .tl-step.done .tl-dot {
    background: var(--brand);
  }

  .tl-step.current .tl-dot {
    background: var(--gold);
    box-shadow: 0 0 0 4px var(--brand-soft);
  }

  .tl-label {
    font-size: 9.5px;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
  }

  /* ===== INVOICE ===== */
  .invoice-box {
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 16px;
    font-size: 13px;
    margin-bottom: 14px;
  }

  .invoice-box .inv-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--brand-dark);
    padding-bottom: 10px;
    margin-bottom: 10px;
  }

  .invoice-box .inv-head h3 {
    font-size: 16px;
    color: var(--brand-dark);
  }

  .invoice-box .inv-number {
    font-size: 11px;
    color: var(--muted);
  }

  .invoice-box table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 12.5px;
  }

  .invoice-box th {
    text-align: left;
    border-bottom: 1px solid var(--line);
    padding: 8px 4px;
    color: var(--muted);
    font-size: 10.5px;
    text-transform: uppercase;
    font-weight: 600;
  }

  .invoice-box td {
    padding: 8px 4px;
    border-bottom: 1px solid #f0efe8;
  }

  .invoice-box td.amount {
    text-align: right;
    font-weight: 600;
    font-family: 'Courier New', monospace;
  }

  .invoice-box .totals {
    text-align: right;
    font-size: 13px;
    margin-top: 10px;
  }

  .invoice-box .total-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
  }

  .invoice-box .grand {
    font-size: 18px;
    font-weight: 800;
    color: var(--brand-dark);
    display: flex;
    justify-content: space-between;
    padding: 10px 0;
  }

  /* ===== PAYMENT METHODS ===== */
  .method-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 14px;
  }

  .method-card {
    border: 1.5px solid var(--line);
    border-radius: 10px;
    padding: 12px;
    text-align: center;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
  }

  .method-card:hover {
    border-color: var(--brand);
  }

  .method-card.selected {
    border-color: var(--brand);
    background: var(--brand-soft);
    color: var(--brand-dark);
    box-shadow: var(--shadow);
  }

  .method-icon {
    font-size: 24px;
    margin-bottom: 4px;
  }

  /* ===== RATINGS ===== */
  .star-row {
    display: flex;
    gap: 6px;
    justify-content: center;
    font-size: 32px;
    margin: 12px 0;
    cursor: pointer;
  }

  .star {
    color: #dcdcd0;
    transition: 0.15s;
    filter: drop-shadow(0 1px 2px rgba(0,0,0,0.1));
  }

  .star:hover,
  .star.filled {
    color: var(--gold);
    transform: scale(1.1);
  }

  /* ===== PROVIDER CARD ===== */
  .provider-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: 0.15s;
  }

  .provider-card:hover {
    border-color: var(--brand);
    box-shadow: var(--shadow);
    transform: translateY(-2px);
  }

  .provider-card .prov-head {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-bottom: 10px;
  }

  .provider-card .prov-avatar {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--brand-soft);
    color: var(--brand-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 18px;
    flex-shrink: 0;
  }

  .provider-card .prov-info h3 {
    font-size: 14px;
    margin: 0;
  }

  .provider-card .prov-info .rating {
    font-size: 12px;
    margin-top: 2px;
  }

  .provider-card .prov-info .rating .stars {
    color: var(--gold);
    font-weight: 700;
  }

  .provider-card .prov-meta {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 8px;
  }

  .prov-meta-item {
    font-size: 11px;
    background: var(--light-bg);

  .fab {

    right: 16px;
    width: 56px;
    height: 56px;

    align-items: center;

    top: 0;
    left: 0;
    right: 0;

    padding: 20px 16px;
    max-height: 90vh;
    overflow-y: auto;

  @keyframes fadeIn {
    from {
      opacity: 0;
    }
    to {
      opacity: 1;
    }
  }

  @keyframes slideUp {
    from {
      transform: translateY(100%);

    to {
      transform: translateY(0);

  function val(id) {
    const el = document.getElementById(id);
    return el ? el.value : '';

  function setVal(id, value) {
    const el = document.getElementById(id);
    if (el) el.value = value;
  }

  function money(amount) {
    return '₹' + (amount || 0).toFixed(2).replace(/\d(?=(\d{3})+\.)/g, '$&,');
  }

  function timeAgo(date) {
    const seconds = Math.floor((new Date() - new Date(date)) / 1000);
    if (seconds < 60) return 'just now';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return `${minutes}m ago`;
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return `${hours}h ago`;
    const days = Math.floor(hours / 24);
    return `${days}d ago`;
  }

  function formatDate(date) {
    return new Date(date).toLocaleDateString('en-IN', {
      year: 'numeric',
      month: 'short',
      day: 'numeric'
    });
  }

  function formatTime(time) {
    return new Date(`2000-01-01 ${time}`).toLocaleTimeString('en-IN', {
      hour: '2-digit',
      minute: '2-digit'
    });
  }

  function toast(message, isError = false) {
    const toastEl = document.getElementById('toast');
    toastEl.textContent = message;
    toastEl.className = 'toast' + (isError ? ' error' : ' success');
    toastEl.classList.remove('hidden');
    setTimeout(() => toastEl.classList.add('hidden'), 3000);

  function goTo(view) {
    state.currentView = view;

            action: action,
            ...data
          })
        )
      });
      const result = await response.json();
      return result;
    } catch (error) {
      console.error('API Error:', error);
      toast('Connection error. Please try again.', true);

  function handleKYCUpload(event, fieldType) {
    const file = event.target.files[0];
    if (!file) return;

    if (file.size > CONFIG.MAX_FILE_SIZE) {
      toast('File too large (max 5MB)', true);
      return;
    }

    const upload = document.getElementById(`${fieldType}_upload`);
    upload.classList.add('filled');

  async function submitProviderKYC() {
    const aadhaar = state.aadhaarFile;
    const pan = state.panFile;
    const bank = val('kyc_bank');
    const ifsc = val('kyc_ifsc');
    const confirm = document.getElementById('kyc_confirm').checked;

    if (!aadhaar || !pan || !bank || !ifsc) {
      toast('Please complete all fields', true);
      return;
    }

    if (!confirm) {
      toast('Confirm document authenticity', true);
      return;
    }

    try {
      const formData = new FormData();
      formData.append('action', 'submitProviderKYC');
      formData.append('userId', state.user.UserID);
      formData.append('aadhaar', aadhaar);
      formData.append('pan', pan);
      formData.append('bank', bank);
      formData.append('ifsc', ifsc);

      const response = await fetch(CONFIG.GAS_URL, {
        method: 'POST',
        body: formData
      });

      const result = await response.json();
      if (result.success) {
        toast('KYC submitted. Verification pending.');
        goTo('dashboardProvider');
      } else {
        toast(result.error, true);
      }
    } catch(e) {
      toast('Failed to submit KYC', true);

  function addBillItem() {
    if (!state.billItems) state.billItems = [];
    const id = Date.now();
    state.billItems.push({ id, description: '', quantity: 1, rate: 0 });
    renderBillItems();
  }

  function renderBillItems() {
    const list = document.getElementById('items-list');
    if (!list) return;

    list.innerHTML = (state.billItems || []).map((item, idx) => `
      <div style="background:var(--card); border:1px solid var(--line); padding:12px; border-radius:10px; margin-bottom:10px;">
        <div class="row2">
          <div class="field" style="margin-bottom:8px;">
            <label>Description</label>
            <input type="text" value="${item.description}" 
              onchange="updateBillItem(${idx}, 'description', this.value)"
              placeholder="e.g., Pipe installation">
          </div>
          <button class="btn danger small" onclick="removeBillItem(${idx})" style="width:auto; align-self:flex-end; margin-bottom:8px;">
            Remove
          </button>
        </div>
        <div class="row3">
          <div class="field" style="margin-bottom:0;">
            <label>Qty</label>
            <input type="number" value="${item.quantity}" min="1"
              onchange="updateBillItem(${idx}, 'quantity', this.value)">
          </div>
          <div class="field" style="margin-bottom:0;">
            <label>Rate (₹)</label>
            <input type="number" value="${item.rate}" min="0"
              onchange="updateBillItem(${idx}, 'rate', this.value)">
          </div>
          <div style="padding-top:20px; text-align:right; font-weight:700;">
            ₹${(item.quantity * item.rate).toFixed(2)}
          </div>
        </div>
      </div>
    `).join('');

    updateBillSummary();
  }

  function updateBillItem(idx, field, value) {
    if (!state.billItems) state.billItems = [];
    state.billItems[idx][field] = field === 'description' ? value : parseFloat(value) || 0;
    renderBillItems();
  }

  function removeBillItem(idx) {
    if (!state.billItems) return;
    state.billItems.splice(idx, 1);
    renderBillItems();
  }

  function updateBillSummary() {
    let subtotal = 0;
    (state.billItems || []).forEach(item => {
      subtotal += (item.quantity * item.rate);
    });

    const gst = subtotal * 0.18;
    const total = subtotal + gst;

    const subEl = document.getElementById('subtotal');
    const gstEl = document.getElementById('gst');
    const totEl = document.getElementById('total');

    if (subEl) subEl.textContent = subtotal.toFixed(2);
    if (gstEl) gstEl.textContent = gst.toFixed(2);
    if (totEl) totEl.textContent = total.toFixed(2);
  }

  async function submitBill(bookingId) {
    if (!state.billItems || state.billItems.length === 0) {
      toast('Add at least one item to the bill', true);
      return;
    }

    let subtotal = 0;
    state.billItems.forEach(item => {
      subtotal += (item.quantity * item.rate);
    });

    const gst = subtotal * 0.18;
    const total = subtotal + gst;
    const notes = val('bill_notes');

    try {
      const res = await api('submitProviderBill', {
        bookingId,
        providerId: state.user.UserID,
        items: JSON.stringify(state.billItems),
        subtotal,
        gst,
        total,
        notes,
        status: 'pending'
      });

      if (res.success) {
        toast('✓ Bill generated and sent to customer!');
        
        // Generate PDF
        setTimeout(() => generateBillPDF(bookingId), 1000);
        
        state.billItems = [];
        setTimeout(() => goTo('dashboardProvider'), 2000);
      } else {
        toast(res.error, true);
      }
    } catch(e) {
      toast('Failed to submit bill', true);
    }
  }

          <p>For queries: support@balajiservice360.com | 1800-BALAJI-1</p>

    // Print or download

  async function adminLogin() {
    const username = val('admin_user');
    const password = val('admin_pass');

    if (!username || !password) {
      toast('Enter credentials', true);
      return;
    }

    try {
      const res = await api('adminLogin', { username, password });
      if (res.success) {
        state.isAdmin = true;
        state.user = res.admin;
        goTo('adminDashboard');
        loadAdminData();
      } else {
        toast(res.error, true);
      }
    } catch(e) {
      toast('Login failed', true);
    }
  }

  async function loadAdminData() {
    try {
      const stats = await api('getAdminStats', {});
      const pending = await api('getPendingProviders', {});
      const reports = await api('getAdminReports', {});

      if (stats.success) state.adminStats = stats.data;
      if (pending.success) state.adminPending = pending.data;
      if (reports.success) state.adminReports = reports.data;

      render();
    } catch(e) {
      console.error('Failed to load admin data');
    }
  }

    const stats = state.adminStats || {};

      if (res.success) {
        toast('Provider approved');
        loadAdminData();
      } else {
        toast(res.error, true);
      }
    } catch(e) {
      toast('Action failed', true);
    }

  async function adminRejectProvider(userId) {
    try {
      const res = await api('adminRejectProvider', { userId });
      if (res.success) {
        toast('Provider rejected');
        loadAdminData();
      } else {
        toast(res.error, true);
      }
    } catch(e) {
      toast('Action failed', true);

      <div class="card">

        <button class="btn" style="margin-bottom:8px;" onclick="exportReport('daily')">Daily Bookings Report</button>

  function renderWalletView() {

      <div class="card">

      <div class="card">
        <h2 style="font-size:15px;">Recent Transactions</h2>

          <div class="list-item" style="cursor:default;">
            <div>
              <div class="li-title">${t.type === 'credit' ? '➕' : '➖'} ${t.description}</div>
              <div class="li-sub">${formatDate(t.date)}</div>

            <div style="text-align:right;">
              <div class="li-title" style="color:${t.type === 'credit' ? 'var(--success)' : 'var(--ink)'};">${t.type === 'credit' ? '+' : '-'}${money(t.amount)}</div>

  // ========== RENDER ENGINE ==========
  function render() {
    const app = document.getElementById('app');
    let content = '';

    // Route-based rendering
    if (state.currentView === 'landing') {
      content = renderLanding();
    } else if (state.currentView === 'customerLogin') {
      content = renderCustomerLogin();
    } else if (state.currentView === 'customerOTP') {
      content = renderCustomerOTP();
    } else if (state.currentView === 'customerSignup' || state.currentView === 'customerProfile') {
      content = renderCustomerProfile();
    } else if (state.currentView === 'providerLogin') {
      content = renderProviderLogin();
    } else if (state.currentView === 'providerOTP') {
      content = renderProviderOTP();
    } else if (state.currentView === 'providerSignup' || state.currentView === 'providerProfile') {
      content = renderProviderProfile();
    } else if (state.currentView === 'providerKYC') {
      content = renderProviderKYC();
    } else if (state.currentView === 'dashboardCustomer') {
      content = renderDashboardCustomer();
      renderBottomNav('customer');
    } else if (state.currentView === 'newBooking') {
      content = renderNewBooking();
      renderBottomNav('customer');
    } else if (state.currentView === 'providerList') {
      content = renderProviderList();
      renderBottomNav('customer');
    } else if (state.currentView === 'dashboardProvider') {
      content = renderDashboardProvider();
      renderBottomNav('provider');
    } else if (state.currentView === 'walletView') {
      content = renderWalletView();
      renderBottomNav('customer');
    } else if (state.currentView === 'adminLogin') {
      content = renderAdminLogin();
    } else if (state.currentView === 'adminDashboard') {
      content = renderAdminDashboard();
      renderBottomNav('admin');
    } else if (state.currentView === 'adminReports') {
      content = renderAdminReports();
      renderBottomNav('admin');
    } else if (state.currentView === 'adminProviders') {
      content = renderAdminProviders();
      renderBottomNav('admin');
    } else {
      content = '<div class="card"><div class="empty">View not found</div></div>';
    }

    app.innerHTML = content;
    renderTopbar();
  }

  function renderTopbar() {
    const topbar = document.getElementById('topbar');
    const actions = document.getElementById('topbar-actions');
    let actionHTML = '';

    // Show demo mode badge
    if (state.user?.IsDemo) {
      const badge = document.createElement('div');
      badge.style.cssText = 'background:var(--gold); color:#3a2705; padding:4px 10px; border-radius:20px; font-size:10px; font-weight:700; margin-right:8px;';
      badge.textContent = '🎬 DEMO MODE';
      topbar.insertBefore(badge, topbar.lastChild);
    }

    if (state.isAuthenticated) {
      const logoutFn = state.user?.IsDemo ? 'logoutDemo()' : 'logout()';
      actionHTML = `
        <button class="linklike" onclick="goTo('profileView')">👤</button>
        <button class="linklike" onclick="${logoutFn}">✕</button>
      `;
    }

    actions.innerHTML = actionHTML;
  }

  function renderBottomNav(role = 'customer') {
    const nav = document.getElementById('bottom-nav');
    let navHTML = '';

    if (role === 'customer') {
      navHTML = `
        <button class="active" onclick="goTo('dashboardCustomer')"><div class="ic">🏠</div><div>Home</div></button>
        <button onclick="goTo('searchServices')"><div class="ic">🔍</div><div>Search</div></button>
        <button onclick="goTo('myBookings')"><div class="ic">📋</div><div>Bookings</div></button>
        <button onclick="goTo('walletView')"><div class="ic">💳</div><div>Wallet</div></button>
        <button onclick="goTo('profileView')"><div class="ic">👤</div><div>Profile</div></button>
      `;
    } else if (role === 'provider') {
      navHTML = `
        <button class="active" onclick="goTo('dashboardProvider')"><div class="ic">🏠</div><div>Home</div></button>
        <button onclick="goTo('myJobs')"><div class="ic">📋</div><div>Jobs</div></button>
        <button onclick="goTo('myEarnings')"><div class="ic">💰</div><div>Earnings</div></button>
        <button onclick="goTo('profileView')"><div class="ic">👤</div><div>Profile</div></button>
        <button onclick="goTo('support')"><div class="ic">💬</div><div>Support</div></button>
      `;
    } else if (role === 'admin') {
      navHTML = `
        <button class="active" onclick="goTo('adminDashboard')"><div class="ic">📊</div><div>Dashboard</div></button>
        <button onclick="goTo('adminProviders')"><div class="ic">👥</div><div>Providers</div></button>
        <button onclick="goTo('adminReports')"><div class="ic">📈</div><div>Reports</div></button>
        <button onclick="goTo('adminSettings')"><div class="ic">⚙️</div><div>Settings</div></button>
      `;
    }

    nav.innerHTML = navHTML;
  }

  function logout() {
    state.isAuthenticated = false;
    state.user = null;
    state.isAdmin = false;
    state.currentView = 'landing';
    render();
    toast('Logged out successfully');
  }

  // ========== INITIALIZATION ==========
  if (navigator.serviceWorker) {
    navigator.serviceWorker.register('sw.js').catch(e => console.log('SW registration failed'));
  }

  render();
</script>
