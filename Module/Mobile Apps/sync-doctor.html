<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Balaji NextGen — Sync Doctor</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#FFF7ED;margin:0;padding:24px;color:#1a1a1a;}
  .card{max-width:640px;margin:0 auto;background:#fff;border-radius:16px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,.08);}
  h1{font-size:20px;margin:0 0 4px;color:#C2410C;}
  p.sub{color:#78716C;font-size:13px;margin:0 0 20px;}
  label{font-size:12px;font-weight:700;color:#57534E;display:block;margin-bottom:4px;}
  input{width:100%;box-sizing:border-box;padding:11px 12px;border:1.5px solid #E7E5E4;border-radius:10px;font-size:13px;margin-bottom:12px;font-family:monospace;}
  button{width:100%;padding:13px;border:none;border-radius:10px;background:#EA580C;color:#fff;font-weight:700;font-size:14px;cursor:pointer;}
  button:disabled{opacity:.6;cursor:wait;}
  .result{margin-top:18px;padding:16px;border-radius:12px;font-size:13px;line-height:1.6;white-space:pre-wrap;display:none;}
  .ok{background:#F0FDF4;border:1.5px solid #86EFAC;color:#166534;}
  .bad{background:#FEF2F2;border:1.5px solid #FCA5A5;color:#991B1B;}
  .warn{background:#FFFBEB;border:1.5px solid #FDE68A;color:#92400E;}
  .step{margin-top:16px;padding-top:16px;border-top:1px solid #E7E5E4;}
  .step h3{font-size:13px;margin:0 0 6px;}
  code{background:#F5F5F4;padding:2px 6px;border-radius:4px;font-size:12px;}
</style>
</head>
<body>
<div class="card">
  <h1>🩺 Sync Doctor</h1>
  <p class="sub">Tests your Apps Script deployment directly and tells you in plain language what's wrong — no browser console needed.</p>

  <label>Your GAS Web App URL (…/exec)</label>
  <input id="url" value="https://script.google.com/macros/s/AKfycbwPLcnWaO9csLohtX6yNwGDhjSCnLhW_jfzmWJBc-LtwScphFC9oGeFps_rLsHC92DRjw/exec">

  <button id="runBtn" onclick="runTest()">▶ Run Diagnostic</button>

  <div id="result" class="result"></div>
</div>

<script>
async function runTest(){
  const url = document.getElementById('url').value.trim();
  const btn = document.getElementById('runBtn');
  const out = document.getElementById('result');
  out.style.display='block';
  out.className='result warn';
  out.textContent = '⏳ Testing GET request…';
  btn.disabled = true;

  let getResult = null, getError = null;
  try{
    const res = await fetch(url, {method:'GET'});
    const contentType = res.headers.get('content-type') || '';
    const fullText = await res.text();
    getResult = {status: res.status, contentType, fullText};
  }catch(e){
    getError = e.message || String(e);
  }

  let report = '';
  let cls = 'bad';
  let getOk = false;

  if(getError){
    report += `❌ GET REQUEST FAILED\n"${getError}"\n\n`;
    if(/failed to fetch|networkerror|cors/i.test(getError)){
      report += `THIS MEANS: the browser could not even complete the request — almost always one of:\n\n`;
      report += `1. The deployment's "Who has access" is NOT set to "Anyone".\n`;
      report += `   Fix: Apps Script editor → Deploy → Manage deployments → pencil/edit icon\n`;
      report += `   on the active deployment → Access should say "Anyone" → if you change\n`;
      report += `   it, click Deploy again (this creates a new VERSION of the SAME URL).\n\n`;
      report += `2. The URL is stale — it points to a deployment that was deleted or archived.\n`;
      report += `   Fix: Deploy → Manage deployments → confirm this exact URL is listed and Active.\n\n`;
      report += `3. You are not logged into the Google account that owns this script in this\n`;
      report += `   browser — try in an Incognito window with no Google account logged in at all\n`;
      report += `   (this simulates exactly what your customers'/other devices' browsers see).\n`;
    }
  } else {
    const text = getResult.fullText;
    if(getResult.contentType.includes('text/html') || /accounts\.google\.com|ServiceLogin|<html/i.test(text)){
      report += `⚠️ GOT AN HTML PAGE INSTEAD OF JSON (status ${getResult.status})\n\n`;
      report += `THIS MEANS: the deployment is reachable, but it's returning a Google\n`;
      report += `sign-in / permission page instead of running your code — "Who has access"\n`;
      report += `is set to something other than "Anyone" (e.g. "Anyone with Google account"\n`;
      report += `or "Only myself"), OR the account that deployed it hasn't authorized the\n`;
      report += `script's permissions yet.\n\n`;
      report += `Fix: Deploy → Manage deployments → edit → Access: "Anyone" → Deploy again.\n\n`;
      report += `First 300 chars of what came back:\n${text.slice(0,300)}`;
    } else {
      try{
        const json = JSON.parse(text);
        report += `✅ GET REQUEST WORKED (status ${getResult.status})\n\n`;
        report += `Response: ${JSON.stringify(json, null, 2).slice(0,600)}\n\n`;
        getOk = true;
      }catch(e){
        report += `⚠️ GOT A RESPONSE BUT IT ISN'T VALID JSON (status ${getResult.status})\n\n`;
        report += `First 500 chars:\n${text.slice(0,500)}\n\n`;
        report += `THIS MEANS: something in your Code.gs is likely throwing before it can\n`;
        report += `return JSON, or this URL doesn't point at your Business OS script at all.`;
      }
    }
  }

  // POST test — this is what your actual saves use, and GAS sometimes
  // handles GET and POST access differently, so a working GET does NOT
  // guarantee POST also works.
  out.textContent = report + '\n\n⏳ GET done — now testing POST (what your app actually uses to save)…';
  let postOk = false, postDetail = '';
  try{
    const res = await fetch(url, {method:'POST', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({action:'DIAG'})});
    const text = await res.text();
    if(/accounts\.google\.com|ServiceLogin|<html/i.test(text)){
      postDetail = `⚠️ POST returned an HTML sign-in page instead of JSON (status ${res.status}) — same access-setting problem as above, but confirmed specifically for POST/saves this time.`;
    } else {
      try{
        const json = JSON.parse(text);
        postOk = true;
        postDetail = `✅ POST REQUEST WORKED (status ${res.status})\nResponse: ${JSON.stringify(json, null, 2).slice(0,300)}`;
      }catch(e){
        postDetail = `⚠️ POST got a response but it isn't valid JSON (status ${res.status}):\n${text.slice(0,300)}`;
      }
    }
  }catch(e){
    postDetail = `❌ POST REQUEST FAILED: "${e.message||e}" — this is the one that matters most, since every save/sync/import in your app is a POST. Same fixes as the GET failure above apply.`;
  }

  report += `\n\n${postDetail}`;

  if(getOk && postOk){
    report += `\n\n✅ OVERALL: both GET and POST work — this deployment IS reachable and functioning right now. If the app still isn't saving, the deployment access setting is not the problem anymore; tell Claude both came back ✅ and we'll look at the next layer (which sheetId the app is actually using, or a specific action failing).`;
    cls = 'ok';
  } else if(getOk && !postOk){
    report += `\n\n⚠️ OVERALL: GET works but POST doesn't — since saves use POST, this is still broken for real use even though the plain link "looks" fine in a browser.`;
    cls = 'warn';
  } else {
    cls = 'bad';
  }

  out.textContent = report;
  out.className = 'result ' + cls;
  btn.disabled = false;
}
</script>
</body>
</html>
