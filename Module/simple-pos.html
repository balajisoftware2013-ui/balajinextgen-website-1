<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Quick Bill — Balaji NextGen ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --accent:#c2590a;--accent2:#b45309;--accent-lt:#fdf0dc;
  --green:#15803d;--green-lt:#f0fdf4;--red:#b91c1c;--red-lt:#fef2f2;
  --bg:#faf8f5;--surface:#fff;--surface2:#f7f4ef;
  --border:#e8e0d4;--text:#1c1208;--text2:#44310f;--muted:#9c8a72;
  --r:16px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;font-size:16px;}
.app{display:flex;height:100vh;}

/* ── LEFT: menu ── */
.menu-side{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{background:var(--surface);padding:14px 18px;display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--border);flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;color:#fff;font-weight:900;font-size:20px;flex-shrink:0;}
.brand-txt{font-weight:800;font-size:17px;}
.client-tag{font-size:11px;color:var(--muted);font-weight:600;}
.big-clock{margin-left:auto;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;color:var(--accent2);}

.cat-scroll{display:flex;gap:10px;padding:14px 18px;overflow-x:auto;background:var(--surface);border-bottom:1px solid var(--border);}
.cat-btn{flex-shrink:0;padding:14px 24px;border-radius:16px;border:2px solid var(--border);background:var(--surface2);
  font-weight:700;font-size:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:90px;}
.cat-btn .ic{font-size:26px;}
.cat-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 6px 18px rgba(194,89,10,.3);}

.item-grid{flex:1;overflow-y:auto;padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;align-content:start;}
.item-tile{background:var(--surface);border:2px solid var(--border);border-radius:var(--r);padding:16px 12px;
  cursor:pointer;text-align:center;transition:.12s;user-select:none;}
.item-tile:active{transform:scale(.95);background:var(--accent-lt);border-color:var(--accent);}
.item-tile .em{font-size:38px;margin-bottom:8px;}
.item-tile .nm{font-weight:700;font-size:15px;line-height:1.25;margin-bottom:6px;min-height:38px;display:flex;align-items:center;justify-content:center;}
.item-tile .pr{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:17px;color:var(--accent2);}

/* ── RIGHT: cart ── */
.cart-side{width:380px;flex-shrink:0;background:var(--surface);border-left:2px solid var(--border);
  display:flex;flex-direction:column;box-shadow:-6px 0 20px rgba(0,0,0,.04);}
.cart-hdr{padding:18px;background:linear-gradient(115deg,#fdf6ea,#fbe0b8);border-bottom:2px solid var(--border);}
.cart-hdr h2{font-size:19px;font-weight:800;}
.cart-count{font-size:12.5px;color:var(--accent2);font-weight:700;margin-top:2px;}
.cart-list{flex:1;overflow-y:auto;padding:10px 14px;}
.cart-empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:15px;}
.cart-empty .big{font-size:40px;margin-bottom:10px;}
.cart-row{display:flex;align-items:center;gap:10px;padding:12px 8px;border-bottom:1px solid var(--border);}
.cart-row .nm{flex:1;font-weight:700;font-size:14.5px;}
.cart-row .pr{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--muted);}
.qty-box{display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:10px;padding:4px;}
.qty-btn{width:30px;height:30px;border-radius:8px;border:none;background:var(--surface);font-size:18px;font-weight:800;
  cursor:pointer;color:var(--accent2);box-shadow:0 1px 3px rgba(0,0,0,.1);}
.qty-val{min-width:22px;text-align:center;font-weight:800;font-family:'JetBrains Mono',monospace;}
.line-total{font-family:'JetBrains Mono',monospace;font-weight:800;font-size:14.5px;min-width:64px;text-align:right;}

.cart-footer{border-top:2px solid var(--border);padding:16px 18px;background:var(--surface2);}
.total-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px;}
.total-row .lbl{font-size:15px;font-weight:700;color:var(--text2);}
.total-row .val{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:900;color:var(--accent2);}
.pay-row{display:flex;gap:10px;margin-bottom:12px;}
.pay-btn{flex:1;padding:14px;border-radius:12px;border:2px solid var(--border);background:var(--surface);
  font-weight:700;font-size:14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;}
.pay-btn .ic{font-size:22px;}
.pay-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.charge-btn{width:100%;padding:20px;border-radius:16px;border:none;background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-size:20px;font-weight:900;cursor:pointer;box-shadow:0 10px 30px rgba(194,89,10,.35);}
.charge-btn:active{transform:scale(.98);}
.charge-btn:disabled{opacity:.4;box-shadow:none;}
.clear-btn{width:100%;padding:10px;margin-top:8px;border-radius:10px;border:none;background:transparent;
  color:var(--red);font-weight:700;font-size:13px;cursor:pointer;}

/* ── Success overlay ── */
.success-overlay{position:fixed;inset:0;background:rgba(28,18,8,.6);display:none;align-items:center;justify-content:center;z-index:999;}
.success-overlay.show{display:flex;}
.success-card{background:#fff;border-radius:24px;padding:40px 36px;text-align:center;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
.success-icon{font-size:64px;margin-bottom:14px;}
.success-title{font-size:22px;font-weight:900;color:var(--green);margin-bottom:6px;}
.success-amt{font-family:'JetBrains Mono',monospace;font-size:34px;font-weight:900;color:var(--accent2);margin:10px 0;}
.success-btn{width:100%;padding:16px;border-radius:14px;border:none;background:var(--accent);color:#fff;
  font-weight:800;font-size:16px;margin-top:16px;cursor:pointer;}

@media(max-width:860px){
  .app{flex-direction:column;}
  .cart-side{width:100%;height:45vh;order:2;}
  .menu-side{order:1;height:55vh;}
  .item-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));}
}
</style>
</head>
<body>

<div class="app">
  <div class="menu-side">
    <div class="topbar">
      <div class="brand">
        <div class="brand-mark">B</div>
        <div>
          <div class="brand-txt">Quick Bill</div>
          <div class="client-tag" id="clientTag">—</div>
        </div>
      </div>
      <div class="big-clock" id="bigClock">--:--</div>
    </div>
    <div class="cat-scroll" id="catScroll"></div>
    <div class="item-grid" id="itemGrid"></div>
  </div>

  <div class="cart-side">
    <div class="cart-hdr">
      <h2>🧾 Current Bill</h2>
      <div class="cart-count" id="cartCount">0 items</div>
    </div>
    <div class="cart-list" id="cartList"></div>
    <div class="cart-footer">
      <div class="total-row"><span class="lbl">Total</span><span class="val" id="totalVal">₹0</span></div>
      <div class="pay-row">
        <button class="pay-btn active" id="payCash" onclick="setPayMode('cash')"><span class="ic">💵</span>Cash</button>
        <button class="pay-btn" id="payUpi" onclick="setPayMode('upi')"><span class="ic">📱</span>UPI</button>
        <button class="pay-btn" id="payCard" onclick="setPayMode('card')"><span class="ic">💳</span>Card</button>
      </div>
      <button class="charge-btn" id="chargeBtn" onclick="chargeNow()" disabled>Charge ₹0</button>
      <button class="clear-btn" onclick="clearCart()">✕ Clear Bill</button>
    </div>
  </div>
</div>

<div class="success-overlay" id="successOverlay">
  <div class="success-card">
    <div class="success-icon">✅</div>
    <div class="success-title">Bill Complete!</div>
    <div class="success-amt" id="successAmt">₹0</div>
    <div style="color:#888;font-size:13px;" id="successMode">Cash</div>
    <button class="success-btn" onclick="startNewBill()">🧾 Start New Bill</button>
  </div>
</div>

<script>
/* =====================================================
   SIMPLE POS — designed for staff with zero computer
   experience: big tiles, minimal taps, no typing needed
   for a normal sale. Tap item → tap Charge → done.
   Wire-up note: replace MENU_DATA with a real GET_MENU
   call to the backend once ready; replace chargeNow()'s
   local save with a real SAVE_SALE action.
===================================================== */

const CLIENT_ID = (new URLSearchParams(location.search).get('client')) || 'CL0001';
document.getElementById('clientTag').textContent = CLIENT_ID;

// Demo menu — swap for real GET_MENU API call per client/industry
const MENU_DATA = {
  categories: [
    { key:'hot', label:'Hot Drinks', icon:'☕' },
    { key:'cold', label:'Cold Drinks', icon:'🥤' },
    { key:'snacks', label:'Snacks', icon:'🍟' },
    { key:'sweets', label:'Sweets', icon:'🍰' },
  ],
  items: [
    { cat:'hot', name:'Tea', emoji:'🍵', price:15 },
    { cat:'hot', name:'Masala Tea', emoji:'🍵', price:20 },
    { cat:'hot', name:'Coffee', emoji:'☕', price:25 },
    { cat:'hot', name:'Black Coffee', emoji:'☕', price:20 },
    { cat:'hot', name:'Hot Milk', emoji:'🥛', price:20 },
    { cat:'cold', name:'Cold Coffee', emoji:'🧊', price:60 },
    { cat:'cold', name:'Lassi', emoji:'🥤', price:40 },
    { cat:'cold', name:'Lemon Soda', emoji:'🥤', price:30 },
    { cat:'cold', name:'Mineral Water', emoji:'💧', price:20 },
    { cat:'cold', name:'Cold Drink', emoji:'🥤', price:35 },
    { cat:'snacks', name:'Samosa', emoji:'🥟', price:15 },
    { cat:'snacks', name:'Bread Omelette', emoji:'🍳', price:40 },
    { cat:'snacks', name:'Toast', emoji:'🍞', price:25 },
    { cat:'snacks', name:'Sandwich', emoji:'🥪', price:50 },
    { cat:'snacks', name:'Maggi', emoji:'🍜', price:40 },
    { cat:'sweets', name:'Cookies', emoji:'🍪', price:20 },
    { cat:'sweets', name:'Cake Slice', emoji:'🍰', price:60 },
    { cat:'sweets', name:'Rasgulla', emoji:'🍡', price:30 },
  ],
};

let activeCat = MENU_DATA.categories[0].key;
let cart = {}; // { itemName: { item, qty } }
let payMode = 'cash';

function renderCats(){
  document.getElementById('catScroll').innerHTML = MENU_DATA.categories.map(c=>
    `<button class="cat-btn ${c.key===activeCat?'active':''}" onclick="selectCat('${c.key}')">
      <span class="ic">${c.icon}</span>${c.label}
    </button>`
  ).join('');
}
function selectCat(key){ activeCat = key; renderCats(); renderItems(); }

function renderItems(){
  const items = MENU_DATA.items.filter(i=>i.cat===activeCat);
  document.getElementById('itemGrid').innerHTML = items.map(item=>`
    <div class="item-tile" onclick="addToCart('${item.name.replace(/'/g,"\\'")}')">
      <div class="em">${item.emoji}</div>
      <div class="nm">${item.name}</div>
      <div class="pr">₹${item.price}</div>
    </div>
  `).join('');
}

function addToCart(name){
  const item = MENU_DATA.items.find(i=>i.name===name);
  if (!item) return;
  if (!cart[name]) cart[name] = { item, qty:0 };
  cart[name].qty++;
  renderCart();
}
function changeQty(name, delta){
  if (!cart[name]) return;
  cart[name].qty += delta;
  if (cart[name].qty <= 0) delete cart[name];
  renderCart();
}
function clearCart(){
  cart = {};
  renderCart();
}

function renderCart(){
  const entries = Object.values(cart);
  const list = document.getElementById('cartList');
  const countEl = document.getElementById('cartCount');
  const totalEl = document.getElementById('totalVal');
  const chargeBtn = document.getElementById('chargeBtn');

  const totalItems = entries.reduce((s,e)=>s+e.qty,0);
  const totalAmt = entries.reduce((s,e)=>s+e.qty*e.item.price,0);

  countEl.textContent = totalItems + (totalItems===1?' item':' items');
  totalEl.textContent = '₹' + totalAmt.toLocaleString();
  chargeBtn.textContent = 'Charge ₹' + totalAmt.toLocaleString();
  chargeBtn.disabled = totalAmt === 0;

  if (!entries.length){
    list.innerHTML = `<div class="cart-empty"><div class="big">🧾</div>Tap items on the left<br>to add them here</div>`;
    return;
  }
  list.innerHTML = entries.map(e=>`
    <div class="cart-row">
      <div>
        <div class="nm">${e.item.emoji} ${e.item.name}</div>
        <div class="pr">₹${e.item.price} each</div>
      </div>
      <div class="qty-box">
        <button class="qty-btn" onclick="changeQty('${e.item.name.replace(/'/g,"\\'")}',-1)">−</button>
        <span class="qty-val">${e.qty}</span>
        <button class="qty-btn" onclick="changeQty('${e.item.name.replace(/'/g,"\\'")}',1)">+</button>
      </div>
      <div class="line-total">₹${e.qty*e.item.price}</div>
    </div>
  `).join('');
}

function setPayMode(mode){
  payMode = mode;
  document.getElementById('payCash').classList.toggle('active', mode==='cash');
  document.getElementById('payUpi').classList.toggle('active', mode==='upi');
  document.getElementById('payCard').classList.toggle('active', mode==='card');
}

function chargeNow(){
  const entries = Object.values(cart);
  const totalAmt = entries.reduce((s,e)=>s+e.qty*e.item.price,0);
  if (totalAmt === 0) return;

  // Wire-up point: POST to backend here (SAVE_SALE action) instead of/alongside local save
  const bill = {
    id: 'BILL-' + Date.now(),
    client: CLIENT_ID,
    items: entries.map(e=>({name:e.item.name, qty:e.qty, price:e.item.price, total:e.qty*e.item.price})),
    total: totalAmt,
    payMode: payMode,
    time: new Date().toISOString(),
  };
  try{
    const key = 'QUICKPOS_BILLS_' + CLIENT_ID;
    const bills = JSON.parse(localStorage.getItem(key)||'[]');
    bills.push(bill);
    localStorage.setItem(key, JSON.stringify(bills));
  } catch(e){}

  document.getElementById('successAmt').textContent = '₹' + totalAmt.toLocaleString();
  document.getElementById('successMode').textContent = payMode==='cash'?'Paid by Cash':payMode==='upi'?'Paid by UPI':'Paid by Card';
  document.getElementById('successOverlay').classList.add('show');
}

function startNewBill(){
  document.getElementById('successOverlay').classList.remove('show');
  clearCart();
  setPayMode('cash');
}

function updateClock(){
  const now = new Date();
  document.getElementById('bigClock').textContent = now.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
}
setInterval(updateClock, 1000);
updateClock();

renderCats();
renderItems();
renderCart();
</script>
</body>
</html>
