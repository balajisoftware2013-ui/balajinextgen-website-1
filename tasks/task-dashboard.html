<!DOCTYPE html><html><head>
<script>
(function(){
  var p=["./erp-config.js", "../erp-config.js", "../../erp-config.js", "../../../erp-config.js"],i=0;
  function t(){if(i>=p.length)return;var s=document.createElement('script');s.src=p[i++];s.onerror=t;document.head.appendChild(s);}t();
})();
</script>
<script>
(function(){
  function show(){document.body&&(document.body.style.visibility='visible');}
  if(window.location.protocol==='file:'){show();return;}
  window.addEventListener('load',function(){
    show();
    try{
      if(typeof ERP==='undefined')return;
      var u=ERP.getUser();
      if(!u){window.location.href='../login.html';return;}
      if(typeof erpFillUserUI==='function')erpFillUserUI();
    }catch(e){}
  });
  setTimeout(show,2500);
})();
</script>

<title>Balaji NextGen ERP — Task Dashboard</title><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><script>window.location.replace("../dashboard.html");</script></head><body></body></html>
