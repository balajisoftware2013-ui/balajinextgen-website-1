# Balaji NextGen ERP -- same-origin API proxy for balajinextgen.in
# Fixes: "ERP API V2_CORE unavailable (HTTP 405)" seen in
# restaurant-dashboard.html whenever /api/core or /api/auth is called.
#
# ROOT CAUSE: restaurant-dashboard.html (and steward-mobile.html) call
# window.location.origin + '/api/core' and '/api/auth' on purpose, to
# avoid the GAS CORS problem. But nothing in this repo ever told
# Netlify what those two paths should DO -- so Netlify's static host
# returned its default 405 for a POST to a path with no matching file
# and no functions/redirect rule. This was never a bug in the .gs or
# .html files; it was a missing proxy config.
#
# This forwards both paths to small serverless functions (below)
# instead of a bare [[redirects]] rewrite, because Google Apps Script
# /exec URLs 302-redirect internally to script.googleusercontent.com --
# a plain Netlify redirect rewrite does not reliably re-POST through
# that redirect with the body intact, which silently turns writes into
# broken/empty requests even when the status code looks fine. The
# function does the POST itself with a real fetch that follows the
# redirect correctly.

[[redirects]]
  from = "/api/core"
  to = "/.netlify/functions/api-core"
  status = 200
  force = true

[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/api-auth"
  status = 200
  force = true

[functions]
  directory = "netlify/functions"
