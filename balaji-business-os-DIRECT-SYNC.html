<!-- 
  BALAJI NEXTGEN BUSINESS OS — DIRECT GOOGLE SHEET SYNC v1
  
  KEY CHANGES FROM PREVIOUS VERSION:
  
  1. REMOVED localStorage.getItem('bnos_db') on startup
     - DB now ALWAYS loads fresh from Google Sheet via SUITE_LOAD_DB
  
  2. IMMEDIATE SYNC ON PAGE LOAD
     - startRealtimeSync() now fetches DB before rendering anything
  
  3. EVERY TRANSACTION WRITES DIRECTLY
     - After each sale, purchase, item, customer, supplier: immediate GAS call
     - Then refresh DB from backend to ensure consistency
  
  4. KEPT localStorage ONLY for:
     - bnos_session (login/auth state)
     - UI preferences (font size, theme)
     - Temporary form state
  
  This solves "entries from other browser" by having ONE source of truth
  (Google Sheet), not multiple browser caches.
-->

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Balaji NextGen Business OS</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:system-ui,-apple-system,sans-serif; background:#f5f5f5; color:#333; }
.container { max-width:1200px; margin:0 auto; padding:20px; }
.card { background:white; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.1); padding:20px; margin-bottom:20px; }
.btn { background:#007bff; color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer; font-size:14px; }
.btn:hover { background:#0056b3; }
.btn-success { background:#28a745; }
.btn-success:hover { background:#1f7e2a; }
.btn-danger { background:#dc3545; }
.btn-danger:hover { background:#a02834; }
.form-group { margin-bottom:15px; }
.form-group label { display:block; margin-bottom:5px; font-weight:bold; }
.form-group input, .form-group select, .form-group textarea { width:100%; padding:8px; border:1px solid #ddd; border-radius:4px; font-size:14px; }
.table { width:100%; border-collapse:collapse; margin-top:20px; }
.table th { background:#f0f0f0; padding:12px; text-align:left; border-bottom:2px solid #ddd; }
.table td { padding:12px; border-bottom:1px solid #ddd; }
.table tr:hover { background:#f9f9f9; }
.alert { padding:15px; margin-bottom:20px; border-radius:4px; }
.alert-info { background:#d1ecf1; color:#0c5460; border:1px solid #bee5eb; }
.alert-success { background:#d4edda; color:#155724; border:1px solid #c3e6cb; }
.alert-error { background:#f8d7da; color:#721c24; border:1px solid #f5c6cb; }
.sync-indicator { position:fixed; top:10px; right:10px; font-size:12px; padding:8px 12px; background:white; border-radius:4px; box-shadow:0 1px 4px rgba(0,0,0,0.1); }
.sync-indicator.syncing { color:#007bff; }
.sync-indicator.synced { color:#28a745; }
.sync-indicator.error { color:#dc3545; }
.hidden { display:none; }
</style>
</head>
<body>

<div class="sync-indicator" id="syncIndicator">⟳ Loading...</div>

<div class="container" id="app"></div>

<script>
// ════════════════════════════════════════════════════════════════════════════
// CONFIG
// ════════════════════════════════════════════════════════════════════════════
const GAS_URL = 'https://script.google.com/macros/s/AKfycbweBrJ9QH9ItEE_5t2hzwASZPblf0m6NHSr6vxr5s4w-dcj2bUdQFANnyUcXuxSK4YK/exec';
const SUPPORT_WHATSAPP = '919832014403';
const SUPPORT_EMAIL = 'balajieducationhub12@gmail.com';

// ════════════════════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════════════════════
let DB = null;  // ← CHANGED: No localStorage cache, will load from Google Sheet
let SESSION = JSON.parse(localStorage.getItem('bnos_session') || 'null');
let _lastKnownSync = 0;
let _syncIntervalId = null;
let _isSyncing = false;

const seed = {
  customers: [],
  suppliers: [],
  items: [],
  sales: [],
  purchases: [],
  cash: 0,
  bank: 0
};

// ════════════════════════════════════════════════════════════════════════════
// SYNC FUNCTIONS — DIRECT GOOGLE SHEET READ/WRITE
// ════════════════════════════════════════════════════════════════════════════

async function callGAS(action, payload = {}) {
  try {
    _isSyncing = true;
    updateSyncIndicator('syncing');
    
    const response = await fetch(GAS_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ action, ...payload })
    });
    
    const result = await response.json();
    _isSyncing = false;
    updateSyncIndicator('synced');
    return result;
  } catch (err) {
    console.error(`GAS call failed (${action}):`, err);
    _isSyncing = false;
    updateSyncIndicator('error');
    showAlert(`Sync error: ${err.message}`, 'error');
    return { success: false, error: err.message };
  }
}

async function pullRemoteUpdates() {
  if (!SESSION || SESSION.isDemo || !SESSION.sheetId) return;
  
  const result = await callGAS('SUITE_LOAD_DB', { sheetId: SESSION.sheetId });
  
  if (result.success && result.data) {
    if (result.lastSynced > _lastKnownSync) {
      DB = result.data;
      _lastKnownSync = result.lastSynced;
      render();
      updateSyncIndicator('synced');
    }
  }
}

async function pushTransaction(action, payload) {
  // Write transaction directly to Google Sheet
  const result = await callGAS(action, { sheetId: SESSION.sheetId, ...payload });
  
  if (result.success) {
    // Immediately pull updated DB from backend to stay in sync
    await pullRemoteUpdates();
    return result;
  } else {
    showAlert(`Failed to save: ${result.message}`, 'error');
    return result;
  }
}

function updateSyncIndicator(state) {
  const ind = document.getElementById('syncIndicator');
  if (!ind) return;
  
  ind.className = 'sync-indicator';
  if (state === 'syncing') {
    ind.classList.add('syncing');
    ind.textContent = '⟳ Syncing...';
  } else if (state === 'synced') {
    ind.classList.add('synced');
    ind.textContent = '✓ Synced';
    setTimeout(() => {
      if (ind.classList.contains('synced')) ind.textContent = '';
    }, 2000);
  } else if (state === 'error') {
    ind.classList.add('error');
    ind.textContent = '✗ Sync failed';
  }
}

function showAlert(message, type = 'info') {
  const alertDiv = document.createElement('div');
  alertDiv.className = `alert alert-${type}`;
  alertDiv.textContent = message;
  const app = document.getElementById('app');
  app.insertBefore(alertDiv, app.firstChild);
  setTimeout(() => alertDiv.remove(), 4000);
}

// ════════════════════════════════════════════════════════════════════════════
// LOGIN / STARTUP
// ════════════════════════════════════════════════════════════════════════════

async function login(mobile, password) {
  const result = await callGAS('LOGIN', { loginId: mobile, password });
  
  if (result.success) {
    SESSION = {
      clientId: result.clientId,
      sheetId: result.sheetId,
      userId: result.userId,
      name: result.bizName,
      role: result.role,
      plan: result.plan,
      isDemo: false
    };
    localStorage.setItem('bnos_session', JSON.stringify(SESSION));
    
    // Load DB from backend (don't use localStorage)
    DB = result.data || seed;
    _lastKnownSync = result.lastSynced || 0;
    
    startRealtimeSync();
    render();
  } else {
    showAlert(result.message || 'Login failed', 'error');
  }
}

async function logout() {
  SESSION = null;
  DB = null;
  localStorage.removeItem('bnos_session');
  clearInterval(_syncIntervalId);
  render();
}

function startRealtimeSync() {
  if (_syncIntervalId) clearInterval(_syncIntervalId);
  if (!SESSION || SESSION.isDemo) return;
  
  // Pull immediately on load
  pullRemoteUpdates();
  
  // Then poll every 5 seconds for updates from other devices
  _syncIntervalId = setInterval(pullRemoteUpdates, 5000);
  
  // Also pull when tab regains focus
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) pullRemoteUpdates();
  });
  window.addEventListener('focus', pullRemoteUpdates);
}

// ════════════════════════════════════════════════════════════════════════════
// TRANSACTION HANDLERS — DIRECT SYNC
// ════════════════════════════════════════════════════════════════════════════

async function addCustomer(name, mobile) {
  if (!DB) { showAlert('Not logged in', 'error'); return; }
  
  const customer = {
    id: 'C' + Date.now(),
    name,
    mobile,
    due: 0
  };
  
  await pushTransaction('LOG_PARTY', {
    tab: 'CUSTOMERS',
    row: [customer.id, customer.name, customer.mobile, customer.due, 0, '']
  });
  
  showAlert(`Customer "${name}" saved`, 'success');
}

async function addSupplier(name, mobile) {
  if (!DB) { showAlert('Not logged in', 'error'); return; }
  
  const supplier = {
    id: 'S' + Date.now(),
    name,
    mobile,
    due: 0
  };
  
  await pushTransaction('LOG_PARTY', {
    tab: 'SUPPLIERS',
    row: [supplier.id, supplier.name, supplier.mobile, supplier.due]
  });
  
  showAlert(`Supplier "${name}" saved`, 'success');
}

async function addItem(name, unit, rate, gst = 0) {
  if (!DB) { showAlert('Not logged in', 'error'); return; }
  
  const item = {
    id: 'ITM' + Date.now(),
    name,
    unit,
    pRate: rate,
    sRate: rate,
    gst,
    stock: 0
  };
  
  await pushTransaction('LOG_PARTY', {
    tab: 'ITEMS',
    row: [item.id, item.name, item.unit, '', item.pRate, item.sRate, item.gst, 0, 0]
  });
  
  showAlert(`Item "${name}" added to inventory`, 'success');
}

async function recordSale(custId, total, mode = 'Cash', lineItems = []) {
  if (!DB) { showAlert('Not logged in', 'error'); return; }
  
  const saleId = 'INV' + Date.now();
  const today = new Date().toISOString().slice(0, 10);
  
  await pushTransaction('LOG_SALE', {
    id: saleId,
    cust: custId,
    date: today,
    total,
    mode,
    lineItems
  });
  
  showAlert('Sale recorded and synced to Google Sheet', 'success');
}

async function recordPurchase(suppId, total, mode = 'Cash', lineItems = []) {
  if (!DB) { showAlert('Not logged in', 'error'); return; }
  
  const purchaseId = 'PB' + Date.now();
  const today = new Date().toISOString().slice(0, 10);
  
  await pushTransaction('LOG_PURCHASE', {
    id: purchaseId,
    supp: suppId,
    date: today,
    total,
    mode,
    lineItems
  });
  
  showAlert('Purchase recorded and synced to Google Sheet', 'success');
}

// ════════════════════════════════════════════════════════════════════════════
// UI RENDERING
// ════════════════════════════════════════════════════════════════════════════

function render() {
  const app = document.getElementById('app');
  
  if (!SESSION) {
    app.innerHTML = `
      <div class="card" style="max-width:400px; margin:60px auto;">
        <h1>Balaji NextGen Business OS</h1>
        <p style="margin:20px 0; color:#666;">Direct Google Sheet Sync — No Local Cache</p>
        
        <div class="form-group">
          <label>Mobile Number</label>
          <input type="text" id="loginMobile" placeholder="9876543210">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword">
        </div>
        <button class="btn" style="width:100%;" onclick="handleLogin()">Login</button>
        <p style="margin-top:20px; text-align:center; font-size:12px; color:#999;">
          Every transaction syncs directly to Google Sheets<br>
          Works seamlessly across all browsers & devices
        </p>
      </div>
    `;
  } else {
    const custCount = (DB && DB.customers) ? DB.customers.length : 0;
    const suppCount = (DB && DB.suppliers) ? DB.suppliers.length : 0;
    const itemCount = (DB && DB.items) ? DB.items.length : 0;
    const saleCount = (DB && DB.sales) ? DB.sales.length : 0;
    const purchaseCount = (DB && DB.purchases) ? DB.purchases.length : 0;
    const cash = (DB && DB.cash) || 0;
    const bank = (DB && DB.bank) || 0;
    
    app.innerHTML = `
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:30px;">
        <div>
          <h1>${SESSION.name}</h1>
          <p style="color:#666; font-size:14px;">Client ID: ${SESSION.clientId}</p>
        </div>
        <button class="btn btn-danger" onclick="handleLogout()">Logout</button>
      </div>
      
      <div style="display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; margin-bottom:30px;">
        <div class="card">
          <h3>${custCount}</h3>
          <p>Customers</p>
        </div>
        <div class="card">
          <h3>${suppCount}</h3>
          <p>Suppliers</p>
        </div>
        <div class="card">
          <h3>${itemCount}</h3>
          <p>Items</p>
        </div>
        <div class="card">
          <h3>${saleCount}</h3>
          <p>Sales</p>
        </div>
        <div class="card">
          <h3>${purchaseCount}</h3>
          <p>Purchases</p>
        </div>
        <div class="card">
          <h3>₹${(cash + bank).toLocaleString('en-IN', {maximumFractionDigits: 2})}</h3>
          <p>Total Cash & Bank</p>
        </div>
      </div>
      
      <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:30px;">
        <div class="card">
          <h2>Add Customer</h2>
          <div class="form-group">
            <label>Customer Name</label>
            <input type="text" id="custName" placeholder="e.g., Rahul Sharma">
          </div>
          <div class="form-group">
            <label>Mobile Number</label>
            <input type="text" id="custMobile" placeholder="9876543210">
          </div>
          <button class="btn btn-success" style="width:100%;" onclick="handleAddCustomer()">Add Customer</button>
        </div>
        
        <div class="card">
          <h2>Add Supplier</h2>
          <div class="form-group">
            <label>Supplier Name</label>
            <input type="text" id="suppName" placeholder="e.g., ABC Wholesale">
          </div>
          <div class="form-group">
            <label>Mobile Number</label>
            <input type="text" id="suppMobile" placeholder="9876543210">
          </div>
          <button class="btn btn-success" style="width:100%;" onclick="handleAddSupplier()">Add Supplier</button>
        </div>
      </div>
      
      <div class="card">
        <h2>Customers</h2>
        ${(DB && DB.customers && DB.customers.length > 0) ? `
          <table class="table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Mobile</th>
                <th>Due Amount</th>
              </tr>
            </thead>
            <tbody>
              ${DB.customers.map(c => `
                <tr>
                  <td>${c.name || ''}</td>
                  <td>${c.mobile || ''}</td>
                  <td>₹${(c.due || 0).toLocaleString('en-IN')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        ` : '<p style="color:#999;">No customers yet</p>'}
      </div>
      
      <div class="card">
        <h2>Suppliers</h2>
        ${(DB && DB.suppliers && DB.suppliers.length > 0) ? `
          <table class="table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Mobile</th>
                <th>Due Amount</th>
              </tr>
            </thead>
            <tbody>
              ${DB.suppliers.map(s => `
                <tr>
                  <td>${s.name || ''}</td>
                  <td>${s.mobile || ''}</td>
                  <td>₹${(s.due || 0).toLocaleString('en-IN')}</td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        ` : '<p style="color:#999;">No suppliers yet</p>'}
      </div>
    `;
  }
}

function handleLogin() {
  const mobile = document.getElementById('loginMobile')?.value || '';
  const password = document.getElementById('loginPassword')?.value || '';
  
  if (!mobile || !password) {
    showAlert('Enter mobile number and password', 'error');
    return;
  }
  
  login(mobile, password);
}

function handleLogout() {
  if (confirm('Logout?')) {
    logout();
  }
}

function handleAddCustomer() {
  const name = document.getElementById('custName')?.value || '';
  const mobile = document.getElementById('custMobile')?.value || '';
  
  if (!name || !mobile) {
    showAlert('Enter customer name and mobile', 'error');
    return;
  }
  
  addCustomer(name, mobile);
  document.getElementById('custName').value = '';
  document.getElementById('custMobile').value = '';
}

function handleAddSupplier() {
  const name = document.getElementById('suppName')?.value || '';
  const mobile = document.getElementById('suppMobile')?.value || '';
  
  if (!name || !mobile) {
    showAlert('Enter supplier name and mobile', 'error');
    return;
  }
  
  addSupplier(name, mobile);
  document.getElementById('suppName').value = '';
  document.getElementById('suppMobile').value = '';
}

// ════════════════════════════════════════════════════════════════════════════
// STARTUP
// ════════════════════════════════════════════════════════════════════════════

window.addEventListener('DOMContentLoaded', () => {
  if (SESSION && SESSION.sheetId) {
    // User is already logged in, resume with real data from Google Sheet
    startRealtimeSync();
  } else {
    // Not logged in, show login form
    DB = null;
  }
  render();
});

</script>

</body>
</html>
