<style>
h2.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
.grp-label{font-size:11px;font-weight:500;color:var(--color-text-tertiary);letter-spacing:.06em;text-transform:uppercase;margin:1.2rem 0 .5rem;padding-left:2px}
.ind-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px;margin-bottom:.5rem}
.ind-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px;cursor:pointer;transition:border-color .15s}
.ind-card:hover{border-color:var(--color-border-primary)}
.ind-card.active{border:1.5px solid var(--color-border-info);background:var(--color-background-info)}
.ind-card .ic{font-size:20px;margin-bottom:4px;color:var(--color-text-secondary)}
.ind-card.active .ic{color:var(--color-text-info)}
.ind-card .name{font-size:13px;font-weight:500;color:var(--color-text-primary);line-height:1.3}
.ind-card.active .name{color:var(--color-text-info)}
.ind-card .sub{font-size:11px;color:var(--color-text-tertiary);margin-top:2px}
.detail-box{background:var(--color-background-secondary);border-radius:var(--border-radius-lg);padding:1rem 1.2rem;margin-top:1rem}
.det-head{display:flex;align-items:center;gap:10px;margin-bottom:.75rem}
.det-head .ic2{font-size:24px;color:var(--color-text-info)}
.det-title{font-size:15px;font-weight:500;color:var(--color-text-primary)}
.det-sub{font-size:12px;color:var(--color-text-secondary)}
.mod-grid{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.75rem}
.mod-badge{font-size:11px;padding:3px 9px;border-radius:20px;border:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary);background:var(--color-background-primary)}
.mod-badge.core{background:var(--color-background-info);color:var(--color-text-info);border-color:var(--color-border-info)}
.det-row{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--color-text-secondary)}
.det-row span{display:flex;align-items:center;gap:4px}
.ask-btn{margin-top:.75rem;font-size:12px;padding:6px 14px}
</style>

const PLAN_COLOR = {STARTER:"var(--color-background-success)",STANDARD:"var(--color-background-warning)",ENTERPRISE:"var(--color-background-danger)"};
const PLAN_TEXT  = {STARTER:"var(--color-text-success)",STANDARD:"var(--color-text-warning)",ENTERPRISE:"var(--color-text-danger)"};

let active = null;

function render(){
  const app = document.getElementById('app');
  let html = '';
  for(const [grp, items] of Object.entries(DATA)){
    html += `<div class="grp-label">${grp}</div><div class="ind-grid">`;
    items.forEach(it=>{
      const a = active===it.id?' active':'';
      html += `<div class="ind-card${a}" onclick="select('${it.id}')">
        <div class="ic"><i class="ti ${it.ic}" aria-hidden="true"></i></div>
        <div class="name">${it.name}</div>
        <div class="sub">${it.sub}</div>
      </div>`;
    });
    html += `</div>`;
  }
  html += `<div id="detail"></div>`;
  app.innerHTML = html;
  if(active) renderDetail();
}

function select(id){
  active = (active===id)?null:id;
  render();
  if(active) setTimeout(()=>document.getElementById('detail').scrollIntoView({behavior:'smooth',block:'nearest'}),50);
}

function renderDetail(){
  let it = null;
  for(const items of Object.values(DATA)){ it=items.find(x=>x.id===active)||it; }
  if(!it) return;
  const badges = it.modules.map(m=>{
    const c = it.core.includes(m)?'core':'';
    return `<span class="mod-badge ${c}">${m.replace(/_/g,' ')}</span>`;
  }).join('');
  document.getElementById('detail').innerHTML = `
    <div class="detail-box">
      <div class="det-head">
        <span class="ic2"><i class="ti ${it.ic}" aria-hidden="true"></i></span>
        <div>
          <div class="det-title">${it.name}</div>
          <div class="det-sub">${it.sub}</div>
        </div>
        <span style="margin-left:auto;font-size:11px;padding:3px 10px;border-radius:20px;background:${PLAN_COLOR[it.plan]};color:${PLAN_TEXT[it.plan]}">${it.plan}</span>
      </div>
      <div class="mod-grid">${badges}</div>
      <div class="det-row">
        <span><i class="ti ti-database" style="font-size:14px" aria-hidden="true"></i>${it.db}</span>
        <span><i class="ti ti-info-circle" style="font-size:14px" aria-hidden="true"></i>vs Tally: ${it.tally}</span>
      </div>
      <button class="ask-btn" onclick="sendPrompt('Give me complete FEATURE_CONTROL_MASTER row, template names, and Apps Script code for ${it.id} — ${it.name} in Balaji NextGen ERP')">Generate Apps Script config for this industry ↗</button>
    </div>`;
}

render();
</script>
