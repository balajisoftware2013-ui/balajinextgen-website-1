<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--brand:#b8690e;--brand2:#d4800f;--brand3:#f5c842;--brand-bg:rgba(184,105,14,.1);--bg:#f4f3ee;--surface:#fff;--surface2:#f0efe8;--border:rgba(0,0,0,.07);--text:#1c1b18;--text2:#4e4d47;--text3:#949389;--green:#1a9456;--red:#d42b2b;--blue:#2655c8;--btn-bg:#b8690e;--btn-text:#fff;--hero-grad:linear-gradient(135deg,#2d0e00,#6b2800,#b85a00,#d4800f,#f5c842);--radius:12px;--shadow:0 2px 14px rgba(0,0,0,.07);}
body.th-green{--brand:#059669;--brand2:#047857;--brand3:#34d399;--brand-bg:rgba(5,150,105,.1);--bg:#f0fdf4;--surface:#fff;--hero-grad:linear-gradient(135deg,#022c1c,#065f46,#059669,#10b981,#34d399);--btn-bg:#059669;}
body.th-blue{--brand:#2655c8;--brand2:#1d44a8;--brand3:#60a5fa;--brand-bg:rgba(38,85,200,.1);--bg:#eef3fd;--surface:#fff;--hero-grad:linear-gradient(135deg,#060d2e,#1e3a8a,#2655c8,#3b6fd4,#60a5fa);--btn-bg:#2655c8;}
body.th-orange{--brand:#f97316;--brand2:#ea580c;--brand3:#fdba74;--brand-bg:rgba(249,115,22,.08);--bg:#fdf4ed;--surface:#fff;--hero-grad:linear-gradient(135deg,#2c1000,#6b2c00,#c45500,#f97316,#fdba74);--btn-bg:#f97316;}
body.th-purple{--brand:#6340c4;--brand2:#4c2fa0;--brand3:#a78bfa;--brand-bg:rgba(99,64,196,.1);--bg:#f5f3ff;--surface:#fff;--hero-grad:linear-gradient(135deg,#130828,#3b1a78,#6340c4,#7c5ce8,#a78bfa);--btn-bg:#6340c4;}
body.th-dark{--brand:#f59e0b;--brand2:#d97706;--brand3:#fcd34d;--brand-bg:rgba(245,158,11,.13);--bg:#0e0e0e;--surface:#1a1a1a;--surface2:#222;--border:rgba(255,255,255,.08);--text:#f0ede8;--text2:#a8a49e;--text3:#5e5a56;--hero-grad:linear-gradient(135deg,#000,#1a0e00,#2e1a00,#4a2e00,#7a5200);--btn-bg:#f59e0b;--btn-text:#000;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Poppins',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:9999;background:var(--hero-grad);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .45s;}
#splash.out{opacity:0;pointer-events:none;}
.sp-logo{width:80px;height:80px;border-radius:20px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-size:36px;animation:float 3s ease-in-out infinite;}
.sp-title{font-size:24px;font-weight:900;color:#fff;text-align:center;line-height:1.2;}
.sp-title em{color:var(--brand3);font-style:normal;}
.sp-sub{font-size:11px;color:rgba(255,255,255,.6);font-weight:600;letter-spacing:.1em;}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}

/* LAYOUT */
#app{display:none;flex-direction:column;height:100vh;}
#app.show{display:flex;}

/* TOPBAR */
.topbar{height:54px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 18px;gap:12px;box-shadow:0 1px 6px rgba(0,0,0,.05);flex-shrink:0;}
.tb-logo{width:34px;height:34px;border-radius:10px;background:var(--hero-grad);display:flex;align-items:center;justify-content:center;font-size:16px;color:#fff;overflow:hidden;}
.tb-logo img{width:100%;height:100%;object-fit:cover;border-radius:10px;}
.tb-brand{font-size:14px;font-weight:800;color:var(--text);}
.tb-brand span{color:var(--brand);}
.tb-client{font-size:11px;color:var(--text3);margin-left:4px;font-weight:600;}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px;}
.tb-user{font-size:11px;font-weight:700;color:var(--text2);background:var(--brand-bg);padding:5px 10px;border-radius:20px;}
.tb-role{font-size:9px;font-weight:800;color:var(--btn-text);background:var(--btn-bg);padding:3px 9px;border-radius:20px;letter-spacing:.04em;}
.tb-btn{padding:7px 13px;border:none;border-radius:9px;font-size:11px;font-weight:700;cursor:pointer;transition:.2s;}
.tb-btn:hover{opacity:.85;transform:translateY(-1px);}
.tb-dash{background:var(--btn-bg);color:var(--btn-text);}
.tb-out{background:#fee2e2;color:#dc2626;}

/* BIZ STRIP */
.biz-strip{background:var(--surface);border-bottom:1px solid var(--border);padding:0 18px;display:flex;align-items:center;gap:0;overflow-x:auto;flex-shrink:0;scrollbar-width:none;}
.biz-strip::-webkit-scrollbar{display:none;}
.biz-tab{padding:10px 14px;font-size:11px;font-weight:700;cursor:pointer;border:none;background:none;color:var(--text3);white-space:nowrap;border-bottom:2px solid transparent;transition:.2s;}
.biz-tab:hover{color:var(--brand);}
.biz-tab.active{color:var(--brand);border-bottom-color:var(--brand);}

/* HERO BANNER */
.hero{position:relative;background:var(--hero-grad);padding:28px 28px 24px;color:#fff;overflow:hidden;flex-shrink:0;}
.hero::after{content:'';position:absolute;right:-30px;bottom:-30px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.04);}
.hero-row{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;position:relative;z-index:1;}
.hero-left h2{font-size:22px;font-weight:900;line-height:1.2;color:#fff;}
.hero-left h2 em{color:var(--brand3);font-style:normal;}
.hero-left p{font-size:12px;color:rgba(255,255,255,.7);margin-top:4px;}
.hero-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.hero-btn{padding:9px 18px;border:none;border-radius:10px;font-size:12px;font-weight:800;cursor:pointer;transition:.2s;white-space:nowrap;}
.hero-btn:hover{transform:translateY(-2px);}
.hb-launch{background:#fff;color:var(--btn-bg);}
.hb-dash{background:rgba(255,255,255,.15);color:#fff;border:1.5px solid rgba(255,255,255,.3);}

/* KPI BAR */
.kpi-bar{display:flex;gap:10px;overflow-x:auto;padding:14px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;scrollbar-width:none;}
.kpi-bar::-webkit-scrollbar{display:none;}
.kpi{background:var(--surface2);border-radius:10px;padding:10px 14px;min-width:100px;flex-shrink:0;}
.kpi-val{font-size:15px;font-weight:800;color:var(--text);}
.kpi-lbl{font-size:9px;color:var(--text3);font-weight:600;margin-top:2px;}
.kpi-chg{font-size:10px;font-weight:700;margin-top:3px;}
.kpi-up{color:var(--green);}
.kpi-dn{color:var(--red);}

/* BODY SPLIT */
.body{display:flex;flex:1;overflow:hidden;}
.sidebar{width:200px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;padding:10px 0;}
.snav-label{font-size:9px;font-weight:800;color:var(--text3);letter-spacing:.1em;padding:10px 16px 4px;text-transform:uppercase;}
.snav-item{display:flex;align-items:center;gap:9px;padding:9px 16px;font-size:12px;font-weight:600;color:var(--text2);cursor:pointer;border-radius:8px;margin:1px 8px;transition:.15s;}
.snav-item:hover{background:var(--brand-bg);color:var(--brand);}
.snav-item.active{background:var(--brand-bg);color:var(--brand);font-weight:700;}
.snav-item .si{font-size:16px;width:22px;text-align:center;}
.main{flex:1;overflow-y:auto;padding:18px;}

/* ROLE CARD */
.role-card{background:var(--surface);border-radius:var(--radius);border:1.5px solid var(--border);padding:18px;margin-bottom:16px;animation:fadeUp .3s;}
.role-card h3{font-size:14px;font-weight:800;color:var(--text);margin-bottom:4px;}
.role-card p{font-size:11px;color:var(--text3);margin-bottom:14px;}
.perm-list{display:flex;flex-wrap:wrap;gap:6px;}
.perm{padding:4px 10px;border-radius:20px;font-size:10px;font-weight:700;}
.perm-ok{background:#dcfce7;color:#166534;}
.perm-no{background:#f1f5f9;color:#94a3b8;text-decoration:line-through;}

/* MODULE GRID */
.section-title{font-size:13px;font-weight:800;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:7px;}
.mod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-bottom:18px;}
.mod-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:14px 12px;cursor:pointer;transition:.2s;text-align:center;}
.mod-card:hover{border-color:var(--brand);background:var(--brand-bg);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.08);}
.mod-icon{font-size:26px;margin-bottom:6px;}
.mod-name{font-size:11px;font-weight:700;color:var(--text);}
.mod-desc{font-size:9px;color:var(--text3);margin-top:2px;line-height:14px;}
.mod-soon{opacity:.45;cursor:default;}
.mod-soon:hover{transform:none;border-color:var(--border);background:var(--surface);}

/* THEME ROW */
.theme-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px;}
.th-btn{width:28px;height:28px;border-radius:8px;border:2.5px solid transparent;cursor:pointer;transition:.2s;}
.th-btn:hover{transform:scale(1.15);}
.th-btn.active{border-color:#fff;box-shadow:0 0 0 2px var(--brand);}

/* SETTINGS PANEL */
.settings-panel{background:var(--surface);border-radius:var(--radius);border:1px solid var(--border);padding:18px;margin-bottom:16px;}
.settings-panel h3{font-size:13px;font-weight:800;margin-bottom:14px;color:var(--text);}
.fg{display:flex;flex-direction:column;gap:5px;margin-bottom:14px;}
.fg label{font-size:11px;font-weight:700;color:var(--text2);}
.fg input,.fg select{padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;font-size:12px;font-family:'Poppins',sans-serif;background:var(--surface2);color:var(--text);outline:none;}
.fg input:focus,.fg select:focus{border-color:var(--brand);}
.save-btn{padding:9px 22px;background:var(--btn-bg);color:var(--btn-text);border:none;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;}

@media(max-width:768px){
  .sidebar{display:none;}
  .hero-left h2{font-size:17px;}
  .biz-tab{font-size:10px;padding:8px 10px;}
  .main{padding:12px;}
  .mod-grid{grid-template-columns:repeat(3,1fr);}
}
</style>
</head>

  // Apply saved theme
  var th = localStorage.getItem('erp_theme') || '';
  if(th) document.body.className = th;

  // Load user
  try{
    if(typeof ERP !== 'undefined') user = ERP.getUser();
  }catch(e){}
  if(!user){
    window.location.replace('login.html');
    return;
  }

  // Apply saved biz type from client/industry
  var ind = (user.INDUSTRY || user.industry || '').toLowerCase();
  var indMap = {restaurant:'restaurant',retail:'retail',hotel:'hotel',medical:'medical',grocery:'grocery',school:'school',manufacturing:'manufacturing'};
  if(indMap[ind]) currentBiz = indMap[ind];
  var savedBiz = localStorage.getItem('erp_biz_type');
  if(savedBiz && BIZ[savedBiz]) currentBiz = savedBiz;

  // Update splash
  var biz = BIZ[currentBiz];
  document.getElementById('spLogo').textContent = biz.emoji;
  document.getElementById('spBiz').textContent = biz.label + ' Management System';

  // Show app after splash
  setTimeout(function(){
    document.getElementById('splash').classList.add('out');
    setTimeout(function(){
      document.getElementById('splash').style.display = 'none';
      document.getElementById('app').classList.add('show');
      initApp();
    }, 450);
  }, 1800);
});

function initApp(){
  renderTopbar();
  renderBizStrip();
  applyBiz(currentBiz);
  renderMainSection('home');
}

function renderTopbar(){
  var name = user.FULL_NAME || user.full_name || user.EMAIL || 'User';
  var role = user.ROLE || user.role || 'ADMIN';
  var client = user.COMPANY_NAME || user.CLIENT_ID || 'Balaji NextGen';
  document.getElementById('tbUser').textContent = name;
  document.getElementById('tbRole').textContent = role;
  document.getElementById('tbClient').textContent = '· ' + client;
  // Logo
  var logo = localStorage.getItem('erp_logo');
  if(logo){ var img = document.createElement('img'); img.src=logo; document.getElementById('tbLogo').innerHTML=''; document.getElementById('tbLogo').appendChild(img); }
}

function renderBizStrip(){
  var html = '';
  Object.keys(BIZ).forEach(function(k){
    var b = BIZ[k];
    html += '<button class="biz-tab'+(k===currentBiz?' active':'')+'" onclick="switchBiz(\''+k+'\')">'+b.emoji+' '+b.label+'</button>';
  });
  document.getElementById('bizStrip').innerHTML = html;
}

function applyBiz(key){
  currentBiz = key;
  localStorage.setItem('erp_biz_type', key);
  var biz = BIZ[key];
  document.getElementById('heroTitle').innerHTML = biz.emoji + ' <em>' + biz.label + '</em> Management System';
  document.getElementById('heroSub').innerHTML = biz.open + ' · <span id="heroClient">'+(user.COMPANY_NAME||'Balaji NextGen')+'</span>';
  document.getElementById('hero').style.background = 'linear-gradient(135deg,'+biz.heroFrom+','+biz.heroTo+')';
  // KPIs
  document.getElementById('kpiBar').innerHTML = biz.kpis.map(function(k){
    return '<div class="kpi"><div class="kpi-val">'+k.val+'</div><div class="kpi-lbl">'+k.lbl+'</div><div class="kpi-chg '+(k.up?'kpi-up':'kpi-dn')+'">'+k.chg+'</div></div>';
  }).join('');
  // Biz strip
  document.querySelectorAll('.biz-tab').forEach(function(t,i){ t.classList.toggle('active', Object.keys(BIZ)[i]===key); });
  if(currentSection==='home') renderMainSection('home');
}

function switchBiz(key){ applyBiz(key); }

function goDashboard(){
  var role = (user.ROLE || user.role || 'ADMIN').toUpperCase();
  var dest = ROLE_URLS[role] || ROLE_URLS.DEFAULT;
  window.location.href = dest;
}

function launchMain(){
  window.location.href = BIZ[currentBiz].mainUrl;
}

function go(url){ window.location.href = url; }

function showSection(s){
  currentSection = s;
  document.querySelectorAll('.snav-item').forEach(function(el){ el.classList.remove('active'); });
  var nav = document.getElementById('nav-'+s);
  if(nav) nav.classList.add('active');
  renderMainSection(s);
}

function renderMainSection(s){
  var html = '';
  if(s==='home'){
    html = renderHome();
  } else if(s==='modules'){
    html = renderModules();
  } else if(s==='roles'){
    html = renderRoles();
  } else if(s==='settings'){
    html = renderSettings();
  }
  document.getElementById('mainArea').innerHTML = html;
}

function renderHome(){
  var role = (user.ROLE || user.role || 'ADMIN').toUpperCase();
  var destUrl = ROLE_URLS[role] || ROLE_URLS.DEFAULT;
  var roleLabels = {
    SUPER_ADMIN:'👑 Super Admin Dashboard',DEVELOPER:'💻 Developer Dashboard',OWNER:'🏠 Owner Dashboard',
    ADMIN:'🔑 Admin Dashboard',MANAGER:'📋 Manager Dashboard',CASHIER:'💳 Cashier POS',
    CHEF:'👨‍🍳 Kitchen KOT',WAITER:'🍽️ Staff Portal',ACCOUNTANT:'💰 Accounts Dashboard',
    STORE_MANAGER:'📦 Inventory Dashboard',CEO:'📊 CEO Dashboard'
  };
  var roleLabel = roleLabels[role] || '📊 Dashboard';

  return '<div style="animation:fadeUp .3s;">' +
    '<div class="role-card">' +
      '<h3>👋 Welcome, ' + (user.FULL_NAME || user.full_name || 'User') + '!</h3>' +
      '<p>You are logged in as <strong>' + role + '</strong> · ' + (user.COMPANY_NAME || user.CLIENT_ID || 'Balaji NextGen') + ' · ' + (user.BRANCH || user.branch || 'Main Branch') + '</p>' +
      '<button onclick="window.location.href=\''+destUrl+'\'" style="padding:11px 22px;background:var(--btn-bg);color:var(--btn-text);border:none;border-radius:10px;font-size:13px;font-weight:800;cursor:pointer;">🚀 Open ' + roleLabel + '</button>' +
    '</div>' +
    '<div class="section-title">⚡ Quick Launch</div>' +
    '<div class="mod-grid">' +
    MODULES.slice(0,8).map(function(m){
      return '<div class="mod-card" onclick="go(\''+m.url+'\')"><div class="mod-icon">'+m.icon+'</div><div class="mod-name">'+m.name+'</div><div class="mod-desc">'+m.desc+'</div></div>';
    }).join('') +
    '</div>' +
    '<div class="section-title">🎨 Theme</div>' +
    '<div class="theme-row">' +
    [['','#b8690e','Amber'],['th-gold','#c9960a','Gold'],['th-green','#059669','Green'],['th-blue','#2655c8','Blue'],['th-purple','#6340c4','Purple'],['th-orange','#f97316','Orange'],['th-lblue','#0ea5e9','Sky'],['th-dark','#1a1a1a','Dark']].map(function(t){
      var active = document.body.className===t[0] ? ' active' : '';
      return '<div class="th-btn'+active+'" style="background:'+t[1]+';" title="'+t[2]+'" onclick="setTheme(\''+t[0]+'\')"></div>';
    }).join('') +
    '</div>' +
  '</div>';
}

function renderModules(){
  return '<div style="animation:fadeUp .3s;">' +
    '<div class="section-title">📦 All Modules</div>' +
    '<div class="mod-grid">' +
    MODULES.map(function(m){
      return '<div class="mod-card" onclick="go(\''+m.url+'\')"><div class="mod-icon">'+m.icon+'</div><div class="mod-name">'+m.name+'</div><div class="mod-desc">'+m.desc+'</div></div>';
    }).join('') +
    '</div></div>';
}

function renderRoles(){
  var role = (user.ROLE || user.role || 'ADMIN').toUpperCase();
  var PERMS = {
    SUPER_ADMIN:['Billing','Purchase','Inventory','HR','Accounts','GST','Reports','AI','Settings','Users','Kitchen'],
    ADMIN:['Billing','Purchase','Inventory','HR','Accounts','GST','Reports','AI'],
    MANAGER:['Billing','Purchase','Inventory','HR','Reports'],
    CASHIER:['Billing','Reports'],
    CHEF:['Kitchen','Inventory'],
    WAITER:['Billing'],
    OWNER:['Billing','Purchase','Inventory','HR','Accounts','GST','Reports','AI','Settings'],
    DEVELOPER:['Billing','Purchase','Inventory','HR','Accounts','GST','Reports','AI','Settings','Users','Kitchen'],
    DEFAULT:['Billing']
  };
  var ALL_PERMS = ['Billing','Purchase','Inventory','HR','Accounts','GST','Reports','AI','Settings','Users','Kitchen'];
  var myPerms = PERMS[role] || PERMS.DEFAULT;
  var destUrl = ROLE_URLS[role] || ROLE_URLS.DEFAULT;

  return '<div style="animation:fadeUp .3s;">' +
    '<div class="role-card">' +
      '<h3>Your Role: ' + role + '</h3>' +
      '<p>Permissions and access level for your account</p>' +
      '<div class="perm-list">' +
        ALL_PERMS.map(function(p){ var ok=myPerms.indexOf(p)>-1; return '<span class="perm '+(ok?'perm-ok':'perm-no')+'">'+(ok?'✓':'✗')+' '+p+'</span>'; }).join('') +
      '</div>' +
      '<br><button onclick="window.location.href=\''+destUrl+'\'" style="padding:10px 20px;background:var(--btn-bg);color:var(--btn-text);border:none;border-radius:9px;font-size:12px;font-weight:800;cursor:pointer;">🚀 Open My Dashboard</button>' +
    '</div>' +
    '<div class="section-title">🚀 Role-Based Dashboards</div>' +
    '<div class="mod-grid">' +
    [
      {role:'SUPER_ADMIN',icon:'👑',name:'Super Admin',desc:'Full system access',url:'Dashboard/super-admin-dashboard.html'},
      {role:'ADMIN',icon:'🔑',name:'Admin',desc:'Management dashboard',url:'Dashboard/dashboard.html'},
      {role:'MANAGER',icon:'📋',name:'Manager',desc:'Operations view',url:'Dashboard/manager-dashboard.html'},
      {role:'CASHIER',icon:'💳',name:'Cashier',desc:'Fast billing POS',url:'Dashboard/cashier-dashboard.html'},
      {role:'CHEF',icon:'👨‍🍳',name:'Chef',desc:'Kitchen KOT orders',url:'Dashboard/chef-dashboard.html'},
      {role:'OWNER',icon:'🏠',name:'Owner',desc:'Business overview',url:'Dashboard/owner-dashboard.html'},
      {role:'ACCOUNTANT',icon:'💰',name:'Accountant',desc:'Finance & GST',url:'Dashboard/accounts/accounts.html'},
      {role:'CEO',icon:'📊',name:'CEO',desc:'Executive dashboard',url:'Dashboard/Ceo-dashboard.html'},
    ].map(function(r){
      var active = r.role === role ? ' style="border-color:var(--brand);background:var(--brand-bg);"' : '';
      return '<div class="mod-card"'+active+' onclick="go(\''+r.url+'\')"><div class="mod-icon">'+r.icon+'</div><div class="mod-name">'+r.name+'</div><div class="mod-desc">'+r.desc+'</div></div>';
    }).join('') +
    '</div></div>';
}

function renderSettings(){
  var savedName = localStorage.getItem('erp_clientName') || (user.COMPANY_NAME || 'Balaji NextGen');
  var savedTheme = document.body.className || '';
  return '<div style="animation:fadeUp .3s;">' +
    '<div class="settings-panel">' +
      '<h3>⚙️ ERP Settings</h3>' +
      '<div class="fg"><label>Company / Business Name</label>' +
        '<input type="text" id="set-name" value="'+savedName+'" placeholder="Your Company Name"></div>' +
      '<div class="fg"><label>Business Type</label>' +
        '<select id="set-biz">' + Object.keys(BIZ).map(function(k){ return '<option value="'+k+'"'+(k===currentBiz?' selected':'')+'>'+BIZ[k].emoji+' '+BIZ[k].label+'</option>'; }).join('') + '</select></div>' +
      '<div class="fg"><label>Theme</label>' +
        '<select id="set-theme">' +
          [['','Amber (Default)'],['th-gold','Gold'],['th-green','Green'],['th-blue','Blue'],['th-purple','Purple'],['th-orange','Orange'],['th-lblue','Sky Blue'],['th-dark','Dark Mode']].map(function(t){ return '<option value="'+t[0]+'"'+(savedTheme===t[0]?' selected':'')+'>'+t[1]+'</option>'; }).join('') +
        '</select></div>' +
      '<button class="save-btn" onclick="saveSettings()">💾 Save Settings</button>' +
    '</div>' +
    '<div class="settings-panel">' +
      '<h3>📊 Dashboard Preferences</h3>' +
      '<div class="mod-grid">' +
      [
        {icon:'🏠',name:'Home Screen',desc:'Welcome & quick launch',url:'welcome.html'},
        {icon:'🍽️',name:'Restaurant',desc:'Full restaurant POS',url:'Dashboard/restaurant/dashboard.html'},
        {icon:'📊',name:'Admin Dashboard',desc:'Full ERP management',url:'Dashboard/dashboard.html'},
        {icon:'👑',name:'Super Admin',desc:'System management',url:'Dashboard/super-admin-dashboard.html'},
      ].map(function(d){
        return '<div class="mod-card" onclick="go(\''+d.url+'\')"><div class="mod-icon">'+d.icon+'</div><div class="mod-name">'+d.name+'</div><div class="mod-desc">'+d.desc+'</div></div>';
      }).join('') +
      '</div>' +
    '</div>' +
    '<div class="settings-panel">' +
      '<h3>🔐 Session Info</h3>' +
      '<p style="font-size:12px;color:var(--text2);line-height:20px;"><b>User:</b> '+(user.FULL_NAME||user.full_name||'N/A')+'<br><b>Role:</b> '+(user.ROLE||user.role||'N/A')+'<br><b>Client:</b> '+(user.CLIENT_ID||'N/A')+'<br><b>Branch:</b> '+(user.BRANCH||user.branch||'N/A')+'<br><b>Email:</b> '+(user.EMAIL||user.email||'N/A')+'</p>' +
      '<br><button onclick="doLogout()" style="padding:9px 18px;background:#ef4444;color:#fff;border:none;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer;">🚪 Logout</button>' +
    '</div></div>';
}

function saveSettings(){
  var name = document.getElementById('set-name').value.trim();
  var biz = document.getElementById('set-biz').value;
  var theme = document.getElementById('set-theme').value;
  if(name) localStorage.setItem('erp_clientName', name);
  localStorage.setItem('erp_biz_type', biz);
  localStorage.setItem('erp_theme', theme);
  setTheme(theme);
  applyBiz(biz);
  alert('✅ Settings saved!');
}

function setTheme(cls){
  document.body.className = cls;
  localStorage.setItem('erp_theme', cls);
  document.querySelectorAll('.th-btn').forEach(function(b,i){
    var themes = ['','th-gold','th-green','th-blue','th-purple','th-orange','th-lblue','th-dark'];
    b.classList.toggle('active', themes[i]===cls);
  });
}

function doLogout(){
  if(typeof ERP !== 'undefined') ERP.logout('login.html');
  else window.location.replace('login.html');
}
</script>
</body>
</html>
