<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Notification Panel</title>

<style>

.notification-panel{

    position:fixed;

    top:70px;

    right:20px;

    width:380px;

    max-height:600px;

    background:white;

    border-radius:15px;

    box-shadow:0 10px 30px rgba(0,0,0,.15);

    overflow:hidden;

    z-index:9999;

    display:none;
}

.notification-header{

    background:#2563eb;

    color:white;

    padding:15px 20px;

    display:flex;

    justify-content:space-between;

    align-items:center;
}

.notification-header h3{

    margin:0;
}

.notification-count{

    background:white;

    color:#2563eb;

    padding:4px 10px;

    border-radius:20px;

    font-weight:bold;
}

.notification-body{

    max-height:500px;

    overflow-y:auto;
}

.notification-item{

    padding:15px;

    border-bottom:1px solid #e5e7eb;

    cursor:pointer;

    transition:.3s;
}

.notification-item:hover{

    background:#f8fafc;
}

.notification-title{

    font-weight:600;

    margin-bottom:5px;
}

.notification-message{

    color:#64748b;

    font-size:13px;
}

.notification-time{

    color:#94a3b8;

    font-size:11px;

    margin-top:5px;
}

.unread{

    border-left:4px solid #2563eb;
}

.notification-footer{

    padding:10px;

    text-align:center;

    background:#f8fafc;
}

.notification-footer button{

    border:none;

    background:#2563eb;

    color:white;

    padding:10px 20px;

    border-radius:8px;

    cursor:pointer;
}


/* ══ BALAJI NEXTGEN — MOBILE FIX v3 ══ */
.ham-btn{display:none;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:42px;height:42px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);border-radius:10px;cursor:pointer;padding:8px;flex-shrink:0;}
.ham-btn span{display:block;width:22px;height:2.5px;background:#fff;border-radius:2px;transition:.25s;}
.ham-btn.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg);}
.ham-btn.open span:nth-child(2){opacity:0;}
.ham-btn.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg);}
@media(max-width:1100px){
  .ham-btn{display:flex;}
  .logo-text h1{font-size:20px!important;}
  .logo-text p{font-size:9px!important;}
  .logo,.logo-section img{width:48px!important;height:48px!important;}
  .nav-menu{display:none!important;flex-direction:column!important;position:absolute;top:100%;left:0;right:0;background:linear-gradient(135deg,#1e3a8a,#2563eb);padding:10px 0;z-index:999;box-shadow:0 10px 28px rgba(0,0,0,.22);}
  .nav-menu.mob-open{display:flex!important;}
  .nav-menu a,.nav-menu .nav-item a,.nav-menu .nav-item>a{display:block!important;padding:13px 22px!important;font-size:14px!important;font-weight:600;border-bottom:1px solid rgba(255,255,255,.08);color:#fff!important;text-decoration:none;}
  nav:not(.keep-desktop){display:none;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:linear-gradient(135deg,#1e3a8a,#2563eb);padding:10px 0;z-index:999;box-shadow:0 10px 28px rgba(0,0,0,.22);}
  nav.mob-open{display:flex!important;}
  nav a{display:block!important;padding:13px 22px;font-size:14px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.08);color:#fff!important;text-decoration:none;}
  .navbar{position:relative!important;top:auto!important;}
  .hero{padding:26px 5% 32px!important;text-align:center!important;}
  .hero h1{font-size:36px!important;line-height:1.2;}
  .hero h2{font-size:32px!important;}
  .hero-container,.hero-flex{grid-template-columns:1fr!important;text-align:center;}
  .hero-image,.hero-img-wrap{display:none!important;}
  .hero-buttons{justify-content:center!important;flex-wrap:wrap;gap:10px!important;}
  .erp-grid,.section-grid,.cards-grid,.services-grid,.features-grid,.plans-grid,.benefits-grid,.row2,.row3,.stats-grid{grid-template-columns:repeat(2,1fr)!important;}
  .two-column,.contact-wrapper,.split-layout{grid-template-columns:1fr!important;}
  .section-title h2,.section-header h2,.cta h2,.banner h2{font-size:30px!important;}
}
@media(max-width:768px){
  .logo-text p{display:none!important;}
  .logo-text h1{font-size:17px!important;}
  .logo,.logo-section img{width:40px!important;height:40px!important;}
  .header-buttons a,.header-right .btn,.header-right .header-btn{padding:8px 11px;font-size:11.5px;}
  .hero h1{font-size:24px!important;}
  .hero h2{font-size:22px!important;}
  .hero-badge{font-size:11px;padding:6px 14px;}
  .erp-grid,.section-grid,.cards-grid,.services-grid,.features-grid,.plans-grid,.benefits-grid,.stats-grid,.footer-grid,.row2,.row3{grid-template-columns:1fr!important;}
  .service-card,.module-card,.feature-card,.plan-card{padding:18px 16px;}
  .section-title h2,.section-header h2,.cta h2,.banner h2,h2{font-size:22px!important;}
  footer{padding:24px 5% 14px!important;}
  .footer-grid{grid-template-columns:1fr!important;gap:18px!important;}
  .form-grid{grid-template-columns:1fr!important;}
  .input-box.full{grid-column:auto!important;}
  .right-panel{padding:20px 16px!important;}
  .left-panel{padding:22px 16px!important;}
  img{max-width:100%;height:auto;}
}
@media(max-width:480px){
  .logo-text h1{font-size:14px!important;}
  .logo,.logo-section img{width:36px!important;height:36px!important;}
  .hero h1{font-size:20px!important;}
  h2{font-size:18px!important;}
  .service-card h3,.module-card h3{font-size:13.5px!important;}
  .submit-btn,.btn-submit{font-size:13px;padding:11px;}
  section,.section{padding-left:12px!important;padding-right:12px!important;}
}
</style>

</head>
<body>

<div class="notification-panel"
     id="notificationPanel">

    <div class="notification-header">

        <h3>
            Notifications
        </h3>

        <span
            class="notification-count"
            id="notificationCount">
            5
        </span>

    </div>

    <div class="notification-body"
         id="notificationBody">

        <div class="notification-item unread">

            <div class="notification-title">
                Low Stock Alert
            </div>

            <div class="notification-message">
                12 products reached reorder level.
            </div>

            <div class="notification-time">
                5 Minutes Ago
            </div>

        </div>

        <div class="notification-item unread">

            <div class="notification-title">
                Helpdesk Ticket
            </div>

            <div class="notification-message">
                New support ticket assigned.
            </div>

            <div class="notification-time">
                15 Minutes Ago
            </div>

        </div>

        <div class="notification-item">

            <div class="notification-title">
                Sales Achievement
            </div>

            <div class="notification-message">
                Monthly target reached 82%.
            </div>

            <div class="notification-time">
                1 Hour Ago
            </div>

        </div>

    </div>

    <div class="notification-footer">

        <button onclick="markAllRead()">

            Mark All Read

        </button>

    </div>

</div>

<script>

function toggleNotifications(){

    const panel =
    document.getElementById(
        "notificationPanel"
    );

    panel.style.display =
        panel.style.display === "block"
        ? "none"
        : "block";
}

function markAllRead(){

    document
    .querySelectorAll(".unread")
    .forEach(item => {

        item.classList.remove("unread");

    });

    document
    .getElementById(
        "notificationCount"
    )
    .innerText = "0";
}

/*

Future Apps Script API

google.script.run
.withSuccessHandler(
loadNotifications
)
.getNotifications();

*/

</script>

<script>
(function(){var b=document.querySelector('.ham-btn');if(!b)return;var ns=document.querySelectorAll('.nav-menu,nav:not(.keep-desktop)');b.addEventListener('click',function(e){e.stopPropagation();var o=b.classList.toggle('open');ns.forEach(function(n){n.classList.toggle('mob-open',o);});});document.addEventListener('click',function(){b.classList.remove('open');ns.forEach(function(n){n.classList.remove('mob-open');});});ns.forEach(function(n){n.addEventListener('click',function(e){e.stopPropagation();});});})();
</script>
</body>
</html>
