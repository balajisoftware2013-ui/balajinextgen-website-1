<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Balaji NextGen ERP Sidebar</title>

<link rel="stylesheet" href="../assets/css/sidebar.css">

<style>

:root{
  --primary:#0f172a;
  --secondary:#1e293b;
  --accent:#2563eb;
  --success:#16a34a;
  --text:#ffffff;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Segoe UI,Arial,sans-serif;
}

.sidebar{
  width:260px;
  height:100vh;
  background:var(--primary);
  color:white;
  position:fixed;
  left:0;
  top:0;
  overflow-y:auto;
  transition:0.3s;
}

.logo{
  padding:20px;
  text-align:center;
  border-bottom:1px solid rgba(255,255,255,.1);
}

.logo h2{
  font-size:20px;
}

.profile{
  padding:15px;
  text-align:center;
  border-bottom:1px solid rgba(255,255,255,.1);
}

.profile img{
  width:70px;
  height:70px;
  border-radius:50%;
}

.profile h4{
  margin-top:10px;
}

.role-badge{
  background:var(--accent);
  padding:5px 10px;
  border-radius:20px;
  display:inline-block;
  margin-top:5px;
  font-size:12px;
}

.menu{
  padding:10px;
}

.menu a{
  display:block;
  color:white;
  text-decoration:none;
  padding:12px 15px;
  margin:4px 0;
  border-radius:8px;
  transition:0.3s;
}

.menu a:hover{
  background:var(--accent);
}

.menu a.active{
  background:var(--accent);
}

.logout{
  margin-top:20px;
  background:#dc2626;
}

@media(max-width:768px){

.sidebar{
  width:80px;
}

.logo h2,
.profile h4,
.role-badge,
.menu span{
  display:none;
}

}


/* ══ DASHBOARD MOBILE FIX v3 ══ */
.sidebar-toggle{display:none;position:fixed;top:12px;left:12px;z-index:9999;width:42px;height:42px;border-radius:11px;background:linear-gradient(135deg,#1e3a8a,#2563eb);border:none;cursor:pointer;flex-direction:column;justify-content:center;align-items:center;gap:5px;box-shadow:0 4px 14px rgba(37,99,235,.4);}
.sidebar-toggle span{display:block;width:20px;height:2.5px;background:#fff;border-radius:2px;transition:.25s;}
.sidebar-toggle.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg);}
.sidebar-toggle.open span:nth-child(2){opacity:0;}
.sidebar-toggle.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg);}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:199;}
.sidebar-overlay.show{display:block;}
@media(max-width:900px){
  body{flex-direction:column;}
  .sidebar-toggle{display:flex;}
  .sidebar{position:fixed!important;left:-280px!important;top:0;width:260px!important;height:100vh;z-index:200;transition:left .28s ease;overflow-y:auto;}
  .sidebar.mob-open{left:0!important;}
  .main{margin-left:0!important;max-width:100vw!important;padding:58px 12px 12px!important;width:100%;}
  .topbar{flex-wrap:wrap;gap:8px;padding:12px 14px!important;}
  .topbar-left h1{font-size:17px!important;}
  .topbar-right{flex-wrap:wrap;gap:6px;}
  .tb-btn{padding:7px 10px;font-size:12px;}
  .kpi-grid{grid-template-columns:repeat(2,1fr)!important;}
  .action-grid{grid-template-columns:repeat(3,1fr)!important;}
  .module-grid{grid-template-columns:repeat(3,1fr)!important;}
  .chart-row,.two-col,.three-col,.split-row,.alert-row,.task-cols,.grid-2,.grid-3{grid-template-columns:1fr!important;}
  .hero{padding:16px!important;}
  .hero h2{font-size:18px!important;}
  .info-box{flex-direction:column;gap:10px;}
  table{font-size:12px;display:block;overflow-x:auto;}
}
@media(max-width:600px){
  .main{padding:54px 10px 10px!important;}
  .topbar-left h1{font-size:15px!important;}
  .tb-logout,.tb-settings{display:none;}
  .kpi-grid{grid-template-columns:1fr 1fr!important;}
  .kpi-card{padding:14px!important;}
  .kpi-value{font-size:20px!important;}
  .action-grid{grid-template-columns:repeat(3,1fr)!important;}
  .module-grid{grid-template-columns:repeat(2,1fr)!important;}
  .module-card{padding:14px 10px!important;}
  .sync-bar{flex-direction:column;gap:8px;align-items:flex-start;}
  .demo-banner{flex-direction:column;text-align:center;padding:12px 14px;}
  .demo-tag{margin:0 auto;}
}
@media(max-width:400px){
  .kpi-grid{grid-template-columns:1fr!important;}
  .action-grid,.module-grid{grid-template-columns:repeat(2,1fr)!important;}
}
</style>
</head>

<body>

<div class="sidebar">

  <div class="logo">
      <h2>BALAJI ERP</h2>
  </div>

  <div class="profile">
      <img src="../assets/Logos/logo.png" class="logo" onerror="this.style.display='none'">
      <h4 id="userName">User Name</h4>
      <div class="role-badge" id="userRole">
          SUPER_ADMIN
      </div>
  </div>

  <div class="menu" id="sidebarMenu">

      <a href="../Dashboard/dashboard.html">
          📊 <span>Dashboard</span>
      </a>

      <a href="../crm/crm-dashboard.html">
          👥 <span>CRM</span>
      </a>

      <a href="../sales/sales-dashboard.html">
          💰 <span>Sales</span>
      </a>

      <a href="../purchase/purchase-dashboard.html">
          🛒 <span>Purchase</span>
      </a>

      <a href="../inventory/inventory-dashboard.html">
          📦 <span>Inventory</span>
      </a>

      <a href="../accounts/accounts-dashboard.html">
          🏦 <span>Accounts</span>
      </a>

      <a href="../hr/hr-dashboard.html">
          👨‍💼 <span>HR</span>
      </a>

      <a href="../manufacturing/manufacturing-dashboard.html">
          🏭 <span>Manufacturing</span>
      </a>

      <a href="../restaurant-dashboard.html">
          🍽 <span>Restaurant</span>
      </a>

      <a href="../retail/retail-pos.html">
          🛍 <span>Retail</span>
      </a>

      <a href="../projects/project-dashboard.html">
          📁 <span>Projects</span>
      </a>

      <a href="../assets/asset-dashboard.html">
          💼 <span>Assets</span>
      </a>

      <a href="../service/service-dashboard.html">
          🔧 <span>Service</span>
      </a>

      <a href="../helpdesk/helpdesk-dashboard.html">
          🎫 <span>Helpdesk</span>
      </a>

      <a href="../dms/dms-dashboard.html">
          📄 <span>DMS</span>
      </a>

      <a href="../ai/ai-center.html">
          🤖 <span>AI Center</span>
      </a>

      <a href="../settings/settings.html">
          ⚙️ <span>Settings</span>
      </a>

      <a href="#" class="logout" onclick="logout()">
          🚪 <span>Logout</span>
      </a>

  </div>

</div>

<script>

function logout(){

    localStorage.removeItem("ERP_USER");

    window.location.href="../../login.html";
}

function loadUser(){

    const user=JSON.parse(
      localStorage.getItem("ERP_USER")
    );

    if(user){

      document.getElementById("userName").innerHTML=
      user.userName || "User";

      document.getElementById("userRole").innerHTML=
      user.role || "EMPLOYEE";
    }
}

loadUser();

</script>


<div class="sidebar-overlay" id="sidebarOverlay"></div>
<button class="sidebar-toggle" id="sidebarToggle" aria-label="Menu"><span></span><span></span><span></span></button>
<script>
(function(){var b=document.getElementById('sidebarToggle');var s=document.getElementById('sidebar')||document.querySelector('.sidebar');var o=document.getElementById('sidebarOverlay');if(!b||!s)return;function open(){s.classList.add('mob-open');o.classList.add('show');b.classList.add('open');}function close(){s.classList.remove('mob-open');o.classList.remove('show');b.classList.remove('open');}b.addEventListener('click',function(e){e.stopPropagation();s.classList.contains('mob-open')?close():open();});o.addEventListener('click',close);s.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){if(window.innerWidth<=900)close();});});window.addEventListener('resize',function(){if(window.innerWidth>900)close();});})();
</script>
</body>
</html>
