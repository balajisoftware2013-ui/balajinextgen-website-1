<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome — Balaji NextGen ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<script src="erp-config.js"></script>
<style>
:root {
    --brand: #0f172a; --accent: #f5c842; --text: #1e293b;
    --hero-grad: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', sans-serif; background: #f8fafc; color: var(--text); overflow: hidden; height: 100vh; }

/* ══ PROFESSIONAL SPLASH ══ */
#splash {
    position: fixed; inset: 0; z-index: 9999;
    background: url('https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    transition: opacity 0.8s ease;
}
#splash::after { content: ''; position: absolute; inset: 0; background: rgba(15, 23, 42, 0.85); z-index: 1; }

.sp-content { position: relative; z-index: 2; text-align: center; }
.sp-logo { width: 120px; margin-bottom: 20px; filter: drop-shadow(0 0 20px rgba(245, 200, 66, 0.4)); animation: float 3s ease-in-out infinite; }
.sp-bar { width: 240px; height: 4px; background: rgba(255,255,255,0.1); border-radius: 10px; margin: 20px auto; overflow: hidden; }
.sp-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.4s; }

@keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }

/* ══ MAIN UI ══ */
.screen { display: none; flex-direction: column; height: 100vh; }
.screen.active { display: flex; }

.nav { height: 65px; background: #fff; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; padding: 0 30px; justify-content: space-between; }
.logo-area { display: flex; align-items: center; gap: 12px; }
.logo-area img { height: 40px; }

.hero { height: 320px; background: var(--hero-grad); color: white; padding: 60px; display: flex; align-items: center; position: relative; overflow: hidden; }
.hero-content { position: relative; z-index: 2; }
.hero-content h1 { font-family: 'Playfair Display'; font-size: 48px; margin-bottom: 10px; }
.hero-bg-icon { position: absolute; right: 40px; font-size: 180px; opacity: 0.1; transform: rotate(-15deg); }

.module-area { flex: 1; overflow-y: auto; padding: 40px; background: #f1f5f9; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 25px; max-width: 1300px; margin: 0 auto; }
.card { background: white; padding: 30px; border-radius: 24px; text-align: center; cursor: pointer; transition: 0.3s; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
.card:hover { transform: translateY(-8px); border-color: var(--accent); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1); }
.card-icon { font-size: 44px; margin-bottom: 15px; display: block; }
.card h3 { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.card p { font-size: 12px; color: #64748b; line-height: 1.5; }

.logout-btn { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: 700; }
</style>
</head>
<body>

<div id="splash">
    <div class="sp-content">
        <img src="Assets/Logos/logo.png" class="sp-logo" alt="Balaji Logo" onerror="this.src='https://via.placeholder.com/120?text=BALAJI'">
        <h2 style="color:white; font-family:'Playfair Display'; font-size: 32px;">BALAJI NEXTGEN</h2>
        <p style="color:var(--accent); letter-spacing: 2px; font-size: 12px; margin-top: 5px;">ENTERPRISE ERP ECOSYSTEM</p>
        <div class="sp-bar"><div class="sp-fill" id="spFill"></div></div>
    </div>
</div>

<div class="screen" id="mainUI">
    <nav class="nav">
        <div class="logo-area">
            <img src="Assets/Logos/logo.png" alt="Logo">
            <div style="line-height:1">
                <strong style="font-size:18px">BALAJI <span style="color:#ef4444">NEXTGEN</span></strong>
                <p style="font-size:9px; color:#64748b; letter-spacing:1px">ENTERPRISE CLOUD</p>
            </div>
        </div>
        <div style="display:flex; align-items:center; gap:20px;">
            <div style="text-align:right">
                <div id="uName" style="font-weight:800; font-size:15px;">User Name</div>
                <div id="uRole" style="font-size:11px; color:#64748b;">Role</div>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </nav>

    <div class="hero">
        <div class="hero-content">
            <h1 id="greet">Welcome</h1>
            <p id="bizDesc">Loading your industry specialized modules...</p>
        </div>
        <div class="hero-bg-icon" id="heroIcon">🏢</div>
    </div>

    <div class="module-area">
        <div class="grid" id="moduleGrid"></div>
    </div>
</div>

<script>
const MODULE_DATA = {
    RESTAURANT: [
        { name: 'POS Billing', icon: '🧾', path: 'Dashboard/restaurant/dashboard.html', desc: 'Dine-in, KOT & Fast Billing' },
        { name: 'Kitchen KOT', icon: '👨‍🍳', path: 'Dashboard/chef-dashboard.html', desc: 'Live Order Management' },
        { name: 'Bar Module', icon: '🍷', path: 'Dashboard/restaurant/bar_management_system.html', desc: 'Liquor Stock & Consumption' },
        { name: 'Inventory', icon: '📦', path: 'Dashboard/inventory/inventory.html', desc: 'Raw Materials & Stock' },
        { name: 'AI Center', icon: '🤖', path: 'Dashboard/ai/ai-center.html', desc: 'Sales Forecasting' }
    ],
    RETAIL: [
        { name: 'Retail POS', icon: '🏪', path: 'Dashboard/retail/retail-pos-ai.html', desc: 'Barcode Scanning & Sales' },
        { name: 'Inventory', icon: '📦', path: 'Dashboard/inventory/inventory.html', desc: 'Warehouse & GRN' },
        { name: 'Accounts', icon: '💰', path: 'Dashboard/accounts/accounts.html', desc: 'Ledger & GST Reports' }
    ],
    DEFAULT: [
        { name: 'ERP Dashboard', icon: '🏠', path: 'main_dashboard.html', desc: 'Central Management' },
        { name: 'Accounts', icon: '💰', path: 'Dashboard/accounts/accounts.html', desc: 'Finance & GST' },
        { name: 'HR Payroll', icon: '👥', path: 'Dashboard/hr/hr-dashboard.html', desc: 'Staff Attendance' }
    ]
};

function logout() {
    sessionStorage.clear();
    localStorage.removeItem('ERP_USER');
    window.location.href = 'login.html';
}

window.onload = () => {
    // 1. Session Check
    const rawUser = sessionStorage.getItem('erp_user') || localStorage.getItem('ERP_USER');
    if(!rawUser && window.location.protocol !== 'file:') {
        window.location.href = 'login.html';
        return;
    }
    const user = JSON.parse(rawUser || '{"FULL_NAME":"Admin","ROLE":"SUPER_ADMIN","INDUSTRY":"RESTAURANT"}');

    // 2. Splash Sequence
    let progress = 0;
    const fill = document.getElementById('spFill');
    const iv = setInterval(() => {
        progress += 25;
        fill.style.width = progress + '%';
        if(progress >= 100) {
            clearInterval(iv);
            document.getElementById('splash').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('splash').style.display = 'none';
                document.getElementById('mainUI').classList.add('active');
                initUI(user);
            }, 800);
        }
    }, 200);
};

function initUI(user) {
    document.getElementById('uName').textContent = user.FULL_NAME;
    document.getElementById('uRole').textContent = user.ROLE.replace('_', ' ');
    document.getElementById('greet').textContent = `Welcome, ${user.FULL_NAME.split(' ')[0]}`;

    const industry = (user.INDUSTRY || 'DEFAULT').toUpperCase();
    const mods = MODULE_DATA[industry] || MODULE_DATA.DEFAULT;
    
    document.getElementById('heroIcon').textContent = industry === 'RESTAURANT' ? '🍽️' : '🏪';
    document.getElementById('bizDesc').textContent = `Your ${industry.toLowerCase()} specialized ERP is active.`;

    const grid = document.getElementById('moduleGrid');
    grid.innerHTML = mods.map(m => `
        <div class="card" onclick="window.location.href='${m.path}'">
            <span class="card-icon">${m.icon}</span>
            <h3>${m.name}</h3>
            <p>${m.desc}</p>
        </div>
    `).join('');
}
</script>
</body>
</html>
