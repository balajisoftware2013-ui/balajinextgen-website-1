<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Delivery Challan — Balaji NextGen ERP</title>
<link rel="stylesheet" href="style.css">
<style>
.challan-preview { background: #fff; color: #111; border-radius: var(--radius); padding: 28px; font-family:'Rajdhani',sans-serif; }
.challan-preview .ch-header { display:flex; justify-content:space-between; border-bottom: 2px solid #0a0e1a; padding-bottom:14px; margin-bottom:14px; }
.challan-preview .ch-brand { font-size:22px; font-weight:800; color:#0a0e1a; font-family:'Orbitron',monospace; }
.challan-preview .ch-sub { font-size:11px; color:#555; }
.challan-preview table thead th { background:#0a0e1a; color:#fff; }
.challan-preview table tbody td { color:#222; border-bottom:1px solid #eee; }
.challan-preview .ch-footer { margin-top:20px; display:flex; justify-content:space-between; }
.challan-preview .sign-box { border-top:1px solid #000; width:160px; text-align:center; padding-top:6px; font-size:12px; color:#555; }
@media print { .sidebar,.topbar,.action-row,.card:not(.print-card) { display:none!important; } .main { margin:0; } .content { padding:0; } }

/* ══ BALAJI NEXTGEN — MOBILE FIX v3 ══ */
.ham-btn{display:none;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:42px;height:42px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);border-radius:10px;cursor:pointer;padding:8px;flex-shrink:0;}
.ham-btn span{display:block;width:22px;height:2.5px;background:#fff;border-radius:2px;transition:.25s;}
.ham-btn.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg);}
.ham-btn.open span:nth-child(2){opacity:0;}
.ham-btn.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg);}
@media(max-width:1100px){
  .ham-btn{display:flex;}
  .logo-text h1{font-size:20px!important;}
  .logo-text p{font-size:9px!important;}
  .logo,.logo-section img{width:48px!important;height:48px!important;}
  .nav-menu{display:none!important;flex-direction:column!important;position:absolute;top:100%;left:0;right:0;background:linear-gradient(135deg,#1e3a8a,#2563eb);padding:10px 0;z-index:999;box-shadow:0 10px 28px rgba(0,0,0,.22);}
  .nav-menu.mob-open{display:flex!important;}
  .nav-menu a,.nav-menu .nav-item a,.nav-menu .nav-item>a{display:block!important;padding:13px 22px!important;font-size:14px!important;font-weight:600;border-bottom:1px solid rgba(255,255,255,.08);color:#fff!important;text-decoration:none;}
  nav:not(.keep-desktop){display:none;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:linear-gradient(135deg,#1e3a8a,#2563eb);padding:10px 0;z-index:999;box-shadow:0 10px 28px rgba(0,0,0,.22);}
  nav.mob-open{display:flex!important;}
  nav a{display:block!important;padding:13px 22px;font-size:14px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.08);color:#fff!important;text-decoration:none;}
  .navbar{position:relative!important;top:auto!important;}
  .hero{padding:26px 5% 32px!important;text-align:center!important;}
  .hero h1{font-size:36px!important;line-height:1.2;}
  .hero h2{font-size:32px!important;}
  .hero-container,.hero-flex{grid-template-columns:1fr!important;text-align:center;}
  .hero-image,.hero-img-wrap{display:none!important;}
  .hero-buttons{justify-content:center!important;flex-wrap:wrap;gap:10px!important;}
  .erp-grid,.section-grid,.cards-grid,.services-grid,.features-grid,.plans-grid,.benefits-grid,.row2,.row3,.stats-grid{grid-template-columns:repeat(2,1fr)!important;}
  .two-column,.contact-wrapper,.split-layout{grid-template-columns:1fr!important;}
  .section-title h2,.section-header h2,.cta h2,.banner h2{font-size:30px!important;}
}
@media(max-width:768px){
  .logo-text p{display:none!important;}
  .logo-text h1{font-size:17px!important;}
  .logo,.logo-section img{width:40px!important;height:40px!important;}
  .header-buttons a,.header-right .btn,.header-right .header-btn{padding:8px 11px;font-size:11.5px;}
  .hero h1{font-size:24px!important;}
  .hero h2{font-size:22px!important;}
  .hero-badge{font-size:11px;padding:6px 14px;}
  .erp-grid,.section-grid,.cards-grid,.services-grid,.features-grid,.plans-grid,.benefits-grid,.stats-grid,.footer-grid,.row2,.row3{grid-template-columns:1fr!important;}
  .service-card,.module-card,.feature-card,.plan-card{padding:18px 16px;}
  .section-title h2,.section-header h2,.cta h2,.banner h2,h2{font-size:22px!important;}
  footer{padding:24px 5% 14px!important;}
  .footer-grid{grid-template-columns:1fr!important;gap:18px!important;}
  .form-grid{grid-template-columns:1fr!important;}
  .input-box.full{grid-column:auto!important;}
  .right-panel{padding:20px 16px!important;}
  .left-panel{padding:22px 16px!important;}
  img{max-width:100%;height:auto;}
}
@media(max-width:480px){
  .logo-text h1{font-size:14px!important;}
  .logo,.logo-section img{width:36px!important;height:36px!important;}
  .hero h1{font-size:20px!important;}
  h2{font-size:18px!important;}
  .service-card h3,.module-card h3{font-size:13.5px!important;}
  .submit-btn,.btn-submit{font-size:13px;padding:11px;}
  section,.section{padding-left:12px!important;padding-right:12px!important;}
}
</style>
<script src="../../erp-config.js"></script>
</head>
<body>
<script src="erp.js"></script>
<div id="sidebar-root"></div>
<div class="main">
  <div id="topbar-root"></div>
  <div class="content">

    <!-- Form -->
    <div class="card">
      <div class="card-header"><span class="card-title">🚚 Delivery Challan</span><span class="badge badge-info" id="dcNo">DC-2026-0314</span></div>
      <div class="card-body">
        <div class="form-grid" style="grid-template-columns:repeat(3,1fr)">
          <div class="form-group"><label class="form-label">Consignee *</label><input class="form-control" id="consignee" placeholder="Type client name..." oninput="searchConsignee(this.value)"></div>
          <div class="form-group"><label class="form-label">Challan Date</label><input class="form-control" type="date" id="challanDate"></div>
          <div class="form-group"><label class="form-label">Against Order No</label><input class="form-control" placeholder="ORD-2026-..."></div>
          <div class="form-group"><label class="form-label">Delivery Address</label><input class="form-control" id="delivAddr" placeholder="Auto-filled from client"></div>
          <div class="form-group"><label class="form-label">Transport / Vehicle</label><input class="form-control" placeholder="e.g. Truck WB-12A-3456"></div>
          <div class="form-group"><label class="form-label">Driver Name</label><input class="form-control" placeholder="Driver name"></div>
        </div>
      </div>
    </div>

    <!-- Items -->
    <div class="card">
      <div class="card-header"><span class="card-title">📦 Delivery Items</span><button class="btn btn-success btn-sm" onclick="addDCRow()">+ Add Item</button></div>
      <div class="card-body" id="dcItems"></div>
    </div>

    <div class="action-row">
      <button class="btn btn-primary" onclick="generateChallan()">🖨️ Generate & Print</button>
      <button class="btn btn-success" onclick="dispatchDC()">🚚 Mark Dispatched</button>
      <button class="btn btn-secondary">💾 Save Draft</button>
    </div>

    <!-- Preview -->
    <div class="card print-card" id="challanPreviewCard" style="display:none">
      <div class="card-header"><span class="card-title">📄 Challan Preview</span><button class="btn btn-primary btn-sm" onclick="window.print()">🖨️ Print</button></div>
      <div class="card-body"><div class="challan-preview" id="challanPreview"></div></div>
    </div>

    <!-- Recent Challans -->
    <div class="card">
      <div class="card-header"><span class="card-title">📋 Recent Challans</span></div>
      <div class="card-body"><div class="table-wrap"><table>
        <thead><tr><th>DC No</th><th>Client</th><th>Date</th><th>Items</th><th>Transport</th><th>Status</th><th>Action</th></tr></thead>
        <tbody id="recentDC"></tbody>
      </table></div></div>
    </div>
  </div>
</div>
<script>
document.getElementById('sidebar-root').innerHTML = renderSidebar('delivery-challan.html');
document.getElementById('topbar-root').innerHTML = renderTopbar('DELIVERY CHALLAN', 'Dispatch & Logistics Management');
const today = new Date();
document.getElementById('challanDate').value = today.toISOString().split('T')[0];
const clients = generateClients(10000);
const products = ['Basmati Rice 25kg','Toor Dal 50kg','Wheat Flour 30kg','Sunflower Oil 15L','Sugar 50kg'];
let dcRows = [];

function searchConsignee(q) {
  if (q.length < 2) return;
  const c = clients.find(x => x.name.toLowerCase().includes(q.toLowerCase()));
  if (c) document.getElementById('delivAddr').value = c.city + ', ' + c.state;
}

function addDCRow() {
  const id = dcRows.length; dcRows.push(id);
  const div = document.createElement('div');
  div.style.cssText = 'display:grid;grid-template-columns:2fr 1fr 1fr 40px;gap:10px;margin-bottom:10px';
  div.id = 'dcr-' + id;
  div.innerHTML = `<select class="form-control">${products.map(p=>`<option>${p}</option>`).join('')}</select>
    <input class="form-control" type="number" value="1" min="1" placeholder="Qty">
    <input class="form-control" placeholder="Unit (Bags/Kg)">
    <button style="background:none;border:none;color:#ff6b6b;font-size:18px;cursor:pointer" onclick="this.parentElement.remove()">✕</button>`;
  document.getElementById('dcItems').appendChild(div);
}
addDCRow(); addDCRow();

function generateChallan() {
  const preview = document.getElementById('challanPreview');
  const card = document.getElementById('challanPreviewCard');
  card.style.display = 'block';
  const client = document.getElementById('consignee').value || 'Sharma Traders';
  const addr = document.getElementById('delivAddr').value || 'Mumbai, Maharashtra';
  preview.innerHTML = `
    <div class="ch-header">
      <div><div class="ch-brand">⚡ BALAJI NEXTGEN ERP</div><div class="ch-sub">NextGen ERP Solutions · Siliguri, West Bengal</div><div class="ch-sub">GSTIN: 19AABCT1234Q1Z5 · Ph: +91 98765 43210</div></div>
      <div style="text-align:right"><div style="font-size:18px;font-weight:700;color:#0a0e1a">DELIVERY CHALLAN</div><div style="font-size:13px">DC No: DC-2026-0314</div><div style="font-size:13px">Date: ${today.toLocaleDateString('en-IN')}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;font-size:13px">
      <div><b>Consignee:</b> ${client}<br><b>Address:</b> ${addr}</div>
      <div><b>Transport:</b> Truck<br><b>Vehicle No:</b> WB-12A-3456</div>
    </div>
    <table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr><th style="padding:8px;text-align:left">#</th><th>Product</th><th>Qty</th><th>Unit</th></tr></thead>
      <tbody><tr><td style="padding:8px;border-bottom:1px solid #eee">1</td><td>Basmati Rice 25kg</td><td>10</td><td>Bags</td></tr>
      <tr><td style="padding:8px;border-bottom:1px solid #eee">2</td><td>Toor Dal 50kg</td><td>5</td><td>Bags</td></tr></tbody>
    </table>
    <div class="ch-footer">
      <div class="sign-box">Receiver's Signature</div>
      <div class="sign-box">Authorised Signatory</div>
    </div>`;
  window.print();
}
function dispatchDC() { alert('✅ DC-2026-0314 marked as Dispatched!'); }

const recentDCData = clients.slice(0,7).map((c,i)=>({no:`DC-2026-0${307+i}`,client:c.name.substring(0,18),date:new Date(2026,5,26-i).toLocaleDateString('en-IN'),items:Math.floor(Math.random()*8+2),transport:'Truck WB-'+(1000+i),status:['Dispatched','Delivered','Pending'][i%3]}));
document.getElementById('recentDC').innerHTML=recentDCData.map(r=>`<tr><td class="mono">${r.no}</td><td class="primary">${r.client}</td><td>${r.date}</td><td>${r.items}</td><td>${r.transport}</td><td><span class="badge ${r.status==='Delivered'?'badge-success':r.status==='Dispatched'?'badge-info':'badge-warning'}">${r.status}</span></td><td><button class="btn btn-secondary btn-sm" onclick="alert('Viewing '+this.closest('tr').querySelector('td').textContent)">View</button></td></tr>`).join('');
</script>
<script>
(function(){var b=document.querySelector('.ham-btn');if(!b)return;var ns=document.querySelectorAll('.nav-menu,nav:not(.keep-desktop)');b.addEventListener('click',function(e){e.stopPropagation();var o=b.classList.toggle('open');ns.forEach(function(n){n.classList.toggle('mob-open',o);});});document.addEventListener('click',function(){b.classList.remove('open');ns.forEach(function(n){n.classList.remove('mob-open');});});ns.forEach(function(n){n.addEventListener('click',function(e){e.stopPropagation();});});})();
</script>

<script>
/* Balaji AI Assistant — inline */
/**
 * BALAJI NEXTGEN ERP — AI ASSISTANT v2.0
 * Embedded AI Chat Widget — works on ALL dashboard pages
 * Uses Anthropic Claude via GAS proxy OR direct API
 */

(function() {
  'use strict';

  // Inject AI Assistant styles
  const style = document.createElement('style');
  style.textContent = `
    #bnj-ai-btn {
      position:fixed;bottom:24px;right:24px;width:56px;height:56px;
      background:linear-gradient(135deg,#1e3a8a,#3b82f6);
      border-radius:50%;border:none;cursor:pointer;box-shadow:0 4px 20px rgba(37,99,235,.5);
      display:flex;align-items:center;justify-content:center;font-size:24px;
      z-index:9999;transition:.3s;color:#fff;
    }
    #bnj-ai-btn:hover{transform:scale(1.1);}
    #bnj-ai-panel {
      position:fixed;bottom:90px;right:24px;width:380px;
      background:#fff;border-radius:20px;
      box-shadow:0 20px 60px rgba(0,0,0,.2);
      z-index:9999;display:none;flex-direction:column;
      max-height:520px;overflow:hidden;
      font-family:'Segoe UI',sans-serif;
    }
    #bnj-ai-panel.open{display:flex;}
    .bnj-ai-header {
      background:linear-gradient(135deg,#0f172a,#1e3a8a);color:#fff;
      padding:16px 20px;display:flex;justify-content:space-between;align-items:center;
      border-radius:20px 20px 0 0;
    }
    .bnj-ai-header h4{font-size:15px;font-weight:700;margin:0;}
    .bnj-ai-header span{font-size:11px;opacity:.7;margin-top:2px;display:block;}
    .bnj-ai-close{background:rgba(255,255,255,.2);border:none;color:#fff;
      width:28px;height:28px;border-radius:8px;cursor:pointer;font-size:16px;}
    .bnj-ai-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;min-height:200px;max-height:320px;}
    .bnj-msg{max-width:85%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5;}
    .bnj-user{background:#1e3a8a;color:#fff;align-self:flex-end;border-radius:14px 14px 4px 14px;}
    .bnj-bot{background:#f1f5f9;color:#1e293b;align-self:flex-start;border-radius:14px 14px 14px 4px;}
    .bnj-bot.thinking{opacity:.6;font-style:italic;}
    .bnj-ai-input{padding:12px 16px;border-top:1px solid #f1f5f9;display:flex;gap:8px;}
    .bnj-ai-input input{flex:1;padding:10px 14px;border:1px solid #e2e8f0;border-radius:10px;
      font-size:13px;outline:none;font-family:'Segoe UI',sans-serif;}
    .bnj-ai-input button{padding:10px 16px;background:#1e3a8a;color:#fff;border:none;
      border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;}
    .bnj-quick{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0;}
    .bnj-chip{padding:5px 10px;background:#eff6ff;color:#1e40af;border-radius:8px;
      font-size:11px;cursor:pointer;border:1px solid #bfdbfe;font-weight:600;}
    .bnj-chip:hover{background:#dbeafe;}
    @media(max-width:480px){#bnj-ai-panel{width:calc(100vw - 32px);right:16px;}}
  `;
  document.head.appendChild(style);

  // Get current page context
  function getContext() {
    const user = typeof ERP !== 'undefined' ? ERP.getUser() : {};
    const page = window.location.pathname.split('/').pop().replace('.html','');
    const company = user ? (user.COMPANY_NAME || 'Balaji NextGen') : 'Balaji NextGen';
    return { page, company, role: user ? user.ROLE : 'USER', user };
  }

  // Inject HTML
  document.body.insertAdjacentHTML('beforeend', `
    <button id="bnj-ai-btn" title="AI Assistant" onclick="toggleAI()">🤖</button>
    <div id="bnj-ai-panel">
      <div class="bnj-ai-header">
        <div><h4>🤖 Balaji AI Assistant</h4><span id="bnj-ai-ctx">ERP Intelligence Engine</span></div>
        <button class="bnj-ai-close" onclick="toggleAI()">✕</button>
      </div>
      <div class="bnj-quick" id="bnj-chips">
        <div class="bnj-chip" onclick="askAI('Today sales summary')">📊 Sales</div>
        <div class="bnj-chip" onclick="askAI('Show pending KOTs')">🍽 KOT</div>
        <div class="bnj-chip" onclick="askAI('Low stock items')">📦 Stock</div>
        <div class="bnj-chip" onclick="askAI('Export Tally XML')">🧮 Tally</div>
        <div class="bnj-chip" onclick="askAI('Send WhatsApp invoice')">💬 WhatsApp</div>
        <div class="bnj-chip" onclick="askAI('GST summary this month')">📋 GST</div>
      </div>
      <div class="bnj-ai-msgs" id="bnj-msgs">
        <div class="bnj-msg bnj-bot">👋 Hello! I'm your Balaji ERP AI Assistant. I can help with sales reports, inventory, GST, Tally export, WhatsApp, and more. What do you need?</div>
      </div>
      <div class="bnj-ai-input">
        <input id="bnj-input" placeholder="Ask anything about your ERP..." onkeydown="if(event.key==='Enter')sendAI()">
        <button onclick="sendAI()">Send</button>
      </div>
    </div>
  `);

  // Update context
  const ctx = getContext();
  const ctxEl = document.getElementById('bnj-ai-ctx');
  if (ctxEl) ctxEl.textContent = ctx.company + ' · ' + ctx.page;

  window.toggleAI = function() {
    document.getElementById('bnj-ai-panel').classList.toggle('open');
  };

  window.askAI = function(q) {
    document.getElementById('bnj-input').value = q;
    sendAI();
  };

  window.sendAI = async function() {
    const input = document.getElementById('bnj-input');
    const q = input.value.trim();
    if (!q) return;
    input.value = '';

    addMsg(q, 'user');
    const thinking = addMsg('⏳ Thinking...', 'bot thinking');

    try {
      const ctx = getContext();
      const systemPrompt = `You are the Balaji NextGen ERP AI Assistant for ${ctx.company}.
Current page: ${ctx.page}. User role: ${ctx.role}.
You help with: sales reports, inventory queries, GST filing, Tally XML export, WhatsApp sending, KOT management, billing, HR, and all ERP operations.
For data queries, provide helpful summaries. For Tally export, tell user to click the Tally button in the page. For WhatsApp, guide them to the share button.
Keep responses concise, practical, and in plain text (no markdown). Max 3 sentences unless a list is needed.`;

      // Use GAS backend to call AI (avoids CORS and keeps API key server-side)
      let reply = '';
      
      if (typeof erpCoreApi !== 'undefined') {
        try {
          const res = await erpCoreApi({
            action: 'AI_QUERY',
            query: q,
            page: ctx.page,
            role: ctx.role,
            company: ctx.company,
          });
          if (res.ok && res.reply) {
            reply = res.reply;
          }
        } catch(e) {}
      }

      // Fallback: smart local responses
      if (!reply) {
        reply = getSmartReply(q, ctx);
      }

      thinking.remove();
      addMsg(reply, 'bot');

    } catch(e) {
      thinking.remove();
      addMsg('Sorry, I encountered an error. Please try again.', 'bot');
    }
  };

  // Smart local fallback responses
  function getSmartReply(q, ctx) {
    const ql = q.toLowerCase();
    if (ql.includes('tally') || ql.includes('export xml')) {
      return '🧮 To export to Tally: Go to Sales Invoice page → click "Export to Tally" button → a .xml file downloads → import it in Tally Prime via Gateway → Import Data → Vouchers.';
    }
    if (ql.includes('whatsapp') || ql.includes('send invoice')) {
      return '💬 To send via WhatsApp: Open the invoice → click the WhatsApp button → it opens WhatsApp Web with the invoice details pre-filled. For bulk sending, configure WATI API in Settings.';
    }
    if (ql.includes('gst') || ql.includes('gstr')) {
      return '📋 GST Reports: Go to Dashboard → GST Center → select GSTR-1, GSTR-3B or HSN Summary → choose the period → click Download Excel. For filing, use the GST portal with the exported data.';
    }
    if (ql.includes('stock') || ql.includes('inventory') || ql.includes('low stock')) {
      return '📦 For stock levels: Go to Inventory → Item Master. Items with current stock below reorder level are shown in red. Use Stock Ledger for transaction history. Run GRN for incoming stock.';
    }
    if (ql.includes('kot') || ql.includes('kitchen order')) {
      return '🍽 KOT Management: Open Restaurant Dashboard → KOT section shows live pending orders. Click Confirm to send to kitchen. Chef Dashboard shows the kitchen queue in real-time.';
    }
    if (ql.includes('sales') || ql.includes('revenue') || ql.includes('today')) {
      return '📊 For sales data: Open Dashboard → today\'s sales are shown on the KPI tiles. For detailed reports, go to Sales → Daily Sales Report or use the date filter in Sales Register.';
    }
    if (ql.includes('payroll') || ql.includes('salary')) {
      return '💼 Payroll: Go to HR & Payroll → Employee Master → then Payroll Register. Mark attendance first, then generate monthly payroll. Export to Excel for bank transfer.';
    }
    if (ql.includes('invoice') || ql.includes('bill')) {
      return '🧾 To create invoice: Go to Sales → Sales Invoice → fill customer and item details → choose GST format → Save. You can then Print, Export to PDF, send via WhatsApp, or export to Tally.';
    }
    return `I can help with ${ctx.page} operations. For detailed ERP guidance, please ask a specific question about sales, inventory, GST, Tally, WhatsApp, billing, or any module.`;
  }

  function addMsg(text, type) {
    const msgs = document.getElementById('bnj-msgs');
    const div = document.createElement('div');
    div.className = `bnj-msg bnj-${type.includes('user') ? 'user' : 'bot'}${type.includes('thinking') ? ' thinking' : ''}`;
    div.textContent = text;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  console.log('✅ Balaji AI Assistant loaded');
})();

</script>

<script>
/* Balaji NextGen ERP — Backend Connector */
window._bnERP = {
  async getData(action, extra){ try{ if(typeof erpFrontendApi==='undefined') return null; const res=await erpFrontendApi({action,...(extra||{})}); return(res.ok||res.status==='success')?res:null; }catch(e){return null;} },
  async saveData(action, data){ try{ if(typeof erpCoreApi==='undefined') return{ok:false}; return await erpCoreApi({action,...(data||{})}); }catch(e){return{ok:false};} },
  formatINR(n){return'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});},
  today(){return new Date().toISOString().split('T')[0];},
  user(){return typeof ERP!=='undefined'?ERP.getUser():null;},
  client(){return typeof ERP!=='undefined'?ERP.getClient():'';},
  logout(){if(typeof ERP!=='undefined')ERP.logout();}
};
</script>
