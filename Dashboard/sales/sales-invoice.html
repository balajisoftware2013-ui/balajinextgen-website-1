<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales Invoice — Balaji NextGen ERP v4.0</title>
<link rel="stylesheet" href="style.css">
<style>
.inv-preview{background:#fff;color:#111;border-radius:var(--radius);font-family:'Rajdhani',sans-serif;}
.inv-header{display:grid;grid-template-columns:1fr auto;align-items:start;padding:20px 24px 14px;border-bottom:2px solid #0a0e1a;}
.inv-brand{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;color:#0a0e1a;}
.inv-title{font-size:18px;font-weight:700;color:#0a0e1a;text-align:right;}
.inv-addresses{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:12px 24px;font-size:12px;background:#f9f9f9;border-bottom:1px solid #eee;}
.inv-body{padding:0 24px 16px;}
.inv-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:12px;}
.inv-table th{background:#0a0e1a;color:#fff;padding:8px 10px;text-align:left;font-size:11px;}
.inv-table td{padding:7px 10px;border-bottom:1px solid #eee;color:#222;}
.inv-totals-wrap{display:flex;justify-content:flex-end;margin-top:10px;}
.inv-totals-inner{width:260px;}
.inv-total-row{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid #eee;}
.inv-total-row.grand{font-family:'Orbitron',monospace;font-weight:700;font-size:14px;color:#0a0e1a;border:none;border-top:2px solid #0a0e1a;padding-top:8px;}
.inv-footer{padding:12px 24px;display:flex;justify-content:space-between;border-top:1px solid #eee;}
.sign-box{border-top:1px solid #000;width:150px;text-align:center;padding-top:6px;font-size:11px;color:#555;}
.print-actions{display:flex;gap:10px;flex-wrap:wrap;padding:14px 20px;border-top:1px solid var(--border);background:var(--bg-card2);}

.format-tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.ftab{padding:6px 14px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--text-secondary);transition:var(--transition);}
.ftab.active,.ftab:hover{background:var(--accent);color:#000;border-color:var(--accent);}

@media print{
  .sidebar,.main>.topbar,.action-row,.no-print,.card:not(.inv-card){display:none!important;}
  .main{margin:0;}.content{padding:0;}
  .inv-card{margin:0;border:none;}
}

/* ══ BALAJI NEXTGEN — MOBILE FIX v3 ══ */
.ham-btn{display:none;flex-direction:column;justify-content:center;align-items:center;gap:5px;width:42px;height:42px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.28);border-radius:10px;cursor:pointer;padding:8px;flex-shrink:0;}
.ham-btn span{display:block;width:22px;height:2.5px;background:#fff;border-radius:2px;transition:.25s;}
.ham-btn.open span:nth-child(1){transform:translateY(7.5px) rotate(45deg);}
.ham-btn.open span:nth-child(2){opacity:0;}
.ham-btn.open span:nth-child(3){transform:translateY(-7.5px) rotate(-45deg);}
@media(max-width:1100px){
  .ham-btn{display:flex;}
  .logo-text h1{font-size:20px!important;}
  .logo-text p{font-size:9px!important;}
  .logo,.logo-section img{width:48px!important;height:48px!important;}
  .nav-menu{display:none!important;flex-direction:column!important;position:absolute;top:100%;left:0;right:0;background:linear-gradient(135deg,#1e3a8a,#2563eb);padding:10px 0;z-index:999;box-shadow:0 10px 28px rgba(0,0,0,.22);}
  .nav-menu.mob-open{display:flex!important;}
  .nav-menu a,.nav-menu .nav-item a,.nav-menu .nav-item>a{display:block!important;padding:13px 22px!important;font-size:14px!important;font-weight:600;border-bottom:1px solid rgba(255,255,255,.08);color:#fff!important;text-decoration:none;}
  nav:not(.keep-desktop){display:none;flex-direction:column;position:absolute;top:100%;left:0;right:0;background:linear-gradient(135deg,#1e3a8a,#2563eb);padding:10px 0;z-index:999;box-shadow:0 10px 28px rgba(0,0,0,.22);}
  nav.mob-open{display:flex!important;}
  nav a{display:block!important;padding:13px 22px;font-size:14px;font-weight:600;border-bottom:1px solid rgba(255,255,255,.08);color:#fff!important;text-decoration:none;}
  .navbar{position:relative!important;top:auto!important;}
  .hero{padding:26px 5% 32px!important;text-align:center!important;}
  .hero h1{font-size:36px!important;line-height:1.2;}
  .hero h2{font-size:32px!important;}
  .hero-container,.hero-flex{grid-template-columns:1fr!important;text-align:center;}
  .hero-image,.hero-img-wrap{display:none!important;}
  .hero-buttons{justify-content:center!important;flex-wrap:wrap;gap:10px!important;}
  .erp-grid,.section-grid,.cards-grid,.services-grid,.features-grid,.plans-grid,.benefits-grid,.row2,.row3,.stats-grid{grid-template-columns:repeat(2,1fr)!important;}
  .two-column,.contact-wrapper,.split-layout{grid-template-columns:1fr!important;}
  .section-title h2,.section-header h2,.cta h2,.banner h2{font-size:30px!important;}
}
@media(max-width:768px){
  .logo-text p{display:none!important;}
  .logo-text h1{font-size:17px!important;}
  .logo,.logo-section img{width:40px!important;height:40px!important;}
  .header-buttons a,.header-right .btn,.header-right .header-btn{padding:8px 11px;font-size:11.5px;}
  .hero h1{font-size:24px!important;}
  .hero h2{font-size:22px!important;}
  .hero-badge{font-size:11px;padding:6px 14px;}
  .erp-grid,.section-grid,.cards-grid,.services-grid,.features-grid,.plans-grid,.benefits-grid,.stats-grid,.footer-grid,.row2,.row3{grid-template-columns:1fr!important;}
  .service-card,.module-card,.feature-card,.plan-card{padding:18px 16px;}
  .section-title h2,.section-header h2,.cta h2,.banner h2,h2{font-size:22px!important;}
  footer{padding:24px 5% 14px!important;}
  .footer-grid{grid-template-columns:1fr!important;gap:18px!important;}
  .form-grid{grid-template-columns:1fr!important;}
  .input-box.full{grid-column:auto!important;}
  .right-panel{padding:20px 16px!important;}
  .left-panel{padding:22px 16px!important;}
  img{max-width:100%;height:auto;}
}
@media(max-width:480px){
  .logo-text h1{font-size:14px!important;}
  .logo,.logo-section img{width:36px!important;height:36px!important;}
  .hero h1{font-size:20px!important;}
  h2{font-size:18px!important;}
  .service-card h3,.module-card h3{font-size:13.5px!important;}
  .submit-btn,.btn-submit{font-size:13px;padding:11px;}
  section,.section{padding-left:12px!important;padding-right:12px!important;}
}
</style>
</head>
<body>
<script src="erp.js"></script>
<div id="sidebar-root"></div>
<div class="main">
  <div id="topbar-root"></div>
  <div class="content">

    <div class="card no-print">
      <div class="card-header"><span class="card-title">📄 Create Sales Invoice</span><span class="badge badge-info" id="invNo">INV-2026-0849</span></div>
      <div class="card-body">
        <div class="form-grid" style="grid-template-columns:repeat(3,1fr)">
          <div class="form-group"><label class="form-label">Bill To (Client) *</label><input class="form-control" id="billTo" placeholder="Search client..." oninput="fillClient(this.value)"></div>
          <div class="form-group"><label class="form-label">Invoice Date</label><input class="form-control" type="date" id="invDate"></div>
          <div class="form-group"><label class="form-label">Due Date</label><input class="form-control" type="date" id="dueDate"></div>
          <div class="form-group"><label class="form-label">GSTIN (Client)</label><input class="form-control" id="clientGST" readonly placeholder="Auto"></div>
          <div class="form-group"><label class="form-label">PO / Order Ref</label><input class="form-control" id="poRef" placeholder="ORD-2026-..."></div>
          <div class="form-group"><label class="form-label">Place of Supply</label><input class="form-control" id="pos" placeholder="State"></div>
          <div class="form-group"><label class="form-label">Billing Address</label><input class="form-control" id="billAddr" placeholder="Auto-filled"></div>
          <div class="form-group"><label class="form-label">Shipping Address</label><input class="form-control" id="shipAddr" placeholder="Same as billing"></div>
          <div class="form-group"><label class="form-label">Transport</label><input class="form-control" id="transport" placeholder="Transport name / vehicle"></div>
        </div>
      </div>
    </div>

    <!-- Line Items -->
    <div class="card no-print">
      <div class="card-header"><span class="card-title">🧾 Line Items</span><button class="btn btn-success btn-sm" onclick="addInvRow()">+ Add Item</button></div>
      <div class="card-body">
        <div style="display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr 40px;gap:8px;margin-bottom:8px;font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px">
          <span>DESCRIPTION</span><span>HSN</span><span>QTY</span><span>RATE ₹</span><span>DISC %</span><span>AMOUNT</span><span></span>
        </div>
        <div id="invRows"></div>
        <div class="form-grid" style="grid-template-columns:repeat(4,1fr);margin-top:14px">
          <div class="form-group"><label class="form-label">GST Type</label><select class="form-control" id="gstType" onchange="calcInv()"><option value="igst">IGST (Inter-State)</option><option value="cgst" selected>CGST+SGST (Intra-State)</option></select></div>
          <div class="form-group"><label class="form-label">GST Rate</label><select class="form-control" id="gstPct" onchange="calcInv()"><option value="0">0%</option><option value="5">5%</option><option value="12">12%</option><option value="18" selected>18%</option><option value="28">28%</option></select></div>
          <div class="form-group"><label class="form-label">Extra Discount ₹</label><input class="form-control" type="number" id="discAmt" value="0" oninput="calcInv()"></div>
          <div class="form-group"><label class="form-label">Freight / Charges</label><input class="form-control" type="number" id="freight" value="0" oninput="calcInv()"></div>
        </div>
      </div>
    </div>

    <!-- Summary + Actions -->
    <div class="two-col no-print">
      <div class="card">
        <div class="card-header"><span class="card-title">📋 Recent Invoices</span></div>
        <div class="card-body"><div class="table-wrap"><table>
          <thead><tr><th>Invoice No</th><th>Client</th><th>Amount</th><th>Status</th></tr></thead>
          <tbody id="invRegister"></tbody>
        </table></div></div>
      </div>
      <div class="card">
        <div class="card-header"><span class="card-title">💰 Invoice Summary</span></div>
        <div class="card-body">
          <div style="background:var(--bg-card2);border:1px solid var(--border);border-radius:var(--radius);padding:14px">
            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px"><span>Sub Total</span><span id="iSub" class="mono">₹0.00</span></div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px"><span>Discount</span><span id="iDisc" class="mono">₹0.00</span></div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px"><span id="gstLabel">CGST + SGST</span><span id="iGST" class="mono">₹0.00</span></div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px"><span>Freight</span><span id="iFreight" class="mono">₹0.00</span></div>
            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px"><span>Round Off</span><span id="iRound" class="mono">₹0.00</span></div>
            <div style="display:flex;justify-content:space-between;padding:10px 0;font-family:'Orbitron';font-size:18px;color:var(--accent);font-weight:700"><span>TOTAL</span><span id="iTotal">₹0.00</span></div>
          </div>
          <div style="margin-top:12px">
            <label class="form-label">Print Format</label>
            <select class="form-control" id="printFormatSel" style="margin-bottom:10px">
              <option value="modern">Modern GST Invoice</option>
              <option value="classic">Classic Format</option>
              <option value="tally">Tally Compatible</option>
              <option value="thermal">Thermal (58mm)</option>
              <option value="a5">A5 Size</option>
            </select>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            <button class="btn btn-primary" onclick="genInvoice()">📄 Generate</button>
            <button class="btn btn-warning btn-sm" onclick="printInvoice()">🖨️ Print</button>
            <button class="btn btn-success btn-sm">📧 Email</button>
            <button class="btn btn-secondary btn-sm" onclick="exportInvoicePDF()">⬇ PDF</button>
            <button class="btn btn-tally btn-sm" onclick="exportInvTally()">🧮 Tally</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Invoice Preview Card -->
    <div class="card inv-card" id="invPreviewCard" style="display:none">
      <div class="card-header no-print">
        <span class="card-title">📄 Invoice Preview</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <div class="format-tabs">
            <button class="ftab active" onclick="switchPrintFormat('modern',this)">Modern</button>
            <button class="ftab" onclick="switchPrintFormat('classic',this)">Classic</button>
            <button class="ftab" onclick="switchPrintFormat('tally',this)">Tally</button>
            <button class="ftab" onclick="switchPrintFormat('minimal',this)">Minimal</button>
          </div>
        </div>
      </div>
      <div class="card-body" style="padding:0">
        <div id="invPreview"></div>
      </div>
      <div class="print-actions no-print">
        <button class="btn btn-primary" onclick="window.print()">🖨️ Print Now</button>
        <button class="btn btn-warning" onclick="exportInvoicePDF()">⬇ Download PDF</button>
        <button class="btn btn-success" onclick="emailInvoice()">📧 Email to Client</button>
        <button class="btn btn-tally" onclick="exportInvTally()">🧮 Export to Tally</button>
        <button class="btn btn-secondary" onclick="shareWhatsApp()">📱 WhatsApp</button>
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('invPreviewCard').style.display='none'">✕ Close</button>
      </div>
    </div>
  </div>
</div>

<script>
document.getElementById('sidebar-root').innerHTML = renderSidebar('sales-invoice.html');
document.getElementById('topbar-root').innerHTML = renderTopbar('SALES INVOICE','GST Tax Invoice · Multi-Format · Tally Export');

const today=new Date(),due=new Date();due.setDate(today.getDate()+30);
document.getElementById('invDate').value=today.toISOString().split('T')[0];
document.getElementById('dueDate').value=due.toISOString().split('T')[0];

const clients=generateClients(10000);
const products=['Basmati Rice 25kg','Toor Dal 50kg','Wheat Flour 30kg','Sunflower Oil 15L','Sugar 50kg','Salt 25kg','Soya Chunks 10kg'];
const hsnCodes=['1006','0713','1101','1512','1701','2501','2106'];
const rates2=[1850,3200,1450,1780,2200,420,890];
let invRows=[];
let currentFormat='modern';

function fillClient(q){
  if(q.length<2)return;
  const c=clients.find(x=>x.name.toLowerCase().includes(q.toLowerCase()));
  if(c){
    document.getElementById('clientGST').value=c.gstin;
    document.getElementById('pos').value=c.state;
    document.getElementById('billAddr').value=c.city+', '+c.state;
    document.getElementById('shipAddr').value=c.city+', '+c.state;
  }
}

function addInvRow(){
  const id=invRows.length;invRows.push(id);
  const idx=id%products.length;
  const div=document.createElement('div');
  div.id='invr-'+id;
  div.style.cssText='display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr 1fr 40px;gap:8px;margin-bottom:8px;align-items:center';
  div.innerHTML=`<select class="form-control" onchange="chgProduct(${id},this.value)">${products.map((p,i)=>`<option value="${i}" ${i===idx?'selected':''}>${p}</option>`).join('')}</select>
    <input class="form-control" id="ih-${id}" value="${hsnCodes[idx]}" placeholder="HSN">
    <input class="form-control" type="number" id="iq-${id}" value="1" min="1" oninput="calcInv()">
    <input class="form-control" type="number" id="ir-${id}" value="${rates2[idx]}" oninput="calcInv()">
    <input class="form-control" type="number" id="id-${id}" value="0" min="0" max="100" oninput="calcInv()" placeholder="0">
    <input class="form-control" id="ia-${id}" value="${rates2[idx]}" readonly style="color:var(--accent3)">
    <button style="background:none;border:none;color:#ff6b6b;font-size:18px;cursor:pointer" onclick="removeInvRow(${id})">✕</button>`;
  document.getElementById('invRows').appendChild(div);calcInv();
}
function chgProduct(id,i){document.getElementById('ir-'+id).value=rates2[i];document.getElementById('ih-'+id).value=hsnCodes[i];calcInv();}
function removeInvRow(id){document.getElementById('invr-'+id).remove();invRows=invRows.filter(x=>x!==id);calcInv();}
function calcInv(){
  let sub=0,discTotal=0;
  invRows.forEach(id=>{
    const q=document.getElementById('iq-'+id),r=document.getElementById('ir-'+id),d=document.getElementById('id-'+id),a=document.getElementById('ia-'+id);
    if(q&&r&&a){
      const gross=(Number(q.value)||0)*(Number(r.value)||0);
      const disc=gross*(Number(d?.value||0)/100);
      const net=gross-disc;
      a.value=net.toFixed(2);sub+=gross;discTotal+=disc;
    }
  });
  const extraDisc=Number(document.getElementById('discAmt').value)||0;
  const freight=Number(document.getElementById('freight').value)||0;
  const gp=Number(document.getElementById('gstPct').value)/100;
  const taxable=sub-discTotal-extraDisc;
  const gst=taxable*gp;
  const total=taxable+gst+freight;
  const round=Math.round(total)-total;
  document.getElementById('iSub').textContent='₹'+sub.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById('iDisc').textContent='₹'+(discTotal+extraDisc).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById('iGST').textContent='₹'+gst.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById('iFreight').textContent='₹'+freight.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById('iRound').textContent=round.toFixed(2);
  document.getElementById('iTotal').textContent='₹'+(total+round).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
  document.getElementById('gstLabel').textContent=document.getElementById('gstType').value==='igst'?'IGST':'CGST + SGST';
}

addInvRow();addInvRow();

function getInvData(){
  const client=document.getElementById('billTo').value||'Sharma Traders';
  const addr=document.getElementById('billAddr').value||'Mumbai, Maharashtra';
  const gst=document.getElementById('clientGST').value||'27AAAAA0000A1Z5';
  const freight=Number(document.getElementById('freight').value)||0;
  const gstPct=Number(document.getElementById('gstPct').value);
  const gstType=document.getElementById('gstType').value;
  const co=getCompanyInfo();
  const bank=ERP_BANKS.getDefault();
  const settings=JSON.parse(localStorage.getItem('erp_settings')||'{}');

  let sub=0,discTotal=0;
  const lineItems=invRows.map(id=>{
    const sel=document.querySelector(`#invr-${id} select`);
    const pname=sel?sel.options[sel.selectedIndex].text:'Product';
    const hsn=document.getElementById('ih-'+id)?.value||'';
    const q=Number(document.getElementById('iq-'+id)?.value||0);
    const r=Number(document.getElementById('ir-'+id)?.value||0);
    const d=Number(document.getElementById('id-'+id)?.value||0);
    const gross=q*r; const disc=gross*(d/100); const net=gross-disc;
    sub+=gross;discTotal+=disc;
    return {name:pname,hsn,q,r,d,gross,disc,net};
  });
  const extraDisc=Number(document.getElementById('discAmt').value)||0;
  const taxable=sub-discTotal-extraDisc;
  const gstAmt=taxable*(gstPct/100);
  const total=taxable+gstAmt+freight;
  const round=Math.round(total)-total;
  const grandTotal=total+round;

  return {client,addr,gst,freight,gstPct,gstType,co,bank,settings,lineItems,sub,discTotal,extraDisc,taxable,gstAmt,freight,round,grandTotal,gstPct};
}

function buildInvoiceHTML(d, format) {
  const isGSTIntra = d.gstType==='cgst';
  const gstLabel1 = isGSTIntra?`CGST @${d.gstPct/2}%`:`IGST @${d.gstPct}%`;
  const gstLabel2 = isGSTIntra?`SGST @${d.gstPct/2}%`:'';
  const gstAmt1 = isGSTIntra?d.gstAmt/2:d.gstAmt;
  const bankBlock = d.bank && d.settings.printBank!==false ? `
    <div style="margin:10px 24px;padding:8px 12px;border:1px solid #ddd;border-radius:6px;background:#f0f7ff;font-size:11px">
      <b>🏦 Bank Details:</b> ${d.bank.bankName} &nbsp;|&nbsp; A/C: ${d.bank.accountNo} &nbsp;|&nbsp; IFSC: ${d.bank.ifsc} &nbsp;|&nbsp; Branch: ${d.bank.branch} &nbsp;|&nbsp; Type: ${d.bank.accountType}
    </div>` : '';

  if(format==='tally'){
    return `<div class="tally-format" style="margin:16px">
<pre>=================================================================
  ${d.co.name.toUpperCase()}
  ${d.co.address} | GSTIN: ${d.co.gstin}
=================================================================
                    TAX INVOICE
  Invoice No : INV-2026-0849       Date: ${today.toLocaleDateString('en-IN')}
  Party      : ${d.client}
  GSTIN      : ${d.gst}
  Address    : ${d.addr}
-----------------------------------------------------------------
  #  PARTICULARS               HSN  QTY    RATE     AMOUNT
-----------------------------------------------------------------
${d.lineItems.map((item,i)=>`  ${i+1}. ${item.name.padEnd(25,' ')} ${item.hsn.padEnd(4,' ')} ${String(item.q).padEnd(5,' ')} ${('₹'+item.r).padEnd(8,' ')} ₹${item.net.toFixed(2)}`).join('\n')}
-----------------------------------------------------------------
  Sub Total                                          ₹${d.sub.toFixed(2)}
  Discount                                          -₹${(d.discTotal+d.extraDisc).toFixed(2)}
  Taxable Value                                      ₹${d.taxable.toFixed(2)}
  ${gstLabel1.padEnd(44,' ')}₹${gstAmt1.toFixed(2)}
${gstLabel2?`  ${gstLabel2.padEnd(44,' ')}₹${gstAmt1.toFixed(2)}`:''}${d.freight?`\n  Freight / Transport                                ₹${d.freight.toFixed(2)}`:''}
  Round Off                                          ₹${d.round.toFixed(2)}
=================================================================
  GRAND TOTAL                                        ₹${d.grandTotal.toFixed(2)}
=================================================================
${d.bank?`  Bank: ${d.bank.bankName}  |  A/C: ${d.bank.accountNo}  |  IFSC: ${d.bank.ifsc}
  Branch: ${d.bank.branch}  |  UPI: payment@balajiErp`:''} 
-----------------------------------------------------------------

function numberToWords(n){
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  if(n===0)return'Zero';
  if(n<0)return'Minus '+numberToWords(-n);
  let str='';
  if(n>=10000000){str+=numberToWords(Math.floor(n/10000000))+' Crore ';n%=10000000;}
  if(n>=100000){str+=numberToWords(Math.floor(n/100000))+' Lakh ';n%=100000;}
  if(n>=1000){str+=numberToWords(Math.floor(n/1000))+' Thousand ';n%=1000;}
  if(n>=100){str+=a[Math.floor(n/100)]+' Hundred ';n%=100;}
  if(n>=20){str+=b[Math.floor(n/10)]+' ';n%=10;}
  if(n>0){str+=a[n]+' ';}
  return str.trim();
}

<script>

(function() {

      font-size:13px;outline:none;font-family:'Segoe UI',sans-serif;}
    .bnj-ai-input button{padding:10px 16px;background:#1e3a8a;color:#fff;border:none;
      border-radius:10px;cursor:pointer;font-size:13px;font-weight:600;}
    .bnj-quick{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0;}
    .bnj-chip{padding:5px 10px;background:#eff6ff;color:#1e40af;border-radius:8px;
      font-size:11px;cursor:pointer;border:1px solid #bfdbfe;font-weight:600;}
    .bnj-chip:hover{background:#dbeafe;}
    @media(max-width:480px){#bnj-ai-panel{width:calc(100vw - 32px);right:16px;}}
  `;
  document.head.appendChild(style);

  // Get current page context
  function getContext() {
    const user = typeof ERP !== 'undefined' ? ERP.getUser() : {};
    const page = window.location.pathname.split('/').pop().replace('.html','');
    const company = user ? (user.COMPANY_NAME || 'Balaji NextGen') : 'Balaji NextGen';
    return { page, company, role: user ? user.ROLE : 'USER', user };
  }

  // Inject HTML
  document.body.insertAdjacentHTML('beforeend', `
    <button id="bnj-ai-btn" title="AI Assistant" onclick="toggleAI()">🤖</button>
    <div id="bnj-ai-panel">
      <div class="bnj-ai-header">

      </div>

  `);

  // Update context
  const ctx = getContext();
  const ctxEl = document.getElementById('bnj-ai-ctx');

  window.toggleAI = function() {

  window.askAI = function(q) {

  window.sendAI = async function() {
    const input = document.getElementById('bnj-input');
    const q = input.value.trim();
    if (!q) return;
    input.value = '';

    addMsg(q, 'user');
    const thinking = addMsg('⏳ Thinking...', 'bot thinking');

    try {
      const ctx = getContext();
      const systemPrompt = `You are the Balaji NextGen ERP AI Assistant for ${ctx.company}.
Current page: ${ctx.page}. User role: ${ctx.role}.
You help with: sales reports, inventory queries, GST filing, Tally XML export, WhatsApp sending, KOT management, billing, HR, and all ERP operations.
For data queries, provide helpful summaries. For Tally export, tell user to click the Tally button in the page. For WhatsApp, guide them to the share button.
Keep responses concise, practical, and in plain text (no markdown). Max 3 sentences unless a list is needed.`;

      // Use GAS backend to call AI (avoids CORS and keeps API key server-side)
      let reply = '';
      
      if (typeof erpCoreApi !== 'undefined') {
        try {
          const res = await erpCoreApi({
            action: 'AI_QUERY',
            query: q,
            page: ctx.page,
            role: ctx.role,
            company: ctx.company,
          });
          if (res.ok && res.reply) {
            reply = res.reply;
          }
        } catch(e) {}
      }

      // Fallback: smart local responses
      if (!reply) {
        reply = getSmartReply(q, ctx);
      }

      thinking.remove();
      addMsg(reply, 'bot');

    } catch(e) {
      thinking.remove();
      addMsg('Sorry, I encountered an error. Please try again.', 'bot');
    }
  };

  // Smart local fallback responses
  function getSmartReply(q, ctx) {
    const ql = q.toLowerCase();
    if (ql.includes('tally') || ql.includes('export xml')) {
      return '🧮 To export to Tally: Go to Sales Invoice page → click "Export to Tally" button → a .xml file downloads → import it in Tally Prime via Gateway → Import Data → Vouchers.';

      return '💬 To send via WhatsApp: Open the invoice → click the WhatsApp button → it opens WhatsApp Web with the invoice details pre-filled. For bulk sending, configure WATI API in Settings.';
    }
    if (ql.includes('gst') || ql.includes('gstr')) {
      return '📋 GST Reports: Go to Dashboard → GST Center → select GSTR-1, GSTR-3B or HSN Summary → choose the period → click Download Excel. For filing, use the GST portal with the exported data.';

  }

  console.log('✅ Balaji AI Assistant loaded');

</script>
