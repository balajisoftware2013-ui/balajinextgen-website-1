<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Inventory Dashboard — Balaji NextGen ERP</title>
<script src="../Dashboard/erp-config.js"></script>
<script>
// ── Balaji NextGen ERP — GAS Connection ──
const GAS_URL = 'https://script.google.com/macros/s/AKfycbxYC6C2ltrcupaEexLJlvoJkISnAtgqE2p_o2KUInn1TaFh4IA2hQeq7cC9Q9ceFrOx/exec';
const CLIENT_ID = (function(){
  try{
    const u = JSON.parse(sessionStorage.getItem('erpUser')||localStorage.getItem('erpUser')||'{}');
    return u.CLIENT_ID || u.clientId || u.client_id || '';
  }catch(e){ return ''; }
})();

async function gasApi(action, payload={}){
  try{
    const body = JSON.stringify({action, clientId: CLIENT_ID, ...payload});
    const res  = await fetch(GAS_URL, {method:'POST', body});
    return await res.json();
  }catch(e){
    console.error('GAS API error:', e);
    return {success:false, error:e.message};
  }
}
function showToast(msg, type='info'){
  const t = document.getElementById('gasToast')||document.createElement('div');
  t.id='gasToast';
  t.style.cssText='position:fixed;bottom:20px;right:20px;background:'+(type==='error'?'#dc2626':type==='success'?'#16a34a':'#0f172a')+';color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:9999;';
  t.textContent=msg; document.body.appendChild(t);
  clearTimeout(t._t); t._t=setTimeout(()=>t.remove(),3000);
}
</script>
<div id="gasToast" style="display:none"></div>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#f8fafc;padding:20px}
.topbar{background:#0f172a;color:#fff;padding:14px 20px;border-radius:12px;display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:#fff;border-radius:10px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.kpi-val{font-size:28px;font-weight:700;color:#0f172a}
.kpi-lbl{font-size:12px;color:#64748b;margin-top:4px}
.card{background:#fff;border-radius:10px;padding:18px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:16px}
.card-title{font-size:14px;font-weight:600;color:#0f172a;margin-bottom:12px;display:flex;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:12px}
th{background:#f1f5f9;padding:8px;text-align:left;font-size:11px;font-weight:600;color:#475569}
td{padding:8px;border-bottom:1px solid #f1f5f9;color:#334155}
.badge{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}
.badge-warn{background:#fef3c7;color:#92400e}
.badge-ok{background:#dcfce7;color:#166534}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:12px;font-weight:600}
.btn-primary{background:#0f172a;color:#fff}
</style>
</head>
<body>
<div class="topbar">
  <div style="display:flex;align-items:center;gap:12px">
    <span style="font-size:20px">📦</span>
    <div>
      <div style="font-weight:600;font-size:15px">Inventory Dashboard</div>
      <div style="font-size:11px;opacity:.7" id="clientName">Balaji NextGen ERP</div>
    </div>
  </div>
  <div style="display:flex;gap:10px;align-items:center">
    <button class="btn btn-primary" onclick="loadData()">↺ Refresh</button>
    <span style="font-size:11px;opacity:.7" id="lastUpdated"></span>
  </div>
</div>

<div class="kpi-grid">
  <div class="kpi"><div class="kpi-val" id="kpiItems">—</div><div class="kpi-lbl">Total Items</div></div>
  <div class="kpi"><div class="kpi-val" id="kpiLow">—</div><div class="kpi-lbl" style="color:#dc2626">Low Stock Items</div></div>
  <div class="kpi"><div class="kpi-val" id="kpiValue">—</div><div class="kpi-lbl">Stock Value (₹)</div></div>
  <div class="kpi"><div class="kpi-val" id="kpiMoves">—</div><div class="kpi-lbl">Today's Movements</div></div>
</div>

<div class="card">
  <div class="card-title">⚠️ Low Stock / Reorder Alert</div>
  <table><thead><tr><th>Item Code</th><th>Item Name</th><th>Category</th><th>Closing Qty</th><th>Reorder Level</th><th>Status</th></tr></thead>
  <tbody id="lowStockTable"><tr><td colspan="6" style="text-align:center;padding:20px;color:#94a3b8">Loading...</td></tr></tbody></table>
</div>

<div class="card">
  <div class="card-title">📋 Recent Stock Movements</div>
  <table><thead><tr><th>Date</th><th>Item</th><th>Type</th><th>In Qty</th><th>Out Qty</th><th>Balance</th><th>Ref</th></tr></thead>
  <tbody id="movementsTable"><tr><td colspan="7" style="text-align:center;padding:20px;color:#94a3b8">Loading...</td></tr></tbody></table>
</div>

<script>
async function loadData(){
  document.getElementById('lastUpdated').textContent = 'Loading...';
  const r = await gasApi('GET_INVENTORY_SUMMARY');
  if(r.success && r.data){
    const d = r.data;
    document.getElementById('kpiItems').textContent  = d.items || 0;
    document.getElementById('kpiLow').textContent    = (d.lowStock||[]).length;
    document.getElementById('kpiValue').textContent  = '₹'+Number(d.stockValue||0).toLocaleString('en-IN');
    document.getElementById('kpiMoves').textContent  = (d.recentMovements||[]).length;
    
    const lowTbl = document.getElementById('lowStockTable');
    lowTbl.innerHTML = (d.lowStock||[]).length ? d.lowStock.map(r=>`
      <tr><td>${r.ITEM_CODE||''}</td><td>${r.ITEM_NAME||''}</td><td>${r.CATEGORY||''}</td>
      <td>${r.CLOSING_QTY||''}</td><td>${r.REORDER_LEVEL||''}</td>
      <td><span class="badge badge-warn">REORDER</span></td></tr>`).join('')
      : '<tr><td colspan="6" style="text-align:center;color:#16a34a;padding:16px">✅ All items above reorder level</td></tr>';
    
    const movTbl = document.getElementById('movementsTable');
    movTbl.innerHTML = (d.recentMovements||[]).map(r=>`
      <tr><td>${r.ENTRY_DATE||''}</td><td>${r.ITEM_NAME||''}</td><td>${r.TRANSACTION_TYPE||''}</td>
      <td style="color:#16a34a">${r.IN_QTY||''}</td><td style="color:#dc2626">${r.OUT_QTY||''}</td>
      <td>${r.BALANCE_QTY||''}</td><td style="font-size:11px">${r.REFERENCE_NO||''}</td></tr>`).join('');
    
    document.getElementById('lastUpdated').textContent = 'Updated: '+new Date().toLocaleTimeString('en-IN');
  } else {
    showToast('Failed to load inventory: '+(r.error||'Check GAS connection'), 'error');
  }
}
loadData();
setInterval(loadData, 120000);
</script>
</body></html>
