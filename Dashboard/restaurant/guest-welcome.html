<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0c">
<title>Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0c;--surface:#151517;--surface2:#1d1d20;--fg:#f6f4ef;--muted:#9b978f;--line:rgba(255,255,255,.1);
  --btn:#f6f4ef;--btn-fg:#0b0b0c;--wa:#25d366;--veg:#1faa59;--nonveg:#d93a2f;--r:18px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:light){:root{--bg:#faf8f4;--surface:#fff;--surface2:#f1eee8;--fg:#111;--muted:#6f6b64;--line:rgba(0,0,0,.1);--btn:#111;--btn-fg:#fff}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
a{color:inherit;text-decoration:none}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:8px}

/* ---------- logo ---------- */
.logo{display:flex;justify-content:center}
.logo img{max-height:76px;max-width:68%;object-fit:contain}
.logo svg{height:76px;width:auto;color:var(--fg)}
.logo svg .t{font-family:'Permanent Marker',cursive;fill:currentColor}
.logo svg .b{fill:currentColor}

/* ---------- boot ---------- */
#boot{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:50;transition:opacity .4s}
#boot .pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35;transform:scale(.97)}}

/* ---------- welcome stage (video) ---------- */
#stage{position:fixed;inset:0;background:#000;z-index:40;color:#fff;overflow:hidden;opacity:0;transition:opacity .5s}
#stage.on{opacity:1}
#stage video,#stage iframe,#stage .intro{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
#stage .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),transparent 28%,transparent 62%,rgba(0,0,0,.7));pointer-events:none}
#stage .top{position:absolute;left:0;right:0;top:0;padding:calc(18px + var(--safe-t)) 18px 0;display:flex;justify-content:space-between;align-items:center;z-index:3}
#stage .top .logo img{max-height:44px}
#stage .top .logo svg{height:44px;color:#fff}
#stage .ctl{position:absolute;left:0;right:0;bottom:0;padding:18px 18px calc(22px + var(--safe-b));display:flex;gap:10px;align-items:center;justify-content:space-between;z-index:3}
.chip{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 16px;border-radius:999px;background:rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-weight:600;font-size:14px;color:#fff;border:1px solid rgba(255,255,255,.2)}
.chip.solid{background:#fff;color:#000;border-color:#fff}
#stage .bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.2);z-index:4}
#stage .bar i{display:block;height:100%;width:0;background:#fff}

/* default animated welcome (used when the client has no video) */
.intro{display:grid;place-items:center;text-align:center;background:radial-gradient(120% 90% at 50% 30%,#1b1b1f 0%,#070708 70%)}
.intro .in{padding:0 28px}
.intro svg{width:min(62vw,260px);height:auto;color:#fff;overflow:visible}
.intro .ln{fill:none;stroke:currentColor;stroke-width:13;stroke-linecap:round;stroke-dasharray:420;stroke-dashoffset:420;animation:draw 1.1s cubic-bezier(.6,0,.2,1) forwards}
.intro .ln:nth-child(2){animation-delay:.15s}.intro .ln:nth-child(3){animation-delay:.45s}.intro .ln:nth-child(4){animation-delay:.6s}
@keyframes draw{to{stroke-dashoffset:0}}
.intro .w{margin-top:26px;font-size:13px;letter-spacing:.42em;text-transform:uppercase;color:#bdb9b0;opacity:0;animation:rise .8s .9s forwards}
.intro h2{font-family:'Permanent Marker',cursive;font-weight:400;font-size:clamp(32px,9vw,46px);margin:10px 0 0;line-height:1.1;opacity:0;animation:rise .9s 1.25s forwards}
.intro .s{margin-top:14px;color:#a7a399;font-size:15px;opacity:0;animation:rise .9s 1.7s forwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* ---------- main ---------- */
#app{min-height:100%;display:none}
#app.on{display:block;animation:fade .5s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}}
.wrap{max-width:520px;margin:0 auto;padding:calc(26px + var(--safe-t)) 18px calc(34px + var(--safe-b))}
.hero{text-align:center;padding:6px 0 22px}
.hero .kick{margin:18px 0 6px;color:var(--muted);font-size:12px;letter-spacing:.34em;text-transform:uppercase}
.hero h1{font-family:'Permanent Marker',cursive;font-weight:400;margin:0;font-size:clamp(30px,9vw,40px);line-height:1.12}
.pill{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:8px 14px;border:1px solid var(--line);border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.pill b{color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--veg)}

.primary{display:flex;align-items:center;justify-content:space-between;width:100%;padding:20px 22px;border-radius:var(--r);background:var(--btn);color:var(--btn-fg);font-size:18px;font-weight:700;box-shadow:0 10px 30px -12px rgba(0,0,0,.6);transition:transform .15s}
.primary:active{transform:scale(.985)}
.primary>span{text-align:left}
.primary small{display:block;font-size:13px;font-weight:500;opacity:.65;margin-top:3px}
.primary svg{width:26px;height:26px;flex:none}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.tile{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:15px;text-align:left;min-height:96px;justify-content:space-between}
.tile svg{width:24px;height:24px}
.tile small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:2px}
.tile.wa svg{color:var(--wa)}
.tile:last-child:nth-child(odd){grid-column:1/-1;min-height:84px}
.tile.full{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center}
.sec{margin:30px 0 12px;display:flex;justify-content:space-between;align-items:baseline}
.sec h3{margin:0;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sec button{font-size:13px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.events{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.events::-webkit-scrollbar{display:none}
.ev{flex:0 0 78%;max-width:320px;scroll-snap-align:start;border-radius:var(--r);overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.ev .ph{aspect-ratio:4/3;background:var(--surface2) center/cover}
.ev .tx{padding:14px 16px 16px}
.ev b{display:block;font-size:16px}
.ev span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.foot{margin-top:30px;text-align:center;color:var(--muted);font-size:12.5px;line-height:1.6}

/* ---------- menu overlay ---------- */
#menu{position:fixed;inset:0;z-index:30;background:var(--bg);display:none;flex-direction:column}
#menu.on{display:flex;animation:fade .3s}
.mh{padding:calc(12px + var(--safe-t)) 14px 10px;border-bottom:1px solid var(--line);background:var(--bg)}
.mh .r1{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;flex:none}
.mh h2{margin:0;font-size:18px;flex:1}
.mh h2 small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:1px}
.search{margin-top:10px;position:relative}
.search input{width:100%;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 14px 0 40px;font:inherit;font-size:16px;outline:none}
.search svg{position:absolute;left:13px;top:12px;width:20px;height:20px;color:var(--muted)}
.seg{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;height:36px;padding:0 15px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--btn);color:var(--btn-fg);border-color:var(--btn)}
.seg.cats{margin-top:8px}
.seg button.vf{display:inline-flex;align-items:center;gap:7px}
.list{flex:1;overflow-y:auto;padding:4px 14px calc(110px + var(--safe-b));-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.cat{margin:22px 0 4px;font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);font-weight:600;scroll-margin-top:8px}
.it{display:flex;gap:14px;padding:16px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.it .im{width:76px;height:76px;border-radius:14px;background:var(--surface2) center/cover;flex:none}
.it .bd{flex:1;min-width:0}
.it .nm{display:flex;gap:8px;align-items:flex-start;font-weight:600;font-size:15.5px;line-height:1.3}
.vd{width:14px;height:14px;border:1.5px solid var(--veg);border-radius:3px;display:grid;place-items:center;flex:none;margin-top:3px}
.vd::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--veg)}
.vd.nv{border-color:var(--nonveg)}.vd.nv::after{background:var(--nonveg)}
.tag{display:inline-block;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--fg);background:var(--surface2);border-radius:6px;padding:2px 7px;margin-left:6px;vertical-align:middle}
.row2{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:10px}
.pr{font-weight:700;font-size:15px}
.add{height:36px;min-width:84px;padding:0 18px;border-radius:10px;border:1.5px solid var(--fg);font-weight:700;font-size:13.5px;letter-spacing:.06em}
.qty{display:inline-flex;align-items:center;height:36px;border-radius:10px;background:var(--btn);color:var(--btn-fg);font-weight:700}
.qty button{width:36px;height:36px;font-size:19px;color:var(--btn-fg)}
.qty span{min-width:22px;text-align:center;font-size:14px}
.empty{padding:60px 20px;text-align:center;color:var(--muted)}
.cart{position:absolute;left:12px;right:12px;bottom:calc(12px + var(--safe-b));display:none}
.cart.on{display:flex}
.cart button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-radius:16px;background:var(--btn);color:var(--btn-fg);font-weight:700;font-size:16px;box-shadow:0 14px 40px -10px rgba(0,0,0,.7)}
.notice{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.5}

/* ---------- sheet ---------- */
#sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;background:rgba(0,0,0,.6)}
#sheet.on{display:flex}
#sheet .pn{width:100%;max-width:520px;margin:0 auto;max-height:92vh;overflow:auto;background:var(--bg);border-radius:24px 24px 0 0;padding:20px 18px calc(22px + var(--safe-b));animation:up .28s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.pn h3{margin:0 0 4px;font-size:20px}
.pn .sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.cl{border-top:1px solid var(--line)}
.cl .r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.cl .r b{font-weight:600;font-size:15px;flex:1}
.cl .r em{font-style:normal;color:var(--muted);font-size:13px;display:block;margin-top:2px}
.fld{margin:14px 0 0}
.fld label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px;color:var(--muted)}
.fld input,.fld textarea{width:100%;font:inherit;font-size:16px;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);outline:none}
.fld textarea{resize:none;height:70px}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin:16px 0 14px}
.send{display:flex;justify-content:center;align-items:center;gap:10px;width:100%;height:56px;border-radius:16px;background:var(--wa);color:#fff;font-weight:700;font-size:16.5px}
.ghost{display:block;width:100%;margin-top:10px;height:46px;color:var(--muted);font-weight:600}
.ok{text-align:center;padding:10px 0}
.ok .tick{width:64px;height:64px;border-radius:50%;background:var(--veg);display:grid;place-items:center;margin:6px auto 14px;color:#fff}
.err{color:#ff6b5e;font-size:13px;min-height:18px;margin-top:8px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important;scroll-behavior:auto!important}}

/* ---------- swipe-up welcome (shown first on every scan) ---------- */
#swl{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;color:#fff3dc;background:radial-gradient(120% 70% at 50% 18%,#6b4423 0%,#2a1a0e 45%,#160d07 100%);padding:0 26px calc(26px + var(--safe-b));overflow:hidden;touch-action:none;transition:transform .45s cubic-bezier(.3,.8,.3,1),opacity .45s}
#swl.go{transform:translateY(-100%);opacity:.4}
#swl .glow{position:absolute;left:50%;top:22%;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;background:radial-gradient(circle,rgba(240,170,80,.28),transparent 68%);animation:swp 3s ease-in-out infinite}
@keyframes swp{50%{transform:scale(1.1);opacity:1}}
#swl .lg{position:relative;width:132px;height:132px;border-radius:30px;background:#1d1510;border:1px solid rgba(255,255,255,.08);box-shadow:0 14px 40px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-bottom:34px;animation:swi .8s both}
#swl .lg img{width:100%;height:100%;max-height:none;max-width:none;object-fit:contain;padding:12px}
#swl .lg:has(img){background:#fff}
#swl .lg svg{height:60px;width:auto;color:#fff3dc}
#swl .k{position:relative;font-size:13px;font-weight:700;letter-spacing:.28em;color:#c99a5b;animation:swi .8s .1s both}
#swl h1{position:relative;font-size:clamp(27px,8vw,38px);font-weight:700;line-height:1.15;margin:12px 0 0;color:#fff0d4;max-width:92%;word-break:break-word;animation:swi .8s .2s both}
#swl .tb{position:relative;font-size:14px;font-weight:600;color:#c99a5b;margin-top:10px}
#swl .sw{position:relative;margin-top:64px;color:#c58f55;font-size:22px;font-weight:600;padding:8px 14px;animation:swi .8s .35s both}
#swl .sw i{display:block;font-style:normal;font-size:26px;line-height:1;margin-top:6px;animation:swu 1.4s ease-in-out infinite}
@keyframes swu{0%,100%{transform:translateY(4px);opacity:.5}50%{transform:translateY(-6px);opacity:1}}
@keyframes swi{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#swl .c{position:relative;margin-top:44px;font-size:12.5px;line-height:1.55;color:#8d7a66;max-width:340px}
#swl .c a{text-decoration:underline}
#swl .pw{position:relative;margin-top:14px;font-size:11px;color:#6f5f50}
@media (max-height:640px){#swl .lg{width:96px;height:96px;margin-bottom:18px}#swl .sw{margin-top:28px}#swl .c{margin-top:22px}}
</style>
</head>
<body>

<div id="boot"><div class="logo pulse" id="bootLogo"></div></div>

<!-- SWIPE-UP WELCOME: client logo + "Welcome to <client name>" -->
<div id="swl" class="hide" role="dialog" aria-label="Welcome">
  <div class="glow"></div>
  <div class="lg" id="swlLogo"></div>
  <div class="k">👋 WELCOME</div>
  <h1 id="swlName">Welcome</h1>
  <div class="tb hide" id="swlTable"></div>
  <button class="sw" id="swlGo" type="button">Swipe up to view menu<i>⌃</i></button>
  <div class="c">By continuing, you agree to sharing your contact details with restaurant and our<br><a href="#" class="swlLink">Terms &amp; Conditions</a> and <a href="#" class="swlLink">Privacy Policy</a></div>
  <div class="pw">Powered by Balaji NextGen</div>
</div>

<!-- WELCOME VIDEO (first visit; client video, or the default welcome) -->
<section id="stage" class="hide" aria-label="Welcome">
  <div id="media"></div>
  <div class="shade"></div>
  <div class="top"><div class="logo" id="stageLogo"></div><span></span></div>
  <div class="ctl">
    <button class="chip hide" id="mute" aria-label="Sound"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4z"/><path id="mutePath" d="m22 9-6 6m0-6 6 6"/></svg><span id="muteTx">Sound off</span></button>
    <span></span>
    <button class="chip solid" id="skip">Enter <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
  </div>
  <div class="bar"><i id="prog"></i></div>
</section>

<!-- MAIN -->
<main id="app">
  <div class="wrap">
    <header class="hero">
      <div class="logo" id="mainLogo"></div>
      <p class="kick" id="kick">Welcome to</p>
      <h1 id="rname">Welcome</h1>
      <div class="pill hide" id="tablePill"><span class="dot"></span>Table <b id="tableNo"></b></div>
    </header>

    <button class="primary hide" id="openMenu" type="button">
      <span><span id="menuLabel">View Menu</span><small id="menuSub"></small></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>

    <div class="grid" id="tiles"></div>

    <div id="evSec" class="hide">
      <div class="sec"><h3>What's on</h3></div>
      <div class="events" id="events"></div>
    </div>

    <p class="foot" id="foot"></p>
    <p class="foot hide" id="replayWrap"><button id="replay" style="text-decoration:underline;text-underline-offset:3px">Replay welcome</button></p>
  </div>
</main>

<!-- DIGITAL MENU -->
<section id="menu" aria-label="Menu">
  <div class="mh">
    <div class="r1">
      <button class="back" id="menuBack" aria-label="Back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <h2 id="menuTitle">Menu<small id="menuTable"></small></h2>
    </div>
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search dishes & drinks" autocomplete="off"></div>
    <div class="seg hide" id="mode"></div>
    <div class="seg cats" id="cats"></div>
  </div>
  <div class="list" id="list"></div>
  <div class="cart" id="cart"><button id="cartBtn" type="button"><span id="cartN">0 items</span><span>View order · <span id="cartT">₹0</span></span></button></div>
</section>

<div id="sheet"><div class="pn" id="pn"></div></div>

<script>
/* ======================= SET THESE ======================= */
var API = 'https://script.google.com/macros/s/AKfycbz39r1zo4LGqHJXpwDsQFulHdp3qsjiLRxRiSIEBBObI_3310_n2izF_gAjofaIHgSJ/exec';   /* the /exec URL of your deployed web app (without ?action=…) */
var DEFAULT_VIDEO_URL = '';                          /* optional: your own default welcome video (.mp4 / YouTube / Drive link). '' = built-in animated welcome */
var CURRENCY = '₹';
/* ========================================================= */

/* Everything below is controlled from POS / the owner screens. A URL can force a switch for testing:
   ?menu=0|1  ?digital=0|1  ?order=0|1  ?video=0|1  ?welcome=always  ?t=<table>  ?c=<clientId>  ?demo=1 */
var qs = new URLSearchParams(location.search);
var CID = (qs.get('c') || qs.get('client') || qs.get('clientId') || 'CL00010').trim();
try{var storedCore=localStorage.getItem('bnx_api_core');if(/^AKfycb[A-Za-z0-9_-]{20,}$/.test(storedCore||''))API='https://script.google.com/macros/s/'+storedCore+'/exec';}catch(_){}
var TABLE = (qs.get('t') || qs.get('table') || qs.get('tableId') || '').trim().slice(0, 12);
var $ = function (id) { return document.getElementById(id); };

var WA_AFTER=false;
/* device id + WhatsApp check-in code (#CI-<client>-<table>-D<device>) — the server (bnxWaCheckinFromMessage_) reads this code */
function deviceId(){var d=store('bnx_device_id');if(!d){d=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random().toString(16).slice(2)).replace(/[^A-Za-z0-9]/g,'');store('bnx_device_id',d);}return d;}
function ciCode(){var d=deviceId().slice(0,12);return '#CI-'+CID+'-'+(TABLE?'T'+TABLE.replace(/[^A-Za-z0-9]/g,''):'C')+(d.length>=8?'-D'+d:'');}
function ciWaLink(name){
 var t='Hi'+(D.info.name?' '+D.info.name:'')+' \uD83D\uDC4B Please check me in'+(TABLE?' \u00B7 Table '+TABLE:'')+'\n'+ciCode();
 return waLink(t);
}
/* 2026-10-23 ROOT FIX ("guest check-in not saved"): this page asked ONE server (API) and, when that deployment had no
   GUEST_CHECKIN, fell back to POST CUSTOMER_CHECKIN — which needs a staff login, so a guest's save always failed.
   Now it asks the same servers as customer-order.html (last working one first, shared on this domain) and keeps the
   first one that really saves. Public GET route = GUEST_CRM + master DB + transactions + welcome. */
var GW_APIS=['https://script.google.com/macros/s/'+(store('bnx_api_core')||'AKfycbz39r1zo4LGqHJXpwDsQFulHdp3qsjiLRxRiSIEBBObI_3310_n2izF_gAjofaIHgSJ')+'/exec',
  'https://script.google.com/macros/s/'+(store('bnx_api_auth')||'AKfycbxYC6C2ltrcupaEexLJlvoJkISnAtgqE2p_o2KUInn1TaFh4IA2hQeq7cC9Q9ceFrOx')+'/exec',
  'https://script.google.com/macros/s/AKfycbwHdqrP4IvuVD2ZkupNybrEkiXu3kmuI6-tQoiHgYxoqr1KgUupeFsi3PIoFEbuv6XA/exec'];
function gwEps(){var out=[],add=function(u){if(u&&/\/exec$/.test(u)&&out.indexOf(u)<0)out.push(u);};add(store('bnx_guest_api_ok'));add(API);GW_APIS.forEach(add);return out;}
function gwPlatform(){return /android/i.test(navigator.userAgent)?'android':/iphone|ipad/i.test(navigator.userAgent)?'ios':'web';}
async function gwGuestGet(params,ctl,isMode){
 var q=new URLSearchParams({action:'GUEST_CHECKIN',clientId:CID,deviceId:deviceId(),platform:gwPlatform(),app:'guest-welcome'});
 Object.keys(params).forEach(function(k){if(params[k]!=null&&params[k]!=='')q.set(k,String(params[k]));});
 var last={success:false,error:'Check-in server not reachable. Please try again.'};
 var eps=gwEps();
 for(var i=0;i<eps.length;i++){
  var base=eps[i];
  try{
   var j=await (await fetch(base+'?'+q.toString(),ctl?{signal:ctl.signal}:{})).json();
   var err=String((j&&(j.error||j.message))||'');
   var notHere=!j||(j.success===false&&/unknown|not installed|not supported|invalid action|no action|invalid or expired session|unauthori[sz]ed|session/i.test(err));
   if(isMode){ if(j&&j.mode===params.mode){store('bnx_guest_api_ok',base);return j;} continue; }
   if(j&&!notHere&&(j.isNewCustomer!==undefined||j.customerName!==undefined||j.customerId!==undefined||j.crn!==undefined||(j.success===false&&err))){ if(j.success!==false)store('bnx_guest_api_ok',base); return j; }
   if(notHere&&store('bnx_guest_api_ok')===base){try{localStorage.removeItem('bnx_guest_api_ok');}catch(_){}}
   last={success:false,error:'Check-in is not installed on the server.'};
  }catch(e){ if(e.name==='AbortError')throw e; }
 }
 return last;
}
async function sendCheckin(name,phone,ctl,source){
 var id=(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random());
 return gwGuestGet({mobileNo:phone,customerName:name,name:name,tableId:TABLE,scanKey:id,requestId:id,source:source||'CUSTOMER_QR',updateName:'true',notifyOptIn:'true'},ctl,false);
}
/* does the restaurant's server receive WhatsApp messages (WA_PROVIDER META / TWILIO)? Only then can "no typing" save a guest. */
var WA_API=null;
function gwLoadConfig(){ try{var c=JSON.parse(sessionStorage.getItem('bnx_gcheck_'+CID)||'null'); if(c){WA_API=(c.waApi===true||c.whatsapp===true);} }catch(_){}
 gwGuestGet({mode:'CONFIG'},null,true).then(function(r){ var c=r&&r.config; if(c){ WA_API=(c.waApi===true||c.whatsapp===true); try{sessionStorage.setItem('bnx_gcheck_'+CID,JSON.stringify(c));}catch(_){} if($('app').classList.contains('on'))showApp(); } }).catch(function(){}); }
/* normal WhatsApp: message names the guest so the staff see who it is (the chat itself is never read by any server) */
function guestWaLink(){ var t='Hi'+(D.info.name?' '+D.info.name:'')+'! I am '+(GUEST.name||'a guest')+(GUEST.phone?' ('+GUEST.phone+')':'')+(TABLE?' at Table '+TABLE:'')+(GUEST.crn?' · Customer No. '+GUEST.crn:'')+'.\n'+ciCode(); return waLink(t); }
/* a returning guest (saved on this phone) is checked in for today's visit automatically, once per day */
function gwAutoVisit(){
 if(!(GUEST.saved&&GUEST.name&&/^[6-9]\d{9}$/.test(GUEST.phone||''))||qs.get('demo')==='1')return;
 var day=new Date(Date.now()+19800000-6*3600000).toISOString().slice(0,10), k='bnx_welcome_visit_'+CID;
 if(store(k)===day+'|'+TABLE)return;
 sendCheckin(GUEST.name,GUEST.phone,null,'CUSTOMER_QR_RETURN').then(function(j){ if(j&&j.success!==false){store(k,day+'|'+TABLE); if(j.crn){GUEST.crn=j.crn;store('bnx_welcome_guest_'+CID,JSON.stringify(GUEST));}} }).catch(function(){});
}
function drawGuestForm(){
 var waBtn=(/^[6-9]\d{9}$/.test(CFG.wa)&&WA_API===true)?'<a class="send" id="guestWaDirect" href="'+esc(ciWaLink(''))+'" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;margin-bottom:10px">'+ico('wa').replace('<svg ','<svg width="22" height="22" ')+'Check in on WhatsApp \u2014 no typing</a><p class="sub" style="text-align:center;margin:0 0 10px">Tap, then press <b>Send</b> in WhatsApp. Or fill in below:</p>':'';
 $('pn').innerHTML='<h3>Guest check-in</h3><p class="sub">Save your details for this visit.</p>'+waBtn+'<form id="guestForm"><div class="fld"><label for="guestName">Your name</label><input id="guestName" name="name" required maxlength="80" autocomplete="name" placeholder="Your full name" value="'+esc(GUEST.name||'')+'"></div><div class="fld"><label for="guestPhone">Mobile / WhatsApp number</label><input id="guestPhone" name="tel" type="tel" inputmode="tel" required maxlength="18" autocomplete="tel" placeholder="10-digit mobile number" value="'+esc(GUEST.phone||'')+'"></div><p class="sub">We save your name and mobile for this visit. WhatsApp replies depend on the restaurant’s messaging setup.</p><div class="err" id="guestError"></div><button class="send" id="guestSave" type="submit">'+((WA_AFTER&&WA_API!==true&&/^[6-9]\d{9}$/.test(CFG.wa))?'Save &amp; open WhatsApp':'Save check-in')+'</button></form><button class="ghost" id="guestClose">Back</button>';
 $('guestClose').onclick=closeSheet;$('guestForm').onsubmit=function(e){e.preventDefault();saveGuest();};
}
async function saveGuest(){
 var name=$('guestName').value.trim().replace(/\s+/g,' '),phone=$('guestPhone').value.replace(/\D/g,'');
 if(phone.length===12&&phone.startsWith('91'))phone=phone.slice(2);
 if(name.length<2||!/^[6-9]\d{9}$/.test(phone)){$('guestError').textContent='Enter your name and a valid 10-digit mobile number.';return;}
 var b=$('guestSave');b.disabled=true;b.textContent='Saving\u2026';var ctl=new AbortController(),timer=setTimeout(function(){ctl.abort();},75000);
 try{
  if(qs.get('demo')==='1')throw new Error('Check-in is unavailable in demo mode.');
  var j=await sendCheckin(name,phone,ctl);
  if(!j||j.success!==true)throw new Error(j&&j.error||'Check-in could not be saved. Please try again.');
  GUEST={name:name,phone:phone,saved:true,crn:j.crn||''};store('bnx_welcome_guest_'+CID,JSON.stringify(GUEST));
  try{store('bnx_welcome_visit_'+CID,new Date(Date.now()+19800000-6*3600000).toISOString().slice(0,10)+'|'+TABLE);}catch(_){}
  var crn=j.crn?'<p class="sub">Customer No: <b>'+esc(j.crn)+'</b></p>':'';
  var waGo=(WA_API!==true&&/^[6-9]\d{9}$/.test(CFG.wa))?'<a class="send" href="'+esc(guestWaLink())+'" target="_blank" rel="noopener" style="text-decoration:none;margin-top:6px" onclick="setTimeout(closeSheet,400)">'+ico('wa').replace('<svg ','<svg width="22" height="22" ')+'Open WhatsApp — tap Send</a>':'';
  WA_AFTER=false;
  var waStatus=(j.welcomeSent===true||j.welcome==='sent'||j.autoReply==='accepted')?'Your check-in is saved. Your WhatsApp message was submitted for sending.':'Your check-in is saved. WhatsApp delivery has not been confirmed.';
  $('pn').innerHTML='<h3>Welcome, '+esc(name)+'</h3><p class="sub">'+(waGo?'Your check-in is saved.':waStatus)+'</p>'+crn+waGo+'<button class="ghost" onclick="closeSheet()" style="color:var(--fg)">Continue to menu</button>';
  try{showApp();}catch(_){}
 }catch(e){if($('guestError'))$('guestError').textContent=e.name==='AbortError'?'No save confirmation received. Please retry.':e.message;}
 finally{clearTimeout(timer);if(document.contains(b)){b.disabled=false;b.textContent='Save check-in';}}
}

/* ---------------- boot ---------------- */
function begin() {
  resolve();
  var firstVisit = !store(seenKey());
  var play = CFG.video && CFG.state !== 'OFF' && firstVisit;
  /* Swipe-up welcome ("Welcome to <client name>") on every scan; then the welcome video (first visit) or the main screen. */
  showSwipeWelcome(function () { if (play) playStage(); else showApp(); });
}

function showSwipeWelcome(next) {
  var el = $('swl');
  if (qs.get('nowelcome') === '1' || !el) { next(); return; }
  var i = D.info || {};
  $('swlName').textContent = i.name ? 'Welcome to ' + i.name : 'Welcome';
  if (TABLE) { $('swlTable').textContent = 'Table ' + TABLE; $('swlTable').classList.remove('hide'); }
  el.classList.remove('hide');
  $('boot').style.opacity = 0; setTimeout(function () { $('boot').classList.add('hide'); }, 400);
  var done = false, y0 = null;
  function finish() {
    if (done) return; done = true;
    window.removeEventListener('keydown', onKey);
    el.classList.add('go');
    setTimeout(function () { el.classList.add('hide'); next(); }, 430);
  }
  function onKey(e) { if (e.key === 'Enter' || e.key === 'ArrowUp' || e.key === ' ') { e.preventDefault(); finish(); } }
  el.addEventListener('touchstart', function (e) { y0 = e.touches[0].clientY; }, { passive: true });
  el.addEventListener('touchmove', function (e) { if (y0 !== null && y0 - e.touches[0].clientY > 40) { y0 = null; finish(); } }, { passive: true });
  el.addEventListener('wheel', function (e) { if (e.deltaY > 10) finish(); }, { passive: true });
  el.addEventListener('click', function (e) { if (e.target.closest && e.target.closest('.swlLink')) { e.preventDefault(); return; } finish(); });
  window.addEventListener('keydown', onKey);
}

var loaded = false;
function go() { if (loaded) return; loaded = true; paintLogos(); begin(); if (qs.get('demo') !== '1') { gwLoadConfig(); gwAutoVisit(); } }

if (qs.get('demo') === '1') {
  D = demo(); LOGO_URL = ''; setTimeout(go, 400);
} else {
  var ctl = new AbortController(), to = setTimeout(function () { ctl.abort(); }, 20000);
  fetch(API + (API.indexOf('?') < 0 ? '?' : '&') + 'action=PUBLIC_MENU&clientId=' + encodeURIComponent(CID), { signal: ctl.signal })
    .then(function (r) { return r.json(); })
    .then(function (j) { clearTimeout(to); if (j && j.success && j.data) { D = j.data; D.info = D.info || {}; D.promo = D.promo || { video: {}, events: [] }; LOGO_URL = String(D.info.logoUrl || ''); } go(); })
    .catch(function () { D.info={name:'Welcome',address:'Connection unavailable. Refresh to load the restaurant menu.'};go(); });
  setTimeout(go, 21000);        /* slow network: never keep the guest waiting; defaults apply */
}
</script>
