<!-- ===== DSR toolbar fix: paste just before </body> in dsr-client.html ===== -->
<style id="bnx-dsr-actions-css">.bnx-dsr-actions{position:fixed!important;top:8px!important;right:16px!important;z-index:2147483000!important;display:flex!important;flex-direction:row!important;flex-wrap:nowrap!important;gap:6px!important;align-items:center!important;margin:0!important;padding:4px 6px!important;background:#fff!important;border-radius:9px!important;box-shadow:0 1px 8px rgba(0,0,0,.18)!important;width:auto!important;height:auto!important}.bnx-dsr-actions>*{position:static!important;width:auto!important;height:30px!important;margin:0!important;padding:0 11px!important;font-size:12px!important;line-height:1!important;white-space:nowrap!important;display:inline-flex!important;align-items:center!important;gap:6px!important;flex:0 0 auto!important}.bnx-dsr-actions svg,.bnx-dsr-actions i,.bnx-dsr-actions img{width:14px!important;height:14px!important;flex:0 0 14px!important;font-size:13px!important}</style>
<script id="bnx-dsr-actions-js">
(function(){
function group(d){
  var want={recalculate:1,print:1,excel:1,report:1,whatsapp:1},seen={},b=[];
  [].forEach.call(d.querySelectorAll('button,a,[role=button],input[type=button]'),function(x){
    var k=((x.textContent||x.value||'')).replace(/\s+/g,' ').trim().toLowerCase();
    if(!want[k])k=String(x.getAttribute('title')||x.getAttribute('aria-label')||'').trim().toLowerCase();
    if(want[k]&&!seen[k]){seen[k]=1;b.push(x);}
  });
  if(b.length<3)return false;
  var w=d.querySelector('.bnx-dsr-actions');
  if(w&&b.every(function(x){return w.contains(x);}))return true;
  if(!w){w=d.createElement('div');w.className='bnx-dsr-actions';d.body.appendChild(w);}
  b.forEach(function(x){w.appendChild(x);});
  try{d.body.style.setProperty('padding-top','46px','important');}catch(e){}
  try{console.log('[BNX DSR] toolbar buttons moved:',b.length);}catch(e){}
  return true;
}

function walk(d){
  if(!d||!d.body)return;
  group(d);
  [].forEach.call(d.querySelectorAll('iframe'),function(f){try{walk(f.contentDocument);}catch(e){}});
}
var tm;function run(){try{walk(document);}catch(e){}}
run();setTimeout(run,500);setTimeout(run,1800);setTimeout(run,5000);
if(window.MutationObserver)new MutationObserver(function(){clearTimeout(tm);tm=setTimeout(run,150);}).observe(document.body,{childList:true,subtree:true});
})();
</script>
