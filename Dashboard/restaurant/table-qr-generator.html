<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Table QR Generator — Balaji NextGen ERP</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=DM+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --gold:#d4a017;--gold-bg:rgba(212,160,23,.12);
  --bg:#f8f4ef;--surface:#fff;--surface2:#f2ede8;--border:rgba(0,0,0,.1);
  --text:#1a1816;--text2:#5a5450;--text3:#9a9490;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--text);padding:24px;}
.wrap{max-width:1100px;margin:0 auto;}
h1{font-size:20px;font-weight:800;margin-bottom:4px;}
.sub{font-size:13px;color:var(--text3);margin-bottom:22px;}
.setup{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:26px;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:14px;}
.field-group label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:6px;}
.field-group input,.field-group textarea{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;background:var(--surface2);outline:none;}
.field-group input:focus,.field-group textarea:focus{border-color:var(--gold);background:#fff;}
.field-group textarea{min-height:70px;resize:vertical;font-family:'DM Mono',monospace;font-size:13px;}
.hint{font-size:11.5px;color:var(--text3);margin-top:6px;line-height:1.5;}
.btn{border:none;border-radius:11px;padding:12px 22px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#c47000,#d4a017);color:#fff;}
.btn:active{transform:scale(.98);}
.btn-ghost{background:var(--surface2);color:var(--text2);margin-left:10px;}
.toolbar{display:flex;align-items:center;margin-bottom:16px;}
.toolbar .count{margin-left:auto;font-size:12.5px;color:var(--text3);}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px;}
.card{background:#fff;border:1.5px dashed var(--border);border-radius:16px;padding:20px;text-align:center;}
.card .rname{font-size:12px;font-weight:800;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;}
.card .tno{font-size:22px;font-weight:800;margin:6px 0 14px;}
.card .qr{display:flex;justify-content:center;margin-bottom:14px;}
.card .scan-txt{font-size:11px;color:var(--text3);font-weight:600;}
.card .url{font-size:9px;color:var(--text3);word-break:break-all;margin-top:8px;font-family:'DM Mono',monospace;}

@media print{
  body{padding:0;background:#fff;}
  .setup,.toolbar,h1,.sub{display:none;}
  .grid{grid-template-columns:repeat(3,1fr);gap:14px;}
  .card{border:1.5px dashed #999;break-inside:avoid;page-break-inside:avoid;}
  .url{display:none;}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>Table QR Generator</h1>
  <div class="sub">Creates one scannable code per table, linking straight to your customer self-order page.</div>

  <div class="setup">
    <div class="row">
      <div class="field-group">
        <label>Restaurant name (shown on the printed card)</label>
        <input id="cfg-name" type="text" placeholder="e.g. Balaji Kitchen &amp; Bar" value="Our Restaurant">
      </div>
      <div class="field-group">
        <label>Client ID</label>
        <input id="cfg-client" type="text" placeholder="e.g. CLI001">
      </div>
    </div>
    <div class="row">
      <div class="field-group">
        <label>Order page URL (where you host customer-order-app.html)</label>
        <input id="cfg-url" type="text" placeholder="https://yourdomain.com/customer-order-app.html">
        <div class="hint">This is the file you deploy publicly — customers reach it by scanning the code, no app or login needed.</div>
      </div>
      <div class="field-group">
        <label>Table IDs (comma or line separated)</label>
        <textarea id="cfg-tables" placeholder="B1, B2, B3, FL1, FL2, RT1">B1, B2, B3, B4, FL1, FL2</textarea>
      </div>
    </div>
    <button class="btn" onclick="renderCards()">Generate QR codes</button>
    <button class="btn btn-ghost" onclick="window.print()">Print</button>
  </div>

  <div class="toolbar"><div class="count" id="qr-count"></div></div>
  <div class="grid" id="qr-grid"></div>
</div>

<script>
function renderCards(){
  const name = document.getElementById('cfg-name').value.trim() || 'Our Restaurant';
  const client = document.getElementById('cfg-client').value.trim();
  const baseUrl = document.getElementById('cfg-url').value.trim();
  const tables = document.getElementById('cfg-tables').value
    .split(/[\n,]/).map(t=>t.trim()).filter(Boolean);

  const grid = document.getElementById('qr-grid');
  grid.innerHTML = '';
  document.getElementById('qr-count').textContent = tables.length ? (tables.length+' table QR codes') : '';

  if (!baseUrl){
    grid.innerHTML = '<div class="hint" style="grid-column:1/-1;">Enter the order page URL above, then Generate.</div>';
    return;
  }

  tables.forEach(tableId=>{
    const link = baseUrl + (baseUrl.includes('?') ? '&' : '?') + 'client=' + encodeURIComponent(client) + '&table=' + encodeURIComponent(tableId);

    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <div class="rname">${name}</div>
      <div class="tno">Table ${tableId}</div>
      <div class="qr" id="qr-${CSS.escape(tableId)}"></div>
      <div class="scan-txt">Scan to view menu &amp; order</div>
      <div class="url">${link}</div>
    `;
    grid.appendChild(card);

    new QRCode(document.getElementById('qr-'+CSS.escape(tableId)), {
      text: link,
      width: 140,
      height: 140,
      colorDark: '#1a1816',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M,
    });
  });
}
renderCards();
</script>
</body>
</html>
