<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hashtag Brewpub — Table Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#171310; --panel:#1f1a15; --panel2:#241d17; --line:#3a2f24;
    --wood:#b9713a; --wood-deep:#8a4e24; --cream:#f2e6d3;
    --text:#f2e6d3; --text2:#c9b79f; --text3:#8f7d68;
    --ok:#4caf6f; --ok-bg:#183424; --resv:#e0a84a; --resv-bg:#3a2c14;
    --occ:#e0574a; --occ-bg:#3a1a16; --clean:#5a8fd6; --clean-bg:#182234;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(ellipse at top,#211a14,#141110 70%);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;}
  header{padding:22px 28px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--wood),var(--wood-deep));display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#1a1410;}
  .brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.3px;}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--text3);}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text2);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  main{max-width:1280px;margin:0 auto;padding:22px 24px 60px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .toolbar .stats{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12px;color:var(--text2);}
  .stat b{color:var(--cream);font-size:15px;display:block;}
  .datebar{display:flex;gap:8px;align-items:center;font-size:12px;}
  .datebar input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:12px;}

  .floor{
    display:grid;gap:14px;
    grid-template-columns:repeat(12,1fr);
    grid-template-areas:
      "dj   dj   dj   dj   brew brew brew brew kit  kit  kit  kit"
      "sit  sit  sit  sit  arch arch arch arch kit  kit  kit  kit"
      "sit  sit  sit  sit  pass pass hook snug kit  kit  kit  kit"
      "fam  fam  fam  fam  lounge lounge lounge lounge bar bar bar bar";
  }
  .zone{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;}
  .zone h3{margin:0 0 3px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--wood);}
  .zone .sub{font-size:11px;color:var(--text3);margin-bottom:10px;}
  .grid-tables{display:flex;flex-wrap:wrap;gap:8px;}

  .z-dj{grid-area:dj;} .z-brew{grid-area:brew;} .z-kit{grid-area:kit;display:flex;align-items:center;justify-content:center;background:repeating-linear-gradient(45deg,#241d17,#241d17 10px,#241009 10px,#241009 20px);border-style:dashed;}
  .z-kit span{color:var(--text3);font-size:12px;letter-spacing:.15em;text-transform:uppercase;transform:rotate(-90deg);white-space:nowrap;}
  .z-sit{grid-area:sit;} .z-arch{grid-area:arch;} .z-pass{grid-area:pass;} .z-hook{grid-area:hook;} .z-snug{grid-area:snug;}
  .z-fam{grid-area:fam;} .z-lounge{grid-area:lounge;} .z-bar{grid-area:bar;}

  .tbl{
    min-width:52px;height:52px;border-radius:10px;border:1px solid transparent;
    background:var(--ok-bg);color:var(--ok);display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;font-size:12px;font-weight:700;transition:transform .12s ease;position:relative;padding:2px 4px;
  }
  .tbl small{font-weight:500;font-size:9px;opacity:.85;}
  .tbl:hover{transform:translateY(-2px);}
  .tbl.available{background:var(--ok-bg);color:var(--ok);border-color:#2c5c3d;}
  .tbl.reserved{background:var(--resv-bg);color:var(--resv);border-color:#5c4620;}
  .tbl.occupied{background:var(--occ-bg);color:var(--occ);border-color:#5c2a22;}
  .tbl.cleaning{background:var(--clean-bg);color:var(--clean);border-color:#2c3f5c;}
  .tbl.selected{outline:2px solid var(--cream);}

  /* Drawer */
  .overlay{position:fixed;inset:0;background:rgba(10,8,6,.6);display:none;align-items:center;justify-content:flex-end;z-index:50;}
  .overlay.open{display:flex;}
  .drawer{width:380px;max-width:92vw;height:100%;background:var(--panel2);border-left:1px solid var(--line);padding:24px;overflow-y:auto;}
  .drawer h2{margin:0 0 2px;font-size:20px;}
  .drawer .cap{color:var(--text3);font-size:12px;margin-bottom:18px;}
  .drawer label{display:block;font-size:11px;color:var(--text3);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em;}
  .drawer input,.drawer select,.drawer textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;}
  .drawer textarea{resize:vertical;min-height:60px;}
  .btnrow{display:flex;gap:10px;margin-top:20px;}
  .btn{flex:1;padding:12px;border-radius:9px;border:none;font-weight:700;font-size:13px;cursor:pointer;}
  .btn.primary{background:linear-gradient(135deg,var(--wood),var(--wood-deep));color:#1a1410;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text2);}
  .closeX{position:absolute;top:18px;right:18px;background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;}
  .status-pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:14px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ok-bg);color:var(--ok);border:1px solid #2c5c3d;padding:12px 22px;border-radius:10px;font-size:13px;font-weight:600;display:none;z-index:60;}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">B</div>
    <div><h1>Hashtag Brewpub</h1><p>2nd Mile Sevoke Road, Siliguri · CL00010</p></div>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:var(--ok)"></i>Available</span>
    <span><i class="dot" style="background:var(--resv)"></i>Reserved</span>
    <span><i class="dot" style="background:var(--occ)"></i>Occupied</span>
    <span><i class="dot" style="background:var(--clean)"></i>Cleaning</span>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="stats" id="stats"></div>
    <div class="datebar">
      <label style="color:var(--text3)">Date</label>
      <input type="date" id="resDate">
      <label style="color:var(--text3)">Time</label>
      <input type="time" id="resTime" value="19:30">
    </div>
  </div>

  <div class="floor" id="floor"></div>
</main>

<div class="overlay" id="overlay">
  <div class="drawer">
    <button class="closeX" onclick="closeDrawer()">✕</button>
    <h2 id="dTitle">Table</h2>
    <div class="cap" id="dCap"></div>
    <span class="status-pill" id="dStatus"></span>

    <div id="orderBlock">
      <label>Waiter / Captain</label>
      <input id="fWaiter" placeholder="Assign captain">
      <label>Covers</label>
      <input id="fCovers" type="number" min="1" value="2">
      <div class="btnrow">
        <button class="btn primary" onclick="startOrder()">Start Order (POS)</button>
      </div>
    </div>

    <div id="reserveBlock">
      <label>Guest Name</label>
      <input id="fName" placeholder="Guest name">
      <label>Phone</label>
      <input id="fPhone" placeholder="10-digit mobile">
      <label>Covers</label>
      <input id="fCovers2" type="number" min="1" value="2">
      <label>Notes</label>
      <textarea id="fNotes" placeholder="Occasion, seating preference, allergies..."></textarea>
      <div class="btnrow">
        <button class="btn primary" onclick="reserveTable()">Confirm Reservation</button>
        <button class="btn ghost" onclick="closeDrawer()">Cancel</button>
      </div>
    </div>

    <div id="freeUpBlock" style="display:none">
      <div class="btnrow">
        <button class="btn primary" onclick="markAvailable()">Mark Available</button>
        <button class="btn ghost" onclick="closeDrawer()">Close</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Real table data pulled from CL00010_V3_DATABASE.xlsx → TABLE_MASTER
const ZONES = [
  {key:'dj',   cls:'z-dj',    label:'Live Show & DJ Area', tables:[['DJ1',4],['DJ2',4],['DJ3',4],['DJ4',4]]},
  {key:'brew', cls:'z-brew',  label:'Brew Pub', tables:[['BP-RT1',4],['BP-RT2',4]]},
  {key:'kit',  cls:'z-kit',   label:'', tables:[]},
  {key:'sit',  cls:'z-sit',   label:'Sitting Space (Round Table)', tables:[['ST1',4],['ST2',4],['ST3',4],['ST4',4],['ST5',4],['ST6',4],['ST7',4],['ST8',4]]},
  {key:'arch', cls:'z-arch',  label:'Feature Arch — Curved Bench', tables:[['CB1',6],['CB2',6]]},
  {key:'pass', cls:'z-pass',  label:'Passage Bench Seating', tables:[['BN1',6],['BN2',6]]},
  {key:'hook', cls:'z-hook',  label:'Hookah Station', tables:[['HK1',4]]},
  {key:'snug', cls:'z-snug',  label:'Snug', tables:[['SN1',2],['SN2',2],['SN3',2]]},
  {key:'fam',  cls:'z-fam',   label:'Family Section', tables:[['FL1',2],['FL2',2],['FL3',2],['FL4',2],['FL5',2],['FL6',2],['FL7',2],['FL8',2],['FL9',2],['FR1',2],['FR2',2],['FR3',2],['FR4',2],['FR5',2],['FR6',2],['FR7',2],['FR8',2],['FR9',2]]},
  {key:'lounge',cls:'z-lounge',label:'Lounge', tables:[['RD1',4],['RD2',4],['RD3',4],['RD4',4],['RDL1',6],['RDL2',6],['RDL3',6],['RDL4',6],['RDL5',6],['RDL6',6],['RDL7',6],['RDL8',6],['RDL9',6]]},
  {key:'bar',  cls:'z-bar',   label:'Bar', tables:[['B1',2],['B2',2],['B3',2],['B4',2],['SW1',6]]},
];

const STATUSES = ['available','available','available','available','reserved','occupied','available','cleaning'];
let state = {};
ZONES.forEach(z=>z.tables.forEach(([id],i)=>{
  state[id] = STATUSES[(id.length+i) % STATUSES.length];
}));
let active = null;

function renderFloor(){
  const f = document.getElementById('floor');
  f.innerHTML = ZONES.map(z=>{
    if(z.key==='kit') return `<div class="zone ${z.cls}"><span>Kitchen · 5415×12170</span></div>`;
    return `<div class="zone ${z.cls}">
      <h3>${z.label}</h3>
      <div class="sub">${z.tables.length} table${z.tables.length!==1?'s':''}</div>
      <div class="grid-tables">
        ${z.tables.map(([id,cap])=>`<div class="tbl ${state[id]}" data-id="${id}" data-cap="${cap}" onclick="openTable('${id}',${cap})">${id}<small>${cap}p</small></div>`).join('')}
      </div>
    </div>`;
  }).join('');
  renderStats();
}

function renderStats(){
  const all = Object.values(state);
  const c = s=>all.filter(x=>x===s).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${all.length}</b>Total Tables</div>
    <div class="stat" style="color:var(--ok)"><b>${c('available')}</b>Available</div>
    <div class="stat" style="color:var(--resv)"><b>${c('reserved')}</b>Reserved</div>
    <div class="stat" style="color:var(--occ)"><b>${c('occupied')}</b>Occupied</div>
    <div class="stat" style="color:var(--clean)"><b>${c('cleaning')}</b>Cleaning</div>`;
}

function openTable(id,cap){
  active = id;
  document.getElementById('dTitle').textContent = id;
  document.getElementById('dCap').textContent = cap+' pax capacity';
  const st = state[id];
  const pill = document.getElementById('dStatus');
  pill.textContent = st.toUpperCase();
  pill.style.background = {available:'var(--ok-bg)',reserved:'var(--resv-bg)',occupied:'var(--occ-bg)',cleaning:'var(--clean-bg)'}[st];
  pill.style.color = {available:'var(--ok)',reserved:'var(--resv)',occupied:'var(--occ)',cleaning:'var(--clean)'}[st];

  document.getElementById('orderBlock').style.display = st==='available' ? 'block':'none';
  document.getElementById('reserveBlock').style.display = st==='available' ? 'block':'none';
  document.getElementById('freeUpBlock').style.display = st!=='available' ? 'block':'none';

  document.getElementById('overlay').classList.add('open');
}
function closeDrawer(){ document.getElementById('overlay').classList.remove('open'); active=null; }

function startOrder(){
  if(!active) return;
  state[active]='occupied';
  renderFloor(); closeDrawer();
  showToast('🍽️ Order started for '+active);
}
function reserveTable(){
  if(!active) return;
  const name = document.getElementById('fName').value || 'Guest';
  state[active]='reserved';
  renderFloor(); closeDrawer();
  showToast('📅 '+active+' reserved for '+name+' · '+(document.getElementById('resDate').value||'today')+' '+document.getElementById('resTime').value);
}
function markAvailable(){
  if(!active) return;
  state[active]='available';
  renderFloor(); closeDrawer();
  showToast('✅ '+active+' marked available');
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  setTimeout(()=>t.style.display='none', 2400);
}

document.getElementById('resDate').valueAsDate = new Date();
renderFloor();
</script>
</body>
</html>
