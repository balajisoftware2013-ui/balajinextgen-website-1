<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Balaji NextGen ERP — Menu Item Import</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --ac:#F97316;--ac-l:#FFF7ED;--ac-d:#C2410C;
  --bg:#FFFBF5;--card:#fff;--text:#111827;--sub:#4B5563;--muted:#9CA3AF;
  --border:#FED7AA;--border2:#FDBA74;
  --green:#059669;--gl:#ECFDF5;--red:#DC2626;--rl:#FEF2F2;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);}
.wrap{max-width:900px;margin:0 auto;padding:24px 16px 60px;}
h1{font-size:20px;margin:0 0 4px;color:var(--ac-d);}
.sub{color:var(--sub);font-size:13px;margin:0 0 20px;}
.card{background:var(--card);border:1.5px solid var(--border);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 8px rgba(0,0,0,.05);}
.drop{border:2px dashed var(--border2);border-radius:10px;padding:32px 16px;text-align:center;cursor:pointer;transition:.15s;background:var(--ac-l);}
.drop:hover,.drop.drag{border-color:var(--ac);background:#FFF1E0;}
.drop input{display:none;}
.drop-icon{font-size:34px;margin-bottom:8px;}
.drop-txt{font-size:14px;font-weight:600;color:var(--text);}
.drop-sub{font-size:11.5px;color:var(--muted);margin-top:4px;}
.btn{border:none;border-radius:8px;padding:9px 16px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;}
.btn-primary{background:var(--ac);color:#fff;}
.btn-primary:hover{background:var(--ac-d);}
.btn-primary:disabled{background:var(--muted);cursor:not-allowed;}
.btn-outline{background:#fff;border:1.5px solid var(--border2);color:var(--ac-d);}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:14px;}
th{background:var(--ac-l);color:var(--ac-d);font-weight:700;text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--border);white-space:nowrap;}
td{padding:7px 10px;border-bottom:1px solid var(--border);}
tr.row-error td{background:var(--rl);}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:700;}
.badge.ok{background:var(--gl);color:var(--green);}
.badge.err{background:var(--rl);color:var(--red);}
.errmsg{color:var(--red);font-size:11px;margin-top:2px;}
.summary{display:flex;gap:14px;margin:14px 0;flex-wrap:wrap;}
.stat{flex:1;min-width:120px;background:var(--ac-l);border:1px solid var(--border);border-radius:8px;padding:10px 14px;}
.stat b{display:block;font-size:20px;color:var(--ac-d);}
.stat span{font-size:11px;color:var(--sub);}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 20px;border-radius:100px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:.25s;pointer-events:none;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-6px);}
@media(max-width:600px){
  table{display:block;overflow-x:auto;}
  .card{padding:14px;}
}
</style>
</head>
<body>
<div class="wrap">
  <h1>🍹 Menu Item Import</h1>
  <p class="sub">Upload a filled-in Cocktail &amp; Mocktail Menu template to add items in bulk.</p>

  <div class="card">
    <label class="drop" id="dropZone">
      <input type="file" id="fileInput" accept=".xlsx,.xls">
      <div class="drop-icon">📥</div>
      <div class="drop-txt">Click to choose a file, or drag it here</div>
      <div class="drop-sub">.xlsx or .xls — use the downloaded template's "Menu Items" tab</div>
    </label>
  </div>

  <div id="previewCard" class="card" style="display:none;">
    <div class="summary" id="summary"></div>
    <div style="overflow-x:auto;">
      <table id="previewTable"></table>
    </div>
    <div style="margin-top:16px;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn btn-primary" id="importBtn" onclick="doImport()">⬆ Import Valid Rows</button>
      <button class="btn btn-outline" onclick="resetImport()">Choose Different File</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── Backend connection — matches this suite's existing erpApi() convention ──
const CID = (function(){
  try{
    const u = JSON.parse(localStorage.getItem('ERP_USER')||sessionStorage.getItem('ERP_USER')||'{}');
    return u.CLIENT_ID || u.clientId || localStorage.getItem('ERP_CLIENT') || '';
  }catch(e){ return ''; }
})();
const SCRIPT_URL = localStorage.getItem('BNJERP_script_url') || 'https://script.google.com/macros/s/AKfycbz39r1zo4LGqHJXpwDsQFulHdp3qsjiLRxRiSIEBBObI_3310_n2izF_gAjofaIHgSJ/exec';
async function erpApi(action, payload){
  if(!CID){ return { success:false, message:'No client session found — please log in again.' }; }
  try{
    const r = await fetch(SCRIPT_URL, { method:'POST', body: JSON.stringify(Object.assign({ action, clientId:CID }, payload)) });
    return await r.json();
  }catch(e){
    return { success:false, message:'Could not reach the server — ' + (e.message||'') };
  }
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

const EXPECTED_HEADERS = ['Item Name*','Category*','Sub-Category*','Unit','Cost Price (₹)','Sale Price (₹)*','Tax Rate (%)','Is Alcoholic?','Status'];

let parsedRows = []; // { name, category, subCategory, unit, cost, sale, tax, isBar, status, errors:[] }

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
['dragover','dragenter'].forEach(ev => dropZone.addEventListener(ev, e=>{ e.preventDefault(); dropZone.classList.add('drag'); }));
['dragleave','drop'].forEach(ev => dropZone.addEventListener(ev, e=>{ e.preventDefault(); dropZone.classList.remove('drag'); }));
dropZone.addEventListener('drop', e=>{ if(e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', e=>{ if(e.target.files.length) handleFile(e.target.files[0]); });

function handleFile(file){
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const wb = XLSX.read(e.target.result, { type:'array' });
      const sheetName = wb.SheetNames.includes('Menu Items') ? 'Menu Items' : wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:'' });
      parseRows(rows);
    }catch(err){
      toast('Could not read this file — is it a valid Excel file?');
    }
  };
  reader.readAsArrayBuffer(file);
}

function parseRows(rows){
  if(!rows.length){ toast('That sheet looks empty.'); return; }
  const header = rows[0].map(h => String(h||'').trim());
  const dataRows = rows.slice(1).filter(r => r.some(c => String(c||'').trim() !== ''));

  parsedRows = dataRows.map(r => {
    const get = (label) => {
      const idx = header.indexOf(label);
      return idx === -1 ? '' : String(r[idx] === undefined ? '' : r[idx]).trim();
    };
    const name = get('Item Name*');
    const category = get('Category*') || 'Beverage';
    const subCategory = get('Sub-Category*');
    const unit = get('Unit') || 'Glass';
    const cost = get('Cost Price (₹)');
    const sale = get('Sale Price (₹)*');
    const tax = get('Tax Rate (%)');
    const isBar = get('Is Alcoholic?');
    const status = get('Status') || 'Active';

    const errors = [];
    if(!name) errors.push('Item Name is required');
    if(!subCategory || !['Cocktail','Mocktail'].includes(subCategory)) errors.push('Sub-Category must be Cocktail or Mocktail');
    if(!sale || isNaN(Number(sale)) || Number(sale) <= 0) errors.push('Sale Price must be a number greater than 0');
    if(isBar && !['Yes','No'].includes(isBar)) errors.push('Is Alcoholic? must be Yes or No');
    if(!isBar) errors.push('Is Alcoholic? is required (Yes/No)');

    return {
      name, category, subCategory, unit,
      cost: Number(cost)||0, sale: Number(sale)||0, tax: Number(tax)||0,
      isBar: isBar === 'Yes', status: status || 'Active',
      errors
    };
  });

  renderPreview();
}

function renderPreview(){
  document.getElementById('previewCard').style.display = 'block';
  const valid = parsedRows.filter(r => r.errors.length === 0);
  const invalid = parsedRows.filter(r => r.errors.length > 0);

  document.getElementById('summary').innerHTML = `
    <div class="stat"><b>${parsedRows.length}</b><span>Rows found</span></div>
    <div class="stat"><b style="color:var(--green)">${valid.length}</b><span>Ready to import</span></div>
    <div class="stat"><b style="color:var(--red)">${invalid.length}</b><span>Need fixing</span></div>
  `;

  const tbl = document.getElementById('previewTable');
  tbl.innerHTML = `<tr><th>Item Name</th><th>Sub-Category</th><th>Unit</th><th>Sale Price</th><th>Alcoholic?</th><th>Status</th></tr>` +
    parsedRows.map(r => `
      <tr class="${r.errors.length ? 'row-error' : ''}">
        <td>${r.name || '<em style="color:var(--muted)">blank</em>'}${r.errors.length ? `<div class="errmsg">${r.errors.join('; ')}</div>` : ''}</td>
        <td>${r.subCategory||'—'}</td>
        <td>${r.unit}</td>
        <td>₹${r.sale}</td>
        <td>${r.isBar ? 'Yes' : 'No'}</td>
        <td>${r.errors.length ? '<span class="badge err">Fix required</span>' : '<span class="badge ok">Ready</span>'}</td>
      </tr>`).join('');

  document.getElementById('importBtn').disabled = valid.length === 0;
  document.getElementById('importBtn').textContent = `⬆ Import ${valid.length} Valid Row${valid.length===1?'':'s'}`;
}

async function doImport(){
  const valid = parsedRows.filter(r => r.errors.length === 0);
  if(!valid.length) return;
  const btn = document.getElementById('importBtn');
  btn.disabled = true; btn.textContent = 'Importing…';

  const res = await erpApi('IMPORT_MENU_ITEMS', { items: valid.map(r => ({
    name: r.name, category: r.category, subCategory: r.subCategory, unit: r.unit,
    costPrice: r.cost, salePrice: r.sale, taxRate: r.tax, isBar: r.isBar, status: r.status,
  })) });

  if(res && res.success){
    toast(`✅ Imported ${res.data.imported} item(s)` + (res.data.skipped ? `, skipped ${res.data.skipped} already in menu` : ''));
    btn.textContent = '✓ Imported';
  } else {
    toast('⚠ Import failed — ' + (res && res.message ? res.message : 'server unreachable'));
    btn.disabled = false;
    btn.textContent = `⬆ Import ${valid.length} Valid Row${valid.length===1?'':'s'}`;
  }
}

function resetImport(){
  parsedRows = [];
  fileInput.value = '';
  document.getElementById('previewCard').style.display = 'none';
}
</script>
</body>
</html>
