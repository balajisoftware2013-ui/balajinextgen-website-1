# Builds the HappyServe Printer app (APK) on GitHub — nothing to install on your PC.
# Push this folder as its own GitHub repository → Actions tab → "Build APK" → open the run → download "HappyServe-Printer-APK".
name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build
        run: gradle --no-daemon assembleRelease
      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk HappyServe-Printer.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HappyServe-Printer-APK
          path: HappyServe-Printer.apk
      - name: Publish as a release (download link without login to Actions)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-build${{ github.run_number }}
          name: HappyServe Printer build ${{ github.run_number }}
          files: HappyServe-Printer.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
permissions:
  contents: write
