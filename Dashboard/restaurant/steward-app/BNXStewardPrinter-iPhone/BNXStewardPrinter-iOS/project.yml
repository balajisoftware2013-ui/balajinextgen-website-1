name: BNXStewardPrinter
options:
  bundleIdPrefix: com.balajinextgen
  deploymentTarget:
    iOS: "15.0"
targets:
  BNXStewardPrinter:
    type: application
    platform: iOS
    sources: [BNXStewardPrinter]
    info:
      path: BNXStewardPrinter/Info.plist
      properties:
        CFBundleDisplayName: BNX Steward Printer
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Needed to send kitchen, bar and bill tickets to the printers on your Wi-Fi.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.balajinextgen.stewardprinter
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
