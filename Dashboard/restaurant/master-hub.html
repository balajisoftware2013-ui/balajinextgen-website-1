<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Master Hub — Balaji NextGen ERP</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --accent:#c2590a;--accent2:#b45309;--accent-lt:rgba(194,89,10,.1);
  --green:#15803d;--green-lt:#f0fdf4;--blue:#1d4ed8;--blue-lt:#eff4ff;
  --red:#b91c1c;--red-lt:#fef2f2;--yellow:#d97706;--yellow-lt:#fffbeb;
  --purple:#7c3aed;--purple-lt:#f4effe;
  --bg:#faf8f5;--bg2:#f2ede5;--surface:#fff;--surface2:#f7f4ef;
  --border:#e8e0d4;--border2:#d4c8b8;--text:#1c1208;--text2:#44310f;--muted:#9c8a72;
  --shadow:0 1px 4px rgba(28,18,8,.07),0 4px 16px rgba(28,18,8,.05);
  --shadow-md:0 6px 28px rgba(28,18,8,.10);
  --r:12px;--r-sm:8px;--sidebar-w:250px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;font-size:14px;}
.sidebar{width:var(--sidebar-w);min-height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:200;overflow-y:auto;}
.brand{padding:16px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;}
.brand-logo{width:40px;height:40px;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:grid;place-items:center;font-size:17px;box-shadow:0 4px 14px rgba(194,89,10,.28);}
.brand-name{font-size:14px;font-weight:800;color:var(--accent);line-height:1.15;}
.brand-sub{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1.4px;}
.nav{padding:8px;flex:1;}
.nav-link{display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:8px;text-decoration:none;color:var(--text2);font-size:12.5px;font-weight:500;transition:all .15s;margin-bottom:1px;position:relative;cursor:pointer;}
.nav-link:hover{background:var(--surface2);color:var(--text);}
.nav-link.active{background:var(--accent-lt);color:var(--accent);font-weight:700;}
.nav-link.active::before{content:'';position:absolute;left:0;top:22%;bottom:22%;width:3px;background:var(--accent);border-radius:0 3px 3px 0;}
.ni{font-size:13px;width:16px;text-align:center;flex-shrink:0;}
.badge-count{margin-left:auto;font-size:9.5px;font-weight:700;padding:1px 6px;border-radius:20px;background:var(--bg2);color:var(--muted);}
.nav-link.active .badge-count{background:var(--accent);color:#fff;}
.main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh;}
.topbar{padding:12px 22px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:100;flex-wrap:wrap;}
.page-title{font-size:17px;font-weight:800;}
.page-title span{color:var(--accent);}
.page-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}
.tb-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tb-btn{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r-sm);padding:8px 14px;font-size:12px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;gap:6px;transition:.15s;}
.tb-btn:hover{background:var(--border);}
.tb-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);}
.tb-btn.primary:hover{background:var(--accent2);}
.tb-btn.upload{background:var(--blue-lt);color:var(--blue);border-color:rgba(29,78,216,.2);}
.content{padding:22px;flex:1;}
/* ── Hero banner ── */
.hero{position:relative;margin:0 22px 20px;border-radius:18px;overflow:hidden;
  background:linear-gradient(115deg,#fdf6ea 0%,#fce4c4 38%,#f3a552 78%,#e8871e 100%);
  padding:30px 32px 26px;color:var(--text);box-shadow:0 8px 26px rgba(194,89,10,.16);
  border:1px solid rgba(194,89,10,.12);}
.hero::before{content:'';position:absolute;inset:0;opacity:.5;
  background-image:radial-gradient(circle at 14% 22%,#fff 0,transparent 40%),
    radial-gradient(circle at 88% 80%,#fff 0,transparent 36%);}
.hero-scallop{position:absolute;left:0;right:0;bottom:-1px;height:16px;
  background:radial-gradient(circle at 8px 0,transparent 8px,var(--bg) 8.5px) 0 0/16px 16px repeat-x;}
.hero-eyebrow{font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;
  letter-spacing:2.2px;text-transform:uppercase;color:var(--accent2);position:relative;}
.hero-title{font-family:'Playfair Display',serif;font-size:30px;font-weight:800;
  line-height:1.12;margin:8px 0 6px;position:relative;letter-spacing:.2px;color:#3a1f06;}
.hero-sub{font-size:12.5px;color:var(--text2);max-width:520px;line-height:1.55;position:relative;}
.hero-stats{display:flex;gap:22px;margin-top:18px;position:relative;flex-wrap:wrap;}
.hero-stat{background:rgba(255,255,255,.55);border:1px solid rgba(194,89,10,.18);
  border-radius:10px;padding:8px 14px;backdrop-filter:blur(2px);}
.hero-stat b{font-family:'JetBrains Mono',monospace;font-size:15px;display:block;color:var(--accent2);}
.hero-stat span{font-size:9.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;}
.card-hdr{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;}
.card-hdr h3{font-size:13.5px;font-weight:700;}
.card-body{padding:0;}
table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{background:var(--surface2);text-align:left;padding:10px 14px;font-weight:700;color:var(--text2);font-size:11px;text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--border);}
td{padding:10px 14px;border-bottom:1px solid var(--border);color:var(--text2);}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--surface2);}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700;}
.pill.yes{background:var(--green-lt);color:var(--green);}
.pill.no{background:var(--red-lt);color:var(--red);}
.row-actions{display:flex;gap:6px;}
.icon-btn{width:26px;height:26px;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:var(--text2);}
.icon-btn:hover{background:var(--bg2);}
.icon-btn.del:hover{background:var(--red-lt);color:var(--red);border-color:rgba(185,28,28,.25);}
.empty{padding:50px 20px;text-align:center;color:var(--muted);}
.empty .big{font-size:28px;margin-bottom:8px;}
/* Permission panel */
.perm-grid{display:grid;grid-template-columns:1fr auto;gap:0;}
.perm-row{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border);}
.perm-row:last-child{border-bottom:none;}
.perm-label{font-size:12.5px;color:var(--text2);font-weight:500;}
.perm-desc{font-size:11px;color:var(--muted);margin-top:2px;}
.toggle{position:relative;width:44px;height:24px;border-radius:14px;background:var(--border2);cursor:pointer;transition:.2s;flex-shrink:0;}
.toggle.on{background:var(--green);}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2);}
.toggle.on::after{left:23px;}
.toggle-label{font-size:10px;font-weight:700;margin-left:8px;width:26px;text-align:left;}
.toggle-label.yes{color:var(--green);}
.toggle-label.no{color:var(--red);}
/* Modal */
.overlay{position:fixed;inset:0;background:rgba(28,18,8,.45);display:none;align-items:center;justify-content:center;z-index:500;padding:20px;}
.overlay.show{display:flex;}
.modal{background:var(--surface);border-radius:var(--r);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;box-shadow:var(--shadow-md);}
.modal-hdr{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.modal-hdr h3{font-size:14.5px;font-weight:700;}
.modal-close{width:28px;height:28px;border-radius:8px;border:none;background:var(--bg2);cursor:pointer;font-size:14px;}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:12px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--text2);margin-bottom:5px;}
.field input,.field select{width:100%;padding:9px 11px;border:1px solid var(--border2);border-radius:var(--r-sm);font-family:inherit;font-size:12.5px;background:var(--surface);color:var(--text);}
.field input:focus,.field select:focus{outline:none;border-color:var(--accent);}
.modal-ftr{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;}
.link-out{padding:40px 20px;text-align:center;}
.link-out a{display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#fff;padding:11px 22px;border-radius:var(--r-sm);text-decoration:none;font-weight:700;font-size:13px;}
.toast{position:fixed;bottom:20px;right:20px;background:var(--text);color:#fff;padding:12px 18px;border-radius:var(--r-sm);font-size:12.5px;font-weight:600;box-shadow:var(--shadow-md);z-index:900;display:none;}
.toast.show{display:block;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px;}
.hamburger{display:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--border);
  background:var(--surface);cursor:pointer;font-size:16px;align-items:center;justify-content:center;
  flex-shrink:0;}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(28,18,8,.4);z-index:190;}
.sidebar-backdrop.show{display:block;}
@media(max-width:860px){
  .hamburger{display:flex;}
  .sidebar{transform:translateX(-100%);transition:transform .22s ease;width:270px;}
  .sidebar.open{transform:translateX(0);box-shadow:0 0 30px rgba(0,0,0,.25);}
  .main{margin-left:0;}
  .hero{margin:0 14px 16px;padding:22px 20px 20px;}
  .hero-title{font-size:22px;}
  .hero-stats{gap:10px;}
  .hero-stat{padding:7px 11px;flex:1;min-width:90px;}
  .content{padding:14px;}
  .topbar{padding:10px 14px;}
  .tb-right{width:100%;}
  .tb-btn{flex:1;justify-content:center;padding:10px 10px;font-size:12.5px;}
  .card-hdr{padding:12px 14px;}
  /* Table → stacked cards on small screens */
  table thead{display:none;}
  table, table tbody, table tr, table td{display:block;width:100%;}
  table tr{border-bottom:8px solid var(--bg);padding:10px 14px;}
  table td{border:none;padding:6px 0;display:flex;justify-content:space-between;gap:10px;font-size:12.5px;}
  table td::before{content:attr(data-label);font-weight:700;color:var(--muted);font-size:10.5px;
    text-transform:uppercase;letter-spacing:.4px;flex-shrink:0;}
  table td.row-actions{justify-content:flex-end;gap:10px;}
  table td.row-actions::before{content:none;}
  .icon-btn{width:34px;height:34px;font-size:14px;}
  .modal{max-width:100%;margin:0 8px;}
  .toggle{width:48px;height:27px;}
  .toggle::after{width:21px;height:21px;}
  .toggle.on::after{left:24px;}
}
</style>
</head>
<body>

<div class="sidebar-backdrop" id="sidebarBackdrop" onclick="closeSidebar()"></div>

<div class="sidebar" id="sidebarEl">
  <div class="brand">
    <div class="brand-logo">🍽️</div>
    <div>
      <div class="brand-name">Master Hub</div>
      <div class="brand-sub">Balaji NextGen ERP</div>
    </div>
  </div>
  <div class="nav" id="navList"></div>
</div>

<div class="main">
  <div class="topbar">
    <button class="hamburger" onclick="openSidebar()">☰</button>
    <button class="tb-btn" onclick="backToDashboard()" style="flex-shrink:0;">← Dashboard</button>
    <div>
      <div class="page-title" id="pageTitle">—</div>
      <div class="page-sub" id="pageSub">—</div>
    </div>
    <div class="tb-right" id="topbarActions"></div>
  </div>
  <div class="hero" id="heroBanner">
    <div class="hero-eyebrow">Balaji NextGen ERP · Restaurant Suite · <span id="industryTag"></span></div>
    <div class="hero-title">Every master record, one place.</div>
    <div class="hero-sub">Menu, recipes, staff, suppliers and floor layout — kept in sync across POS, KOT and Reports the moment you save here.</div>
    <div class="hero-stats" id="heroStats"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;">
      <button class="tb-btn" style="background:#fff;" onclick="downloadAllMasterTemplates()">⬇ Download Complete Master Setup Template (one sheet, every category)</button>
      <button class="tb-btn" style="background:#fff;" onclick="document.getElementById('masterSetupFileInput').click()">⬆ Upload Filled Master Setup</button>
    </div>
    <input type="file" id="masterSetupFileInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleMasterSetupUpload(event)">
    <div class="hero-scallop"></div>
  </div>
  <div class="content" id="content"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-hdr">
      <h3 id="modalTitle">Add record</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-ftr">
      <button class="tb-btn" onclick="closeModal()">Cancel</button>
      <button class="tb-btn primary" onclick="saveRecord()">Save</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept=".xlsx,.xls,.csv" style="display:none" onchange="handleUpload(event)">
<div class="toast" id="toast"></div>

<script>
/* =====================================================
   MASTER HUB — CONFIG-DRIVEN
   Each entry defines one Master category: its fields,
   whether it links to an existing dedicated page instead
   of the generic table, and any role-permission toggles
   relevant to that category.
   Wire-up note: swap loadRecords()/saveRecord()/deleteRecord()
   localStorage calls for real erpApiRequest() calls to your
   GAS backend (GET_MASTER / SAVE_MASTER / DELETE_MASTER actions)
   once the backend endpoint exists — everything else stays same.
===================================================== */
/* =====================================================
   SCHEMA-CORRECTED 2026-08-08 against the model-wise
   template split (PURCHASE_MASTER_DB / INVENTORY_MASTER_DB /
   SALES_MASTER_DB / TEMPLATE_RESTAURANT_OPS_DB).

   Every entry now carries:
     dbFile — which spreadsheet the backend must open:
              'OPS' = client's vertical-ops file (same as before)
              'CORE_PURCHASE' / 'CORE_INVENTORY' / 'CORE_SALES'
                     = the shared core module file (DIFFERENT
                       spreadsheet ID — see Client Registry row:
                       PURCHASE_DB_ID / INVENTORY_DB_ID / SALES_DB_ID)
     sheet  — exact tab name to write into
   field.name values were renamed to match the REAL column
   headers in those tabs (verified against the actual xlsx),
   so a straight "append object as row" backend needs no
   further field-mapping logic.

   GAPS — categories below with dbFile:'GAP' have no matching
   sheet anywhere in the current templates. Left untouched
   (still localStorage-only) rather than invented, because
   guessing a sheet name here would just create a new mismatch.
   See gapNote on each for the recommended fix.

   STRUCTURAL MISMATCHES — 'company', 'tax', and 'tables' are
   flagged inline; these need more than a field rename before
   GET_MASTER/SAVE_MASTER can work correctly (see structNote).
===================================================== */
const MASTER_CONFIG = [
  { key:'company', label:'Company', icon:'🏢',
    dbFile:'OPS', sheet:'03_COMPANY_MASTER',
    structNote:'03_COMPANY_MASTER is a 2-column FIELD/VALUE sheet (one company\'s settings), NOT a row-per-record table. GET_MASTER/SAVE_MASTER as built for every other category (append/read rows) will not work here — backend needs a dedicated get-by-field-name / set-by-field-name handler for this one category, same pattern as stampControlPanel_() in client-provisioning-and-migration.gs.',
    fields:[
      {name:'NAME',label:'Company Name',type:'text',req:true},
      {name:'GSTIN',label:'GSTIN',type:'text'},
      {name:'PAN',label:'PAN',type:'text'},
      {name:'ADDRESS',label:'Address',type:'text'},
      {name:'CITY',label:'City',type:'text'},
      {name:'STATE',label:'State',type:'text'},
      {name:'PHONE',label:'Phone',type:'text'},
      {name:'EMAIL',label:'Email',type:'text'},
    ]},
  { key:'branch', label:'Branch', icon:'🏬',
    dbFile:'OPS', sheet:'91_BRANCH_MASTER',
    fields:[
      {name:'BRANCH_NAME',label:'Branch Name',type:'text',req:true},
      {name:'CITY',label:'City',type:'text'},
      {name:'STATE',label:'State',type:'text'},
      {name:'GST_NO',label:'GST No',type:'text'},
      {name:'CONTACT_PERSON',label:'Branch Manager',type:'text'},
      {name:'MOBILE',label:'Phone',type:'text'},
      // ADDRESS has no matching column in 91_BRANCH_MASTER — add an
      // ADDRESS column to the template (migrateAllClients() will roll
      // it out to existing clients safely) if you want to keep this field.
    ]},
  { key:'store', label:'Store', icon:'🏪',
    dbFile:'GAP',
    gapNote:'No STORE_MASTER-type sheet exists in any template. INVENTORY_GODOWN_MASTER (core) is the closest concept but models a physical godown, not a front-of-house store type. Either add a new tab to TEMPLATE_RESTAURANT_OPS_DB, or fold this into the "warehouse" category below.',
    fields:[
      {name:'NAME',label:'Store Name',type:'text',req:true},
      {name:'BRANCH',label:'Branch',type:'text'},
      {name:'TYPE',label:'Type',type:'select',opts:['Kitchen Store','Bar Store','General Store','Cold Store']},
      {name:'ADDRESS',label:'Address',type:'text'},
    ]},
  { key:'menucat', label:'Menu Category', icon:'🍛',
    dbFile:'GAP',
    gapNote:'05_CATEGORY_MASTER was removed from the ops file in the dedup pass, but nothing in the core files covers POS/menu category (INVENTORY_CATEGORY_MASTER is for raw-material category, a different concept per the README). Needs a new tab in TEMPLATE_RESTAURANT_OPS_DB, e.g. 07_MENU_CATEGORY_MASTER.',
    fields:[
      {name:'NAME',label:'Category Name',type:'text',req:true},
      {name:'KITCHEN_SECTION',label:'Kitchen Section',type:'text'},
      {name:'DISPLAY_ORDER',label:'Display Order',type:'text'},
    ]},
  { key:'menu', label:'Menu', icon:'📋',
    dbFile:'OPS', sheet:'06_ITEM_MASTER',
    fields:[
      {name:'ITEM_NAME',label:'Item Name',type:'text',req:true},
      {name:'CATEGORY',label:'Category',type:'text'},
      {name:'RATE',label:'Price (₹)',type:'text'},
      {name:'GST_PERCENT',label:'Tax %',type:'text'},
      {name:'VEG_NONVEG',label:'Veg / Non-Veg',type:'select',opts:['Veg','Non-Veg','Egg']},
    ],
    permissions:[
      {key:'KITCHEN_CAN_CREATE_MENU',label:'Kitchen can add/edit Menu items',desc:'When ON, Chef/Kitchen role sees an "Add Item" option on this tab'},
      {key:'CAPTAIN_CAN_EDIT_PRICE',label:'Captain can edit Menu price',desc:'Off by default — price changes usually stay Admin-only'},
    ]},
  { key:'recipe', label:'Recipe', icon:'📖', linkOut:'recipe-master.html', linkLabel:'Open Recipe Master',
    dbFile:'OPS', sheet:'39_RECIPE_MASTER' },
  { key:'ingredients', label:'Ingredients', icon:'🥕',
    dbFile:'CORE_INVENTORY', sheet:'INVENTORY_ITEM_MASTER',
    structNote:'Routes to the CLIENT\'S INVENTORY_MASTER_DB spreadsheet (INVENTORY_DB_ID in the Client Registry) — NOT the ops file. Previously this and every other core-module category was silently being sent to the same ops-file GAS URL as everything else with no file distinction.',
    fields:[
      {name:'ITEM_NAME',label:'Ingredient Name',type:'text',req:true},
      {name:'CATEGORY',label:'Category',type:'text'},
      {name:'UOM',label:'UOM',type:'select',opts:['Kg','Gram','Litre','Ml','Piece','Packet']},
      {name:'REORDER_LEVEL',label:'Reorder Level',type:'text'},
    ]},
  { key:'tables', label:'Tables', icon:'🪑',
    dbFile:'OPS', sheet:'04_TABLE_MASTER',
    structNote:'04_TABLE_MASTER also carries LIVE order state (PAX, GUESTS, START_TIME, KOT_COUNT, BILL_AMOUNT, STATUS). SAVE_MASTER for this category must upsert by TABLE_ID and only ever write the master columns below — never blank out or overwrite the live-state columns on an existing row.',
    fields:[
      {name:'TABLE_NAME',label:'Table No',type:'text',req:true},
      {name:'FLOOR_NAME',label:'Section / Floor',type:'text'},
      {name:'CAPACITY',label:'Capacity (pax)',type:'text'},
    ],
    permissions:[
      {key:'CAPTAIN_CAN_MANAGE_TABLES',label:'Captain can add/edit Tables',desc:'Table layout changes from the floor, not just Admin'},
    ]},
  { key:'kitchen', label:'Kitchen', icon:'🔥',
    dbFile:'GAP',
    gapNote:'No KITCHEN_SECTION-type master sheet exists. 17_DROPDOWN_MASTER (MODULE/FIELD_NAME/DROPDOWN_VALUE) could hold this as a lightweight dropdown list if a dedicated tab isn\'t wanted.',
    fields:[
      {name:'SECTION_NAME',label:'Kitchen Section',type:'text',req:true},
      {name:'PRINTER',label:'KOT Printer',type:'text'},
      {name:'CHEF_ASSIGNED',label:'Chef Assigned',type:'text'},
    ]},
  { key:'barmenu', label:'Bar Menu', icon:'🍸', linkOut:'bar_module.html', linkLabel:'Open Bar Module',
    permissions:[
      {key:'BAR_CAN_CREATE_COCKTAIL',label:'Bar staff can add/edit Cocktail & Mocktail recipes',desc:'When ON, Bar Manager role can create new recipes without Admin'},
    ]},
  { key:'customer', label:'Customer', icon:'👤',
    dbFile:'CORE_SALES', sheet:'CUSTOMER_MASTER',
    structNote:'Routes to the CLIENT\'S SALES_MASTER_DB spreadsheet (SALES_DB_ID in the Client Registry) — NOT the ops file.',

/* ── DOWNLOAD TEMPLATES ──
   Reads header names straight from MASTER_CONFIG above — the same
   config that drives the Add/Edit forms — so a template can never
   drift out of sync with what the form actually asks for. Categories
   with no fields (Recipe, Bar Menu, Settings) link to their own
   dedicated pages instead and are skipped here on purpose. */
function downloadCategoryTemplate(key){
  const c = MASTER_CONFIG.find(x=>x.key===key);
  if (!c || !c.fields || !c.fields.length){ showToast('This category has no flat-table template — it is managed on its own dedicated page.'); return; }
  const headers = c.fields.map(f=>f.name);
  const ws = XLSX.utils.aoa_to_sheet([headers]);
  ws['!cols'] = headers.map(()=>({wch:16}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, c.label.slice(0,31));
  XLSX.writeFile(wb, c.label.replace(/\s+/g,'_')+'_Template.xlsx');
  showToast('Template downloaded — fill it up and upload via Upload Excel above');
}

// FIX ("wrong — master hub one sheet complete master"): this was 19
// separate tiny tabs, which isn't what was asked for. Now it's ONE
// sheet — every category stacked in sequence with a bold section
// label, its column headers, then blank rows to fill in, so the whole
// business's starting setup can be filled from top to bottom in a
// single continuous sheet and handed back as one file.
function downloadAllMasterTemplates(){
  const maxCols = Math.max(...MASTER_CONFIG.filter(c=>c.fields&&c.fields.length).map(c=>c.fields.length));
  const rows = [];
  const merges = [];
  rows.push(['COMPLETE MASTER SETUP — fill in every section that applies to your business']);
  merges.push({ s:{r:0,c:0}, e:{r:0,c:maxCols-1} });
  rows.push([]);

  let count = 0;
  MASTER_CONFIG.forEach(c=>{
    if (!c.fields || !c.fields.length) return; // Recipe/Bar Menu/Settings link to their own dedicated pages, skipped here
    const sectionRow = rows.length;
    const gapTag = c.dbFile === 'GAP' ? '  [NOT SYNCED — will stay in-browser only until a backend sheet exists]' : '';
    rows.push([c.icon + '  ' + c.label.toUpperCase() + gapTag]);
    merges.push({ s:{r:sectionRow,c:0}, e:{r:sectionRow,c:maxCols-1} });
    rows.push(c.fields.map(f=>f.name));
    for (let i=0;i<5;i++) rows.push([]); // 5 blank fill-in rows per section
    rows.push([]); // spacer before next section
    count++;
  });

  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!merges'] = merges;
  ws['!cols'] = Array(maxCols).fill({wch:17});
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Master Setup');
  XLSX.writeFile(wb, 'Master_Setup_Template.xlsx');
  showToast('Master Setup template downloaded — one sheet, ' + count + ' sections, fill in and upload back with the Upload Filled Master Setup button');
}

// Parses the single sectioned sheet from downloadAllMasterTemplates()
// back apart — scans for each category's section-label row (icon +
// label, uppercased), reads the header row directly below it, then
// every non-empty row after that as data until the next section
// label or a run of blank rows. Bulk-imports each detected section
// straight to its matching category.
async function handleMasterSetupUpload(e){
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(evt){
    const wb = XLSX.read(evt.target.result, {type:'binary'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const grid = XLSX.utils.sheet_to_json(sheet, {header:1, defval:''});
    const sectionStarts = MASTER_CONFIG
      .filter(c=>c.fields && c.fields.length)
      .map(c => ({ key:c.key, label:c.label, needle: c.label.toUpperCase() }));

    let imported = 0, totalRecords = 0;
    const summary = [];
    for (let r = 0; r < grid.length; r++){
      const cellText = String(grid[r][0]||'').toUpperCase();
      const match = sectionStarts.find(s => cellText.includes(s.needle));
      if (!match) continue;
      const c = cfg(match.key);
      const headerRow = grid[r+1] || [];
      const records = [];
      let blankRun = 0;
      for (let rr = r+2; rr < grid.length && blankRun < 2; rr++){
        const row = grid[rr] || [];
        const isBlank = row.every(v => String(v||'').trim()==='');
        if (isBlank){ blankRun++; continue; }
        blankRun = 0;
        const data = {};
        c.fields.forEach((f)=>{
          const headerIdx = headerRow.findIndex(h => String(h||'').trim().toUpperCase() === f.name);
          data[f.name] = headerIdx>=0 ? String(row[headerIdx]||'') : '';
        });
        if (Object.values(data).some(v=>v!=='')) records.push(data);
      }
      if (records.length){
        const result = await bulkImportRecords(match.key, records);
        totalRecords += result.count; imported++;
        summary.push(match.label + ': ' + result.count + (result.synced ? '' : ' (not synced — no backend sheet yet)'));
      }
    }
    await renderNav();
    await renderContent();
    showToast(imported
      ? `Processed ${totalRecords} record(s) across ${imported} section(s) — ${summary.join(', ')}`
      : 'No filled-in sections found — make sure this is the downloaded Master Setup template with data added under each section.');
  };
  reader.readAsBinaryString(file);
  e.target.value = '';
}

// FIX — CRITICAL (P0 client security): this used to be
// `(new URLSearchParams(location.search).get('client')) || 'CL00010'`
// — URL-only, and defaulting to a REAL live client (CL00010) if the
// param was simply missing. Anyone opening this page with no param,
// a mistyped param, or a deliberately different client's code got
// full SAVE_MASTER/DELETE_MASTER/BULK_IMPORT_MASTER access to that
// client's master data with zero authentication. Now resolves from
// the authenticated session first (same pattern as the rest of the
// suite), never trusts the URL as an authority, and never falls back
// to a real client code — an unresolved session means the API calls
// below are blocked (see mhApi), not silently redirected to CL00010.
const CLIENT_ID = (function(){
  try{
    var u=JSON.parse(sessionStorage.getItem('ERP_USER')||localStorage.getItem('ERP_USER')||'{}');
    var fromSession = u.CLIENT_ID||u.clientId||u.client_id||'';
    var fromFlatKey = localStorage.getItem('ERP_CLIENT')||'';
    var id = fromSession || fromFlatKey || localStorage.getItem('bnx_client_id') || '';
    if(id) localStorage.setItem('bnx_client_id', id);
    return id;
  }catch(e){ return ''; }
})();
const CLIENT_INDUSTRY = (new URLSearchParams(location.search).get('industry')) || 'RESTAURANT';

/* =====================================================
   INDUSTRY PROFILES
   A tea counter doesn't need Steward/Captain/Bar Menu tabs;
   a full hotel restaurant needs everything. Three tiers,
   each industry mapped to one, with small per-industry
   overrides where a category doesn't fit the general tier.
===================================================== */
const PROFILE_TIERS = {
  FULL: ['company','branch','store','menucat','menu','recipe','ingredients','tables','kitchen',
         'barmenu','customer','supplier','employee','steward','captain','chef','item','warehouse',
         'tax','bankaccount','user','role','settings'],
  MID:  ['company','branch','store','menucat','menu','recipe','ingredients','customer','supplier',
         'employee','item','warehouse','tax','bankaccount','user','role','settings'],
  LITE: ['company','menucat','menu','ingredients','customer','supplier','employee','item','tax',
         'bankaccount','user','role','settings'],
};

const INDUSTRY_TIER = {
  RESTAURANT:'FULL', RESTAURANT_PUB:'FULL', HOTEL:'FULL', CLOUD_KITCHEN:'FULL', CATERING:'FULL',
  BAR:'MID', BAKERY:'MID', SWEET_SHOP:'MID',
  FRUIT_CENTER:'LITE', JUICE_CENTER:'LITE', TEA_SHOP:'LITE', COFFEE_CENTER:'LITE',
  SMALL_CAFE:'LITE', RESTRO_SMALL:'LITE',
};

// per-industry additions on top of the base tier — small exceptions, not a new tier
const INDUSTRY_OVERRIDES = {
  BAR:        { add:['barmenu','tables'] },              // bars need drink menu + table tracking even at MID tier
  SMALL_CAFE: { add:['tables'] },                          // most small cafes still have a few seats
  RESTRO_SMALL:{ add:['tables','kitchen'] },               // small restaurant still needs table + kitchen section
  COFFEE_CENTER:{ add:['tables'] },
};

function getVisibleKeys(){
  const tier = INDUSTRY_TIER[CLIENT_INDUSTRY] || 'FULL';
  let keys = new Set(PROFILE_TIERS[tier]);
  const override = INDUSTRY_OVERRIDES[CLIENT_INDUSTRY];
  if (override && override.add) override.add.forEach(k=>keys.add(k));
  return keys;
}

/* =====================================================
   BACKEND WIRING
   Kept deliberately separate from the live login URL
   (V2_AUTH) until that's confirmed to be the same project
   as V2_CORE or not. Master Hub works fully on its own —
   only re-point this if you confirm they're the same
   deployment. See WIRING_INSTRUCTIONS.txt.
   Falls back to localStorage automatically if the backend
   call fails, so this page still works offline/mid-setup.
===================================================== */
const MASTER_HUB_API_URL = 'https://script.google.com/macros/s/AKfycbz39r1zo4LGqHJXpwDsQFulHdp3qsjiLRxRiSIEBBObI_3310_n2izF_gAjofaIHgSJ/exec';
const LOCAL_PREFIX = 'MASTERHUB_' + CLIENT_ID + '_'; // offline fallback cache only

async function mhApi(payload){
  // FIX: no sessionToken was ever sent — the confirmed backend
  // requires it on every write via bnxRequireSession_() and will
  // reject these calls without it. Also added a hard block: this
  // page does DELETE_MASTER/SAVE_MASTER against real client data, so
  // an unresolved CLIENT_ID must refuse to call the server at all,
  // not silently proceed with an empty/wrong clientId.
  if (!CLIENT_ID) return { success:false, message:'No client session found — please log in again before making changes here.' };
  const resp = await fetch(MASTER_HUB_API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify(Object.assign({ clientId: CLIENT_ID, sessionToken: (localStorage.getItem('ERP_SESSION')||'') }, payload)),
  });
  const text = await resp.text();
  return JSON.parse(text);
}

function cfg(key){ return MASTER_CONFIG.find(c=>c.key===key); }

/* Every call now includes dbFile + sheet from MASTER_CONFIG so the
   backend router can open the correct spreadsheet (client's own
   INVENTORY_DB_ID/PURCHASE_DB_ID/SALES_DB_ID/OPS_DB_ID from the
   Client Registry) instead of assuming everything lives in one file.
   Categories with dbFile:'GAP' are blocked client-side — no sheet
   exists to write to yet, so we fail fast to localStorage instead
   of silently sending a request that has nowhere to land. */
function routeFor(key){
  const c = cfg(key);
  return { dbFile: c.dbFile, sheet: c.sheet };
}

async function loadRecords(key){
  const route = routeFor(key);
  if (route.dbFile === 'GAP'){
    try{ return JSON.parse(localStorage.getItem(LOCAL_PREFIX+key+'_records')||'[]'); }
    catch(e){ return []; }
  }
  try{
    const r = await mhApi(Object.assign({ action:'GET_MASTER', category:key }, route));
    if (r.success){
      localStorage.setItem(LOCAL_PREFIX+key+'_records', JSON.stringify(r.data.records));
      return r.data.records;
    }
  } catch(e){ /* backend unreachable — fall through to cache */ }
  try{ return JSON.parse(localStorage.getItem(LOCAL_PREFIX+key+'_records')||'[]'); }
  catch(e){ return []; }
}

async function saveOneRecord(key, record){
  const route = routeFor(key);
  if (route.dbFile === 'GAP'){
    showToast('⚠ No sheet configured for this category yet — saved locally only');
    return false;
  }
  try{
    const r = await mhApi(Object.assign({ action:'SAVE_MASTER', category:key, record: JSON.stringify(record) }, route));
    if (r.success) return true;
  } catch(e){}
  showToast('⚠ Backend unreachable — saved locally only, will not sync yet');
  return false;
}

async function deleteOneRecord(key, id){
  const route = routeFor(key);
  if (route.dbFile === 'GAP'){
    showToast('⚠ No sheet configured for this category yet — deleted locally only');
    return false;
  }
  try{
    const r = await mhApi(Object.assign({ action:'DELETE_MASTER', category:key, id: id }, route));
    if (r.success) return true;
  } catch(e){}
  showToast('⚠ Backend unreachable — deleted locally only, will not sync yet');
  return false;
}

async function bulkImportRecords(key, records){
  const route = routeFor(key);
  if (route.dbFile === 'GAP'){
    return { count: records.length, synced: false };
  }
  try{
    const r = await mhApi(Object.assign({ action:'BULK_IMPORT_MASTER', category:key, records: JSON.stringify(records) }, route));
    if (r.success) return { count: r.data.count, synced: true };
  } catch(e){}
  return { count: records.length, synced: false };
}

/* Permission toggles (menu/tables/barmenu/customer's per-category
   toggles AND the standalone 'settings' global toggles) all share
   ONE new key-value tab: A7_SETTINGS_TOGGLES (SCOPE | TOGGLE_KEY | VALUE).
   No existing sheet fits — 113_PERMISSION_MASTER is a ROLE×MODULE
   grid for a different concept (who can view/add/edit/delete/approve
   per module), not a flat feature-flag store. This is a NEW tab you
   need to add to TEMPLATE_RESTAURANT_OPS_DB (and PUB) — safe to add
   and roll out via migrateAllClients() since it only adds sheets,
   never removes. SCOPE = the category key ('settings' for globals,
   'menu'/'tables'/'barmenu'/'customer' for their own toggles). */
const SETTINGS_SHEET = { dbFile:'OPS', sheet:'A7_SETTINGS_TOGGLES' };

async function loadPerms(key){
  try{
    const r = await mhApi(Object.assign({ action:'GET_PERMISSIONS', category:key, scope:key }, SETTINGS_SHEET));
    if (r.success) return r.data.permissions || {};
  } catch(e){}
  try{ return JSON.parse(localStorage.getItem(LOCAL_PREFIX+key+'_perms')||'{}'); }
  catch(e){ return {}; }
}

async function saveOnePermission(key, permKey, value){
  try{
    const r = await mhApi(Object.assign({ action:'SAVE_PERMISSION', category:key, scope:key, permKey:permKey, value:value }, SETTINGS_SHEET));
    if (r.success) return true;
  } catch(e){}
  showToast('⚠ Backend unreachable — saved locally only, will not sync yet');
  return false;
}

// simple in-memory cache so we don't re-fetch on every keystroke/render
let _recordCache = {};
let _permCache = {};

async function refreshTab(key){
  const c = cfg(key);
  if (c.fields) _recordCache[key] = await loadRecords(key);
  if (c.permissions) _permCache[key] = await loadPerms(key);
}

async function renderNav(){
  const nav = document.getElementById('navList');
  nav.innerHTML = MASTER_CONFIG.filter(c=>VISIBLE_KEYS.has(c.key)).map(c=>{
    const count = c.fields ? ((_recordCache[c.key]||[]).length) : '';
    return `<div class="nav-link ${c.key===activeKey?'active':''}" onclick="selectTab('${c.key}')">
      <span class="ni">${c.icon}</span><span>${c.label}</span>
      ${count!==''? `<span class="badge-count">${count}</span>`:''}
    </div>`;
  }).join('');
}

/* Always a full, fresh navigation back to the dashboard — never
   history.back(). Relying on the browser Back button here is what
   causes the dashboard to reopen "frozen": the browser restores it
   from bfcache instead of actually reloading it, so none of its
   init/data-refresh code reruns and nav clicks (like POS) can look
   dead. A real navigation avoids that entirely. */
function backToDashboard(){
  window._erpNavigating = true;

}

async function renderContent(){
  const c = cfg(activeKey);
  const isGap = c.dbFile === 'GAP';
  document.getElementById('pageTitle').innerHTML = `${c.icon} <span>${c.label}</span>${isGap ? ' <span style="font-size:11px;font-weight:700;color:var(--yellow);background:var(--yellow-lt);padding:3px 8px;border-radius:6px;vertical-align:middle;">NOT SYNCED</span>' : ''}`;
  document.getElementById('pageSub').textContent = c.linkOut
    ? 'Managed in its own dedicated page'
    : isGap ? 'No backend sheet exists for this category yet — records stay in this browser only until one is added'
    : (c.fields ? `Master data for ${c.label.toLowerCase()} — used across POS, KOT, Reports` : 'Restaurant-wide toggle settings');

  const actions = document.getElementById('topbarActions');
  if (c.linkOut){
    actions.innerHTML = '';
  } else if (c.fields){
    actions.innerHTML = `
      <button class="tb-btn" onclick="downloadCategoryTemplate('${c.key}')">⬇ Download Template</button>
      <button class="tb-btn upload" onclick="document.getElementById('fileInput').click()">⬆ Upload Excel</button>
      <button class="tb-btn primary" onclick="openModal()">+ Add ${c.label}</button>`;
  } else {
    actions.innerHTML = '';
  }

  const content = document.getElementById('content');
  let html = '';
  if (isGap){
    html += `<div class="card" style="background:var(--yellow-lt);border-color:var(--yellow);margin-bottom:16px;"><div class="card-body" style="font-size:13px;color:var(--text2);">⚠ <strong>${c.label}</strong> has no matching sheet in the current database templates yet, so anything added, edited, or uploaded here stays in this browser only and will not appear in Google Sheets or on any other device until a sheet is added. ${c.gapNote||''}</div></div>`;
  }

  if (c.linkOut){
    html += `<div class="card"><div class="link-out">
      <p style="margin-bottom:14px;color:var(--muted);font-size:13px;">${c.label} has its own full page with recipe costing, cocktail/mocktail builder and bulk import already built.</p>
      <a href="${c.linkOut}">↗ ${c.linkLabel}</a>
    </div></div>`;
  } else if (c.fields){
    const records = _recordCache[c.key] || [];
    html += `<div class="card"><div class="card-hdr"><h3>${c.label} records (${records.length})</h3></div><div class="card-body">`;
    if (!records.length){
      html += `<div class="empty"><div class="big">📭</div>No ${c.label.toLowerCase()} yet — click "+ Add ${c.label}" or upload an Excel file.</div>`;
    } else {
      html += `<table><thead><tr>${c.fields.map(f=>`<th>${f.label}</th>`).join('')}<th style="width:80px">Actions</th></tr></thead><tbody>`;
      records.forEach(r=>{
        html += `<tr>${c.fields.map(f=>`<td data-label="${f.label}">${r[f.name]||'—'}</td>`).join('')}
          <td class="row-actions" data-label="">
            <button class="icon-btn" onclick="openModal('${r._id}')">✎</button>
            <button class="icon-btn del" onclick="deleteRecord('${r._id}')">🗑</button>
          </td></tr>`;
      });
      html += `</tbody></table>`;
    }
    html += `</div></div>`;
  }

  if (c.permissions && c.permissions.length){
    const perms = _permCache[c.key] || {};
    html += `<div class="card"><div class="card-hdr"><h3>Permissions — who can do what</h3></div>
      <div class="card-body"><div class="perm-grid">`;
    c.permissions.forEach(p=>{
      const on = !!perms[p.key];
      html += `<div class="perm-row">
        <div><div class="perm-label">${p.label}</div>${p.desc?`<div class="perm-desc">${p.desc}</div>`:''}</div>
        <div style="display:flex;align-items:center;">
          <div class="toggle ${on?'on':''}" onclick="togglePerm('${c.key}','${p.key}')"></div>
          <span class="toggle-label ${on?'yes':'no'}">${on?'YES':'NO'}</span>
        </div>
      </div>`;
    });
    html += `</div></div></div>`;
  }

  content.innerHTML = html;
}

async function togglePerm(catKey, permKey){
  const perms = _permCache[catKey] || {};
  const newVal = !perms[permKey];
  perms[permKey] = newVal;
  _permCache[catKey] = perms;
  await renderContent();
  await saveOnePermission(catKey, permKey, newVal);
  showToast('Permission updated');
}

function openModal(id){
  const c = cfg(activeKey);
  editingId = id || null;
  const record = id ? (_recordCache[c.key]||[]).find(r=>r._id===id) : {};
  document.getElementById('modalTitle').textContent = (id?'Edit ':'Add ') + c.label;
  document.getElementById('modalBody').innerHTML = c.fields.map(f=>{
    const val = (record && record[f.name]) || '';
    if (f.type==='select'){
      return `<div class="field"><label>${f.label}${f.req?' *':''}</label>
        <select id="fld_${f.name}">
          <option value="">Select…</option>
          ${f.opts.map(o=>`<option value="${o}" ${val===o?'selected':''}>${o}</option>`).join('')}
        </select></div>`;
    }
    return `<div class="field"><label>${f.label}${f.req?' *':''}</label>
      <input id="fld_${f.name}" type="text" value="${(val+'').replace(/"/g,'&quot;')}">
    </div>`;
  }).join('');
  document.getElementById('overlay').classList.add('show');
}
function closeModal(){ document.getElementById('overlay').classList.remove('show'); editingId=null; }

async function saveRecord(){
  const c = cfg(activeKey);
  const data = {};
  let missingReq = false;
  c.fields.forEach(f=>{
    const el = document.getElementById('fld_'+f.name);
    data[f.name] = el.value.trim();
    if (f.req && !data[f.name]) missingReq = true;
  });
  if (missingReq){ showToast('Please fill required fields (*)'); return; }
  if (editingId) data._id = editingId;

  closeModal();
  showToast('Saving…');
  await saveOneRecord(c.key, data);
  await refreshTab(c.key);
  await renderNav();
  await renderContent();
  showToast('Saved');
}

async function deleteRecord(id){
  const c = cfg(activeKey);
  if (!confirm('Delete this record?')) return;
  await deleteOneRecord(c.key, id);
  await refreshTab(c.key);
  await renderNav();
  await renderContent();
  showToast('Deleted');
}

function handleUpload(e){
  const file = e.target.files[0];
  if (!file) return;
  const c = cfg(activeKey);
  const reader = new FileReader();
  reader.onload = async function(evt){
    const wb = XLSX.read(evt.target.result, {type:'binary'});
    const sheet = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(sheet, {defval:''});
    if (!rows.length){ showToast('No rows found in file'); return; }
    const records = rows.map(row=>{
      const data = {};
      c.fields.forEach(f=>{
        const match = Object.keys(row).find(k =>
          k.trim().toUpperCase() === f.name || k.trim().toUpperCase() === f.label.toUpperCase());
        data[f.name] = match ? String(row[match]) : '';
      });
      return data;
    });
    showToast('Importing…');
    const result = await bulkImportRecords(c.key, records);
    await refreshTab(c.key);
    await renderNav();
    await renderContent();
    showToast(result.synced
      ? `Imported ${result.count} ${c.label.toLowerCase()} record(s)`
      : `⚠ ${result.count} record(s) staged locally only — no backend sheet configured yet for ${c.label.toLowerCase()} (or backend unreachable), so nothing was written to Google Sheets`);
  };
  reader.readAsBinaryString(file);
  e.target.value = '';
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function renderHeroStats(){
  const visibleConfig = MASTER_CONFIG.filter(c=>VISIBLE_KEYS.has(c.key));
  const dataCats = visibleConfig.filter(c=>c.fields).length;
  const linkCats = visibleConfig.filter(c=>c.linkOut).length;
  const totalRecords = Object.values(_recordCache).reduce((sum,arr)=>sum+(arr?arr.length:0),0);
  document.getElementById('industryTag').textContent = CLIENT_INDUSTRY.replace(/_/g,' ');
  document.getElementById('heroStats').innerHTML = `
    <div class="hero-stat"><b>${dataCats + linkCats}</b><span>Master Categories</span></div>
    <div class="hero-stat"><b>${totalRecords}</b><span>Records Loaded</span></div>
    <div class="hero-stat"><b>${CLIENT_ID}</b><span>Active Client</span></div>`;
}

(async function init(){
  await refreshTab(activeKey);
  await renderNav();
  await renderContent();
  renderHeroStats();
})();

/* v29 FIX: same gap found and fixed in restaurant-dashboard.html —
   welcome.html force-logs-out after 15 minutes of no activity on a
   shared localStorage timestamp, but this page never touched it.
   Someone doing a big bulk data-entry session in Master Hub for 15+
   minutes would get logged out the instant they navigated back,
   despite being continuously active the whole time. */
(function _erpTouchActivity(){
  if (window.location.protocol==='file:') return;
  var KEY='erp_last_active';
  function touch(){ try{ localStorage.setItem(KEY, Date.now()); }catch(e){} }
  ['mousemove','mousedown','keydown','click','scroll','touchstart'].forEach(function(ev){
    document.addEventListener(ev, touch, {passive:true, capture:true});
  });
  touch();
  setInterval(touch, 60000);
})();
</script>
</body>
