<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Menu</title>
<meta name="description" content="Our full menu — food, drinks and desserts.">
<meta name="theme-color" content="#121212">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!--
  BALAJI NEXTGEN · DIGITAL MENU (view only)        2026-11-26 "chalkboard" design
  restaurant-menu.html?client=CL00010 [&table=5] [&view=list] [&tab=food]
  Dark welcome + "Our Menu" cards (Drinks / Food / Desserts …) + "Chef's Recommends" (items marked POPULAR / FAVOURITE),
  then the full list: pill tabs, category rail, veg-only, search, item cards and a "Know more" sheet.
  Data: GET ?action=PUBLIC_MENU&clientId=… (public, cached on the server). Item description = DESCRIPTION column of
  MENU_CARD_ITEMS / BAR_MENU_CARD. Tagline + intro text = Growth Hub → Settings → Website extras.
  "Order" opens customer-order.html for the same table (hidden when online ordering is switched off).
-->
<style>
:root{--bg:#121212;--bg2:#1b1b1b;--chalk:#f2efe8;--chalk2:#bdb8ad;--gold:#e8c37c;--ink:#1d1d1f;--ink2:#55555c;--ink3:#8d8d94;--line:#ececf0;--soft:#f6f6f8;--slate:#4d6183;--veg:#16a34a;--nv:#b91c1c;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;font:15px/1.5 Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{background:var(--bg);color:var(--chalk)}
body.list{background:#fff;color:var(--ink)}
a{color:inherit}button{font-family:inherit}
.bl{font-family:'UnifrakturMaguntia','Old English Text MT',serif;font-weight:400;letter-spacing:.01em}
/* chalkboard intro */
.board{background:radial-gradient(120% 60% at 50% 0%,#2a2a2a 0%,#141414 60%),var(--bg);min-height:100vh;padding:18px 0 calc(var(--safe-b) + 40px);position:relative;overflow:hidden}
.board::before{content:"";position:absolute;inset:0;opacity:.07;pointer-events:none;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px}
.wc{position:relative;margin:8px 16px 26px;border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:34px 20px 30px;text-align:center;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.01))}
.wc .lg{width:86px;height:86px;border-radius:50%;margin:0 auto 14px;background:#fff center/contain no-repeat;border:3px solid rgba(255,255,255,.85);display:grid;place-items:center;color:#111;font:600 30px Poppins}
.wc h1{font-size:clamp(30px,9vw,46px);line-height:1.15;margin:0;color:var(--chalk)}
.wc p{color:var(--chalk2);font-weight:300;font-size:14px;margin:10px auto 0;max-width:420px}
.wc .meta{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid rgba(255,255,255,.22);border-radius:99px;padding:6px 12px;font-size:12px;color:var(--chalk);text-decoration:none;background:none;cursor:pointer}
.dot{width:8px;height:8px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.25)}
.sec{position:relative;padding:8px 0 22px}
.sec h2{font-size:clamp(30px,9vw,42px);margin:0 16px;color:var(--chalk);line-height:1.1}
.sec .sub{margin:6px 16px 16px;color:var(--chalk2);font-size:13.5px;font-weight:300}
.car{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 10px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}.car>*{flex:0 0 auto;scroll-snap-align:center}
.mc{width:min(62vw,250px);aspect-ratio:3/4.4;border-radius:22px;border:0;padding:0;cursor:pointer;position:relative;overflow:hidden;color:#fff;text-align:left;background:#2a2a2a center/cover no-repeat;box-shadow:0 14px 30px rgba(0,0,0,.45)}
.mc::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 35%,rgba(0,0,0,.78))}
.mc .lb{position:absolute;left:16px;right:16px;bottom:16px;z-index:2}
.mc b{display:block;font:600 22px/1.1 Poppins;letter-spacing:.06em;text-transform:uppercase}
.mc small{font-size:12px;color:rgba(255,255,255,.8)}
.mc .ic{position:absolute;top:16px;left:16px;z-index:2;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;backdrop-filter:blur(4px)}
.mc .ic svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:1.6}
.cr{width:min(56vw,220px);background:#1f1f1f;border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.08);cursor:pointer;color:var(--chalk);padding:0;text-align:left}
.cr .im{aspect-ratio:1;background:#2b2b2b center/cover no-repeat;display:grid;place-items:center;font-size:34px;color:#555}
.cr .tx{padding:10px 12px 12px}.cr small{display:block;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.cr b{display:block;font-weight:500;font-size:14px;line-height:1.3;margin-top:2px}.cr span{font-size:13px;color:var(--chalk2)}
.all{display:block;margin:10px 16px 0;width:calc(100% - 32px);border:1px solid rgba(255,255,255,.25);background:none;color:var(--chalk);border-radius:14px;padding:14px;font-size:13px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.foot{text-align:center;color:#6d6a64;font-size:11.5px;margin-top:26px}
/* list view */
.lv{min-height:100vh;padding-bottom:calc(var(--safe-b) + 90px)}
.hd{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line)}
.hr1{display:flex;align-items:center;gap:8px;padding:10px 12px}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto;color:var(--ink)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}
.ib.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.nm{flex:1;min-width:0}.nm b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink3)}
.vt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:99px;padding:5px 10px 5px 6px;font-size:12px;cursor:pointer;background:#fff;color:var(--ink2);flex:0 0 auto}
.vt i{width:30px;height:18px;border-radius:99px;background:#d4d4d8;position:relative;transition:background .15s}

.vt.on i{background:var(--veg)}.vt.on i::after{left:14px}
.sr{padding:0 12px 10px}.sr input{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:var(--soft);padding:0 14px;font:400 14.5px Poppins;color:var(--ink)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 16px;font-size:13px;cursor:pointer;color:var(--ink2);white-space:nowrap}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.body{display:grid;grid-template-columns:92px 1fr;max-width:1100px;margin:0 auto}
@media(min-width:760px){.body{grid-template-columns:200px 1fr}}
.rail{position:sticky;top:var(--hdh,150px);align-self:start;max-height:calc(100vh - var(--hdh,150px));overflow-y:auto;border-right:1px solid var(--line);padding:10px 0;scrollbar-width:none;background:#fcfcfd}

.rc{display:flex;flex-direction:column;align-items:center;gap:5px;width:100%;border:0;background:none;padding:8px 6px;cursor:pointer;font-size:11px;line-height:1.25;color:var(--ink2);text-align:center;border-left:3px solid transparent}
.rc .th{width:54px;height:54px;border-radius:14px;background:#eee center/cover no-repeat;display:grid;place-items:center;font-weight:600;color:#777;font-size:18px}
.rc.on{color:var(--ink);font-weight:600;border-left-color:var(--slate);background:#f1f4f9}
@media(min-width:760px){.rc{flex-direction:row;text-align:left;font-size:13px;padding:8px 12px}.rc .th{width:40px;height:40px;flex:0 0 auto}.rail h4{text-align:left;margin-left:14px}}
.items{padding:6px 12px 20px;min-width:0}
.cat{scroll-margin-top:calc(var(--hdh,150px) + 6px)}
.cat h3{font-size:16px;font-weight:600;margin:16px 0 8px;display:flex;justify-content:space-between;align-items:baseline}
.cat h3 small{font-size:11.5px;color:var(--ink3);font-weight:400}
.it{display:grid;grid-template-columns:1fr 104px;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.it.noimg{grid-template-columns:1fr}
.it .ph{width:104px;height:104px;border-radius:14px;background:#eee center/cover no-repeat;cursor:pointer}
.it h5{margin:4px 0 2px;font-size:15px;font-weight:500;line-height:1.3}
.it p{margin:0;color:var(--ink3);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it .pr{display:flex;align-items:center;justify-content:space-between;margin-top:8px;gap:8px}
.it .pr b{font-weight:600;font-size:15px}
.km{border:0;background:none;color:var(--slate);font-size:12.5px;font-weight:500;cursor:pointer;padding:6px 0}
.vg{display:inline-grid;place-items:center;width:14px;height:14px;border:1.5px solid var(--veg);border-radius:3px;vertical-align:-2px}
.vg::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--veg)}
.vg.nv{border-color:var(--nv)}.vg.nv::after{background:none;width:0;height:0;border-radius:0;border-left:4px solid transparent;border-right:4px solid transparent;border-bottom:7px solid var(--nv)}
.bs{display:inline-block;margin-left:6px;font-size:10px;font-weight:600;letter-spacing:.04em;color:#b45309;background:#fef3c7;border-radius:99px;padding:2px 7px;vertical-align:1px}
.empty{padding:50px 10px;text-align:center;color:var(--ink3)}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 14px);z-index:30;display:flex;gap:10px}
.fab a,.fab button{display:inline-flex;white-space:nowrap;align-items:center;gap:8px;border:0;border-radius:99px;padding:13px 20px;font-size:13px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.fab .o{background:var(--slate);color:#fff}.fab .w{background:#fff;color:var(--ink)}
body:not(.list) .fab .w{background:#2a2a2a;color:var(--chalk)}
/* sheet */
.sh{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:none;align-items:flex-end;justify-content:center}.sh.on{display:flex}
.sh .bx{background:#fff;color:var(--ink);width:100%;max-width:520px;border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;padding-bottom:calc(var(--safe-b) + 16px)}
@media(min-width:700px){.sh{align-items:center}.sh .bx{border-radius:22px}}
.sh .hero{aspect-ratio:4/3;background:#eee center/cover no-repeat;position:relative}
.sh .x{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.92);font-size:18px;cursor:pointer}
.sh .ct{padding:16px 18px}.sh h3{margin:4px 0;font-size:20px;font-weight:600}.sh .ds{color:var(--ink2);font-size:14px;white-space:pre-line;margin:8px 0 14px}
.state{padding:100px 20px;text-align:center;color:var(--chalk2)}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,#222,#333,#222);background-size:200% 100%;animation:sk 1.2s infinite;margin:10px auto}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 2026-11-27 closer to the reference video (client 10): photo welcome, single-card snap carousel with centred label,

var M=null, TABS=[], TAB='', VEG=false, Q='', CAT='';
function build(d){
  var food=(d.food||[]).filter(function(x){ return x&&x.name; }), bar=(d.bar||[]).filter(function(x){ return x&&x.name; });
  var g={drinks:bar.slice(), bev:[], food:[], des:[]};
  food.forEach(function(x){ var c=String(x.category||''); if(RX.des.test(c)) g.des.push(x); else if(RX.bev.test(c)) g.bev.push(x); else g.food.push(x); });
  var chef=food.concat(bar).filter(function(x){ return x.popular; });
  TABS=[['drinks','Drinks',g.drinks],['bev','Beverages',g.bev],['food','Food',g.food],['des','Desserts',g.des],['chef',"Chef's Recommends",chef]].filter(function(t){ return t[2].length; });
  return {g:g, chef:chef, info:d.info||{}, cards:(d.cards||[]).filter(function(c){ return https(c.url); })};
}
function cats(list){ var o=[], ix={}; list.forEach(function(x){ var c=title(x.category||'Menu'); if(!(c in ix)){ ix[c]=o.length; o.push({name:c,items:[]}); } o[ix[c]].items.push(x); }); return o; }
/* 2026-11-27: the Order button only when this QR / restaurant allows ordering (?order=1 from the Growth Hub QR, or
   customerOrderEnabled on the server) — and it passes order / call / event / wt on, so the order page opens ready. */
function canOrder(){ return /^(1|true|yes|on)$/i.test(qs.get('order')||'')||M.info.customerOrderEnabled===true; }
function orderUrl(){ if(!canOrder()) return ''; try{ var u=new URL('customer-order.html',location.href); u.searchParams.set('client',CID); if(TABLE) u.searchParams.set('table',TABLE); u.searchParams.set('nowelcome','1');
  ['order','call','event','wt'].forEach(function(k){ var v=qs.get(k); if(v) u.searchParams.set(k,v); }); if(!u.searchParams.get('order')) u.searchParams.set('order','1'); return u.href; }catch(e){ return ''; } }
function homeUrl(){ try{ var u=new URL('restaurant-landing.html',location.href); u.searchParams.set('client',CID); if(TABLE) u.searchParams.set('table',TABLE); return u.href; }catch(e){ return 'restaurant-landing.html?client='+CID; } }
var ICONS={drinks:'<svg viewBox="0 0 24 24"><path d="M5 4h14l-6 8v6h3v2H8v-2h3v-6z"/></svg>',bev:'<svg viewBox="0 0 24 24"><path d="M6 8h10v6a5 5 0 0 1-10 0zM16 10h2a2 2 0 0 1 0 4h-2M8 3v3M11 3v3M14 3v3"/></svg>',
  food:'<svg viewBox="0 0 24 24"><path d="M3 13h18a9 9 0 0 1-18 0zM12 4v3M7 6l1 2M17 6l-1 2"/></svg>',des:'<svg viewBox="0 0 24 24"><path d="M7 11a5 5 0 0 1 10 0zM6 11h12l-6 10z"/></svg>',chef:'<svg viewBox="0 0 24 24"><path d="M7 14a4 4 0 1 1 1-7.8A4 4 0 0 1 16 6a4 4 0 1 1 1 8v4H7z"/></svg>'};
function firstImg(list){ for(var i=0;i<list.length;i++){ var u=img(list[i].imageUrl); if(u) return u; } return ''; }
function vegDot(x){ return x.veg==='V'?'<i class="vg" title="Veg"></i> ':(x.veg==='NV'||x.veg==='E')?'<i class="vg nv" title="Non-veg"></i> ':''; }

/* ───────── intro (dark) ───────── */
/* own chalk-line drawings (simple strokes, not copied art) */
var CHALK={mugs:'<svg class="chalk" viewBox="0 0 120 100" fill="none" stroke="#e9e5dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 38h30v46a6 6 0 0 1-6 6H28a6 6 0 0 1-6-6z"/><path d="M52 48h7a7 7 0 0 1 0 14h-7"/><path d="M20 38c-4-10 6-16 12-10 2-8 14-8 16 0 6-4 12 2 8 10"/><path d="M30 50v30M38 50v30M46 50v30"/><path d="M68 34h30v50a6 6 0 0 1-6 6H74a6 6 0 0 1-6-6z" transform="rotate(12 83 60)"/><path d="M66 30c-2-9 9-14 14-7 4-7 15-4 15 4 5-2 9 4 5 8" transform="rotate(12 83 60)"/><path d="M58 18l4 8M64 14l1 8M70 18l-3 7"/></svg>',
  plate:'<svg class="chalk r" viewBox="0 0 130 90" fill="none" stroke="#e9e5dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="62" cy="52" rx="52" ry="26"/><ellipse cx="62" cy="50" rx="36" ry="16"/><path d="M40 48c6-10 16-12 22-6 6-8 18-6 22 4"/><circle cx="52" cy="47" r="2"/><circle cx="64" cy="44" r="2"/><circle cx="74" cy="48" r="2"/><path d="M112 20l-24 22M118 26l-24 22"/></svg>'};
var LAND={};
async function loadLanding(){ var e=endpoints(); for(var i=0;i<e.length;i++){ try{ var j=await (await fetch(e[i]+'?action=GUEST_CHECKIN&mode=LANDING&clientId='+encodeURIComponent(CID))).json(); if(j&&j.info){ LAND=j.info; return; } }catch(x){} } }
var PROF='<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>';
function intro(){
  var i=Object.assign({},LAND,M.info||{}), nm=M.info.name||LAND.name||'our place', lg=img(M.info.logoUrl||LAND.logoUrl), cover=img(LAND.coverUrl)||firstImg((M.g.drinks||[]).concat(M.g.food||[])), h='';
  h+='<a class="prof" href="'+esc(homeUrl())+'#profile" aria-label="My bookings">'+PROF+'</a>';
  h+='<div class="hero2" style="'+(cover?'background-image:url(\''+esc(cover)+'\')':'background:radial-gradient(circle at 40% 30%,#6b4e2b,#1a1a1a 70%)')+'"></div>';
  h+='<div class="wc2">'+(lg?'<div class="lg" style="background-image:url(\''+esc(lg)+'\')"></div>':'<div class="lg">'+esc(nm.charAt(0).toUpperCase())+'</div>')
    +'<div class="w1 bl">Welcome to</div><div class="w2">'+esc(nm)+'</div><p>'+esc(i.menuIntro||'A place where the ordinary ends, and the extraordinary begins!')+'</p>'
    +(TABLE?'<div class="meta"><span class="pill"><i class="dot"></i>Table '+esc(TABLE)+'</span></div>':'')+'</div>';
  h+=CHALK.mugs+'<div class="sec2"><h2 class="bl">Our<br>Menu</h2><p class="sub">'+esc(i.menuTagline||'Dine like you\'re being spoiled')+(i.menuTagline?'':'<i>— because you are.</i>')+'</p><div class="car2">'
    +TABS.filter(function(t){ return t[0]!=='chef'; }).map(function(t){ var u=firstImg(t[2]); return '<button class="mc2" data-tab="'+t[0]+'" style="'+(u?'background-image:url(\''+esc(u)+'\')':'background:linear-gradient(160deg,#3a3a3a,#1a1a1a)')+'"><b>'+esc(t[1])+'</b></button>'; }).join('')
    +'</div></div>'+CHALK.plate;
  if(M.chef.length) h+='<div class="sec2"><h2 class="bl" style="font-size:clamp(40px,12vw,58px)">Chef\'s<br>Recommends</h2><p class="sub">From sizzling starters to the chef\'s secret crushes<i>— fall in love bite by bite!</i></p><div class="car2">'
    +M.chef.slice(0,16).map(function(x){ var u=img(x.imageUrl); return '<button class="cr2" data-item="'+esc(x.id)+'"><div class="im" style="'+(u?'background-image:url(\''+esc(u)+'\')':'')+'"></div><div class="tx"><small>'+esc(isBar(x)?'Drinks':'Food')+'</small><b>'+esc(x.name)+'</b><span>'+rupee(x.price)+'</span></div></button>'; }).join('')+'</div></div>';
  h+='<button class="all" id="seeAll">See the full menu</button><div class="foot">'+esc(nm)+' · Prices include applicable taxes unless stated · Powered by Balaji NextGen</div>';
  $('#intro').innerHTML=h;
  $('#intro').onclick=function(e){ var b=e.target.closest('[data-tab]'); if(b) return openList(b.getAttribute('data-tab'));
    var it=e.target.closest('[data-item]'); if(it) return sheet(it.getAttribute('data-item'));
    if(e.target.id==='seeAll') openList(TABS[0]&&TABS[0][0]); };
  /* start each carousel on its 2nd card so a card peeks on both sides (as in the reference) */
  document.querySelectorAll('.car2').forEach(function(c){ var k=c.children[1]; if(k) c.scrollLeft=k.offsetLeft-(c.clientWidth-k.clientWidth)/2; });
}
function isBar(x){ return M.g.drinks.indexOf(x)>=0; }

/* ───────── list (white) ───────── */
var SORT='', SV={f:'<svg viewBox="0 0 24 24"><path d="M4 5h16l-6 8v5l-4 2v-7z"/></svg>',p:PROF,x:'<svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>',s:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>'};
function openList(tab, push){
  TAB=tab||(TABS[0]&&TABS[0][0])||''; document.body.classList.add('list'); $('#intro').hidden=true; $('#list').hidden=false;
  if(push!==false){ try{ qs.set('view','list'); qs.set('tab',TAB); history.pushState({v:'list'},'',location.pathname+'?'+qs.toString()); }catch(e){} }
  var i=M.info;
  $('#list').innerHTML='<div class="hd" id="hd"><div class="hr1"><button class="ib" id="back" aria-label="Back">'+SV.x+'</button><div class="mt"><select id="mtype" aria-label="Menu"><option value="">Regular</option>'+M.cards.map(function(c,k){ return '<option value="'+k+'">'+esc(c.type==='FOOD'?'Food menu (PDF)':c.type==='BAR'?'Bar menu (PDF)':c.type==='COCKTAIL'?'Cocktails (PDF)':(c.name||'Menu card'))+'</option>'; }).join('')+'</select><small><i class="dot"></i>Active Now'+(TABLE?' · Table '+esc(TABLE):'')+'</small></div>'
    +'<button class="vt'+(VEG?' on':'')+'" id="veg" aria-pressed="'+VEG+'"><i></i>Veg</button><button class="ib'+(SORT?' on':'')+'" id="fBtn" aria-label="Sort">'+SV.f+'</button><button class="ib" id="sBtn" aria-label="Search">'+SV.s+'</button><a class="ib" href="'+esc(homeUrl())+'#profile" aria-label="My bookings">'+SV.p+'</a></div>'
    +'<div class="sr" id="sr" hidden><input id="q" type="search" placeholder="Search dishes & drinks" autocomplete="off" enterkeyhint="search"></div>'
    +'<div class="tabs" id="tabs">'+TABS.map(function(t){ return '<button class="tab'+(t[0]===TAB?' on':'')+'" data-t="'+t[0]+'">'+esc(t[1])+'</button>'; }).join('')+'</div></div>'
    +'<div class="body"><nav class="rail" id="rail" aria-label="Sections"></nav><div class="items" id="items"></div></div>';
  $('#back').onclick=function(){ if(history.state&&history.state.v==='list') history.back(); else closeList(); };
  $('#veg').onclick=function(){ VEG=!VEG; this.classList.toggle('on',VEG); this.setAttribute('aria-pressed',VEG); paint(); };
  $('#sBtn').onclick=function(){ var s=$('#sr'); s.hidden=!s.hidden; this.classList.toggle('on',!s.hidden); if(!s.hidden) $('#q').focus(); else { Q=''; $('#q').value=''; paint(); } hdh(); };
  $('#q').oninput=function(){ Q=this.value.trim().toLowerCase(); paint(); };
  $('#mtype').onchange=function(){ var c=M.cards[+this.value]; if(c) window.open(c.url,'_blank','noopener'); this.value=''; };
  $('#fBtn').onclick=sortSheet;
  $('#tabs').onclick=function(e){ var b=e.target.closest('[data-t]'); if(!b) return; TAB=b.getAttribute('data-t'); document.querySelectorAll('#tabs .tab').forEach(function(x){ x.classList.toggle('on',x===b); }); b.scrollIntoView({inline:'center',block:'nearest'}); try{ qs.set('tab',TAB); history.replaceState(history.state,'',location.pathname+'?'+qs.toString()); }catch(e2){} paint(); scrollTo(0,0); };
  $('#rail').onclick=function(e){ if(e.target.id==='exNext'){ var all=[].slice.call(document.querySelectorAll('#rail .rc')), k=all.findIndex(function(x){ return x.classList.contains('on'); }), nx=all[Math.min(all.length-1,k+1)]; if(nx) nx.click(); return; } var b=e.target.closest('[data-c]'); if(!b) return; var el=document.getElementById(b.getAttribute('data-c')); if(el) el.scrollIntoView({behavior:'smooth'}); };
  $('#items').onclick=function(e){ var b=e.target.closest('[data-item]'); if(b) sheet(b.getAttribute('data-item')); };
  paint(); hdh(); scrollTo(0,0); fab();
}
function closeList(){ document.body.classList.remove('list'); $('#list').hidden=true; $('#intro').hidden=false; fab(); }
window.addEventListener('popstate',function(){ var v=new URLSearchParams(location.search).get('view'); if(v==='list'){ if($('#list').hidden) openList(new URLSearchParams(location.search).get('tab'),false); } else closeList(); });
function hdh(){ var h=$('#hd'); if(h) document.documentElement.style.setProperty('--hdh',h.offsetHeight+'px'); }
window.addEventListener('resize',hdh);
var IO=null;
function paint(){
  var t=TABS.filter(function(x){ return x[0]===TAB; })[0]; if(!t) return;
  var src=Q?TABS.reduce(function(a,x){ return x[0]==='chef'?a:a.concat(x[2]); },[]):t[2];
  var list=src.filter(function(x){ return (!VEG||x.veg==='V')&&(!Q||(String(x.name)+' '+String(x.category)+' '+String(x.desc||'')).toLowerCase().indexOf(Q)>=0); });
  if(SORT) list=list.slice().sort(function(a,b){ return SORT==='lo'?a.price-b.price:SORT==='hi'?b.price-a.price:(b.popular?1:0)-(a.popular?1:0); });
  var cs=cats(list);
  $('#rail').innerHTML='<div class="ex">'+(Q?'Results':'Explore<br>Cuisines')+'<button type="button" id="exNext" aria-label="Next section">›</button></div>'+cs.map(function(c,k){ var u=firstImg(c.items); return '<button class="rc'+(k===0?' on':'')+'" data-c="c'+k+'"><span class="th" style="'+(u?'background-image:url(\''+esc(u)+'\')':'')+'">'+(u?'':esc(c.name.charAt(0)))+'</span><span>'+esc(c.name)+'</span></button>'; }).join('');
  $('#items').innerHTML=cs.length?cs.map(function(c,k){ return '<section class="cat" id="c'+k+'"><h3>'+esc(c.name)+' <small>'+c.items.length+'</small></h3>'+c.items.map(row).join('')+'</section>'; }).join('')
    :'<div class="empty">'+(Q?'Nothing matches “'+esc(Q)+'”.':VEG?'No veg items here.':'Nothing here yet.')+'</div>';
  if(IO) IO.disconnect();
  if('IntersectionObserver' in window){ IO=new IntersectionObserver(function(es){ es.forEach(function(x){ if(x.isIntersecting){ var id=x.target.id; document.querySelectorAll('#rail .rc').forEach(function(b){ var on=b.getAttribute('data-c')===id; b.classList.toggle('on',on); if(on) b.scrollIntoView({block:'nearest'}); }); } }); },{rootMargin:'-'+(parseInt(getComputedStyle(document.documentElement).getPropertyValue('--hdh'))||150)+'px 0px -60% 0px'});
    document.querySelectorAll('.cat').forEach(function(s){ IO.observe(s); }); }
}
function row(x){ var u=img(x.imageUrl), nm='<h5>'+vegDot(x)+esc(x.name)+'</h5>'+(x.desc?'<p>'+esc(x.desc)+'</p>':'');
  return '<article class="it2">'+(u?'<div class="ph" data-item="'+esc(x.id)+'" style="background-image:url(\''+esc(u)+'\')" role="img" aria-label="'+esc(x.name)+'"><div class="ov">'+nm+'</div></div>':'<div class="np">'+nm+'</div>')
    +'<div class="ft"><b>'+rupee(x.price)+(x.popular?' <span class="bs">★ Chef\'s pick</span>':'')+'</b><button class="km" data-item="'+esc(x.id)+'">Know More ↗</button></div></article>'; }
function sortSheet(){
  $('#sheetBox').innerHTML='<div class="ct fsheet"><h3>Sort</h3>'+[['','Menu order'],['pop',"Chef's picks first"],['lo','Price: low to high'],['hi','Price: high to low']].map(function(o){ return '<button class="opt'+(SORT===o[0]?' on':'')+'" data-s="'+o[0]+'">'+o[1]+'</button>'; }).join('')+'</div>';
  $('#sheet').classList.add('on');
  $('#sheetBox').onclick=function(e){ var b=e.target.closest('[data-s]'); if(!b) return; SORT=b.getAttribute('data-s'); var f=$('#fBtn'); if(f) f.classList.toggle('on',!!SORT); closeSheet(); $('#sheetBox').onclick=null; paint(); };
}
function find(id){ var all=(M.g.drinks).concat(M.g.bev,M.g.food,M.g.des); for(var i=0;i<all.length;i++) if(String(all[i].id)===String(id)) return all[i]; return null; }
function sheet(id){
  var x=find(id); if(!x) return; $('#sheetBox').onclick=null; var u=img(x.imageUrl), o=orderUrl();
  $('#sheetBox').innerHTML=(u?'<div class="hero" style="background-image:url(\''+esc(u)+'\')"><button class="x" id="shX" aria-label="Close">✕</button></div>':'<div style="text-align:right;padding:10px 12px 0"><button class="x" id="shX" style="position:static;background:#f1f1f3" aria-label="Close">✕</button></div>')
    +'<div class="ct"><div style="font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)">'+vegDot(x)+esc(title(x.category))+'</div><h3>'+esc(x.name)+'</h3><b style="font-size:18px">'+rupee(x.price)+'</b>'
    +'<div class="ds">'+esc(x.desc||'Ask your server about this one.')+'</div>'
    +(o?'<a class="km" style="display:inline-flex;background:var(--slate);color:#fff;border-radius:99px;padding:12px 20px;text-decoration:none;font-size:13px;letter-spacing:.06em;text-transform:uppercase" href="'+esc(o)+'">Order this</a>':'')+'</div>';
  $('#shX').onclick=closeSheet; $('#sheet').classList.add('on');
}
function closeSheet(){ $('#sheet').classList.remove('on'); }
$('#sheet').onclick=function(e){ if(e.target.id==='sheet') closeSheet(); };
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeSheet(); });
function fab(){ var o=orderUrl(), f=$('#fab'); if(!M) return; f.innerHTML=(o?'<a class="o" href="'+esc(o)+'">Order at table</a>':'')+(document.body.classList.contains('list')?'':'<a class="w" href="'+esc(homeUrl())+'">Book a table</a>'); f.hidden=!f.innerHTML; }

function apply(d){
  M=build(d);
  var nm=M.info.name||''; document.title=(nm?nm+' — ':'')+'Menu';
  if(!TABS.length){ $('#intro').innerHTML='<div class="state"><h2 class="bl" style="font-size:34px;color:var(--chalk)">Menu coming soon</h2><p>Please ask your server.</p></div>'; return; }
  intro(); fab();
  var v=qs.get('view'), t=qs.get('tab'); if(v==='list') openList(TABS.some(function(x){ return x[0]===t; })?t:TABS[0][0],false);
}
async function boot(){
  if(!CID){ $('#intro').innerHTML='<div class="state"><h2 class="bl" style="font-size:34px;color:var(--chalk)">Link not complete</h2><p>This page needs the restaurant code, e.g. <b>?client=CL00010</b>.</p></div>'; return; }
  var cached=null; try{ cached=JSON.parse(ls(CK)||'null'); }catch(e){}
  if(cached&&cached.d&&Date.now()-cached.t<7*864e5) apply(cached.d);
  loadLanding().then(function(){ if(M&&!$('#intro').hidden) intro(); });
  var d=await load();
  if(d){ var slim={food:d.food,bar:d.bar,info:d.info,cards:d.cards}, same=cached&&cached.d&&JSON.stringify(cached.d)===JSON.stringify(slim);
    try{ ls(CK,JSON.stringify({t:Date.now(),d:slim})); }catch(e){}
    if(same&&M) return;   /* phone copy already on screen and nothing changed: do not redraw under the guest's thumb */
    var wasList=!$('#list').hidden, tab=TAB; apply(d); if(wasList) openList(tab,false); }
  else if(!cached){ $('#intro').innerHTML='<div class="state"><h2 class="bl" style="font-size:34px;color:var(--chalk)">Could not load the menu</h2><p>Check your connection and try again.</p><button class="all" onclick="location.reload()">Try again</button></div>'; }
}
boot();
})();
</script>
