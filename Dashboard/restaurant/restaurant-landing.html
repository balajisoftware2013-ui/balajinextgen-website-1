<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome</title>
<meta name="description" content="Menu, table booking, events and tickets.">
<meta name="theme-color" content="#1f1a14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<!--
  BALAJI NEXTGEN · BRANDED RESTAURANT LANDING PAGE  (Guest growth suite, 2026-11-09)
  restaurant-landing.html?client=CL00010            one page per restaurant, all content from the ERP:
     name / logo / phone / address (COMPANY_SETTINGS, CLIENT_SETTINGS) · events + posters (Customer QR Promotion)
     ticket types (Growth Hub → Events) · booking rules, tagline, about, hours, cover, colour (Growth Hub → Settings)
  Optional: &api=<Apps Script deployment id>  (remembered on this phone) · &table=5 (passes the table to the menu link)
  Public calls only (GET ?action=GUEST_CHECKIN&mode=LANDING|RESV_SLOTS|RESERVE|RESV_STATUS|RESV_CANCEL|TICKET_BOOK|TICKET_STATUS|FEEDBACK)
-->
<style>
:root{
  --ink:#1f1a14;--ink2:#5b5148;--ink3:#8f857b;--paper:#fbf7f1;--card:#ffffff;--line:#ece4d9;--brand:#b4531c;--brand2:#e0892b;--ok:#15803d;--bad:#b91c1c;
  --r:18px;--shadow:0 10px 30px rgba(31,26,20,.10);--safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{max-width:100%;display:block}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;letter-spacing:-.01em;margin:0}
h2{font-size:clamp(26px,4.6vw,36px);line-height:1.1}
.kicker{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand)}
.muted{color:var(--ink3)}
.btn{appearance:none;border:0;border-radius:14px;padding:14px 18px;font:800 15px/1 'DM Sans',sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;min-height:48px;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn-p{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 8px 20px color-mix(in srgb,var(--brand) 35%,transparent)}
.btn-l{background:rgba(255,255,255,.14);color:#fff;border:1.5px solid rgba(255,255,255,.4);backdrop-filter:blur(6px)}
.btn-o{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn-wa{background:#25D366;color:#fff}
.btn-sm{min-height:38px;padding:9px 13px;font-size:13.5px;border-radius:11px}

/* top bar */
.top{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-color:var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;height:60px}
.top .lg{width:36px;height:36px;border-radius:10px;object-fit:cover;background:var(--card);border:1px solid var(--line)}
.top .nm{font:800 17px/1.1 Fraunces,serif;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top nav{display:flex;gap:4px}
.top nav a{font-weight:700;font-size:14px;text-decoration:none;padding:8px 10px;border-radius:10px;color:var(--ink2)}
.top nav a:hover{background:var(--card)}
@media(max-width:720px){.top nav{display:none}}

/* hero */
.hero{position:relative;min-height:min(78vh,640px);display:flex;align-items:flex-end;color:#fff;overflow:hidden;background:#2a2118}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;transform:scale(1.04);filter:saturate(1.05)}
.hero video.bg{width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,14,8,.15) 0%,rgba(20,14,8,.35) 40%,rgba(20,14,8,.88) 100%)}
.hero .hin{position:relative;z-index:2;padding:48px 16px 34px;width:100%}
.hero .hlg{width:76px;height:76px;border-radius:20px;object-fit:cover;border:3px solid rgba(255,255,255,.85);background:#fff;margin-bottom:16px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.hero h1{font-size:clamp(36px,8vw,68px);line-height:1;font-weight:800;text-wrap:balance}
.hero p.tg{font-size:clamp(16px,2.4vw,20px);max-width:620px;margin:12px 0 22px;color:rgba(255,255,255,.88)}
.hero .cta{display:flex;flex-wrap:wrap;gap:10px}
.hero .meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font-size:14px;color:rgba(255,255,255,.85)}
.hero .meta span{display:inline-flex;gap:6px;align-items:center}
.pattern{background:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--brand2) 55%,transparent),transparent 45%),radial-gradient(circle at 80% 0%,color-mix(in srgb,var(--brand) 70%,transparent),transparent 50%),#2a2118}

section{padding:56px 0}
section.alt{background:var(--card);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sh{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.sh p{margin:6px 0 0;max-width:560px}

/* events */
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--shadow)}
.ev .pic{aspect-ratio:4/3;background:#efe6da center/cover no-repeat;position:relative}
.ev .dt{position:absolute;left:12px;top:12px;background:#fff;color:var(--ink);border-radius:12px;padding:6px 10px;text-align:center;line-height:1.05;font-weight:800;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.ev .dt b{display:block;font:800 22px/1 Fraunces,serif}
.ev .dt small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.ev .bd{padding:16px;display:flex;flex-direction:column;gap:8px;flex:1}
.ev h3{font-size:21px}
.ev .tt{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 10px;font-size:12.5px;font-weight:700;color:var(--ink2)}
.chip.so{opacity:.55;text-decoration:line-through}
.ev .ft{margin-top:auto;padding-top:6px}

/* booking */
.bk{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:22px}
.bk>*,.row2>*,.panel{min-width:0}
@media(max-width:860px){.bk{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
label.l{display:block;font-size:12.5px;font-weight:800;color:var(--ink2);margin:14px 0 6px;letter-spacing:.02em}
.in{width:100%;border:1.5px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 13px;font:600 15px 'DM Sans',sans-serif;color:var(--ink);min-height:48px}
.in:focus{outline:2px solid color-mix(in srgb,var(--brand) 45%,transparent);border-color:var(--brand)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
@media(max-width:420px){.row2{grid-template-columns:1fr}}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:62px;border:1.5px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 6px;text-align:center;cursor:pointer;font-weight:700;color:var(--ink2)}
.day b{display:block;font:800 20px/1.1 Fraunces,serif;color:var(--ink)}
.day small{font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.day.on{background:var(--ink);color:#fff;border-color:var(--ink)}.day.on b{color:#fff}
.day.off{opacity:.4;pointer-events:none}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.slot{border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 4px;text-align:center;cursor:pointer;font-weight:800;font-size:14px}
.slot small{display:block;font-size:10.5px;font-weight:700;color:var(--ink3)}
.slot.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,#fff);color:var(--brand)}
.slot.full{opacity:.4;pointer-events:none;text-decoration:line-through}
.pax{display:flex;align-items:center;gap:10px}
.pax button{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font-size:22px;font-weight:800;cursor:pointer}
.pax output{font:800 24px Fraunces,serif;min-width:46px;text-align:center}
.cons{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink2);margin-top:14px}
.cons input{width:20px;height:20px;margin-top:1px;accent-color:var(--brand)}
.msg{font-size:13.5px;margin-top:10px;min-height:18px}
.msg.e{color:var(--bad)}.msg.o{color:var(--ok)}
.done{border:2px dashed color-mix(in srgb,var(--ok) 50%,transparent);background:#f0fdf4;border-radius:16px;padding:16px;margin-top:14px}
.done h3{font-size:20px;color:var(--ok)}
.side h3{font-size:22px;margin-bottom:6px}
.side ul{padding-left:18px;margin:8px 0;color:var(--ink2)}
.side li{margin:4px 0}

/* menu */
.dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.dish{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.dish .im{aspect-ratio:16/10;background:linear-gradient(135deg,#f6ead9,#efe0cb) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:34px}
.dish .tx{padding:12px 14px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.dish .tx b{font-size:15px;line-height:1.25}
.dish .tx span{font-weight:800;color:var(--brand);white-space:nowrap}
.veg{display:inline-block;width:12px;height:12px;border:1.5px solid #15803d;border-radius:2px;position:relative;margin-right:6px;vertical-align:-1px}
.veg::after{content:"";position:absolute;inset:2px;border-radius:50%;background:#15803d}
.veg.nv{border-color:#b91c1c}.veg.nv::after{background:#b91c1c}
.cats{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px}

/* feedback */
.stars{display:flex;gap:6px}
.stars button{border:0;background:none;font-size:36px;cursor:pointer;filter:grayscale(1);opacity:.4;padding:0 2px;transition:.15s}
.stars button.on{filter:none;opacity:1}

/* contact */
.ct{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.ct .panel{display:flex;flex-direction:column;gap:6px}
.ct .panel b{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--brand)}

/* my bookings + modal */
.mine{display:flex;flex-direction:column;gap:8px}
.mine .it{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:#fff;font-size:14px}
.st{font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;background:#f3f4f6;color:#374151;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.st.CONFIRMED,.st.PAID,.st.CHECKED_IN,.st.SEATED{background:#dcfce7;color:#166534}.st.PENDING,.st.RESERVED{background:#fef3c7;color:#92400e}.st.DECLINED,.st.CANCELLED,.st.EXPIRED,.st.NO_SHOW{background:#fee2e2;color:#991b1b}
.modal{position:fixed;inset:0;z-index:100;background:rgba(20,14,8,.55);display:none;align-items:flex-end;justify-content:center}
.modal.on{display:flex}
.modal .box{background:#fff;width:100%;max-width:520px;border-radius:22px 22px 0 0;padding:20px 18px calc(var(--safe-b) + 18px);max-height:94vh;overflow:auto}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:22px}}
.tix{display:flex;flex-direction:column;gap:8px}
.tix label{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.tix label.on{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 7%,#fff)}
.tix label.so{opacity:.45;pointer-events:none}
.code{font:800 34px/1 'DM Sans',monospace;letter-spacing:.18em;text-align:center;padding:12px;background:var(--paper);border-radius:14px;margin:10px 0}
#qr{display:flex;justify-content:center;margin:6px 0}
footer{padding:28px 0 calc(var(--safe-b) + 90px);text-align:center;font-size:13px;color:var(--ink3)}
.dock{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 12px calc(var(--safe-b) + 10px);background:linear-gradient(180deg,transparent,rgba(251,247,241,.96) 30%);display:flex;gap:8px;justify-content:center}
.dock .btn{flex:1;max-width:240px}
@media(min-width:900px){.dock{display:none}footer{padding-bottom:28px}}
.state{padding:80px 16px;text-align:center}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,#efe6da,#f8f2ea,#efe6da);background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header class="top" id="top"><div class="wrap">
  <img class="lg" id="tLogo" alt="" hidden>
  <div class="nm" id="tName">&nbsp;</div>
  <nav><a href="#menu">Menu</a><a href="#events" id="navEv">Events</a><a href="#reserve" id="navRv">Book a table</a><a href="#feedback" id="navFb">Feedback</a><a href="#visit">Visit</a></nav>
</div></header>

<main id="app">
  <div class="state" id="boot"><div class="sk" style="max-width:260px;margin:0 auto 12px"></div><div class="sk" style="max-width:180px;margin:0 auto"></div></div>
</main>

<div class="modal" id="tixModal" role="dialog" aria-modal="true" aria-labelledby="tixTitle"><div class="box" id="tixBox"></div></div>

<div class="dock" id="dock" hidden>
  <a class="btn btn-o" id="dMenu" href="#menu">🍽️ Menu</a>
  <a class="btn btn-p" id="dBook" href="#reserve">📅 Book a table</a>
</div>

<script>
(function(){
'use strict';
/* ───────── config ───────── */
var qs=new URLSearchParams(location.search);
var CID=String(qs.get('client')||qs.get('clientId')||'').trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,30);
var TABLE=String(qs.get('table')||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,12);
var DEF_API='AKfycbwHdqrP4IvuVD2ZkupNybrEkiXu3kmuI6-tQoiHgYxoqr1KgUupeFsi3PIoFEbuv6XA';
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }
(function(){ var a=qs.get('api'); if(/^AKfycb[A-Za-z0-9_-]{20,}$/.test(a||'')) ls('bnx_landing_api',a); })();
function endpoints(){
  var out=[], add=function(id){ if(/^AKfycb[A-Za-z0-9_-]{20,}$/.test(id||'')){ var u='https://script.google.com/macros/s/'+id+'/exec'; if(out.indexOf(u)<0) out.push(u); } };
  add(ls('bnx_landing_api')); var ok=ls('bnx_guest_api_ok'); if(/\/exec$/.test(ok||'')) { var m=String(ok).match(/\/s\/([^/]+)\/exec/); if(m) add(m[1]); }
  add(ls('bnx_api_core')); add(DEF_API); return out;
}
function devId(){ try{ var d=localStorage.getItem('bnx_device_id'); if(!d){ d='dv-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); localStorage.setItem('bnx_device_id',d); } return d; }catch(e){ return ''; } }
async function api(mode,params,timeoutMs){
  var q=new URLSearchParams({action:'GUEST_CHECKIN',mode:mode,clientId:CID,deviceId:devId()});
  Object.keys(params||{}).forEach(function(k){ var v=params[k]; if(v!==undefined&&v!==null&&v!=='') q.set(k,String(v)); });
  var last={success:false,offline:true,error:'Could not reach the restaurant — check your connection.'};
  var eps=endpoints();
  for(var i=0;i<eps.length;i++){
    var ctl=new AbortController(), tm=setTimeout(function(){ ctl.abort(); }, timeoutMs||45000);
    try{ var j=await (await fetch(eps[i]+'?'+q.toString(),{signal:ctl.signal})).json();
      if(j&&j.mode===mode){ var m=eps[i].match(/\/s\/([^/]+)\/exec/); if(m) ls('bnx_landing_api',m[1]); return j; }
      last={success:false,error:'This restaurant\'s booking service is not installed yet.'};
    }catch(e){ last={success:false,offline:true,error:'Could not reach the restaurant — check your connection.'}; }
    finally{ clearTimeout(tm); }
  }
  return last;
}
/* ───────── helpers ───────── */
var $=function(s,r){ return (r||document).querySelector(s); };
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function https(u){ return /^https:\/\//i.test(String(u||''))?String(u):''; }
function rupee(n){ return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}); }
function istToday(){ return new Date(Date.now()+5.5*3600e3).toISOString().slice(0,10); }
function addDays(d,n){ var x=new Date(d+'T12:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); }
function dParts(d){ var x=new Date(d+'T12:00:00Z'); return { dow:x.toLocaleDateString('en-IN',{weekday:'short',timeZone:'UTC'}), day:x.getUTCDate(), mon:x.toLocaleDateString('en-IN',{month:'short',timeZone:'UTC'}), nice:x.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}) }; }
function t12(t){ var p=String(t||'').split(':'); if(p.length<2) return t||''; var h=+p[0], m=p[1]; return ((h%12)||12)+':'+m+' '+(h<12?'AM':'PM'); }
function mob(v){ var d=String(v||'').replace(/\D/g,''); if(d.length===12&&d.indexOf('91')===0) d=d.slice(2); d=d.slice(-10); return /^[6-9]\d{9}$/.test(d)?d:''; }
function rid(p){ return p+'-'+CID+'-'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function driveImg(u){ u=String(u||''); var m=u.match(/(?:\/d\/|[?&]id=)([\w-]{10,})/); return m&&/drive\.google|docs\.google/.test(u)?'https://lh3.googleusercontent.com/d/'+m[1]+'=w1600':https(u); }
var MINE_K='bnx_landing_mine_'+CID;
function mine(){ try{ return JSON.parse(ls(MINE_K)||'[]')||[]; }catch(e){ return []; } }
function saveMine(a){ ls(MINE_K,JSON.stringify(a.slice(-12))); }
var who=(function(){ try{ return JSON.parse(ls('bnx_landing_me')||'{}')||{}; }catch(e){ return {}; } })();
function remember(name,m){ who={name:name,mobile:m}; ls('bnx_landing_me',JSON.stringify(who)); }

var D=null;
/* ───────── boot ───────── */
async function boot(){
  if(!CID){ $('#app').innerHTML='<div class="state"><h2>Link not complete</h2><p class="muted">This page needs the restaurant code, e.g. <b>?client=CL00010</b>. Ask the restaurant for their link or QR.</p></div>'; return; }
  var r=await api('LANDING',{},60000);
  if(!r||!r.success){ $('#app').innerHTML='<div class="state"><h2>We could not load this page</h2><p class="muted">'+esc(r&&r.error||'')+'</p><button class="btn btn-p" onclick="location.reload()">Try again</button></div>'; return; }
  D=r; render();
}
function brand(info){
  var c=/^#[0-9a-f]{6}$/i.test(info.brandColor||'')?info.brandColor:'';
  if(c){ var n=parseInt(c.slice(1),16), mix=function(v,w){ return Math.round(v*0.7+w*0.3); };   /* plain hex, works on old Android WebViews */
    var c2='#'+[mix(n>>16&255,245),mix(n>>8&255,165),mix(n&255,36)].map(function(v){ return ('0'+v.toString(16)).slice(-2); }).join('');
    document.documentElement.style.setProperty('--brand',c); document.documentElement.style.setProperty('--brand2',c2); }
  document.title=(info.name||'Restaurant')+(info.tagline?' — '+info.tagline:'');
  var meta=document.querySelector('meta[name=description]'); if(meta) meta.content=(info.tagline||info.about||'Menu, table booking, events and tickets').slice(0,160);
  $('#tName').textContent=info.name||'';
  var lg=driveImg(info.logoUrl); if(lg){ var t=$('#tLogo'); t.src=lg; t.hidden=false; t.onerror=function(){ t.hidden=true; }; }
}
function menuUrl(){ try{ var u=new URL('customer-order.html',location.href); u.searchParams.set('client',CID); if(TABLE) u.searchParams.set('table',TABLE); u.searchParams.set('nowelcome','1'); return u.href; }catch(e){ return 'customer-order.html?client='+encodeURIComponent(CID); } }
function render(){
  var i=D.info||{}, ev=(D.events||[]), rv=D.resv||{}, fb=D.feedback||{}, mn=D.menu||{};
  brand(i);

      if(!sel) return msg.textContent='Choose a ticket'; if(!nm) return msg.textContent='Enter your name'; if(!m) return msg.textContent='Enter a valid 10-digit mobile number';
      b.disabled=true; b.textContent='Booking…';
      var r=await api('TICKET_BOOK',{eventId:e.id,typeId:sel,qty:qty,customerName:nm,mobileNo:m,marketingOptIn:$('#tkMk').checked?'true':'',source:'LANDING',requestId:rid('tk')});
      if(!r.success){ b.disabled=false; b.textContent='Try again'; msg.textContent=r.error||'Could not book'; if(r.soldOut){ var ty2=t.filter(function(x){ return x.typeId===sel; })[0]; if(ty2) ty2.left=r.left||0; setTimeout(paint,1200); } return; }
      remember(nm,m);
      var it={k:'T',id:r.code,m:m,d:r.date,e:r.event,s:r.status,q:r.qty,a:r.amount,ty:r.type,u:r.upiLink||'',tm:r.time||''};
      var a=mine().filter(function(x){ return x.id!==r.code; }); a.push(it); saveMine(a); paintMine(false);
      var ty3=t.filter(function(x){ return x.typeId===sel; })[0]; if(ty3) ty3.left=Math.max(0,ty3.left-r.qty);
      showTicket(it);
    };
  }
  function close(){ $('#tixModal').classList.remove('on'); }
  $('#tixModal').onclick=function(ev2){ if(ev2.target.id==='tixModal') close(); };
  paint(); $('#tixModal').classList.add('on');
}
function showTicket(x){
  var box=$('#tixBox'), unpaid=x.s==='RESERVED'&&Number(x.a)>0;
  box.innerHTML='<div style="display:flex;justify-content:space-between;gap:10px"><div><div class="kicker">'+esc(dParts(x.d).nice)+(x.tm?' · '+esc(x.tm):'')+'</div><h3 style="font-size:23px;margin-top:4px">'+esc(x.e||'Your ticket')+'</h3></div><button class="btn btn-o btn-sm" id="tixX">✕</button></div>'
    +'<div class="muted" style="margin-top:6px">'+esc(x.q||1)+' × '+esc(x.ty||'Ticket')+(Number(x.a)?' · '+rupee(x.a):' · Free')+'</div>'
    +'<div id="qr"></div><div class="code">'+esc(x.id)+'</div>'
    +'<div style="text-align:center"><span class="st '+esc(x.s)+'">'+esc(unpaid?'Payment pending':String(x.s).replace('_',' '))+'</span></div>'
    +(unpaid?(x.u?'<a class="btn btn-p" style="width:100%;margin-top:14px" href="'+esc(x.u)+'">Pay '+rupee(x.a)+' with UPI</a><p class="muted" style="font-size:12.5px;text-align:center">Opens GPay / PhonePe / Paytm. Staff confirm payment; you can also pay at the door.</p>'
      :'<p class="muted" style="font-size:13px;text-align:center">Pay at the door — show this code.</p>'):'<p class="muted" style="font-size:13px;text-align:center">Show this code at the entrance. A screenshot works too.</p>');
  $('#tixX').onclick=function(){ $('#tixModal').classList.remove('on'); };
  $('#tixModal').classList.add('on');
  try{ if(window.QRCode) new QRCode($('#qr'),{text:'BNXTK:'+CID+':'+x.id,width:150,height:150,correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
}
/* ───────── feedback ───────── */
function initFeedback(){
  var val=0;
  $('#fbStars').onclick=function(e){ var b=e.target.closest('button'); if(!b) return; val=Number(b.getAttribute('data-v'));
    this.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on',Number(x.getAttribute('data-v'))<=val); }); };
  if(who.name) $('#fbName').value=who.name; if(who.mobile) $('#fbMob').value=who.mobile;
  $('#fbGo').onclick=async function(){
    var msg=$('#fbMsg'), b=this; msg.className='msg e';
    if(!val) return msg.textContent='Tap the stars first';
    var raw=$('#fbMob').value.trim(), m=mob(raw); if(raw&&!m) return msg.textContent='Mobile looks wrong — or leave it empty';
    b.disabled=true; b.textContent='Sending…';
    var r=await api('FEEDBACK',{rating:val,comment:$('#fbTxt').value,customerName:$('#fbName').value,mobileNo:m,tableId:TABLE,source:'LANDING',requestId:rid('fb')});
    if(!r.success){ b.disabled=false; b.textContent='Send feedback'; msg.textContent=r.error||'Could not send'; return; }
    var rv=r.reviewUrl||'';
    $('#fbBox').innerHTML='<h3 style="font-size:22px">🙏 Thank you!</h3><p class="muted">'+(r.rating>=4?'We are so glad you enjoyed it.':'Sorry it was not perfect — the manager has your note.')+'</p>'
      +(r.rating>=4&&rv?'<a class="btn btn-p" target="_blank" rel="noopener" href="'+esc(rv)+'">⭐ Share it on Google</a>':'');
  };
}
window.addEventListener('scroll',function(){ $('#top').classList.toggle('scrolled',scrollY>8); },{passive:true});
boot();
})();
</script>
