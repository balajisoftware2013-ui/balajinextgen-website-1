<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Welcome</title>
<meta name="description" content="Events, menu, table booking and tickets.">
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Great+Vibes&display=swap" rel="stylesheet">

<!--
  BALAJI NEXTGEN · RESTAURANT WEBSITE (landing)   2026-11-26 "experience" design
  restaurant-landing.html?client=CL00010 [&table=5] [&api=<deployment id>]
  White editorial layout: event ticker · welcome hero · event line-up · menu teaser → restaurant-menu.html · ambience
  gallery · story · timings · table booking · order online · contact · follow · registered business details · footer,
  fixed bottom bar (Home · Events · Reserve · Menu · Profile). Content comes from the ERP (Growth Hub → Settings →
  Landing page, and "Website extras"). Public calls only (GUEST_CHECKIN modes LANDING, RESV_*, TICKET_*, FEEDBACK).
-->
<style>
:root{--ink:#1d1d1f;--ink2:#4a4a4f;--ink3:#8b8b92;--line:#ececf0;--paper:#fff;--soft:#f6f6f8;--slate:#4d6183;--slate2:#3c4e6d;--brand:#4d6183;--brand2:#7b8fb3;--story1:#5b2fc9;--story2:#8a5cf0;--ok:#15803d;--bad:#b91c1c;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 Poppins,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}img{max-width:100%;display:block}
.wrap{max-width:1100px;margin:0 auto;padding:0 18px}
h1,h2,h3{margin:0;font-weight:400;letter-spacing:.04em}
h2.t{font-size:clamp(22px,5.4vw,30px);line-height:1.25;text-transform:uppercase;font-weight:400}
.lead{color:var(--ink3);font-size:13.5px;margin:6px 0 0}
section{padding:42px 0}
.btn{appearance:none;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font:500 13px/1 Poppins,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:13px 20px;min-height:44px;border-radius:2px;transition:transform .12s,background .15s}
.btn:active{transform:scale(.98)}.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn-s{background:var(--slate);color:#fff}.btn-s:hover{background:var(--slate2)}
.btn-o{background:#fff;color:var(--ink);border:1px solid var(--ink)}
.btn-l{background:none;color:var(--ink);padding:8px 0;min-height:0;font-weight:500}
.arrow{display:inline-block;transform:rotate(-45deg);font-size:15px;line-height:1}
.btn-wa{background:#25D366;color:#fff}
/* ticker */
.tick{position:sticky;top:0;z-index:50;background:#fff;border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap}
.tick .row{display:inline-flex;gap:34px;padding:9px 0;animation:tk 38s linear infinite}
.tick:hover .row{animation-play-state:paused}
.tick a{display:inline-flex;align-items:center;gap:12px;text-decoration:none}
.tick small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);line-height:1.2}
.tick b{display:block;font-weight:400;font-size:13px;text-transform:uppercase;letter-spacing:.04em;line-height:1.2}
.tick .dt{font-style:normal;font-size:21px;font-weight:500;letter-spacing:0}
.tick em{font-style:normal;font-size:22px;font-weight:400;letter-spacing:0}
@keyframes tk{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.tick.plain .row{animation:none;padding-left:18px}
/* hero */
.hero{position:relative;min-height:min(86vh,720px);display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;overflow:hidden;background:#222}
.hero .bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:grayscale(1) contrast(1.05) brightness(.82);transform:scale(1.03)}
.hero video.bg{width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.28) 60%,rgba(0,0,0,.45))}
.hero .hin{position:relative;z-index:2;padding:40px 18px}
.hero .lg{width:96px;height:96px;margin:0 auto 18px;background:#fff;border-radius:6px;object-fit:contain;padding:8px;box-shadow:0 8px 30px rgba(0,0,0,.3)}
.hero h1{font-size:clamp(26px,6.4vw,44px);text-transform:uppercase;letter-spacing:.08em;line-height:1.3;text-shadow:0 2px 18px rgba(0,0,0,.35)}
.hero .tag{display:inline-block;margin-top:14px;background:#111;color:#fff;font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:5px 12px;border-radius:99px}
.hero p{max-width:560px;margin:14px auto 0;font-weight:300;color:rgba(255,255,255,.9)}
.pattern{background:radial-gradient(circle at 25% 20%,#5b5b66,transparent 50%),radial-gradient(circle at 80% 10%,#3b3b44,transparent 55%),#26262c}
/* carousels */
.car{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 18px 12px;margin:0 -18px;scrollbar-width:none}
.car::-webkit-scrollbar{display:none}
.car>*{scroll-snap-align:center;flex:0 0 auto}
.ev{width:min(78vw,300px);background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(20,20,40,.12);display:flex;flex-direction:column}
.ev .pic{aspect-ratio:3/4;background:#ddd center/cover no-repeat;position:relative}
.ev .tg{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border-radius:99px;backdrop-filter:blur(4px)}
.ev .bd{padding:14px 16px 0}.ev h3{font-size:16px;text-transform:uppercase;font-weight:500;letter-spacing:.03em}
.ev .when{font-size:11.5px;color:var(--ink2);margin:4px 0 14px}
.ev .go{margin-top:auto;display:block;width:100%;text-align:center;background:var(--slate);color:#fff;padding:13px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;border:0;cursor:pointer;font-family:inherit;text-decoration:none}
.ev .go[disabled]{background:#9aa4b5}
/* menu teaser */
.teaser{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:center}
.teaser .imgs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.teaser .imgs div{aspect-ratio:1;background:#eee center/cover no-repeat;border-radius:4px}
.teaser .imgs div:first-child{grid-column:1/-1;aspect-ratio:16/10}
@media(max-width:760px){.teaser{grid-template-columns:1fr}}
.gal{width:min(70vw,320px);aspect-ratio:4/3;background:#ddd center/cover no-repeat;border-radius:4px}
/* story */
.story{background:linear-gradient(135deg,var(--story1),var(--story2));color:#fff;padding:30px 24px;border-radius:2px;font-weight:300;font-size:14px;white-space:pre-line}
.story h2{color:#fff;margin-bottom:10px}
/* timings */
.hrs{display:grid;grid-template-columns:auto 1fr;gap:4px 18px;font-size:13px;color:var(--ink2);margin-top:12px}
.hrs b{font-weight:500;color:var(--ink);letter-spacing:.05em}
.kick{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3)}
/* order online */
.oo{display:flex;gap:14px;flex-wrap:wrap;margin-top:16px}
.oo a{display:inline-flex;align-items:center;justify-content:center;min-width:120px;height:64px;border-radius:10px;color:#fff;text-decoration:none;font-weight:600;font-size:17px;letter-spacing:.02em;box-shadow:0 6px 18px rgba(0,0,0,.12)}
.oo .sw{background:#fc8019}.oo .zo{background:#e23744}
/* contact */
.ci{display:grid;grid-template-columns:28px 1fr;gap:14px;align-items:start;margin-top:18px}
.ci svg{width:24px;height:24px;stroke:var(--ink);fill:none;stroke-width:1.6}
.ci small{display:block;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.ci a,.ci span{font-size:14px;text-decoration:none}
.soc{display:flex;gap:16px;margin-top:16px}.soc a{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;color:#fff;text-decoration:none}
.soc .fb{background:#1877f2;border-radius:50%}.soc .ig{background:radial-gradient(circle at 30% 110%,#fdc468,#df4996 55%,#7d3bcf)}
.soc svg{width:26px;height:26px;fill:#fff}
.reg{display:grid;grid-template-columns:1fr 1fr;gap:16px 24px;margin-top:16px}
.reg small{display:block;font-size:10.5px;color:var(--ink3)}.reg span{font-size:12.5px;font-weight:500}
.own{font-family:'Great Vibes',cursive;font-size:clamp(44px,12vw,70px);line-height:1.05;color:#7a7a80;margin:6px 0 10px}
footer{padding:10px 0 calc(var(--safe-b) + 110px);font-size:11.5px;color:var(--ink3)}
footer a{color:var(--ink3)}
/* booking + forms */
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 8px 24px rgba(20,20,40,.06)}
.bk{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:20px;margin-top:18px}.bk>*{min-width:0}
@media(max-width:860px){.bk{grid-template-columns:1fr}}
label.l{display:block;font-size:11.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);margin:14px 0 6px}
.in{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:12px;font:400 14.5px Poppins,sans-serif;color:var(--ink);min-height:46px}
.in:focus{outline:2px solid color-mix(in srgb,var(--slate) 40%,transparent);border-color:var(--slate)}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}.row2>*{min-width:0}@media(max-width:420px){.row2{grid-template-columns:1fr}}
.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:60px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 6px;text-align:center;cursor:pointer;color:var(--ink2);font-family:inherit}
.day b{display:block;font-size:19px;font-weight:500;color:var(--ink)}.day small{font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.day.on{background:var(--ink);color:#fff;border-color:var(--ink)}.day.on b{color:#fff}.day.off{opacity:.35;pointer-events:none}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 4px;text-align:center;cursor:pointer;font:500 13.5px Poppins,sans-serif}
.slot small{display:block;font-size:10px;color:var(--ink3);font-weight:400}
.slot.on{border-color:var(--slate);background:#eef1f7;color:var(--slate2)}.slot.full{opacity:.35;pointer-events:none;text-decoration:line-through}
.pax{display:flex;align-items:center;gap:10px}.pax button{width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer}
.pax output{font-size:22px;font-weight:500;min-width:42px;text-align:center}
.cons{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:var(--ink2);margin-top:14px}.cons input{width:18px;height:18px;accent-color:var(--slate)}
.msg{font-size:13px;margin-top:10px;min-height:18px}.msg.e{color:var(--bad)}.msg.o{color:var(--ok)}
.done{border:1px dashed #86c59a;background:#f0fdf4;border-radius:10px;padding:14px;margin-top:14px}.done h3{font-size:17px;color:var(--ok);font-weight:500}
.side ul{padding-left:18px;margin:8px 0;color:var(--ink2);font-size:13.5px}
.stars{display:flex;gap:6px}.stars button{border:0;background:none;font-size:34px;cursor:pointer;filter:grayscale(1);opacity:.35;padding:0 2px}.stars button.on{filter:none;opacity:1}
.mine{display:flex;flex-direction:column;gap:8px}
.mine .it{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13.5px}
.st{font-size:10.5px;font-weight:600;border-radius:99px;padding:3px 9px;background:#f3f4f6;color:#374151;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap}
.st.CONFIRMED,.st.PAID,.st.CHECKED_IN,.st.SEATED{background:#dcfce7;color:#166534}.st.PENDING,.st.RESERVED{background:#fef3c7;color:#92400e}.st.DECLINED,.st.CANCELLED,.st.EXPIRED,.st.NO_SHOW{background:#fee2e2;color:#991b1b}
.btn-sm{min-height:34px;padding:8px 12px;font-size:11px}
.chip{display:inline-flex;gap:6px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;font-size:11.5px;color:var(--ink2)}.chip.so{opacity:.5;text-decoration:line-through}
.modal{position:fixed;inset:0;z-index:100;background:rgba(10,10,20,.55);display:none;align-items:flex-end;justify-content:center}.modal.on{display:flex}
.modal .box{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:20px 18px calc(var(--safe-b) + 18px);max-height:94vh;overflow:auto}
@media(min-width:700px){.modal{align-items:center}.modal .box{border-radius:18px}}
.tix{display:flex;flex-direction:column;gap:8px}.tix label{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.tix label.on{border-color:var(--slate);background:#f1f4f9}.tix label.so{opacity:.45;pointer-events:none}
.code{font:600 32px/1 Poppins,monospace;letter-spacing:.18em;text-align:center;padding:12px;background:var(--soft);border-radius:10px;margin:10px 0}#qr{display:flex;justify-content:center;margin:6px 0}
/* bottom bar */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 10px);z-index:60;width:min(94vw,520px);height:62px;background:#fff;border-radius:34px;box-shadow:0 6px 28px rgba(0,0,0,.16);display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
.nav a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;font-size:10.5px;color:var(--ink2)}
.nav a svg{width:22px;height:22px;fill:var(--ink)}
.nav a.on{color:var(--slate)}.nav a.on svg{fill:var(--slate)}
.nav .rs{position:relative;top:-18px}
.nav .rs i{width:52px;height:52px;border-radius:50%;background:var(--slate);display:grid;place-items:center;box-shadow:0 6px 16px rgba(77,97,131,.45);border:4px solid #fff}
.nav .rs i svg{fill:#fff;width:24px;height:24px}
.state{padding:90px 18px;text-align:center}
.sk{height:14px;border-radius:7px;background:linear-gradient(90deg,#eee,#f7f7f7,#eee);background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>.muted{color:var(--ink3)}.kicker{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}.btn-p{background:var(--slate);color:#fff}.state h2{font-size:22px;margin-bottom:8px}</style>
</head>

<script>
(function(){
'use strict';
/* ───────── config ───────── */
var qs=new URLSearchParams(location.search);
var CID=String(qs.get('client')||qs.get('clientId')||'').trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,30);
/* 2026-11-09 ("Link not complete" when the link has no ?client=): use the restaurant this phone opened last, or the ERP
   login on this browser (staff testing from the dashboard), and put it back into the address bar so the link can be shared. */
if(!CID){ try{
  var lc=localStorage.getItem('bnx_landing_last_client')||'';
  if(!lc){ var u=JSON.parse(localStorage.getItem('ERP_USER')||sessionStorage.getItem('ERP_USER')||'null')||{}; lc=u.CLIENT_ID||u.clientId||localStorage.getItem('ERP_CLIENT')||''; }
  lc=String(lc).trim().toUpperCase().replace(/[^A-Z0-9_-]/g,'').slice(0,30);
  if(/^[A-Z0-9_-]{3,30}$/.test(lc)){ CID=lc; qs.set('client',CID); history.replaceState(null,'',location.pathname+'?'+qs.toString()+location.hash); }
}catch(e){} }
try{ if(CID) localStorage.setItem('bnx_landing_last_client',CID); }catch(e){}
var TABLE=String(qs.get('table')||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,12);
var DEF_API='AKfycbwHdqrP4IvuVD2ZkupNybrEkiXu3kmuI6-tQoiHgYxoqr1KgUupeFsi3PIoFEbuv6XA';
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }
(function(){ var a=qs.get('api'); if(/^AKfycb[A-Za-z0-9_-]{20,}$/.test(a||'')) ls('bnx_landing_api',a); })();
function endpoints(){
  var out=[], add=function(id){ if(/^AKfycb[A-Za-z0-9_-]{20,}$/.test(id||'')){ var u='https://script.google.com/macros/s/'+id+'/exec'; if(out.indexOf(u)<0) out.push(u); } };
  add(ls('bnx_landing_api')); var ok=ls('bnx_guest_api_ok'); if(/\/exec$/.test(ok||'')) { var m=String(ok).match(/\/s\/([^/]+)\/exec/); if(m) add(m[1]); }
  add(ls('bnx_api_core')); add(DEF_API); return out;
}
function devId(){ try{ var d=localStorage.getItem('bnx_device_id'); if(!d){ d='dv-'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); localStorage.setItem('bnx_device_id',d); } return d; }catch(e){ return ''; } }
async function api(mode,params,timeoutMs){
  var q=new URLSearchParams({action:'GUEST_CHECKIN',mode:mode,clientId:CID,deviceId:devId()});
  Object.keys(params||{}).forEach(function(k){ var v=params[k]; if(v!==undefined&&v!==null&&v!=='') q.set(k,String(v)); });
  var last={success:false,offline:true,error:'Could not reach the restaurant — check your connection.'};
  var eps=endpoints();
  for(var i=0;i<eps.length;i++){
    var ctl=new AbortController(), tm=setTimeout(function(){ ctl.abort(); }, timeoutMs||45000);
    try{ var j=await (await fetch(eps[i]+'?'+q.toString(),{signal:ctl.signal})).json();
      if(j&&j.mode===mode){ var m=eps[i].match(/\/s\/([^/]+)\/exec/); if(m) ls('bnx_landing_api',m[1]); return j; }
      last={success:false,error:'This restaurant\'s booking service is not installed yet.'};
    }catch(e){ last={success:false,offline:true,error:'Could not reach the restaurant — check your connection.'}; }
    finally{ clearTimeout(tm); }
  }
  return last;
}
/* ───────── helpers ───────── */
var $=function(s,r){ return (r||document).querySelector(s); };
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function https(u){ return /^https:\/\//i.test(String(u||''))?String(u):''; }
function rupee(n){ return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}); }
function istToday(){ return new Date(Date.now()+5.5*3600e3).toISOString().slice(0,10); }
function addDays(d,n){ var x=new Date(d+'T12:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); }
function dParts(d){ var x=new Date(d+'T12:00:00Z'); return { dow:x.toLocaleDateString('en-IN',{weekday:'short',timeZone:'UTC'}), day:x.getUTCDate(), mon:x.toLocaleDateString('en-IN',{month:'short',timeZone:'UTC'}), nice:x.toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}) }; }

/* 2026-11-27 welcome video ("video already uploaded but not shown"): the video saved in Dashboard › Customer QR Promotion
   is a Google Drive (or YouTube) link — this page only played links ending in .mp4 / .webm, so Drive videos never showed.
   Same player rule as the order page: Drive → direct file (muted autoplay loop) → Drive preview if that fails; YouTube → embed. */
function bnxVParse_(u){ u=String(u||'').trim(); if(!/^https:\/\//i.test(u)) return null;
  var yt=u.match(/(?:youtu\.be\/|youtube(?:-nocookie)?\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/))([\w-]{11})/);
  if(yt) return {kind:'youtube',src:'https://www.youtube-nocookie.com/embed/'+yt[1]+'?autoplay=1&mute=1&playsinline=1&loop=1&playlist='+yt[1]+'&controls=0&modestbranding=1&rel=0',poster:'https://i.ytimg.com/vi/'+yt[1]+'/hqdefault.jpg'};
  var dr=u.match(/(?:drive|docs)\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^#]*&)?id=)([\w-]{20,})/)||u.match(/drive\.usercontent\.google\.com\/download\?(?:[^#]*&)?id=([\w-]{20,})/);
  if(dr) return {kind:'drive',src:'https://drive.usercontent.google.com/download?id='+dr[1]+'&export=download&confirm=t',fallback:'https://drive.google.com/file/d/'+dr[1]+'/preview',poster:'https://drive.google.com/thumbnail?id='+dr[1]+'&sz=w1280'};
  if(/\.(mp4|m4v|webm|ogv|mov)(\?|#|$)/i.test(u)||/\/video\//i.test(u)) return {kind:'file',src:u};
  return null; }

function bnxSiteWelcome_(cid){ var tries=['assets/shorts/'+cid+'/','/Dashboard/restaurant/assets/shorts/'+cid+'/'], i=0;

    return fetch(b+'shorts.json?d='+new Date().toISOString().slice(0,10),{cache:'no-cache'}).then(function(r){ if(!r.ok) throw 0; return r.json(); })
      .then(function(j){ var w=j&&j.welcome; if(!w) return ''; return /^https?:\/\//.test(w)?w:new URL(b+String(w).replace(/^\.?\//,''),location.href).href; }).catch(next); }
  return next(); }

   the guest's name + mobile come from the token (no typing), and the token leaves the address bar at once. */
async function waToken(){
  var tok=String(qs.get('wt')||'').replace(/[^A-Za-z0-9_-]/g,'').slice(0,64); if(!tok) return;
  try{ qs.delete('wt'); history.replaceState(null,'',location.pathname+(qs.toString()?'?'+qs.toString():'')+location.hash); }catch(e){}
  var r=await api('WA_TOKEN',{token:tok,purpose:'FEEDBACK'},20000);
  if(!(r&&r.success!==false&&r.known&&mob(r.mobile))) return;
  remember(String(r.customerName||'').trim(),mob(r.mobile));
  var set=function(id,v){ var el=document.getElementById(id); if(el&&!el.value&&v) el.value=v; };
  set('fbName',who.name); set('fbMob',who.mobile); set('rvName',who.name); set('rvMob',who.mobile);
  if(r.tableId&&!TABLE) TABLE=String(r.tableId).replace(/[^A-Za-z0-9_-]/g,'').slice(0,12);

}

   +'</div></section>';
  /* FEEDBACK */
  if(fb.on) h+='<section id="feedback" style="background:var(--soft)"><div class="wrap" style="max-width:640px"><div class="kick">Tell us</div><h2 class="t">How was your visit?</h2><p class="lead">Goes straight to the manager.</p><div class="panel" id="fbBox" style="margin-top:14px">'
   +'<div class="stars" id="fbStars" role="radiogroup" aria-label="Rating">'+[1,2,3,4,5].map(function(n){ return '<button type="button" data-v="'+n+'" aria-label="'+n+' star'+(n>1?'s':'')+'">⭐</button>'; }).join('')+'</div>'
   +'<textarea class="in" id="fbTxt" rows="3" maxlength="500" placeholder="What did you like? What can we do better?" style="margin-top:12px;min-height:90px"></textarea>'
   +'<div class="row2"><input class="in" id="fbName" placeholder="Name (optional)" maxlength="60" style="margin-top:10px"><input class="in" id="fbMob" type="tel" inputmode="numeric" placeholder="Mobile (optional)" maxlength="14" style="margin-top:10px"></div>'
   +'<button class="btn btn-s" id="fbGo" style="width:100%;margin-top:14px">Send feedback</button><div class="msg" id="fbMsg" role="status"></div></div></div></section>';
  /* REGISTERED DETAILS */
  var reg=[['GST Number',i.gstin],['Place Name',i.placeName],['Registered Name',i.legalName],['FSSAI Number',i.fssai]].filter(function(r){ return String(r[1]||'').trim(); });
  if(reg.length) h+='<section style="padding-top:20px"><div class="wrap"><h2 class="t" style="font-size:18px">Registered business details</h2><div class="reg">'+reg.map(function(r){ return '<div><small>'+esc(r[0])+'</small><span>'+esc(r[1])+'</span></div>'; }).join('')+'</div></div></section>';
  h+='<footer><div class="wrap"><div class="own">Own the<br>experience!</div><div>Crafted with ♥ by '+esc(name)+' · Powered by Balaji NextGen</div><div style="margin-top:6px">© '+new Date().getFullYear()+' '+esc(i.legalName||name)+'</div></div></footer>';
  $('#app').innerHTML=h;
  if(hv) bnxSiteWelcome_(CID).then(function(w){ var hb=$('#heroVid'); if(hb) bnxVMount_(hb,w||D.video); });
  /* bottom bar */
  $('#nEv').hidden=!ev.length; $('#nRv').style.visibility=rv.on?'':'hidden'; $('#nMenu').href=MP; $('#dock').hidden=false;
  $('#nMe').onclick=function(e){ e.preventDefault(); var b=$('#mineBox'), a=mine(); if(b&&a.length){ b.scrollIntoView({behavior:'smooth',block:'center'}); } else if(fb.on){ $('#feedback').scrollIntoView({behavior:'smooth'}); } else $('#contact').scrollIntoView({behavior:'smooth'}); };
  var evA=$('#evAll'); if(evA) evA.onclick=function(e){ e.preventDefault(); var c=$('#evCar'); if(c){ c.style.flexWrap=c.style.flexWrap?'':'wrap'; c.style.justifyContent=c.style.flexWrap?'center':''; evA.lastChild.textContent=c.style.flexWrap?' Show as slider':' View all events'; } };
  if(rv.on) initReserve(rv);
  if(fb.on) initFeedback();
  document.querySelectorAll('[data-ev]').forEach(function(b){ b.onclick=function(){ openTickets(b.getAttribute('data-ev')); }; });
  document.querySelectorAll('[data-evres]').forEach(function(a){ a.addEventListener('click',function(){ RV.eventId=a.getAttribute('data-evres'); pickDay(a.getAttribute('data-evdate')); }); });
  paintMine();
  /* active tab follows scroll */
  var secs=[['home','nHome'],['events','nEv'],['reserve','nRv'],['menu','nMenu']];
  if('IntersectionObserver' in window){ var io=new IntersectionObserver(function(es){ es.forEach(function(x){ if(x.isIntersecting){ var s=secs.filter(function(p){ return p[0]===x.target.id; })[0]; if(s){ document.querySelectorAll('.nav a').forEach(function(a){ a.classList.toggle('on',a.id===s[1]); }); } } }); },{rootMargin:'-45% 0px -50% 0px'});
    secs.forEach(function(p){ var el=document.getElementById(p[0]); if(el) io.observe(el); }); }
  if(location.hash){ var t=document.getElementById(location.hash.slice(1)); if(t) setTimeout(function(){ t.scrollIntoView({behavior:'smooth'}); },60); }
  var tq=qs.get('ticket'); if(tq){ var ee=ev.filter(function(x){ return x.id===tq; })[0]; if(ee) openTickets(ee.id); }
}
/* ───────── reservations ───────── */
var RV={date:'',time:'',pax:2,eventId:''};
function initReserve(rv){
  var today=rv.today||istToday(), days=Math.min(rv.maxDays||60,30), closed=String(rv.closedDays||'').toLowerCase().split(/[\s,]+/).filter(String), h='';
  for(var k=0;k<days;k++){ var d=addDays(today,k), p=dParts(d), off=closed.some(function(c){ return c===d||c.slice(0,3)===p.dow.toLowerCase().slice(0,3); });
    h+='<button type="button" class="day'+(off?' off':'')+'" data-d="'+d+'"><small>'+(k===0?'Today':k===1?'Tmrw':esc(p.dow))+'</small><b>'+p.day+'</b><small>'+esc(p.mon)+'</small></button>'; }
  $('#rvDays').innerHTML=h;
  $('#rvDays').onclick=function(e){ var b=e.target.closest('.day'); if(b) pickDay(b.getAttribute('data-d')); };
  $('#pxM').onclick=function(){ RV.pax=Math.max(1,RV.pax-1); $('#pxV').textContent=RV.pax; paintSlots(); };
  $('#pxP').onclick=function(){ RV.pax=Math.min(rv.maxPax||20,RV.pax+1); $('#pxV').textContent=RV.pax; paintSlots(); };
  if(who.name) $('#rvName').value=who.name; if(who.mobile) $('#rvMob').value=who.mobile;
  $('#rvForm').onsubmit=function(e){ e.preventDefault(); reserve(); };
  var first=$('#rvDays .day:not(.off)'); if(first) pickDay(first.getAttribute('data-d'));
}
var SLOTS=[];
async function pickDay(d){
  if(!d) return; RV.date=d; RV.time='';
  document.querySelectorAll('#rvDays .day').forEach(function(b){ b.classList.toggle('on',b.getAttribute('data-d')===d); });
  var on=$('#rvDays .day.on'); if(on) on.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  $('#rvSlots').innerHTML='<div class="sk"></div>';
  var r=await api('RESV_SLOTS',{date:d});
  if(RV.date!==d) return;
  if(!r.success){ $('#rvSlots').innerHTML='<div class="msg e">'+esc(r.error)+'</div>'; return; }
  if(r.closed){ $('#rvSlots').innerHTML='<div class="muted">'+esc(r.closed)+'</div>'; SLOTS=[]; return; }
  SLOTS=r.slots||[]; paintSlots();
}
function paintSlots(){
  if(!SLOTS.length){ $('#rvSlots').innerHTML='<div class="muted">No times available on this day.</div>'; return; }
  var any=false;
  $('#rvSlots').innerHTML=SLOTS.map(function(s){ var full=s.left<RV.pax; if(!full) any=true; return '<button type="button" class="slot'+(full?' full':'')+(RV.time===s.time?' on':'')+'" data-t="'+s.time+'">'+esc(t12(s.time))+'<small>'+(s.past?'closed':full?(s.left?'only '+s.left:'full'):s.left<=8?s.left+' seats left':'available')+'</small></button>'; }).join('')
    +(any?'':'<div class="muted" style="grid-column:1/-1">Fully booked for '+RV.pax+' — try another day or fewer guests.</div>');
  $('#rvSlots').onclick=function(e){ var b=e.target.closest('.slot'); if(!b) return; RV.time=b.getAttribute('data-t'); paintSlots(); };
}
async function reserve(){
  var msg=$('#rvMsg'), btn=$('#rvGo'), name=$('#rvName').value.trim(), m=mob($('#rvMob').value);
  msg.className='msg e';
  if(!RV.date) return msg.textContent='Choose a day';
  if(!RV.time) return msg.textContent='Choose a time';
  if(!name) return msg.textContent='Enter your name';
  if(!m) return msg.textContent='Enter a valid 10-digit mobile number';
  btn.disabled=true; btn.textContent='Sending…'; msg.textContent='';
  var r=await api('RESERVE',{date:RV.date,time:RV.time,pax:RV.pax,customerName:name,mobileNo:m,occasion:$('#rvOcc').value,area:$('#rvArea').value,note:$('#rvNote').value,
    eventId:RV.eventId||'',marketingOptIn:$('#rvMk').checked?'true':'',source:'LANDING',requestId:rid('rv')});
  btn.disabled=false; btn.textContent='Request booking';
  if(!r.success){ msg.textContent=r.error||'Could not book'; if(r.soldOut) pickDay(RV.date); return; }
  remember(name,m);
  var a=mine().filter(function(x){ return x.id!==r.reqId; }); a.push({k:'R',id:r.reqId,m:m,d:r.date,t:r.time,p:r.pax,s:r.status}); saveMine(a);
  var p=dParts(r.date);
  $('#rvDone').innerHTML='<div class="done"><h3>'+(r.status==='CONFIRMED'?'✅ Table confirmed':r.duplicate?'You already have a booking that day':'🙌 Request received')+'</h3>'
    +'<div style="margin-top:6px;font-size:15px"><b>'+esc(p.nice)+'</b> at <b>'+esc(t12(r.time))+'</b> · '+r.pax+' guest'+(r.pax>1?'s':'')+'</div>'
    +'<div class="muted" style="font-size:13.5px;margin-top:6px">'+(r.status==='CONFIRMED'?'See you soon!':'We will confirm on WhatsApp shortly. Booking ref <b>'+esc(r.reqId)+'</b>.')+'</div></div>';
  msg.textContent=''; paintMine(); if(r.status!=='CONFIRMED') pickDay(RV.date);
}
/* ───────── my bookings & tickets (this phone) ───────── */
async function paintMine(refresh){
  var box=$('#mineBox'); if(!box) return; var a=mine(); var today=istToday();
  a=a.filter(function(x){ return (x.d||'9999')>=addDays(today,-1); });
  if(!a.length){ box.innerHTML=''; return; }
  box.innerHTML='<h3 style="font-size:18px">Your bookings</h3><div class="mine">'+a.slice().reverse().map(function(x){
    return '<div class="it"><div>'+(x.k==='R'?'📅 '+esc(dParts(x.d).nice)+' · '+esc(t12(x.t))+' · '+x.p+' pax':'🎟️ '+esc(x.e||'Event')+' · <b>'+esc(x.id)+'</b>')+'</div><div style="display:flex;gap:6px;align-items:center"><span class="st '+esc(x.s)+'">'+esc(String(x.s||'').replace('_',' '))+'</span>'
      +(x.k==='R'&&/^(PENDING|CONFIRMED)$/.test(x.s)?'<button class="btn btn-o btn-sm" data-cx="'+esc(x.id)+'" style="min-height:30px;padding:5px 9px">Cancel</button>':'')+(x.k==='T'?'<button class="btn btn-o btn-sm" data-show="'+esc(x.id)+'" style="min-height:30px;padding:5px 9px">Show</button>':'')+'</div></div>'; }).join('')+'</div>';
  box.querySelectorAll('[data-cx]').forEach(function(b){ b.onclick=async function(){ var id=b.getAttribute('data-cx'), x=mine().filter(function(y){ return y.id===id; })[0]; if(!x||!confirm('Cancel this booking?')) return;
    b.disabled=true; var r=await api('RESV_CANCEL',{reqId:id,mobileNo:x.m}); if(r.success){ var all=mine(); all.forEach(function(y){ if(y.id===id) y.s='CANCELLED'; }); saveMine(all); paintMine(); if(RV.date) pickDay(RV.date); } else { alert(r.error||'Could not cancel'); b.disabled=false; } }; });
  box.querySelectorAll('[data-show]').forEach(function(b){ b.onclick=function(){ var x=mine().filter(function(y){ return y.id===b.getAttribute('data-show'); })[0]; if(x) showTicket(x); }; });
  if(refresh===false) return;
  /* live status */
  var changed=false;
  for(var i=0;i<a.length;i++){ var x=a[i]; if(/^(CANCELLED|DECLINED|EXPIRED|CHECKED_IN|NO_SHOW|SEATED)$/.test(x.s)) continue;
    var r=x.k==='R'?await api('RESV_STATUS',{reqId:x.id,mobileNo:x.m}):await api('TICKET_STATUS',{code:x.id,mobileNo:x.m});
    if(r.success&&r.status&&r.status!==x.s){ var all=mine(); all.forEach(function(y){ if(y.id===x.id) y.s=r.status; }); saveMine(all); changed=true; } }
  if(changed) paintMine(false);
}
/* ───────── tickets ───────── */
function openTickets(evId){
  var e=(D.events||[]).filter(function(x){ return x.id===evId; })[0]; if(!e) return;
  var t=(e.tickets||[]).filter(function(x){ return x.active!==false; }), sel=(t.filter(function(x){ return x.left>0; })[0]||{}).typeId, qty=1;
  var box=$('#tixBox'), p=dParts(e.date);
  function paint(){
    var ty=t.filter(function(x){ return x.typeId===sel; })[0]||{}, max=Math.max(1,Math.min(ty.maxPer||10,ty.left||1)); qty=Math.min(qty,max);
    box.innerHTML='<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><div class="kicker">'+esc(p.nice)+(e.time?' · '+esc(e.time):'')+'</div><h3 id="tixTitle" style="font-size:24px;margin-top:4px">'+esc(e.title)+'</h3></div><button class="btn btn-o btn-sm" id="tixX" aria-label="Close">✕</button></div>'
      +'<label class="l">Ticket</label><div class="tix">'+t.map(function(x){ return '<label class="'+(x.typeId===sel?'on ':'')+(x.left?'':'so')+'"><span><input type="radio" name="tt" value="'+esc(x.typeId)+'" '+(x.typeId===sel?'checked':'')+' style="accent-color:var(--brand);margin-right:8px"><b>'+esc(x.name)+'</b>'+(x.note?'<br><small class="muted">'+esc(x.note)+'</small>':'')+'</span><span style="text-align:right"><b>'+(x.price?rupee(x.price):'Free')+'</b><br><small class="muted">'+(x.left?(x.left<=10?x.left+' left':'available'):'sold out')+'</small></span></label>'; }).join('')+'</div>'
      +'<label class="l">How many?</label><div class="pax"><button type="button" id="tqM">−</button><output id="tqV">'+qty+'</output><button type="button" id="tqP">+</button><span class="muted">'+(ty.price?'Total '+rupee(ty.price*qty):'')+'</span></div>'
      +'<div class="row2"><div><label class="l" for="tkName">Name</label><input class="in" id="tkName" maxlength="60" autocomplete="name" value="'+esc(who.name||'')+'"></div><div><label class="l" for="tkMob">Mobile (WhatsApp)</label><input class="in" id="tkMob" type="tel" inputmode="numeric" maxlength="14" autocomplete="tel-national" value="'+esc(who.mobile||'')+'"></div></div>'
      +'<label class="cons"><input type="checkbox" id="tkMk"> <span>Optional: send me offers & event news on WhatsApp.</span></label>'
      +'<button class="btn btn-p" id="tkGo" style="width:100%;margin-top:14px">'+(ty.price?'Book · pay '+rupee(ty.price*qty):'Get free pass')+'</button><div class="msg e" id="tkMsg"></div>';
    $('#tixX').onclick=close;
    box.querySelectorAll('input[name=tt]').forEach(function(r){ r.onchange=function(){ sel=r.value; paint(); }; });
    $('#tqM').onclick=function(){ qty=Math.max(1,qty-1); paint(); }; $('#tqP').onclick=function(){ qty=Math.min(max,qty+1); paint(); };
    $('#tkGo').onclick=async function(){
      var nm=$('#tkName').value.trim(), m=mob($('#tkMob').value), msg=$('#tkMsg'), b=this;
      if(!sel) return msg.textContent='Choose a ticket'; if(!nm) return msg.textContent='Enter your name'; if(!m) return msg.textContent='Enter a valid 10-digit mobile number';
      b.disabled=true; b.textContent='Booking…';
      var r=await api('TICKET_BOOK',{eventId:e.id,typeId:sel,qty:qty,customerName:nm,mobileNo:m,marketingOptIn:$('#tkMk').checked?'true':'',source:'LANDING',requestId:rid('tk')});
      if(!r.success){ b.disabled=false; b.textContent='Try again'; msg.textContent=r.error||'Could not book'; if(r.soldOut){ var ty2=t.filter(function(x){ return x.typeId===sel; })[0]; if(ty2) ty2.left=r.left||0; setTimeout(paint,1200); } return; }
      remember(nm,m);
      var it={k:'T',id:r.code,m:m,d:r.date,e:r.event,s:r.status,q:r.qty,a:r.amount,ty:r.type,u:r.upiLink||'',tm:r.time||''};
      var a=mine().filter(function(x){ return x.id!==r.code; }); a.push(it); saveMine(a); paintMine(false);
      var ty3=t.filter(function(x){ return x.typeId===sel; })[0]; if(ty3) ty3.left=Math.max(0,ty3.left-r.qty);
      showTicket(it);
    };
  }
  function close(){ $('#tixModal').classList.remove('on'); }
  $('#tixModal').onclick=function(ev2){ if(ev2.target.id==='tixModal') close(); };
  paint(); $('#tixModal').classList.add('on');
}
function showTicket(x){
  var box=$('#tixBox'), unpaid=x.s==='RESERVED'&&Number(x.a)>0;
  box.innerHTML='<div style="display:flex;justify-content:space-between;gap:10px"><div><div class="kicker">'+esc(dParts(x.d).nice)+(x.tm?' · '+esc(x.tm):'')+'</div><h3 style="font-size:23px;margin-top:4px">'+esc(x.e||'Your ticket')+'</h3></div><button class="btn btn-o btn-sm" id="tixX">✕</button></div>'
    +'<div class="muted" style="margin-top:6px">'+esc(x.q||1)+' × '+esc(x.ty||'Ticket')+(Number(x.a)?' · '+rupee(x.a):' · Free')+'</div>'
    +'<div id="qr"></div><div class="code">'+esc(x.id)+'</div>'
    +'<div style="text-align:center"><span class="st '+esc(x.s)+'">'+esc(unpaid?'Payment pending':String(x.s).replace('_',' '))+'</span></div>'
    +(unpaid?(x.u?'<a class="btn btn-p" style="width:100%;margin-top:14px" href="'+esc(x.u)+'">Pay '+rupee(x.a)+' with UPI</a><p class="muted" style="font-size:12.5px;text-align:center">Opens GPay / PhonePe / Paytm. Staff confirm payment; you can also pay at the door.</p>'
      :'<p class="muted" style="font-size:13px;text-align:center">Pay at the door — show this code.</p>'):'<p class="muted" style="font-size:13px;text-align:center">Show this code at the entrance. A screenshot works too.</p>');
  $('#tixX').onclick=function(){ $('#tixModal').classList.remove('on'); };
  $('#tixModal').classList.add('on');
  try{ if(window.QRCode) new QRCode($('#qr'),{text:'BNXTK:'+CID+':'+x.id,width:150,height:150,correctLevel:QRCode.CorrectLevel.M}); }catch(e){}
}
/* ───────── feedback ───────── */
function initFeedback(){
  var val=0;
  $('#fbStars').onclick=function(e){ var b=e.target.closest('button'); if(!b) return; val=Number(b.getAttribute('data-v'));
    this.querySelectorAll('button').forEach(function(x){ x.classList.toggle('on',Number(x.getAttribute('data-v'))<=val); }); };
  if(who.name) $('#fbName').value=who.name; if(who.mobile) $('#fbMob').value=who.mobile;
  $('#fbGo').onclick=async function(){
    var msg=$('#fbMsg'), b=this; msg.className='msg e';
    if(!val) return msg.textContent='Tap the stars first';
    var raw=$('#fbMob').value.trim(), m=mob(raw); if(raw&&!m) return msg.textContent='Mobile looks wrong — or leave it empty';
    b.disabled=true; b.textContent='Sending…';
    var r=await api('FEEDBACK',{rating:val,comment:$('#fbTxt').value,customerName:$('#fbName').value,mobileNo:m,tableId:TABLE,source:'LANDING',requestId:rid('fb')});
    if(!r.success){ b.disabled=false; b.textContent='Send feedback'; msg.textContent=r.error||'Could not send'; return; }
    var rv=r.reviewUrl||'';
    $('#fbBox').innerHTML='<h3 style="font-size:22px">🙏 Thank you!</h3><p class="muted">'+(r.rating>=4?'We are so glad you enjoyed it.':'Sorry it was not perfect — the manager has your note.')+'</p>'
      +(r.rating>=4&&rv?'<a class="btn btn-p" target="_blank" rel="noopener" href="'+esc(rv)+'">⭐ Share it on Google</a>':'');
  };
}
boot();
})();

</script>
