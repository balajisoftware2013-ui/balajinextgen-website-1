<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202020"><title>My Guest Account</title><link rel="manifest" href="guest-portal.webmanifest"><style>[hidden]{display:none!important}body{font:16px system-ui;background:#f8f6f1;color:#242424;margin:0}main{max-width:720px;margin:auto;padding:20px}header{background:#202020;color:white;padding:25px;border-radius:20px}button,a.btn{display:inline-block;border:0;background:#202020;color:white;padding:13px 18px;border-radius:12px;font:inherit;text-decoration:none;margin:5px 0;cursor:pointer}section,article{background:white;border:1px solid #e5dfd4;border-radius:16px;padding:16px;margin:12px 0}small{color:#666}h1{margin:8px 0}#status{min-height:24px}nav{display:flex;gap:8px;flex-wrap:wrap}button:disabled{opacity:.5}</style></head><body><main><header><small style="color:#e5c88c">BALAJI NEXTGEN • GUEST</small><h1>My Account</h1><div id="restaurant"></div></header><section><a class="btn" id="menu">Digital menu</a> <button id="login">Verify with WhatsApp</button> <button id="logout" hidden>Sign out</button><p id="status" role="status">Verify your WhatsApp number to see your history.</p><a id="send" class="btn" hidden target="_blank" rel="noopener">Open WhatsApp and send verification</a></section><section id="history" hidden><h2>My activity</h2><nav id="filters"></nav><div id="rows"></div></section></main><script>
const $=id=>document.getElementById(id),cid=(new URLSearchParams(location.search).get('client')||'').toUpperCase(),api='https://script.google.com/macros/s/'+(localStorage.getItem('bnx_api_core')||'AKfycbwHdqrP4IvuVD2ZkupNybrEkiXu3kmuI6-tQoiHgYxoqr1KgUupeFsi3PIoFEbuv6XA')+'/exec';let token='',timer,rows=[]; $('restaurant').textContent=cid;$('menu').href='customer-order.html?client='+encodeURIComponent(cid);async function call(action,extra={}){let r=await fetch(api,{method:'POST',body:JSON.stringify({action,clientId:cid,guestToken:token,...extra})});let j=await r.json();if(!j.success)throw Error(j.error||'Request failed');return j}function status(t){$('status').textContent=t}function render(filter){$('rows').replaceChildren();let list=rows.filter(r=>filter==='All'||r.type.toUpperCase().includes(filter));if(!list.length)$('rows').textContent='No matching records available.';for(let r of list){let a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('p'),d=document.createElement('small');h.textContent=r.type+' '+r.ref;p.textContent=r.items+(r.amount?' • ₹'+r.amount.toLocaleString('en-IN'):'');d.textContent=r.date;a.append(h,p,d);$('rows').append(a)}}async function load(){let j=await call('GP_HISTORY');rows=j.rows;status('Verified '+j.mobile+(j.limited?' • Recent records only':''));$('history').hidden=false;$('logout').hidden=false;$('login').hidden=true;$('send').hidden=true;render('All')}for(let f of ['All','BILL','ORDER','BOOK','TICKET','VISIT','REWARD']){let b=document.createElement('button');b.textContent=f;b.onclick=()=>render(f);$('filters').append(b)}$('login').onclick=async()=>{clearTimeout(timer);$('login').disabled=true;try{let j=await call('GP_START');$('send').href=j.url;$('send').hidden=false;status('Send the verification message from WhatsApp, then return here.');let end=Date.now()+300000;async function poll(){try{if(Date.now()>end)throw Error('Verification expired');let x=await call('GP_POLL',{challenge:j.challenge});if(x.pending){timer=setTimeout(poll,4000);return}token=x.guestToken;await load()}catch(e){status(e.message);$('login').disabled=false;$('send').hidden=true}}timer=setTimeout(poll,4000)}catch(e){status(e.message);$('login').disabled=false}};$('logout').onclick=async()=>{try{await call('GP_LOGOUT')}catch(e){}token='';rows=[];$('rows').replaceChildren();$('history').hidden=true;$('logout').hidden=true;$('login').hidden=false;$('login').disabled=false;status('Signed out')};if(!/^CL\d{5}$/.test(cid)){$('login').disabled=true;status('Open your restaurant QR menu first.')}if('serviceWorker'in navigator)navigator.serviceWorker.register('guest-portal-sw.js').catch(()=>{});
</script></body></html>
