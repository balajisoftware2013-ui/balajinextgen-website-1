<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202020"><title>My Guest Account</title><link rel="manifest" href="guest-portal.webmanifest"><style>[hidden]{display:none!important}body{font:16px system-ui;background:#f8f6f1;color:#242424;margin:0}main{max-width:720px;margin:auto;padding:20px}header{background:#202020;color:white;padding:25px;border-radius:20px}button,a.btn{display:inline-block;border:0;background:#202020;color:white;padding:13px 18px;border-radius:12px;font:inherit;text-decoration:none;margin:5px 0;cursor:pointer}section,article{background:white;border:1px solid #e5dfd4;border-radius:16px;padding:16px;margin:12px 0}small{color:#666}h1{margin:8px 0}#status{min-height:24px}nav{display:flex;gap:8px;flex-wrap:wrap}button:disabled{opacity:.5}main{max-width:960px}header{background:linear-gradient(125deg,#192521,#34473b);padding:30px}header h1{font-size:34px}#restaurant{color:#e5c88c;font-weight:700;letter-spacing:.06em}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.tile{background:white;border:1px solid #e5dfd4;border-radius:16px;padding:18px;text-align:left;color:#242424;margin:0;display:flex;flex-direction:column;gap:8px;text-decoration:none;min-height:105px}.tile span{font-size:26px}.tile small{font-size:13px}.tile:hover{border-color:#a78a4c}.eyebrow{font-size:12px;letter-spacing:.12em;color:#80662e;font-weight:700}#login{background:#176b46}#status{line-height:1.5}#filters button{font-size:13px;padding:9px 12px}@media(max-width:600px){main{padding:12px}header{padding:22px}header h1{font-size:28px}.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tile{padding:13px;min-height:95px}}</style></head><body><main><header><small style="color:#e5c88c">BALAJI NEXTGEN • GUEST</small><div id="restaurant"></div><h1>My Guest Account</h1><div>Dine · Discover · Connect</div></header><section><div class="eyebrow">YOUR PERSONAL ACCOUNT</div><h2>Welcome back</h2><a class="btn" id="menu">Explore digital menu</a> <button id="login">Verify with WhatsApp</button> <button id="logout" hidden>Sign out</button><p id="status" role="status">Verify your WhatsApp number to see your history.</p><a id="send" class="btn" hidden target="_blank" rel="noopener">Open WhatsApp and send verification</a></section><div class="eyebrow" style="margin:24px 0 10px">EXPLORE YOUR ACCOUNT</div><div class="tiles" id="tiles"></div><section id="history" hidden><h2>My activity</h2><nav id="filters"></nav><div id="rows"></div></section></main><script>
const $=id=>document.getElementById(id),cid=(new URLSearchParams(location.search).get('client')||'').toUpperCase(),api='https://script.google.com/macros/s/'+(localStorage.getItem('bnx_api_core')||'AKfycbwHdqrP4IvuVD2ZkupNybrEkiXu3kmuI6-tQoiHgYxoqr1KgUupeFsi3PIoFEbuv6XA')+'/exec';let token='',timer,rows=[]; $('restaurant').textContent=cid==='CL00010'?'HASHTAG SILIGURI':(cid||'Guest Connect');$('menu').href='customer-order.html?client='+encodeURIComponent(cid);const tiles=[['🍽️','Digital Menu','Explore food and drinks','menu'],['🧾','My Bills','View available bill records','BILL'],['🛍️','My Orders','Your order history','ORDER'],['📅','My Bookings','Available reservation records','BOOK'],['🎟️','My Tickets','Available event records','TICKET'],['🕒','Visit History','Your previous visits','VISIT'],['🎁','My Rewards','Available reward records','REWARD']];for(const [icon,title,desc,filter] of tiles){let b=document.createElement('button');b.className='tile';let i=document.createElement('span'),h=document.createElement('strong'),d=document.createElement('small');i.textContent=icon;h.textContent=title;d.textContent=desc;b.append(i,h,d);b.onclick=()=>{if(filter==='menu'){location.href=$('menu').href;return}if(!token||$('history').hidden){$('status').textContent='Verify with WhatsApp to access '+title.toLowerCase()+'.';$('login').scrollIntoView({behavior:'smooth',block:'center'});return}render(filter);$('history').scrollIntoView({behavior:'smooth'})};$('tiles').append(b)}async function call(action,extra={}){let r=await fetch(api,{method:'POST',body:JSON.stringify({action,clientId:cid,guestToken:token,...extra})});let j=await r.json();if(!j.success)throw Error(j.error||'Request failed');return j}function status(t){$('status').textContent=t}function render(filter){$('rows').replaceChildren();let list=rows.filter(r=>filter==='All'||r.type.toUpperCase().includes(filter));if(!list.length)$('rows').textContent='No matching records available.';for(let r of list){let a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('p'),d=document.createElement('small');h.textContent=r.type+' '+r.ref;p.textContent=r.items+(r.amount?' • ₹'+r.amount.toLocaleString('en-IN'):'');d.textContent=r.date;a.append(h,p,d);$('rows').append(a)}}async function load(){let j=await call('GP_HISTORY');rows=j.rows;status('Verified '+j.mobile+(j.limited?' • Recent records only':''));$('history').hidden=false;$('logout').hidden=false;$('login').hidden=true;$('send').hidden=true;render('All')}for(let f of ['All','BILL','ORDER','BOOK','TICKET','VISIT','REWARD']){let b=document.createElement('button');b.textContent=f;b.onclick=()=>render(f);$('filters').append(b)}$('login').onclick=async()=>{clearTimeout(timer);$('login').disabled=true;try{let j=await call('GP_START');$('send').href=j.url;$('send').hidden=false;status('Send the verification message from WhatsApp, then return here.');let end=Date.now()+300000;async function poll(){try{if(Date.now()>end)throw Error('Verification expired');let x=await call('GP_POLL',{challenge:j.challenge});if(x.pending){timer=setTimeout(poll,4000);return}token=x.guestToken;await load()}catch(e){status(e.message);$('login').disabled=false;$('send').hidden=true}}timer=setTimeout(poll,4000)}catch(e){status(e.message);$('login').disabled=false}};$('logout').onclick=async()=>{try{await call('GP_LOGOUT')}catch(e){}token='';rows=[];$('rows').replaceChildren();$('history').hidden=true;$('logout').hidden=true;$('login').hidden=false;$('login').disabled=false;status('Signed out')};if(!/^CL\d{5}$/.test(cid)){$('login').disabled=true;status('Open your restaurant QR menu first.')}if('serviceWorker'in navigator)navigator.serviceWorker.register('guest-portal-sw.js').catch(()=>{});
</script></body></html>
