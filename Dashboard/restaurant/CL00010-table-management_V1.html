<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hashtag Brewpub — Table Management</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#171310; --panel:#1f1a15; --panel2:#241d17; --line:#3a2f24;
    --wood:#b9713a; --wood-deep:#8a4e24; --cream:#f2e6d3;
    --text:#f2e6d3; --text2:#c9b79f; --text3:#8f7d68;
    --ok:#4caf6f; --ok-bg:#183424; --resv:#e0a84a; --resv-bg:#3a2c14;
    --occ:#e0574a; --occ-bg:#3a1a16; --clean:#5a8fd6; --clean-bg:#182234;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(ellipse at top,#211a14,#141110 70%);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;}
  header{padding:22px 28px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--wood),var(--wood-deep));display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#1a1410;}
  .brand h1{font-size:18px;margin:0;font-weight:700;letter-spacing:.3px;}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--text3);}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text2);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  main{max-width:1280px;margin:0 auto;padding:22px 24px 60px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .toolbar .stats{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12px;color:var(--text2);}
  .stat b{color:var(--cream);font-size:15px;display:block;}
  .datebar{display:flex;gap:8px;align-items:center;font-size:12px;}
  .datebar input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:12px;}

  /* ══════════════════════════════════════════════════════
     SPATIAL FLOOR MAP
     FIX ("MAPS CAN ADD CLIEN 10"): this used to be a plain 12-column
     CSS-grid of rectangular zone boxes, laid out in reading order —
     it didn't look anything like Hashtag Brewpub's actual floor plan
     (2nd Mile, Sevoke Road), so a captain glancing at it couldn't tell
     where a table really sits relative to the DJ area, Kitchen, Brew
     Pub, or the passage/arch entrance. Replaced with the same
     absolutely-positioned spatial venue map used for CL00011 — every
     table below is placed (as % of the canvas) to match its real
     position on the client's floor plan drawing, with the Kitchen,
     Entry Foyer, Cash counter, Service Station, Hookah Station,
     Looking Mirror and the central arch/passage rendered as
     non-clickable structural shapes exactly where they sit on plan,
     not just described in a corner label. */
  .venue{position:relative;width:100%;aspect-ratio:900/515;
    background:radial-gradient(ellipse at 50% 0%,#241d17,#141110 75%);
    border:2px solid var(--wood-deep);border-radius:14px;overflow:hidden;
    box-shadow:inset 0 0 60px rgba(0,0,0,.5);}
  .zlabel{position:absolute;font-weight:800;letter-spacing:.1em;
    text-transform:uppercase;color:var(--wood);pointer-events:none;white-space:nowrap;
    font-size:clamp(7px,1.5vw,10.5px);}
  .zlabel.vert{writing-mode:vertical-rl;}
  .zlabel.dim{color:var(--text3);font-weight:700;}
  .fixture{position:absolute;border:1px solid var(--line);border-radius:8px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none;padding:2px;}
  .fixture span{font-size:clamp(6px,1.2vw,8.5px);color:var(--text3);text-transform:uppercase;letter-spacing:.06em;line-height:1.25;}
  .kitchen-block{position:absolute;border:1px dashed var(--line);border-radius:10px;
    background:repeating-linear-gradient(45deg,#241d17,#241d17 10px,#1a140f 10px,#1a140f 20px);
    display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .arch-shape{position:absolute;border:5px solid var(--wood-deep);border-bottom:none;border-radius:120px 120px 0 0;
    background:linear-gradient(0deg,rgba(185,113,58,.08),transparent);pointer-events:none;}

  .tbl{position:absolute;border-radius:8px;border:1px solid transparent;
    background:var(--ok-bg);color:var(--ok);display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;font-weight:800;transition:transform .12s ease;z-index:2;
    font-size:clamp(7px,1.7vw,11px);line-height:1.1;}
  .tbl small{font-weight:600;font-size:clamp(5.5px,1.2vw,8px);opacity:.9;}
  .tbl:hover{transform:scale(1.1);z-index:6;}
  .tbl.available{background:var(--ok-bg);color:var(--ok);border-color:#2c5c3d;}
  .tbl.reserved{background:var(--resv-bg);color:var(--resv);border-color:#5c4620;}
  .tbl.occupied{background:var(--occ-bg);color:var(--occ);border-color:#5c2a22;}
  .tbl.cleaning{background:var(--clean-bg);color:var(--clean);border-color:#2c3f5c;}

  .tbl{
    min-width:52px;height:52px;border-radius:10px;border:1px solid transparent;
    background:var(--ok-bg);color:var(--ok);display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;font-size:12px;font-weight:700;transition:transform .12s ease;position:relative;padding:2px 4px;
  }
  .tbl small{font-weight:500;font-size:9px;opacity:.85;}
  .tbl:hover{transform:translateY(-2px);}
  .tbl.available{background:var(--ok-bg);color:var(--ok);border-color:#2c5c3d;}
  .tbl.reserved{background:var(--resv-bg);color:var(--resv);border-color:#5c4620;}
  .tbl.occupied{background:var(--occ-bg);color:var(--occ);border-color:#5c2a22;}
  .tbl.cleaning{background:var(--clean-bg);color:var(--clean);border-color:#2c3f5c;}
  .tbl.selected{outline:2px solid var(--cream);}

  /* Drawer */
  .overlay{position:fixed;inset:0;background:rgba(10,8,6,.6);display:none;align-items:center;justify-content:flex-end;z-index:50;}
  .overlay.open{display:flex;}
  .drawer{width:380px;max-width:92vw;height:100%;background:var(--panel2);border-left:1px solid var(--line);padding:24px;overflow-y:auto;}
  .drawer h2{margin:0 0 2px;font-size:20px;}
  .drawer .cap{color:var(--text3);font-size:12px;margin-bottom:18px;}
  .drawer label{display:block;font-size:11px;color:var(--text3);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em;}
  .drawer input,.drawer select,.drawer textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;}
  .drawer textarea{resize:vertical;min-height:60px;}
  .btnrow{display:flex;gap:10px;margin-top:20px;}
  .btn{flex:1;padding:12px;border-radius:9px;border:none;font-weight:700;font-size:13px;cursor:pointer;}
  .btn.primary{background:linear-gradient(135deg,var(--wood),var(--wood-deep));color:#1a1410;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text2);}
  .closeX{position:absolute;top:18px;right:18px;background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;}
  .status-pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:14px;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ok-bg);color:var(--ok);border:1px solid #2c5c3d;padding:12px 22px;border-radius:10px;font-size:13px;font-weight:600;display:none;z-index:60;}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">B</div>
    <div><h1>Hashtag Brewpub</h1><p>2nd Mile Sevoke Road, Siliguri · CL00010</p></div>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:var(--ok)"></i>Available</span>
    <span><i class="dot" style="background:var(--resv)"></i>Reserved</span>
    <span><i class="dot" style="background:var(--occ)"></i>Occupied</span>
    <span><i class="dot" style="background:var(--clean)"></i>Cleaning</span>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="stats" id="stats"></div>
    <div class="datebar">
      <label style="color:var(--text3)">Date</label>
      <input type="date" id="resDate">
      <label style="color:var(--text3)">Time</label>
      <input type="time" id="resTime" value="19:30">
    </div>
  </div>

  <div class="venue" id="venue"></div>
</main>

<div class="overlay" id="overlay">
  <div class="drawer">
    <button class="closeX" onclick="closeDrawer()">✕</button>
    <h2 id="dTitle">Table</h2>
    <div class="cap" id="dCap"></div>
    <span class="status-pill" id="dStatus"></span>

    <div id="orderBlock">
      <label>Waiter / Captain</label>
      <input id="fWaiter" placeholder="Assign captain">
      <label>Covers</label>
      <input id="fCovers" type="number" min="1" value="2">
      <div class="btnrow">
        <button class="btn primary" onclick="startOrder()">Start Order (POS)</button>
      </div>
    </div>

    <div id="reserveBlock">
      <label>Guest Name</label>
      <input id="fName" placeholder="Guest name">
      <label>Phone</label>
      <input id="fPhone" placeholder="10-digit mobile">
      <label>Covers</label>
      <input id="fCovers2" type="number" min="1" value="2">
      <label>Notes</label>
      <textarea id="fNotes" placeholder="Occasion, seating preference, allergies..."></textarea>
      <div class="btnrow">
        <button class="btn primary" onclick="reserveTable()">Confirm Reservation</button>
        <button class="btn ghost" onclick="closeDrawer()">Cancel</button>
      </div>
    </div>

    <div id="freeUpBlock" style="display:none">
      <div class="btnrow">
        <button class="btn primary" onclick="markAvailable()">Mark Available</button>
        <button class="btn ghost" onclick="closeDrawer()">Close</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// FIX ("MAPS CAN ADD CLIEN 10"): real table positions read directly off
// the client's own CAD floor plan (Hashtag Brewpub, 2nd Mile Sevoke
// Road — DJ/Live Show area top-centre, Brew Pub top-right, Kitchen
// filling the right wall, the round-table Sitting Space and the
// curved-arch passage in the middle, Family Section booths along the
// far-left wall top and bottom, Lounge + Bar along the right side below
// Brew Pub, Hookah Station / Service Station / Cash counter / Looking
// Mirror as their own fixtures). left/top/w/h are all % of the venue
// canvas — same convention as CL00011's spatial map — so each table
// renders exactly where it physically sits, not just grouped in an
// abstract zone box.
const TABLES = [
  // Live Show & DJ Area — sofa-table row along the top wall
  ['DJ1',4, 30,2, 7,14], ['DJ2',4, 38,2, 7,14], ['DJ3',4, 46,2, 7,14], ['DJ4',4, 54,2, 7,14],
  // Brew Pub — two round tables top-right, before the kitchen wall
  ['BP-RT1',4, 60,12, 10,14], ['BP-RT2',4, 70,12, 10,14],
  // Family Section — booth block along the far-left wall, top half
  ['FL1',2, 1,2, 4,7], ['FL2',2, 6,2, 4,7], ['FL3',2, 11,2, 4,7],
  ['FL4',2, 1,10, 4,7], ['FL5',2, 6,10, 4,7], ['FL6',2, 11,10, 4,7],
  ['FL7',2, 1,18, 4,7], ['FL8',2, 6,18, 4,7], ['FL9',2, 11,18, 4,7],
  // Family Section — booth block along the far-left wall, bottom half
  ['FR1',2, 1,58, 4,7], ['FR2',2, 6,58, 4,7], ['FR3',2, 11,58, 4,7],
  ['FR4',2, 1,66, 4,7], ['FR5',2, 6,66, 4,7], ['FR6',2, 11,66, 4,7],
  ['FR7',2, 1,74, 4,7], ['FR8',2, 6,74, 4,7], ['FR9',2, 11,74, 4,7],
  // Sitting Space — round tables in the open centre-left floor
  ['ST1',4, 17,22, 8,13], ['ST2',4, 27,22, 8,13],
  ['ST3',4, 17,38, 8,13], ['ST4',4, 27,38, 8,13],
  ['ST5',4, 17,54, 8,13], ['ST6',4, 27,54, 8,13],
  ['ST7',4, 17,70, 8,13], ['ST8',4, 27,70, 8,13],
  // Feature Arch — Curved Bench, flanking the arch/passage entrance
  ['CB1',6, 35,26, 10,14], ['CB2',6, 49,26, 10,14],
  // Passage Bench Seating — running down either side of the passage
  ['BN1',6, 34,50, 5,28], ['BN2',6, 53,50, 5,28],
  // Snug — small nook past the passage, near Looking Mirror
  ['SN1',2, 40,87, 6,10], ['SN2',2, 47,87, 6,10], ['SN3',2, 54,87, 6,10],
  // Hookah Station — single table, its own alcove
  ['HK1',4, 58,76, 8,12],
  // Lounge — grid of round + long tables on the right, below Brew Pub
  ['RD1',4, 58,52, 5,7], ['RD2',4, 64,52, 5,7], ['RD3',4, 70,52, 5,7], ['RD4',4, 76,52, 5,7],
  ['RDL1',6, 58,60, 5,7], ['RDL2',6, 64,60, 5,7], ['RDL3',6, 70,60, 5,7], ['RDL4',6, 76,60, 5,7],
  ['RDL5',6, 58,68, 5,7], ['RDL6',6, 64,68, 5,7], ['RDL7',6, 70,68, 5,7], ['RDL8',6, 76,68, 5,7],
  ['RDL9',6, 58,76, 5,7],
  // Bar — small tables + one window sofa, right side before Entry Foyer
  ['B1',2, 58,84, 5,7], ['B2',2, 64,84, 5,7], ['B3',2, 70,84, 5,7], ['B4',2, 76,84, 5,7],
  ['SW1',6, 58,92, 10,7],
];

const STATUSES = ['available','available','available','available','reserved','occupied','available','cleaning'];
let state = {};
TABLES.forEach(([id],i)=>{ state[id] = STATUSES[(id.length+i) % STATUSES.length]; });
let active = null;

function renderVenue(){
  const v = document.getElementById('venue');
  // Structural fixtures + zone labels, positioned per the real floor
  // plan — kept non-clickable (pointer-events:none) since they aren't
  // bookable tables, purely for orientation, same as CL00011's
  // console/bar-shape/zlabel elements.
  const fixtures = `
    <div class="kitchen-block" style="left:81%;top:17%;width:19%;height:64%;"><span>Kitchen<br>5415×12170</span></div>
    <div class="fixture" style="left:81%;top:86%;width:19%;height:13%;"><span>Entry Foyer</span></div>
    <div class="fixture" style="left:70%;top:43%;width:7%;height:6%;"><span>Cash</span></div>
    <div class="fixture" style="left:51%;top:53%;width:8%;height:11%;"><span>Service<br>Station</span></div>
    <div class="fixture" style="left:33%;top:88%;width:8%;height:10%;"><span>Looking<br>Mirror</span></div>
    <div class="arch-shape" style="left:38%;top:26%;width:24%;height:56%;"></div>
    <div class="zlabel" style="left:16%;top:1%;">Live Show &amp; DJ Area</div>
    <div class="zlabel vert" style="left:12.5%;top:32%;">Sitting Space</div>
    <div class="zlabel vert" style="left:0.3%;top:34%;">Family Section</div>
    <div class="zlabel" style="left:60%;top:8%;">Brew Pub</div>
    <div class="zlabel" style="left:58%;top:47%;">Lounge &amp; Bar</div>
    <div class="zlabel dim" style="left:32%;top:81%;">Niche</div>
    <div class="zlabel dim" style="left:54%;top:81%;">Niche</div>
    <div class="zlabel dim" style="left:44%;top:79%;">Passage</div>
  `;
  const tablesHtml = TABLES.map(([id,cap,l,t,w,h])=>
    `<div class="tbl ${state[id]}" data-id="${id}" data-cap="${cap}" style="left:${l}%;top:${t}%;width:${w}%;height:${h}%;" onclick="openTable('${id}',${cap})">${id}<small>${cap}p</small></div>`
  ).join('');
  v.innerHTML = fixtures + tablesHtml;
  renderStats();
}

function renderStats(){
  const all = Object.values(state);
  const c = s=>all.filter(x=>x===s).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${all.length}</b>Total Tables</div>
    <div class="stat" style="color:var(--ok)"><b>${c('available')}</b>Available</div>
    <div class="stat" style="color:var(--resv)"><b>${c('reserved')}</b>Reserved</div>
    <div class="stat" style="color:var(--occ)"><b>${c('occupied')}</b>Occupied</div>
    <div class="stat" style="color:var(--clean)"><b>${c('cleaning')}</b>Cleaning</div>`;
}

function openTable(id,cap){
  active = id;
  document.getElementById('dTitle').textContent = id;
  document.getElementById('dCap').textContent = cap+' pax capacity';
  const st = state[id];
  const pill = document.getElementById('dStatus');
  pill.textContent = st.toUpperCase();
  pill.style.background = {available:'var(--ok-bg)',reserved:'var(--resv-bg)',occupied:'var(--occ-bg)',cleaning:'var(--clean-bg)'}[st];
  pill.style.color = {available:'var(--ok)',reserved:'var(--resv)',occupied:'var(--occ)',cleaning:'var(--clean)'}[st];

  document.getElementById('orderBlock').style.display = st==='available' ? 'block':'none';
  document.getElementById('reserveBlock').style.display = st==='available' ? 'block':'none';
  document.getElementById('freeUpBlock').style.display = st!=='available' ? 'block':'none';

  document.getElementById('overlay').classList.add('open');
}
function closeDrawer(){ document.getElementById('overlay').classList.remove('open'); active=null; }

function startOrder(){
  if(!active) return;
  state[active]='occupied';
  renderVenue(); closeDrawer();
  showToast('🍽️ Order started for '+active);
}
function reserveTable(){
  if(!active) return;
  const name = document.getElementById('fName').value || 'Guest';
  state[active]='reserved';
  renderVenue(); closeDrawer();
  showToast('📅 '+active+' reserved for '+name+' · '+(document.getElementById('resDate').value||'today')+' '+document.getElementById('resTime').value);
}
function markAvailable(){
  if(!active) return;
  state[active]='available';
  renderVenue(); closeDrawer();
  showToast('✅ '+active+' marked available');
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  setTimeout(()=>t.style.display='none', 2400);
}

document.getElementById('resDate').valueAsDate = new Date();
renderVenue();
</script>
</body>
</html>
