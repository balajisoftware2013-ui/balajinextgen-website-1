<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ashtag — Table Booking</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#0a0806; --panel:#141009; --panel2:#181209; --line:#332812;
    --gold:#d4a94a; --gold-deep:#a87e2c; --cream:#f4e9cf;
    --text:#f4e9cf; --text2:#c9b98a; --text3:#8a7a54;
    --ok:#4caf6f; --ok-bg:#132a1d; --resv:#e0a84a; --resv-bg:#332510;
    --occ:#e0574a; --occ-bg:#331712; --sold:#5a5248; --sold-bg:#211c14;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:radial-gradient(ellipse at top,#181209,#0a0806 65%);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;}
  header{padding:22px 28px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand .mark{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--gold-deep));display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:#1a1206;letter-spacing:-1px;}
  .brand h1{font-size:20px;margin:0;font-weight:800;letter-spacing:2px;text-transform:uppercase;background:linear-gradient(135deg,#f4e9cf,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;}
  .brand p{margin:2px 0 0;font-size:12px;color:var(--text3);}
  .legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--text2);}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  main{max-width:900px;margin:0 auto;padding:22px 24px 40px;}
  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;flex-wrap:wrap;gap:10px;}
  .toolbar .stats{display:flex;gap:10px;flex-wrap:wrap;}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font-size:12px;color:var(--text2);}
  .stat b{color:var(--gold);font-size:15px;display:block;}
  .datebar{display:flex;gap:8px;align-items:center;font-size:12px;}
  .datebar input{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:7px 10px;font-size:12px;}

  .venue{position:relative;width:100%;aspect-ratio:515/560;
    background:radial-gradient(ellipse at 50% 0%,#211a0c,#0a0806 75%);
    border:2px solid var(--gold-deep);border-radius:14px;overflow:hidden;
    box-shadow:inset 0 0 60px rgba(0,0,0,.5);}
  .zlabel{position:absolute;font-weight:800;letter-spacing:.12em;
    text-transform:uppercase;color:var(--text3);pointer-events:none;white-space:nowrap;
    font-size:clamp(7px,1.6vw,11px);}
  .zlabel.vert{writing-mode:vertical-rl;}
  .bar-shape{position:absolute;border:6px solid #8a6a26;border-top:none;border-radius:0 0 90px 90px;
    background:linear-gradient(180deg,rgba(212,169,74,.08),transparent);pointer-events:none;}
  .console{position:absolute;border:1px solid var(--line);border-radius:10px;background:var(--panel2);
    display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .console span{font-size:clamp(6px,1.3vw,9px);color:var(--text3);text-transform:uppercase;letter-spacing:.1em;}

  .tbl{position:absolute;border-radius:8px;border:1px solid transparent;
    background:var(--ok-bg);color:var(--ok);display:flex;flex-direction:column;align-items:center;justify-content:center;
    cursor:pointer;font-weight:800;transition:transform .12s ease;
    font-size:clamp(8px,1.9vw,12px);line-height:1.1;}
  .tbl small{font-weight:600;font-size:clamp(6px,1.3vw,8px);opacity:.9;}
  .tbl:hover{transform:scale(1.08);z-index:5;}
  .tbl.available{background:var(--ok-bg);color:var(--ok);border-color:#245c39;}
  .tbl.reserved{background:var(--resv-bg);color:var(--resv);border-color:#5c4310;}
  .tbl.occupied{background:var(--occ-bg);color:var(--occ);border-color:#5c2318;}
  .tbl.sold{background:var(--sold-bg);color:var(--sold);border-color:#3a3527;cursor:not-allowed;}
  .tbl.sold small{color:var(--sold);}

  .pricing{margin-top:20px;display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;}
  .pricing div{background:var(--panel);padding:12px 8px;text-align:center;}
  .pricing .h{color:var(--text3);font-size:9px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px;}
  .pricing .p{color:var(--gold);font-size:16px;font-weight:800;}
  .pricing .m{color:var(--text3);font-size:9px;margin-top:3px;}
  @media(max-width:640px){.pricing{grid-template-columns:repeat(3,1fr);}}

  .overlay{position:fixed;inset:0;background:rgba(6,4,2,.65);display:none;align-items:center;justify-content:flex-end;z-index:50;}
  .overlay.open{display:flex;}
  .drawer{width:380px;max-width:92vw;height:100%;background:var(--panel2);border-left:1px solid var(--line);padding:24px;overflow-y:auto;}
  .drawer h2{margin:0 0 2px;font-size:20px;letter-spacing:1px;}
  .drawer .cap{color:var(--text3);font-size:12px;margin-bottom:6px;}
  .drawer .price{color:var(--gold);font-size:22px;font-weight:800;margin-bottom:16px;}
  .drawer label{display:block;font-size:11px;color:var(--text3);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.05em;}
  .drawer input,.drawer select,.drawer textarea{width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:10px 12px;font-size:13px;font-family:inherit;}
  .drawer textarea{resize:vertical;min-height:60px;}
  .btnrow{display:flex;gap:10px;margin-top:20px;}
  .btn{flex:1;padding:12px;border-radius:9px;border:none;font-weight:800;font-size:13px;cursor:pointer;letter-spacing:.03em;}
  .btn.primary{background:linear-gradient(135deg,var(--gold),var(--gold-deep));color:#1a1206;}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text2);}
  .closeX{position:absolute;top:18px;right:18px;background:none;border:none;color:var(--text3);font-size:20px;cursor:pointer;}
  .status-pill{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:800;margin-bottom:14px;letter-spacing:.05em;}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ok-bg);color:var(--ok);border:1px solid #245c39;padding:12px 22px;border-radius:10px;font-size:13px;font-weight:700;display:none;z-index:60;}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="mark">A</div>
    <div><h1>Ashtag</h1><p>CL00011 · Table & Package Booking</p></div>
  </div>
  <div class="legend">
    <span><i class="dot" style="background:var(--ok)"></i>Available</span>
    <span><i class="dot" style="background:var(--resv)"></i>Reserved</span>
    <span><i class="dot" style="background:var(--occ)"></i>Occupied</span>
    <span><i class="dot" style="background:var(--sold)"></i>Sold Out</span>
  </div>
</header>

<main>
  <div class="toolbar">
    <div class="stats" id="stats"></div>
    <div class="datebar">
      <label style="color:var(--text3)">Event Date</label>
      <input type="date" id="resDate">
      <label style="color:var(--text3)">Time</label>
      <input type="time" id="resTime" value="21:00">
    </div>
  </div>

  <div class="venue" id="venue"></div>

  <div class="pricing" id="pricing"></div>
</main>

<div class="overlay" id="overlay">
  <div class="drawer">
    <button class="closeX" onclick="closeDrawer()">✕</button>
    <h2 id="dTitle">Table</h2>
    <div class="cap" id="dCap"></div>
    <div class="price" id="dPrice"></div>
    <span class="status-pill" id="dStatus"></span>

    <div id="bookBlock">
      <label>Guest / Group Name</label>
      <input id="fName" placeholder="Guest or group name">
      <label>Phone</label>
      <input id="fPhone" placeholder="10-digit mobile">
      <label>Covers</label>
      <input id="fCovers" type="number" min="1" value="6">
      <label>Advance Paid (₹)</label>
      <input id="fAdvance" type="number" min="0" placeholder="0">
      <label>Notes</label>
      <textarea id="fNotes" placeholder="Package inclusions, VIP notes..."></textarea>
      <div class="btnrow">
        <button class="btn primary" onclick="reserveTable()">Confirm Booking</button>
        <button class="btn ghost" onclick="closeDrawer()">Cancel</button>
      </div>
    </div>

    <div id="freeUpBlock" style="display:none">
      <div class="btnrow">
        <button class="btn primary" onclick="markAvailable()">Release Table</button>
        <button class="btn ghost" onclick="closeDrawer()">Close</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// Real table + pricing data from CL00011_V3_DATABASE.xlsx → TABLE_MASTER
// left/top/w/h are all % of the venue canvas, read off the actual
// Ashtag floor plan so each table sits where it really is.
const TABLES = [
  ['Q1',8,75000, 5, 4, 9,7], ['Q2',8,75000, 17,4, 9,7], ['Q3',8,75000, 29,4, 9,7],
  ['Q4',8,75000, 5,16, 9,7], ['Q5',8,75000, 17,16,9,7], ['Q6',8,75000, 29,16,9,7],
  ['R1',8,100000,40,4, 9,7], ['R2',8,100000,50,4, 9,7], ['R3',8,100000,60,4, 9,7], ['R4',8,100000,70,4, 9,7],
  ['S10',8,75000,40,16,9,7], ['S11',8,75000,50,16,9,7], ['S12',8,75000,60,16,9,7],
  ['C1',8,40000, 88,20,10,8], ['C2',8,40000, 88,32,10,8], ['C3',8,40000, 88,44,10,8], ['C4',8,40000, 88,56,10,8],
  ['S1',8,100000, 30,25,8,6.5], ['S5',8,100000, 40,25,8,6.5],
  ['S2',8,100000, 30,33,8,6.5], ['S6',8,100000, 40,33,8,6.5],
  ['S3',8,100000, 30,41,8,6.5], ['S7',8,100000, 40,41,8,6.5],
  ['S4',8,100000, 30,49,8,6.5], ['S8',8,100000, 40,49,8,6.5],
  ['S9',8,100000, 40,57,8,6.5],
  ['S13',8,75000, 53,54,8,7], ['S14',8,75000, 62,54,8,7], ['S15',8,75000, 71,54,8,7],
  ['H4',8,null, 48,62,8,7], ['H3',8,null, 57,62,8,7], ['H2',8,null, 66,62,8,7], ['H1',8,null, 75,62,8,7],
  ['H6',8,null, 57,71,8,7], ['H5',8,null, 66,71,8,7],
  ['K4',8,75000, 5,54, 9,7], ['K5',8,75000, 17,54,9,7], ['K6',8,75000, 29,54,9,7],
  ['K1',8,75000, 5,66, 9,7], ['K2',8,75000, 17,66,9,7], ['K3',8,75000, 29,66,9,7],
];

const PRICING = [
  ['Floor Front Standing','₹1L','6-8 pax'],
  ['Floor Tables','₹75K','6-8 pax'],
  ['Royal Den','₹1L','6-8 pax'],
  ['Kings & Queens','₹75K','6-8 pax'],
  ['Upper Decks','₹40K','6-8 pax'],
  ['Backstage','₹2L','12 pax'],
];

const STATUSES = ['sold','sold','reserved','available','sold','occupied'];
let state = {};
TABLES.forEach(([id],i)=>{ state[id] = STATUSES[(id.length+i) % STATUSES.length]; });
let active=null, activeCap=0, activePrice=0;

function renderVenue(){
  const v = document.getElementById('venue');
  const zoneLabels = `
    <div class="zlabel" style="left:5%;top:23%;">QUEENS</div>
    <div class="zlabel" style="left:40%;top:12.5%;">ROYAL DEN</div>
    <div class="zlabel" style="left:5%;top:74%;">KINGS</div>
    <div class="zlabel" style="left:30%;top:22%;">FLOOR</div>
    <div class="zlabel vert" style="left:82%;top:35%;">CHARLES</div>
    <div class="zlabel vert" style="left:85%;top:45%;">BAR</div>
    <div class="zlabel" style="left:66%;top:79%;">HALLWAY</div>
    <div class="zlabel vert" style="left:1.5%;top:32%;">BACKSTAGE</div>
  `;
  const consoleEl = `<div class="console" style="left:4%;top:38%;width:11%;height:14%;"><span>Console</span></div>`;
  const bar = `<div class="bar-shape" style="left:47%;top:26%;width:33%;height:24%;"></div>`;
  const tablesHtml = TABLES.map(([id,cap,price,l,t,w,h])=>
    `<div class="tbl ${state[id]}" style="left:${l}%;top:${t}%;width:${w}%;height:${h}%;" onclick="openTable('${id}',${cap},${price||0})">${id}<small>${state[id]==='sold'?'SOLD':cap+'p'}</small></div>`
  ).join('');
  v.innerHTML = zoneLabels + consoleEl + bar + tablesHtml;
  document.getElementById('pricing').innerHTML = PRICING.map(([l,p,m])=>`<div><div class="h">${l}</div><div class="p">${p}</div><div class="m">Max ${m}</div></div>`).join('');
  renderStats();
}

function renderStats(){
  const all = Object.values(state);
  const c = s=>all.filter(x=>x===s).length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><b>${all.length}</b>Total Tables</div>
    <div class="stat" style="color:var(--ok)"><b>${c('available')}</b>Available</div>
    <div class="stat" style="color:var(--resv)"><b>${c('reserved')}</b>Reserved</div>
    <div class="stat" style="color:var(--occ)"><b>${c('occupied')}</b>Occupied</div>
    <div class="stat" style="color:var(--sold)"><b>${c('sold')}</b>Sold Out</div>`;
}

function openTable(id,cap,price){
  if(state[id]==='sold'){ showToast('🚫 '+id+' is sold out for this date'); return; }
  active = id; activeCap=cap; activePrice=price;
  document.getElementById('dTitle').textContent = id;
  document.getElementById('dCap').textContent = 'Max '+cap+' pax';
  document.getElementById('dPrice').textContent = price ? '₹'+price.toLocaleString('en-IN')+' min. spend' : 'No minimum spend';
  const st = state[id];
  const pill = document.getElementById('dStatus');
  pill.textContent = st.toUpperCase();
  pill.style.background = {available:'var(--ok-bg)',reserved:'var(--resv-bg)',occupied:'var(--occ-bg)'}[st];
  pill.style.color = {available:'var(--ok)',reserved:'var(--resv)',occupied:'var(--occ)'}[st];

  document.getElementById('bookBlock').style.display = st==='available' ? 'block':'none';
  document.getElementById('freeUpBlock').style.display = st!=='available' ? 'block':'none';
  document.getElementById('fCovers').value = Math.min(cap,6);
  document.getElementById('overlay').classList.add('open');
}
function closeDrawer(){ document.getElementById('overlay').classList.remove('open'); active=null; }

function reserveTable(){
  if(!active) return;
  const name = document.getElementById('fName').value || 'Guest';
  state[active]='reserved';
  renderVenue(); closeDrawer();
  showToast('🎟️ '+active+' booked for '+name+' · '+(document.getElementById('resDate').value||'today')+' '+document.getElementById('resTime').value);
}
function markAvailable(){
  if(!active) return;
  state[active]='available';
  renderVenue(); closeDrawer();
  showToast('✅ '+active+' released back to available');
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent = msg; t.style.display='block';
  setTimeout(()=>t.style.display='none', 2400);
}

document.getElementById('resDate').valueAsDate = new Date();
renderVenue();
</script>
</body>
</html>
