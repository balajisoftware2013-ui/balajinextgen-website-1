plugins { id 'com.android.application' }

android {
    namespace 'in.balajinextgen.happyserve.printer'
    compileSdk 34

    defaultConfig {
        applicationId 'in.balajinextgen.happyserve.printer'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    /* one fixed signing key in the repo, so every new build installs OVER the old one (no uninstall, no lost login) */
    signingConfigs {
        bnx {
            storeFile file('bnx-app.keystore')
            storePassword 'android'
            keyAlias 'happyserve'
            keyPassword 'android'
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.bnx }
        debug { signingConfig signingConfigs.bnx }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

android {
    lint { checkReleaseBuilds false; abortOnError false }
}
