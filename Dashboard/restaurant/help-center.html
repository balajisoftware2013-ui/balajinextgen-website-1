<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Help Center · Balaji NextGen</title>
<meta name="description" content="Step-by-step guides for Balaji NextGen restaurant clients: QR menu, welcome page, events, tickets, WhatsApp and updates.">
<meta name="theme-color" content="#1c1917">
<!--
  BALAJI NEXTGEN · HELP CENTER (2026-11-27)
  One page for every client: Dashboard › ❓ Help Center (sidebar + top bar). No login, no client data on this page.
  Add a guide: put its slides as JPG (slide-01.jpg …) + the .pptx / .pdf in assets/help/<folder>/ and add one entry to GUIDES.
-->
<style>
:root{--ink:#1c1917;--ink2:#44403c;--mut:#78716c;--line:#e7e5e4;--soft:#f5f5f4;--or:#c2570a;--or2:#9a3412;--peach:#fdebd8}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;color:var(--ink);font:15px/1.5 Calibri,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif}
a{color:var(--or)}
header{background:var(--ink);color:#fff;padding:22px 20px 26px}
header .in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font:700 28px/1.15 Cambria,Georgia,serif;margin:0;flex:1;min-width:220px}
header p{margin:6px 0 0;color:#d6d3d1;font-size:15px}
.back{color:#fff;text-decoration:none;border:1px solid #57534e;border-radius:99px;padding:8px 14px;font-weight:600;font-size:14px}
.back:hover{background:#292524}
main{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.srch{display:flex;gap:10px;margin:0 0 18px}
.srch input{flex:1;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:16px}
.srch input:focus{outline:2px solid var(--or);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff;display:flex;flex-direction:column;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.card .th{aspect-ratio:16/9;background:var(--soft) center/cover no-repeat;cursor:pointer;position:relative}
.card .th span{position:absolute;left:10px;bottom:10px;background:rgba(28,25,23,.85);color:#fff;font-size:12px;font-weight:700;border-radius:99px;padding:4px 10px}
.card .bd{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h2{font:700 19px/1.25 Cambria,Georgia,serif;margin:0}
.card p{margin:0;color:var(--ink2);font-size:14px;flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap}.tags i{font-style:normal;font-size:11.5px;background:var(--peach);color:var(--or2);border-radius:99px;padding:2px 9px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 13px;font:600 14px/1 inherit;font-family:inherit;text-decoration:none;cursor:pointer}
.btn.p{background:var(--or);border-color:var(--or);color:#fff}.btn:hover{filter:brightness(.96)}
.icon{width:46px;height:46px;border-radius:50%;background:var(--or);color:#fff;display:grid;place-items:center;font-size:22px;flex:none}
.wide{grid-column:1/-1;display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-radius:16px;padding:16px;background:var(--soft)}
.wide b{font-size:16px}.wide .t{flex:1;min-width:200px}
h3.sec{font:700 13px/1 inherit;letter-spacing:.08em;text-transform:uppercase;color:var(--or);margin:26px 0 12px}
.none{color:var(--mut);padding:20px 4px;display:none}
/* slide viewer */
.vw{position:fixed;inset:0;background:#0c0a09;z-index:50;display:none;flex-direction:column}
.vw.on{display:flex}
.vw .top{display:flex;align-items:center;gap:10px;padding:10px 14px;color:#fff}
.vw .top b{flex:1;font:700 16px/1.2 Cambria,Georgia,serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vw .top .btn{background:#292524;border-color:#44403c;color:#fff;padding:8px 11px}
.vw .stage{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;padding:0 8px;touch-action:pan-y}
.vw .stage img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 10px 40px rgba(0,0,0,.5);background:#fff}
.vw .nav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:24px;cursor:pointer}
.vw .nav:hover{background:rgba(255,255,255,.25)}.vw .prev{left:12px}.vw .next{right:12px}
.vw .bot{display:flex;gap:8px;align-items:center;padding:10px 14px calc(10px + env(safe-area-inset-bottom));color:#d6d3d1;font-size:13px;overflow-x:auto}
.vw .ch{flex:none;border:1px solid #44403c;background:transparent;color:#d6d3d1;border-radius:99px;padding:6px 11px;font:600 12.5px/1 inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.vw .ch.on{background:var(--or);border-color:var(--or);color:#fff}
.vw .cnt{flex:none;min-width:58px;text-align:center}
@media (max-width:640px){header h1{font-size:23px}.vw .nav{width:40px;height:40px;font-size:20px}.vw .prev{left:4px}.vw .next{right:4px}}
@media print{header .back,.srch,.row,.vw{display:none!important}}
</style>
</head>
<body>
<header><div class="in">
  <div style="flex:1;min-width:220px"><h1>❓ Help Center</h1><p>Step-by-step guides for every Balaji NextGen restaurant — open on the counter PC or on your phone.</p></div>
  <a class="back" id="back" href="restaurant-dashboard.html">← Back to dashboard</a>
</div></header>
<main>
  <div class="srch"><input id="q" type="search" placeholder="Search guides — e.g. QR, event, WhatsApp, AR, update" autocomplete="off" aria-label="Search guides"></div>
  <h3 class="sec">Guides</h3>
  <div class="grid" id="guides"></div>
  <div class="none" id="none">No guide matches. Try another word, or ask Balaji NextGen support.</div>
  <h3 class="sec">More help</h3>
  <div class="grid" id="more"></div>
</main>

<div class="vw" id="vw" role="dialog" aria-modal="true" aria-label="Guide slides">
  <div class="top"><b id="vwT"></b><a class="btn" id="vwPpt" download>⬇ PPT</a><a class="btn" id="vwPdf" target="_blank" rel="noopener">PDF</a><button class="btn" id="vwX" aria-label="Close">✕</button></div>
  <div class="stage" id="stage"><button class="nav prev" id="prev" aria-label="Previous slide">‹</button><img id="img" alt=""><button class="nav next" id="next" aria-label="Next slide">›</button></div>
  <div class="bot" id="bot"></div>
</div>

<script>
(function(){
'use strict';
var D=document, $=function(id){ return D.getElementById(id); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

/* ───── guides (add new ones here) ───── */
var GUIDES=[
  { id:'qr-menu', folder:'assets/help/qr-menu-guide/', title:'QR menu, welcome page & events',
    text:'Set up the welcome page, print table QR codes, AR dish view, add events and tickets, automatic WhatsApp invoices — and how every update reaches all clients.',
    file:'QR_Menu_Welcome_Events_Guide', slides:23, tags:['QR menu','Welcome','Events','Tickets','WhatsApp','AR','Updates'],
    chapters:[[1,'Start'],[2,'Guest journey'],[3,'Links'],[4,'Collect first'],[5,'Welcome page'],[6,'Settings'],[7,'Website extras'],[8,'Guest view'],
      [9,'QR menu'],[10,'Phone & PC'],[11,'Print QR'],[12,'Menu content'],[13,'AR view'],[14,'Events'],[15,'Add event'],[16,'Tickets'],[17,'Auto WhatsApp'],
      [18,'Updating'],[19,'All clients'],[20,'Release checklist'],[21,'New restaurant'],[22,'Quick fixes'],[23,'Help']],
    words:'qr scanner table menu welcome landing video cover logo event poster ticket door check in whatsapp invoice template ar 3d plate camera growth hub settings website extras gst fssai swiggy zomato update deploy github apps script new client release fix' }
];
var MORE=[
  { icon:'▶️', title:'Video tutorials · Balaji Education Hub', text:'Short videos for billing, KOT, DSR and more.', href:'https://youtube.com/@balajieducationhub12?si=SX8VnsLq_-I54MNY', label:'Open YouTube ↗', ext:true },
  { icon:'🚀', title:'Growth Hub', text:'Welcome page settings, QR codes, events & tickets, WhatsApp.', href:'guest-growth-hub.html', label:'Open Growth Hub ↗', ext:true },
  { icon:'🖨️', title:'Print station', text:'Print KOTs and bills without QZ Tray — PC or Android.', href:'print-station.html', label:'Open print station ↗', ext:true }
];
function pad(n){ return (n<10?'0':'')+n; }
function src(g,n){ return g.folder+'slide-'+pad(n)+'.jpg'; }

function paint(){
  var q=String($('q').value||'').toLowerCase().trim(), shown=0;
  $('guides').innerHTML=GUIDES.map(function(g,i){
    var hay=(g.title+' '+g.text+' '+g.tags.join(' ')+' '+g.words+' '+g.chapters.map(function(c){ return c[1]; }).join(' ')).toLowerCase();
    if(q&&q.split(/\s+/).some(function(w){ return hay.indexOf(w)<0; })) return '';
    shown++;
    return '<article class="card"><div class="th" data-open="'+i+'" style="background-image:url(\''+esc(src(g,1))+'\')" role="button" tabindex="0" aria-label="Open '+esc(g.title)+'"><span>'+g.slides+' slides</span></div>'
      +'<div class="bd"><h2>'+esc(g.title)+'</h2><p>'+esc(g.text)+'</p><div class="tags">'+g.tags.map(function(t){ return '<i>'+esc(t)+'</i>'; }).join('')+'</div>'
      +'<div class="row"><button class="btn p" data-open="'+i+'">▶ View slides</button><a class="btn" href="'+esc(g.folder+g.file+'.pptx')+'" download>⬇ PPT</a><a class="btn" href="'+esc(g.folder+g.file+'.pdf')+'" target="_blank" rel="noopener">PDF</a></div></div></article>';
  }).join('');
  $('none').style.display=shown?'none':'block';
}
$('more').innerHTML=MORE.map(function(m){ return '<div class="wide"><div class="icon">'+m.icon+'</div><div class="t"><b>'+esc(m.title)+'</b><div style="color:#44403c;font-size:14px">'+esc(m.text)+'</div></div><a class="btn" href="'+esc(m.href)+'"'+(m.ext?' target="_blank" rel="noopener"':'')+'>'+esc(m.label)+'</a></div>'; }).join('');
$('q').oninput=paint; paint();
$('guides').addEventListener('click',function(e){ var b=e.target.closest('[data-open]'); if(b) open(+b.getAttribute('data-open'),1); });
$('guides').addEventListener('keydown',function(e){ if(e.key==='Enter'){ var b=e.target.closest('[data-open]'); if(b) open(+b.getAttribute('data-open'),1); } });

/* back link: the dashboard that opened this tab, else the restaurant dashboard */
try{ if(D.referrer&&/restaurant-dashboard|guest-growth-hub|steward/.test(D.referrer)){ $('back').href=D.referrer.split('#')[0]; } if(window.opener){ $('back').onclick=function(e){ e.preventDefault(); try{ window.close(); }catch(x){} setTimeout(function(){ location.href='restaurant-dashboard.html'; },200); }; } }catch(e){}

/* ───── slide viewer ───── */
var G=null, N=1;
function open(i,n){ G=GUIDES[i]; if(!G) return; $('vwT').textContent=G.title; $('vwPpt').href=G.folder+G.file+'.pptx'; $('vwPdf').href=G.folder+G.file+'.pdf';
  $('vw').classList.add('on'); D.body.style.overflow='hidden'; show(n||1);
  try{ history.pushState({g:i},'','#'+G.id+'-'+(n||1)); }catch(e){} }
function close(){ $('vw').classList.remove('on'); D.body.style.overflow=''; G=null; try{ if(/#/.test(location.href)) history.replaceState(null,'',location.pathname+location.search); }catch(e){} }
function chapterOf(n){ var c=G.chapters[0]; G.chapters.forEach(function(x){ if(x[0]<=n) c=x; }); return c; }
function show(n){ if(!G) return; N=Math.max(1,Math.min(G.slides,n)); var im=$('img'); im.src=src(G,N); im.alt=G.title+' — slide '+N;
  var cur=chapterOf(N);
  $('bot').innerHTML='<span class="cnt">'+N+' / '+G.slides+'</span>'+G.chapters.map(function(c){ return '<button class="ch'+(c===cur?' on':'')+'" data-n="'+c[0]+'">'+esc(c[1])+'</button>'; }).join('');
  var on=$('bot').querySelector('.on'); if(on) on.scrollIntoView({inline:'center',block:'nearest'});
  [N-1,N+1].forEach(function(k){ if(k>=1&&k<=G.slides){ var p=new Image(); p.src=src(G,k); } });
  try{ history.replaceState(history.state,'','#'+G.id+'-'+N); }catch(e){} }
$('prev').onclick=function(){ show(N-1); }; $('next').onclick=function(){ show(N+1); }; $('vwX').onclick=close;
$('bot').onclick=function(e){ var b=e.target.closest('[data-n]'); if(b) show(+b.getAttribute('data-n')); };
D.addEventListener('keydown',function(e){ if(!G) return; if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){ e.preventDefault(); show(N+1); } else if(e.key==='ArrowLeft'||e.key==='PageUp'){ e.preventDefault(); show(N-1); } else if(e.key==='Escape') close(); });
var sx=null; $('stage').addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; },{passive:true});
$('stage').addEventListener('touchend',function(e){ if(sx==null) return; var dx=e.changedTouches[0].clientX-sx; if(Math.abs(dx)>45) show(N+(dx<0?1:-1)); sx=null; },{passive:true});
window.addEventListener('popstate',function(){ if(G&&!/#/.test(location.hash)) close(); });
/* deep link: help-center.html#qr-menu-11 opens that slide */
(function(){ var m=location.hash.match(/^#([\w-]+?)-(\d+)$/); if(!m) return; var i=GUIDES.findIndex(function(g){ return g.id===m[1]; }); if(i>=0) open(i,+m[2]); })();
})();
</script>
</body>
</html>
