<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c1917">
<title>Menu · AR view</title>
<!-- item-ar.html — Balaji NextGen ERP · product / AR view for every client · build 2026-11-19
     ?c=CL00010                → menu catalogue (search, sections, QR for every dish)
     ?c=CL00010&i=ITM00433     → one product: photo, price, 3D / AR (when a model exists), QR, link
     &print=1                  → printable QR cards (table tents)      &embed=1 → inside the apps (menu-ar.js)
     &api=<deployment id>      → other Apps Script deployment          &imgbase=<url> → other item-photo folder -->
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#1c1917;--mut:#78716c;--line:#e7e2da;--acc:#c2410c;--acc2:#ea580c;--ok:#15803d;--warn:#b45309;--soft:#fff7ed;--r:18px}
*{box-sizing:border-box}html,body{margin:0}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom)}
a{color:inherit}button{font:inherit;cursor:pointer}
.wrap{max-width:1060px;margin:0 auto;padding:16px}
.top{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
.top img{width:36px;height:36px;border-radius:10px;object-fit:cover;background:#fff}
.top .co{font-weight:800;letter-spacing:.2px;line-height:1.15}.top .co small{display:block;font-weight:500;opacity:.65;font-size:12px}
.top .sp{flex:1}
.top button{background:rgba(255,255,255,.12);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:13px;font-weight:700}
.crumb{font-size:13px;color:var(--mut);margin:4px 0 12px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.crumb a{text-decoration:none;color:var(--acc);font-weight:600}.crumb i{font-style:normal;opacity:.5}
/* product */
.pv{display:grid;grid-template-columns:1.15fr 1fr;gap:20px}
@media (max-width:780px){.pv{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stage{position:relative;aspect-ratio:1/1;background:#f1ece4;display:flex;align-items:center;justify-content:center}
.stage img{width:100%;height:100%;object-fit:cover;display:block}
.stage .emo{font-size:96px}
.stage model-viewer{width:100%;height:100%;--poster-color:transparent;background:#f1ece4}
.tag{position:absolute;left:12px;top:12px;background:rgba(28,25,23,.78);color:#fff;font-size:11.5px;font-weight:700;padding:5px 9px;border-radius:999px;backdrop-filter:blur(6px)}
.tabs{display:flex;gap:6px;padding:10px;border-top:1px solid var(--line)}
.tabs button{flex:1;border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px;font-weight:700;font-size:13px;color:var(--mut)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.tabs button:disabled{opacity:.45;cursor:not-allowed}
.info{padding:18px}
.name{font-size:24px;font-weight:800;line-height:1.2;margin:0 0 6px;display:flex;gap:10px;align-items:flex-start}
.code{font:12.5px ui-monospace,Menlo,Consolas,monospace;color:var(--mut)}
.price{font-size:22px;font-weight:800;color:var(--acc);margin:10px 0 4px}
.price small{font-size:13px;color:var(--mut);font-weight:600}
.desc{color:#44403c;margin:8px 0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips span{background:var(--soft);border:1px solid #fed7aa;color:#9a3412;font-size:12.5px;font-weight:600;padding:4px 9px;border-radius:999px}
.vd{width:16px;height:16px;border:2px solid;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:6px}
.vd:after{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.vd.VEG{color:#15803d}.vd.NON_VEG{color:#b91c1c}.vd.EGG{color:#ca8a04}
.status{margin:14px 0;border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
.status b{display:block;font-size:14px}
.status.ok{background:#f0fdf4;border:1px solid #bbf7d0;color:#14532d}
.status.no{background:#fffbeb;border:1px solid #fde68a;color:#78350f}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 14px;font-weight:800;font-size:14px}
.btn.pri{background:var(--acc);color:#fff}.btn.pri:hover{background:var(--acc2)}
.btn.sec{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn.wa{background:#16a34a;color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;min-width:130px}
.qrbox{display:flex;gap:16px;align-items:center;padding:16px;border-top:1px dashed var(--line)}
.qrbox canvas{width:132px;height:132px;flex:none;border-radius:10px;border:1px solid var(--line);background:#fff;image-rendering:pixelated}
.qrbox .t{font-size:13px;color:var(--mut)}.qrbox .t b{color:var(--ink);display:block;font-size:14px;margin-bottom:2px}
.link{font:12px ui-monospace,Menlo,monospace;word-break:break-all;background:#f5f5f4;border-radius:8px;padding:6px 8px;margin:8px 0;color:#57534e}
.addbar{position:sticky;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%);display:none}
.addbar .btn{width:100%;padding:14px;font-size:15px}
/* catalogue */
.tools{display:flex;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.tools input{flex:1;min-width:180px;border:1px solid var(--line);border-radius:12px;padding:11px 13px;font:inherit;background:#fff}
.tools select{border:1px solid var(--line);border-radius:12px;padding:10px;background:#fff;font:inherit}
.secs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.secs::-webkit-scrollbar{display:none}
.secs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:700;color:#57534e}
.secs button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.stats{font-size:12.5px;color:var(--mut);margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.gi{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column;color:inherit;text-decoration:none}
.gi:hover{border-color:#d6c9b8;box-shadow:0 4px 14px rgba(28,25,23,.07)}
.gi .ph{aspect-ratio:4/3;background:#f1ece4;position:relative;display:flex;align-items:center;justify-content:center;font-size:42px}
.gi .ph img{width:100%;height:100%;object-fit:cover}
.gi .ph em{position:absolute;right:7px;top:7px;font-style:normal;font-size:10.5px;font-weight:800;padding:3px 7px;border-radius:999px;background:var(--ok);color:#fff}
.gi .tx{padding:9px 11px 11px}.gi .nm{font-weight:700;font-size:14px;line-height:1.25}.gi .pr{color:var(--acc);font-weight:800;font-size:13.5px;margin-top:3px}
.empty{padding:40px 16px;text-align:center;color:var(--mut)}
.load{padding:60px 16px;text-align:center;color:var(--mut)}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:sp 0.8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.arbtn{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.arbtn.big{bottom:50%;transform:translate(-50%,50%);font-size:17px;padding:16px 22px}
.arprompt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center;color:#fff;background:rgba(0,0,0,.25);font:15px system-ui,sans-serif}
.arprompt b{font-size:19px}.arprompt span{max-width:300px;opacity:.92}
.arprompt .ring{width:90px;height:90px;border-radius:50%;border:3px solid #fff;animation:arm 1.6s ease-in-out infinite alternate}
@keyframes arm{from{transform:translateX(-40px) scale(.9)}to{transform:translateX(40px) scale(1)}}
.pset{position:absolute;right:10px;bottom:10px;border:0;border-radius:99px;padding:8px 12px;background:#1c1917;color:#fff;font:600 12px system-ui,sans-serif;cursor:pointer;z-index:3}
.ppanel{position:absolute;right:10px;top:96px;width:min(300px,calc(100% - 20px));max-height:calc(100% - 150px);overflow:auto;background:#fff;border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:12px;z-index:4;font:13px system-ui,sans-serif;color:#1c1917}
.ppanel .ph{display:flex;align-items:center;gap:8px;margin-bottom:6px}.ppanel .ph b{flex:1}.ppanel .ph button{border:0;background:#f5f5f4;border-radius:99px;width:28px;height:28px;cursor:pointer}
.ppanel label{display:block;margin:8px 0;font-weight:600;color:#44403c}.ppanel label span{float:right;font-weight:500;color:#78716c}
.ppanel select,.ppanel input[type=range]{display:block;width:100%;margin-top:4px}.ppanel select{padding:7px;border:1px solid #d6d3d1;border-radius:8px;font:inherit}
.ppanel .pr{display:flex;gap:8px;margin-top:10px}.ppanel .pr .btn{flex:1}.ppanel .pm{margin-top:8px;font-size:12px;color:#57534e}
.psize{position:absolute;top:48px;left:50%;transform:translateX(-50%);display:flex;gap:6px;background:rgba(255,255,255,.9);border-radius:99px;padding:4px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.psize button{border:0;background:none;border-radius:99px;padding:6px 10px;font:600 12px system-ui,sans-serif;cursor:pointer;color:#57534e;white-space:nowrap}
.psize button.on{background:#1c1917;color:#fff}
.arhelp{position:absolute;left:10px;right:10px;bottom:70px;background:#fff7ed;border:1px solid #fed7aa;color:#7c2d12;border-radius:12px;padding:10px 12px;font:13.5px/1.4 system-ui,sans-serif;text-align:center}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;font-size:13.5px;opacity:0;transition:.25s;z-index:20;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
/* print QR cards */
.pq{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pq .c{border:1px solid #d6d3d1;border-radius:12px;padding:10px;text-align:center;break-inside:avoid;page-break-inside:avoid;background:#fff}
.pq canvas{width:120px;height:120px}.pq .n{font-weight:800;font-size:13px;margin-top:4px}.pq .p{font-size:12px;color:#57534e}
@media print{.top,.tools,.secs,.stats,.noprint{display:none!important}body{background:#fff}.wrap{padding:0}.pq{grid-template-columns:repeat(4,1fr)}}
body.embed .top .bk{display:none}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<style>html,body{max-width:100%;overflow-x:hidden}.pv{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}.pv>*{min-width:0}.wrap{width:100%;max-width:1060px}.row .btn{min-width:0;overflow-wrap:anywhere}.stage{max-height:65dvh}.stage img{object-fit:contain}.qrbox{flex-wrap:wrap;overflow-wrap:anywhere}@media(max-width:780px){.pv{grid-template-columns:minmax(0,1fr)}.wrap{padding:10px}}</style></head>

<div class="top">
  <img id="logo" alt="" hidden>
  <div class="co"><span id="coName">Menu</span><small id="coSub">Product view · AR</small></div>
  <div class="sp"></div>
  <button class="bk" id="btnMenu" hidden>☰ Menu</button>
  <button id="btnClose" hidden aria-label="Close">✕</button>
</div>
<main class="wrap" id="app"><div class="load"><div class="spin"></div>Loading menu…</div></main>
<div class="addbar" id="addbar"><button class="btn pri" id="btnAdd">＋ Add to order</button></div>
<div class="toast" id="toast"></div>

  var o=plateOpt(it); PLATE_PICK[it.id]=0;
  var box=D.createElement('div'); box.className='ppanel'; box.id='pPanel';
  function sel(id,map,v){ return '<select id="'+id+'">'+Object.keys(map).map(function(k){ return '<option value="'+k+'"'+(k===v?' selected':'')+'>'+esc(map[k])+'</option>'; }).join('')+'</select>'; }
  function rng(id,min,max,st,v){ return '<input type="range" id="'+id+'" min="'+min+'" max="'+max+'" step="'+st+'" value="'+v+'">'; }
  box.innerHTML='<div class="ph"><b>Plate settings · '+esc(title(it.name))+'</b><button id="ppX" aria-label="Close">✕</button></div>'+
    '<label>Serve in'+sel('ppK',KINDS,o.k)+'</label><label>Look'+sel('ppS',LOOKS,o.s)+'</label>'+
    '<label>Size <span id="ppCmV">'+o.cm+' cm</span>'+rng('ppCm',5,40,1,o.cm)+'</label>'+
    '<label>Photo zoom <span id="ppZV">×'+o.z.toFixed(2)+'</span>'+rng('ppZ',1,2,0.05,o.z)+'</label>'+
    '<label>Move photo ← →'+rng('ppX2',-0.3,0.3,0.02,o.x)+'</label><label>Move photo ↑ ↓'+rng('ppY',-0.3,0.3,0.02,o.y)+'</label>'+
    '<div class="pr"><button class="btn sec" id="ppReset">Default</button><button class="btn pri" id="ppSave">💾 Save for this dish</button></div><div class="pm" id="ppMsg">Changes preview here · Save makes them live for every guest.</div>';
  $('stage').appendChild(box);
  var t=null; function cur(){ return {k:$('ppK').value,s:$('ppS').value,cm:Number($('ppCm').value),z:Number($('ppZ').value),x:Number($('ppX2').value),y:Number($('ppY').value)}; }
  function upd(kindChanged){ var c=cur();
    if(kindChanged){ c.cm=plateCmRule(it,c.k); $('ppCm').value=c.cm; $('ppS').value=c.k==='board'?'wood':c.k==='thali'?'steel':(c.s==='wood'||c.s==='steel'?'white':c.s); c.s=$('ppS').value; }
    $('ppCmV').textContent=c.cm+' cm'; $('ppZV').textContent='×'+c.z.toFixed(2);
    PLATE_TRY[it.id]=c; clearTimeout(t); t=setTimeout(function(){ redrawKeep(); },350); }
  function redrawKeep(){ var keep=box; redraw(); var tick=setInterval(function(){ var st=$('stage'); if(st&&st.querySelector('model-viewer')&&!$('pPanel')){ st.appendChild(keep); clearInterval(tick); } },120); setTimeout(function(){ clearInterval(tick); },15000); }
  $('ppK').onchange=function(){ upd(true); }; ['ppS','ppCm','ppZ','ppX2','ppY'].forEach(function(id){ $(id).oninput=function(){ upd(false); }; });
  $('ppX').onclick=function(){ box.remove(); };
  $('ppReset').onclick=function(){ $('ppMsg').textContent='Resetting…'; savePlate(it,null,true).then(function(){ delete it.plate; delete PLATE_TRY[it.id]; box.remove(); toast('Back to default'); redraw(); }).catch(function(e){ $('ppMsg').textContent='✗ '+e.message; }); };
  $('ppSave').onclick=function(){ var c=cur(); $('ppMsg').textContent='Saving…';
    savePlate(it,c).then(function(){ it.plate=c; delete PLATE_TRY[it.id]; try{ localStorage.removeItem('bnx_ar_cat_'+CID); }catch(e){} $('ppMsg').textContent='✓ Saved — guests see this '+KINDS[c.k].toLowerCase()+' (up to 10 min on phones that had the menu open).'; toast('Saved'); })
     .catch(function(e){ $('ppMsg').textContent='✗ '+e.message; }); };
}

/* ── product view ── */
function renderItem(it,co){
  head(co); CUR3D=''; CURIT=it; var app=$('app'), real3d=!!it.glb, plate=false, has3d=real3d||plate, nm=title(it.name);
  var chips=[]; if(it.variants) it.variants.split(/\s*[\/;]\s*/).forEach(function(v){ if(v) chips.push(v); });
  var addons=it.addons?it.addons.split(/\s*[\/;,]\s*/).filter(Boolean):[];
  app.innerHTML=
   '<div class="crumb">'+(EMBED?'':'<a href="'+esc(link(''))+'" data-go="">Menu</a><i>›</i>')+'<a href="'+esc(link('')+'&s='+encodeURIComponent(it.section))+'" data-sec="'+esc(it.section)+'">'+esc(title(it.section))+'</a><i>›</i><span>'+esc(nm)+'</span></div>'+
   '<div class="pv"><div class="card"><div class="stage" id="stage">'+imgTag(it,1000)+''+'</div>'+
     '<div class="tabs"><button id="tPhoto" class="on">📷 Photo</button><button id="t3d"'+(has3d?'':' disabled title="No 3D model available"')+'>🧊 3D view</button><button id="tAr"'+(has3d?'':' disabled title="No 3D model available"')+'>📱 View in AR</button></div></div>'+
   '<div class="card"><div class="info"><h1 class="name">'+(it.veg?'<span class="vd '+esc(it.veg)+'" title="'+esc(it.veg.replace('_',' '))+'"></span>':'')+'<span>'+esc(nm)+'</span></h1>'+
     '<div class="code">Product code: '+esc(it.id)+(it.type==='BAR'?' · Bar':'')+'</div>'+
     '<div class="price">'+money(it.price)+(it.bottle&&it.bottle!==it.price?' <small>· bottle '+money(it.bottle)+'</small>':'')+'</div>'+
     (it.desc?'<p class="desc">'+esc(it.desc)+'</p>':'')+
     (chips.length?'<div class="chips">'+chips.map(function(c){ return '<span>'+esc(c)+'</span>'; }).join('')+'</div>':'')+
     (addons.length?'<div class="code" style="margin-top:6px">Add-ons: '+esc(addons.join(' · '))+'</div>':'')+
     (real3d?'<div class="status ok"><span>🧊</span><div><b>3D model · AR ready</b>Tap “View in AR” to place this dish on your table (Android: Scene Viewer · iPhone: Quick Look).</div></div>'
     :plate?'<div class="status ok"><span>🍽️</span><div><b>3D plate · AR ready</b>The dish photo on a real-size plate (S / M / L) — tap “View in AR”, point at your table and move the phone slowly.</div></div>'
           :'<div class="status no"><span>📷</span><div><b>Photo only</b>No 3D model for this dish yet — verified photo or icon shown instead.</div></div>')+
     '<div class="row"><button class="btn sec" id="bCopy">🔗 Copy link</button><button class="btn sec" id="bShare">📤 Share</button><a class="btn wa" id="bWa" target="_blank" rel="noopener">WhatsApp</a></div>'+
   '</div><div class="qrbox"><span id="qrSlot"></span><div class="t"><b>QR for this dish</b>Print it on the table tent or menu — guests scan to open this page.<div class="link" id="lnk"></div><button class="btn pri" id="bQr">⬇ Download QR</button></div></div></div></div>';
  var url=link(it.id);
  $('lnk').textContent=url; $('qrSlot').appendChild(qrCanvas(url,264));
  $('bCopy').onclick=function(){ copy(url); };
  $('bQr').onclick=function(){ qrDownload(it,co); };
  $('bWa').href='https://wa.me/?text='+encodeURIComponent(nm+' — '+money(it.price)+'\n'+url);
  $('bShare').onclick=function(){ if(navigator.share) navigator.share({title:nm,text:nm+' — '+money(it.price),url:url}).catch(function(){}); else copy(url); };
  app.querySelectorAll('[data-go]').forEach(function(a){ a.onclick=function(e){ e.preventDefault(); go(''); }; });
  app.querySelectorAll('[data-sec]').forEach(function(a){ a.onclick=function(e){ e.preventDefault(); SEC=a.getAttribute('data-sec'); go(''); }; });
  $('addbar').style.display=(EMBED&&CAN_ADD)?'block':'none';
  var stage=$('stage'), tabs=[$('tPhoto'),$('t3d'),$('tAr')];
  function on(b){ tabs.forEach(function(t){ t.classList.toggle('on',t===b); }); }
  $('tPhoto').onclick=function(){ on(this); stage.innerHTML=imgTag(it,1000)+''; };
  /* 2026-11-26 AR fixes (guest: "camera won't open · lands on the floor · wrong size · dish moves with the phone"):
     · the camera only opens from a real tap — activateAR() on the "load" event was blocked by the browser, so the AR tab
       now shows one big "Open camera" button (the tap starts AR);
     · inside the menu book / order sheet (iframe) AR opens this page in its own tab (cameras are refused in frames);
     · the made-from-photo plate is a blob → Scene Viewer cannot open it ("couldn't load"), so plates use WebXR / Quick Look,
       real .glb models use Scene Viewer first (steadiest anchoring);
     · until the phone finds the TABLE the dish floats with the camera — a guide now says "point at the table, move slowly"
       and disappears when the dish is placed; drag moves it, two fingers turn it;
     · plate size S / M / L (16–30 cm) instead of always 28 cm. */
  function arUrl(){ return link(it.id)+'&ar=1'; }
  function show3d(thenAr){
    CUR3D=it.id;
    stage.innerHTML='<div class="load"><div class="spin"></div>'+(real3d?'Loading 3D…':'Making the 3D plate…')+'</div>';
    Promise.all([needMV(), real3d?Promise.resolve(it.glb):plateSrc(it)]).then(function(r){
      if(CUR3D!==it.id) return;
      var src=r[1], poster=photo(it.photo,1000), po=plateOpt(it), cm=po.cm, orb=po.k==='glass'?'0deg 68deg 0.42m':po.k==='bowl'?'0deg 58deg '+(0.40+cm/50).toFixed(2)+'m':'0deg 52deg '+(0.45+cm/56).toFixed(2)+'m';
      var modes=real3d&&/^https:/i.test(src)?'scene-viewer webxr quick-look':'webxr quick-look';
      stage.innerHTML='<model-viewer id="mv" src="'+esc(src)+'"'+(real3d&&it.usdz?' ios-src="'+esc(it.usdz)+'"':'')+(poster?' poster="'+esc(poster)+'"':'')+
        ' alt="'+esc(nm)+'" ar ar-modes="'+modes+'" ar-placement="floor" ar-scale="fixed" xr-environment camera-controls touch-action="pan-y"'+(thenAr?'':' auto-rotate')+(real3d?'':' camera-orbit="'+orb+'" field-of-view="30deg"')+' shadow-intensity="1" exposure="1.05">'+
        '<button slot="ar-button" class="btn pri arbtn'+(thenAr?' big':'')+'" id="arGo">📷 '+(thenAr?'Open camera · place on my table':'View on my table')+'</button>'+
        '<div slot="ar-prompt" class="arprompt"><div class="ring"></div><b>Point the phone at your table</b><span>Move it slowly left and right until the dish sits on the table. Drag to move · two fingers to turn.</span></div>'+
        '</model-viewer><span class="tag">'+(real3d?'3D model':esc(KINDS[po.k])+' · '+esc(LOOKS[po.s])+' · '+cm+' cm')+'</span>'+
        (real3d?'':'<div class="psize" id="psize">'+(KSIZE[po.k]||KSIZE.plate).map(function(z){ return '<button data-cm="'+z[0]+'"'+(z[0]===cm?' class="on"':'')+'>'+z[1]+' · '+z[0]+' cm</button>'; }).join('')+'</div>')+
        (!real3d&&canSetPlate()&&!thenAr?'<button class="pset" id="pSet">⚙ Plate settings</button>':'')+
        '<div class="arhelp" id="arHelp" hidden></div>';
      var mv=$('mv'), help=$('arHelp');
      function tell(h){ help.innerHTML=h; help.hidden=!h; }
      mv.addEventListener('load',function(){
        if(!mv.canActivateAR){
          var iOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
          tell(EMBED?'Tap <b>Open camera</b> — it opens in a new tab (the camera cannot start inside the menu).'
            :iOS?'Open this page in <b>Safari</b> to place the dish on your table.'
            :/Android/i.test(navigator.userAgent)?'Use <b>Chrome</b> and install <b>Google Play Services for AR</b> (Play Store) — then tap Open camera again.'
            :'AR works on a phone. Scan the QR code on the right with your phone camera.');
          var b=$('arGo'); if(b){ b.style.display=''; b.onclick=function(e){ e.preventDefault(); e.stopPropagation(); if(EMBED||/Android|iPhone|iPad/i.test(navigator.userAgent)) W.open(arUrl(),'_blank','noopener'); else toast('Scan the QR with your phone'); }; }
        }
      },{once:true});
      mv.addEventListener('ar-status',function(ev){ var st=ev.detail&&ev.detail.status;
        if(st==='failed') tell('The camera could not start. Android: Chrome + Google Play Services for AR. iPhone: Safari. Then tap again.');
        else if(st==='object-placed') tell('');
      });
      mv.addEventListener('error',function(){ toast('3D could not load'); },{once:true});
      var ps=$('psize'); if(ps) ps.onclick=function(e){ var b=e.target.closest('[data-cm]'); if(!b) return; PLATE_PICK[it.id]=Number(b.getAttribute('data-cm')); show3d(thenAr); };
      var pb=$('pSet'); if(pb) pb.onclick=function(){ platePanel(it,function(){ show3d(thenAr); }); };
    }).catch(function(e){ CUR3D=''; stage.innerHTML=imgTag(it,1000); toast(e.message||'3D could not load'); on($('tPhoto')); });
  }
  $('t3d').onclick=function(){ if(!has3d) return; on(this); show3d(false); };
  $('tAr').onclick=function(){ if(!has3d) return;
    if(EMBED){ W.open(arUrl(),'_blank','noopener'); toast('Opening the camera in a new tab…'); return; }   /* real tap → new tab allowed */
    on(this); show3d(true); };
  if(qs.get('ar')==='1'&&has3d&&!EMBED){ on($('tAr')); show3d(true); }
}

/* ── catalogue ── */
function sections(){ var s=[],seen={}; (CAT.items||[]).forEach(function(i){ if(!i.offMenu&&!seen[i.section]){ seen[i.section]=1; s.push(i.section); } }); return s; }
function filtered(){
  var q=Q.toLowerCase().trim(), t=($('fType')&&$('fType').value)||'ALL';
  return (CAT.items||[]).filter(function(i){
    if(i.offMenu) return false;
    if(SEC!=='All'&&i.section!==SEC) return false;
    if(t==='AR'&&!i.glb) return false; if(t==='REAL'&&i.photoKind!=='REAL') return false;
    if(t==='FOOD'&&i.type!=='FOOD') return false; if(t==='BAR'&&i.type!=='BAR') return false; if(t==='VEG'&&i.veg!=='VEG') return false;
    return !q || (i.name+' '+i.id+' '+i.section+' '+(i.desc||'')).toLowerCase().indexOf(q)>=0;
  });
}
function renderCatalogue(){
  head(CAT.company); var app=$('app');
  if(!$('cq')){
    app.innerHTML='<div class="tools"><input id="cq" type="search" placeholder="Search dish, drink or code…" autocomplete="off">'+
      '<select id="fType"><option value="ALL">All items</option><option value="FOOD">Food</option><option value="BAR">Bar</option><option value="VEG">Veg</option><option value="REAL">Real photos</option><option value="AR">3D / AR ready</option></select>'+
      '<button class="btn sec noprint" id="bPrint">'+(PRINT?'▦ Photos':'🖨 QR cards')+'</button><button class="btn sec noprint" id="bMenuQr">🔗 Menu QR</button></div>'+
      '<div class="secs" id="secs"></div><div class="stats" id="stats"></div><div id="list"></div>';
    $('cq').value=Q; $('cq').oninput=function(){ Q=this.value; drawList(); };
    $('fType').onchange=drawList;
    $('bPrint').onclick=function(){ PRINT=!PRINT; this.textContent=PRINT?'▦ Photos':'🖨 QR cards'; drawList(); if(PRINT) setTimeout(function(){ toast('Use the browser’s Print to print these cards'); },200); };
    $('bMenuQr').onclick=function(){ qrDownload({id:'',name:'Our menu',price:0,glb:''},CAT.company); };
  }
  var s=sections(); if(SEC!=='All'&&s.indexOf(SEC)<0) SEC='All';
  $('secs').innerHTML=['All'].concat(s).map(function(x){ return '<button class="'+(x===SEC?'on':'')+'" data-s="'+esc(x)+'">'+esc(x==='All'?'All':title(x))+'</button>'; }).join('');
  $('secs').querySelectorAll('button').forEach(function(b){ b.onclick=function(){ SEC=b.getAttribute('data-s'); renderCatalogue(); }; });
  drawList();
}
function drawList(){
  var l=filtered(), box=$('list');
  $('stats').textContent=l.length+' of '+CAT.count+' items · '+CAT.realPhotos+' real photos · '+CAT.arReady+' in 3D / AR';
  if(!l.length){ box.innerHTML='<div class="empty">Nothing matches — try another word or section.</div>'; return; }
  var show=l.slice(0,PRINT?400:240);
  if(PRINT){
    box.innerHTML='<div class="pq">'+show.map(function(i){ return '<div class="c" data-q="'+esc(i.id)+'"></div>'; }).join('')+'</div>';
    show.forEach(function(i){ var c=box.querySelector('[data-q="'+i.id+'"]'); c.appendChild(qrCanvas(link(i.id),240)); c.insertAdjacentHTML('beforeend','<div class="n">'+esc(title(i.name))+'</div><div class="p">'+money(i.price)+' · '+esc(i.id)+'</div>'); });
    return;
  }
  box.innerHTML='<div class="grid">'+show.map(function(i){
    return '<a class="gi" href="'+esc(link(i.id))+'" data-i="'+esc(i.id)+'"><div class="ph">'+imgTag(i,400)+(i.glb?'<em>3D · AR</em>':'')+'</div><div class="tx"><div class="nm">'+esc(title(i.name))+'</div><div class="pr">'+money(i.price)+'</div></div></a>';
  }).join('')+'</div>'+(l.length>show.length?'<div class="empty">Showing '+show.length+' of '+l.length+' — search to narrow down.</div>':'');
  box.querySelectorAll('[data-i]').forEach(function(a){ a.onclick=function(e){ if(e.metaKey||e.ctrlKey) return; e.preventDefault(); go(a.getAttribute('data-i')); }; });
}

function fail(msg){ $('app').innerHTML='<div class="empty">⚠️ '+esc(msg)+'<br><br><button class="btn pri" onclick="location.reload()">Retry</button></div>'; }
function route(fromRefresh){
  if(!CID){ head({}); return fail('Open this page with ?c=CLIENT_ID (for example ?c=CL00010).'); }
  if(ITEM){
    var hit=CAT&&CAT.items&&CAT.items.filter(function(x){ return x.id===ITEM; })[0];
    if(hit) return renderItem(hit,CAT.company);
    if(fromRefresh) return;
    var pv=PREVIEW&&PREVIEW.id===ITEM?PREVIEW:null;
    if(pv) renderItem(pv,{name:pv.co||''}); else $('app').innerHTML='<div class="load"><div class="spin"></div>Loading…</div>';
    return loadOne(ITEM).then(function(d){ if(ITEM===d.item.id){ var keep3d=CUR3D===ITEM; if(!keep3d) renderItem(d.item,d.company); else CURIT=d.item; } })
      .catch(function(e){ if(!pv) fail(e.message); else toast('Showing the app’s details — '+e.message); });
  }
  if(CAT) return renderCatalogue();
  loadCatalogue().then(function(d){ CAT=d; if(!ITEM) renderCatalogue(); }).catch(function(e){ fail(e.message); });
}
var s0=qs.get('s'); if(s0) SEC=s0;
route();
if(ITEM&&!EMBED) setTimeout(function(){ loadCatalogue().then(function(d){ CAT=d; }).catch(function(){}); },1500);
W.addEventListener('keydown',function(e){ if(e.key==='Escape'&&EMBED) $('btnClose').click(); });
})();
</script>
</body>
