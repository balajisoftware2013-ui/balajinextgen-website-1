<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0c0b">
<title>Menu</title>
<!-- menu-book.html — Balaji NextGen ERP · page-by-page menu book for every client · build 2026-11-19
     ?c=CL00010            → cover, then the designed menu pages (swipe / ‹ › / keys), tap a dish → photo · 3D · AR sheet
     #p=3                  → open at page 3 (QR on a table tent can point to a page)
     &card=1               → printable table card with the QR to this book
     Pages: assets/menu-book/<CLIENT>/book.json  (pages = designed menu images, hot = tappable dish areas in %)          -->
<style>
:root{--bg:#0e0c0b;--ink:#f5efe6;--mut:#a8a29e;--gold:#c8a46a;--line:rgba(255,255,255,.12)}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
.serif{font-family:"Cormorant Garamond","Playfair Display",Georgia,"Times New Roman",serif}
#stage{position:fixed;inset:0 0 86px 0;display:flex;align-items:center;justify-content:center;padding:14px;perspective:2200px}
.pg{position:absolute;background:#1a1715;box-shadow:0 18px 50px rgba(0,0,0,.6);border-radius:4px;overflow:hidden;
  transform-origin:left center;transition:transform .55s cubic-bezier(.3,.7,.2,1),opacity .55s;backface-visibility:hidden;touch-action:pan-y pinch-zoom}
.pg img{width:100%;height:100%;display:block;object-fit:fill;user-select:none;-webkit-user-drag:none}
.pg .shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.35),transparent 18%);opacity:0;transition:opacity .55s;pointer-events:none}
.pg.out-next{transform:rotateY(-100deg);opacity:.2}.pg.out-next .shade{opacity:1}
.pg.in-prev{transform:rotateY(-100deg);opacity:.2}
.pg.under{transform:scale(.985);transition:transform .55s}
.hs{position:absolute;border:0;background:transparent;padding:0;border-radius:6px;-webkit-tap-highlight-color:transparent}
.hs:after{content:"›";position:absolute;right:-17px;top:1px;width:15px;height:15px;opacity:.85;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font:700 12px/1 system-ui;color:#fff;background:rgba(200,164,106,.85);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.hs:active,.hs.pulse{background:rgba(200,164,106,.28);outline:2px solid rgba(200,164,106,.9)}
.hs.pulse{animation:pl 1.2s ease 2}@keyframes pl{50%{background:rgba(200,164,106,.05)}}
.hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(0,0,0,.72);color:#fff;font-size:12px;padding:6px 11px;border-radius:999px;pointer-events:none;transition:opacity .4s;white-space:nowrap}
/* cover */
.cover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;
  background:radial-gradient(120% 80% at 50% 0%,#2a221b 0%,#0e0c0b 70%)}
.cover .rule{width:120px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:16px auto}
.cover h1{font-weight:500;font-size:clamp(34px,9vw,56px);letter-spacing:1px;margin:0;line-height:1.05}
.cover .sub{letter-spacing:5px;font-size:12px;text-transform:uppercase;color:var(--gold)}
.cover .ch{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:22px}
.cover .ch button{border:1px solid var(--gold);background:transparent;border-radius:999px;padding:11px 22px;letter-spacing:2px;text-transform:uppercase;font-size:12.5px}
.cover .ch button.pri{background:var(--gold);color:#1b140c;font-weight:700}
.cover .note{position:absolute;bottom:18px;left:20px;right:20px;font-size:11px;color:var(--mut)}
/* bar */
.bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;align-items:center;gap:4px;background:rgba(28,25,23,.92);border:1px solid var(--line);
  border-radius:999px;padding:6px;backdrop-filter:blur(10px);width:min(94vw,520px);justify-content:space-between}
.bar button{background:transparent;border:0;border-radius:999px;padding:10px 14px;letter-spacing:3px;font-size:13px;text-transform:uppercase}
.bar button:hover{background:rgba(255,255,255,.07)}.bar .n{letter-spacing:2px;font-size:14px;min-width:70px;text-align:center}
.bar .ic{font-size:20px;letter-spacing:0;padding:8px 14px}
/* browse */
#browse{position:fixed;inset:0;background:rgba(10,9,8,.97);z-index:20;display:none;flex-direction:column}
#browse.on{display:flex}
#browse .hd{display:flex;gap:8px;align-items:center;padding:14px 14px 8px}
#browse input{flex:1;background:#1c1917;border:1px solid var(--line);border-radius:12px;padding:11px 13px;color:var(--ink);font:inherit}
#browse .x{background:#1c1917;border:1px solid var(--line);border-radius:12px;padding:10px 14px}
#browse .row{display:flex;gap:8px;padding:0 14px 8px;flex-wrap:wrap}
#browse .row button,#browse .row a{border:1px solid var(--line);background:#1c1917;border-radius:999px;padding:8px 13px;font-size:13px;color:var(--ink);text-decoration:none}
#browse .row .wa{background:#15803d;border-color:#15803d}
#browse .body{flex:1;overflow:auto;padding:4px 14px 30px}
#browse h3{font-weight:500;letter-spacing:3px;text-transform:uppercase;font-size:12px;color:var(--gold);margin:16px 0 8px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.thumbs button{border:1px solid var(--line);background:#1c1917;border-radius:8px;padding:0;overflow:hidden;position:relative}
.thumbs button.cur{outline:2px solid var(--gold)}
.thumbs img{width:100%;display:block;aspect-ratio:2/3;object-fit:cover}
.thumbs span{position:absolute;left:6px;bottom:6px;background:rgba(0,0,0,.7);border-radius:6px;padding:1px 6px;font-size:11px}
.res{display:flex;flex-direction:column;gap:2px}
.res button{display:flex;justify-content:space-between;gap:10px;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:11px 2px}
.res small{color:var(--mut)}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:#f5efe6;color:#1c1917;padding:9px 15px;border-radius:12px;font-weight:700;font-size:13px;opacity:0;transition:.25s;z-index:40;pointer-events:none}
.toast.on{opacity:1}
.err{max-width:420px;text-align:center;color:var(--mut);padding:30px}
/* table card (print) */
#card{display:none}
body.card{overflow:auto;background:#fff;color:#1c1917}
body.card #stage,body.card .bar{display:none}
body.card #card{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;padding:30px}
#card .tc{width:105mm;min-height:148mm;border:1px solid #d6cbb8;border-radius:6px;padding:14mm 10mm;text-align:center;background:linear-gradient(180deg,#fffdf8,#f7f1e6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6mm}
#card h1{font-weight:500;font-size:30px;margin:0}#card .s{letter-spacing:4px;font-size:10px;text-transform:uppercase;color:#8a6a3a}
#card canvas{width:52mm;height:52mm}#card .cta{font-size:22px}
@media print{body.card #card{padding:0;min-height:0}#card .noprint{display:none}}
@media (prefers-reduced-motion:reduce){.pg{transition:none}}
</style>
</head>
<body>
<div id="stage"><div class="err">Loading menu…</div></div>
<div class="bar" id="bar" hidden>
  <button class="ic" id="bPrev" aria-label="Previous page">‹</button>
  <button id="bBrowse">Browse</button>
  <span class="n" id="bN">–</span>
  <button class="ic" id="bFull" aria-label="Full screen">⛶</button>
  <button class="ic" id="bNext" aria-label="Next page">›</button>
</div>
<div id="browse" role="dialog" aria-label="Browse the menu">
  <div class="hd"><input id="q" type="search" placeholder="Search a dish or drink…" autocomplete="off"><button class="x" id="bX">✕</button></div>
  <div class="row"><button id="bCover">⌂ Cover</button><span id="chs" style="display:contents"></span><a class="wa" id="bWa" target="_blank" rel="noopener">WhatsApp</a><button id="bCopy">🔗 Copy link</button><button id="bCard">🪧 Table QR card</button></div>
  <div class="body" id="bBody"></div>
</div>
<div id="card"></div>
<div class="toast" id="toast"></div>

      '<div class="ch">'+(BOOK.chapters||[]).map(function(c,k){ return '<button data-p="'+c.page+'" class="'+(k?'':'pri')+'">'+esc(c.name)+'</button>'; }).join('')+'</div>'+
      '<div class="ch"><button data-browse>🔍 Search a dish</button></div><div class="note">'+esc(BOOK.note||'')+'</div></div>';
    d.querySelectorAll('[data-p]').forEach(function(b){ b.onclick=function(){ go(+b.getAttribute('data-p')); }; });
    d.querySelector('[data-browse]').onclick=openBrowse;
    return d;
  }
  var pg=BOOK.pages[i-1]; d._ar=pg.w/pg.h; fit(d);
  d.innerHTML='<img alt="Menu page '+i+'" referrerpolicy="no-referrer" src="'+esc(pageSrc(pg))+'" decoding="async" draggable="false"><div class="shade"></div>'+
    (pg.hot||[]).map(function(h,k){ return '<button class="hs" data-k="'+k+'" aria-label="'+esc(h.name)+'" style="left:'+h.x+'%;top:'+h.y+'%;width:'+h.w+'%;height:'+h.h+'%"></button>'; }).join('')+
    ((pg.hot||[]).length&&!sessionStorage.getItem('bnx_book_hint')?'<div class="hint">Tap a dish to see the photo · 3D · AR</div>':'');
  d.querySelectorAll('.hs').forEach(function(b){ b.onclick=function(e){ e.stopPropagation(); var h=pg.hot[+b.getAttribute('data-k')]; openItem(h); }; });
  var hint=d.querySelector('.hint'); if(hint){ sessionStorage.setItem('bnx_book_hint','1'); setTimeout(function(){ hint.style.opacity='0'; },3500); }
  return d;
}
function preload(i){ [i+1,i+2,i-1].forEach(function(k){ if(k>=1&&k<=N()){ var im=new Image(); im.referrerPolicy='no-referrer'; im.src=pageSrc(BOOK.pages[k-1]); } }); }
function openItem(h){
  if(!W.bnxAr){ toast('Item view not available'); return; }
  W.bnxAr.open(h.id,{clientId:CID,preview:{name:h.name,price:Number(h.price)||0}});
}
function show(i,dir){
  var st=$('stage'), old=st.querySelector('.pg:not(.leaving)'), el=pageEl(i);
  if(!old||!dir){ st.innerHTML=''; st.appendChild(el); }
  else if(dir>0){ st.insertBefore(el,old); el.classList.add('under'); requestAnimationFrame(function(){ el.classList.remove('under'); old.classList.add('out-next','leaving'); }); setTimeout(function(){ old.remove(); busy=false; },560); busy=true; }
  else { el.classList.add('in-prev'); st.appendChild(el); old.classList.add('leaving'); requestAnimationFrame(function(){ requestAnimationFrame(function(){ el.classList.remove('in-prev'); }); }); setTimeout(function(){ old.remove(); busy=false; },560); busy=true; }
  P=i; $('bN').textContent=i?i+' / '+N():'Cover'; $('bPrev').disabled=i===0; $('bNext').disabled=i===N();
  try{ history.replaceState(null,'',i?'#p='+i:location.pathname+location.search); }catch(e){}
  preload(i);
}
function go(i){ if(busy) return; i=Math.max(0,Math.min(N(),i)); if(i===P) return; show(i,i>P?1:-1); }
$('bPrev').onclick=function(){ go(P-1); }; $('bNext').onclick=function(){ go(P+1); };
$('bFull').onclick=function(){ var e=D.documentElement; if(!D.fullscreenElement){ (e.requestFullscreen||e.webkitRequestFullscreen||function(){ toast('Use Add to Home screen for full screen'); }).call(e); } else D.exitFullscreen(); };
W.addEventListener('keydown',function(e){ if($('browse').classList.contains('on')) { if(e.key==='Escape') closeBrowse(); return; } if(e.key==='ArrowRight') go(P+1); if(e.key==='ArrowLeft') go(P-1); });
/* swipe */
var sx=0,sy=0,st0=0;
$('stage').addEventListener('touchstart',function(e){ if(e.touches.length!==1) { sx=null; return; } sx=e.touches[0].clientX; sy=e.touches[0].clientY; st0=Date.now(); },{passive:true});
$('stage').addEventListener('touchend',function(e){ if(sx==null) return; var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
  if(W.visualViewport&&W.visualViewport.scale>1.05) return;   /* zoomed in: the swipe pans */
  if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.4&&Date.now()-st0<800) go(P+(dx<0?1:-1)); },{passive:true});

/* browse + search */
var CATP=null;
function catalogue(){ if(CATP) return CATP; CATP=new Promise(function(ok){ try{ var c=JSON.parse(localStorage.getItem('bnx_ar_cat_'+CID)||'null'); if(c&&c.items) return ok(c); }catch(e){}
  if(W.bnxAr&&W.bnxAr.ready) W.bnxAr.ready.then(function(){ try{ ok(JSON.parse(localStorage.getItem('bnx_ar_cat_'+CID)||'null')||{items:[]}); }catch(e){ ok({items:[]}); } }); else ok({items:[]}); }); return CATP; }
function openBrowse(){ $('browse').classList.add('on'); drawBrowse(); setTimeout(function(){ $('q').focus(); },50); }
function closeBrowse(){ $('browse').classList.remove('on'); }
$('bBrowse').onclick=openBrowse; $('bX').onclick=closeBrowse; $('bCover').onclick=function(){ closeBrowse(); go(0); };
$('q').oninput=drawBrowse;
function drawBrowse(){
  var q=$('q').value.trim().toLowerCase(), box=$('bBody');
  if(!q){
    box.innerHTML='<h3>Pages</h3><div class="thumbs">'+BOOK.pages.map(function(p,k){ return '<button data-p="'+(k+1)+'" class="'+(P===k+1?'cur':'')+'"><img loading="lazy" alt="" src="'+esc(src(p.thumb||p.img))+'" referrerpolicy="no-referrer"><span>'+(k+1)+'</span></button>'; }).join('')+'</div>';
    box.querySelectorAll('[data-p]').forEach(function(b){ b.onclick=function(){ closeBrowse(); go(+b.getAttribute('data-p')); }; });
    return;
  }
  var res=[], seen={};
  BOOK.pages.forEach(function(p,k){ (p.hot||[]).forEach(function(h,j){ if(h.name.toLowerCase().indexOf(q)>=0&&!seen[h.id]){ seen[h.id]=1; res.push({h:h,p:k+1,j:j}); } }); });
  var draw=function(cat){
    var more=(cat&&cat.items||[]).filter(function(i){ return !seen[i.id]&&!i.offMenu&&(i.name+' '+i.section).toLowerCase().indexOf(q)>=0; }).slice(0,40);
    box.innerHTML='<div class="res">'+res.map(function(r,n){ return '<button data-r="'+n+'"><span>'+esc(r.h.name)+'<br><small>Page '+r.p+'</small></span><span>'+(r.h.price?'₹'+esc(r.h.price):'')+' ›</span></button>'; }).join('')+
      more.map(function(i){ return '<button data-i="'+esc(i.id)+'"><span>'+esc(i.name)+'<br><small>'+esc(i.section)+'</small></span><span>'+(i.price?'₹'+i.price:'')+' ›</span></button>'; }).join('')+'</div>'+
      (!res.length&&!more.length?'<p style="color:var(--mut)">Nothing found.</p>':'');
    box.querySelectorAll('[data-r]').forEach(function(b){ b.onclick=function(){ var r=res[+b.getAttribute('data-r')]; closeBrowse(); var same=P===r.p; if(!same) go(r.p);
      setTimeout(function(){ var hs=$('stage').querySelector('.pg:not(.leaving) .hs[data-k="'+r.j+'"]'); if(hs){ hs.classList.add('pulse'); setTimeout(function(){ hs.classList.remove('pulse'); },2600); } },same?0:620); }; });
    box.querySelectorAll('[data-i]').forEach(function(b){ b.onclick=function(){ var it=(cat.items||[]).filter(function(x){ return x.id===b.getAttribute('data-i'); })[0]; W.bnxAr&&W.bnxAr.open(it.id,{clientId:CID,preview:{name:it.name,price:it.price,photo:it.photo&&/^https:/.test(it.photo)?it.photo:''}}); }; });
  };
  draw(null); catalogue().then(function(c){ if($('q').value.trim().toLowerCase()===q) draw(c); });
}
$('bCopy').onclick=function(){ var u=link(P); (navigator.clipboard&&W.isSecureContext?navigator.clipboard.writeText(u):Promise.reject()).then(function(){ toast('Link copied'); },function(){ prompt('Copy this link',u); }); };
$('bCard').onclick=function(){ location.href=location.pathname+'?c='+encodeURIComponent(CID)+'&card=1'; };

/* printable table card */
function tableCard(){
  D.body.classList.add('card');
  var u=link(0), q=qrcode(0,'M'); q.addData(u); q.make(); var n=q.getModuleCount(), m=3, s=10, c=D.createElement('canvas'); c.width=c.height=(n+m*2)*s;
  var x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.fillStyle='#1c1917'; for(var r=0;r<n;r++) for(var k=0;k<n;k++) if(q.isDark(r,k)) x.fillRect((k+m)*s,(r+m)*s,s,s);
  $('card').innerHTML='<div class="tc"><h1 class="serif">'+esc(BOOK.title||CID)+'</h1><div class="s">'+esc(BOOK.subtitle||'Menu')+'</div><div id="qrs"></div><div class="cta serif">Scan to view our menu</div><div class="s">Photos · 3D · AR on your table</div></div>'+
    '<div class="noprint" style="display:flex;gap:8px"><button onclick="print()" style="padding:10px 16px;border-radius:10px;border:0;background:#1c1917;color:#fff">🖨 Print</button><a id="dl" style="padding:10px 16px;border-radius:10px;background:#c8a46a;color:#1c1917;text-decoration:none" download="TABLE_QR_'+esc(CID)+'.png">⬇ QR image</a><a href="?c='+esc(CID)+'" style="padding:10px 16px">Open menu</a></div>';
  $('qrs').appendChild(c); $('dl').href=c.toDataURL('image/png');
}

function fail(t){ $('stage').innerHTML='<div class="err">⚠️ '+esc(t)+'</div>'; }
if(!CID){ fail('Open this page with ?c=CLIENT_ID (for example ?c=CL00010).'); return; }
/* the client's own book (dashboard › Menu book, saved on the server) first; else the files in assets/menu-book/<CLIENT>/ */
var DEP=(qs.get('api')||localStorage.getItem('bnx_api_core')||'AKfycbwHdqrP4IvuVD2ZkupNybrEkiXu3kmuI6-tQoiHgYxoqr1KgUupeFsi3PIoFEbuv6XA').replace(/[^\w-]/g,'');
function fromServer(){ return fetch('https://script.google.com/macros/s/'+DEP+'/exec?action=MENU_BOOK&clientId='+encodeURIComponent(CID)).then(function(r){ return r.json(); })
  .then(function(j){ if(j&&j.success&&j.data&&j.data.pages&&j.data.pages.length) return j.data; throw new Error('none'); }); }
function fromFiles(){ return fetch(BASE+'book.json',{cache:'no-cache'}).then(function(r){ if(!r.ok) throw new Error('This menu book is not set up yet — the restaurant can add it in Dashboard › 3D / AR Menu & QR › Menu book.'); return r.json(); }); }
var KEY='bnx_book_'+CID, cached=null; try{ cached=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
var live=(qs.get('book')?fromFiles():fromServer().catch(fromFiles)).then(function(b){ try{ localStorage.setItem(KEY,JSON.stringify(b)); }catch(e){} return b; });
var started=false;
function start(b){
  BOOK=b; D.title=(b.title||CID)+' · Menu';
  $('chs').innerHTML=(b.chapters||[]).map(function(c){ return '<button data-p="'+c.page+'">'+esc(c.name)+'</button>'; }).join('');
  $('chs').querySelectorAll('[data-p]').forEach(function(x){ x.onclick=function(){ closeBrowse(); go(+x.getAttribute('data-p')); }; });
  $('bWa').href='https://wa.me/?text='+encodeURIComponent((b.title||'Our')+' menu — photos, 3D and AR:\n'+link(0));
  if(started){ if(P>N()) P=N(); show(P,0); return; }
  started=true;
  if(qs.get('card')==='1') return tableCard();
  $('bar').hidden=false;
  var h=+((location.hash.match(/p=(\d+)/)||[])[1]||0); show(Math.max(0,Math.min(N(),h)),0);
  setTimeout(catalogue,4000);
  W.addEventListener('hashchange',function(){ var k=+((location.hash.match(/p=(\d+)/)||[])[1]||0); if(k!==P) go(k); });
}
if(cached&&cached.pages&&cached.pages.length){ start(cached); live.then(function(b){ if(JSON.stringify(b.pages)!==JSON.stringify(cached.pages)||b.title!==cached.title) start(b); }).catch(function(){}); }
else live.then(start).catch(function(e){ fail(e.message); });
})();
</script>
