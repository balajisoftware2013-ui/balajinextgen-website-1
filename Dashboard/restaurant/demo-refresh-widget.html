<!-- BALAJI NEXTGEN ERP - DEMO DATA REFRESH UTILITY
     Call this from Settings > System or embed as a utility modal
     Allows safe refresh of demo data without losing historical records -->

<div id="demoRefreshPanel" style="
  display: none;
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 9999;
  background: white;
  border-radius: 12px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  padding: 24px;
  width: 90%;
  max-width: 500px;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
">
  <h2 style="margin: 0 0 16px 0; font-size: 20px; color: #333;">
    🔄 Demo Data Refresh
  </h2>
  
  <div id="refreshStatus" style="
    background: #f5f5f5;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 14px;
    min-height: 60px;
    display: flex;
    align-items: center;
  ">
    Ready to refresh demo data for today. Historical records preserved.
  </div>
  
  <div style="margin-bottom: 16px;">
    <label style="display: block; margin-bottom: 8px; font-weight: 500; font-size: 14px;">
      What to do?
    </label>
    <select id="refreshAction" style="
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    ">
      <option value="today">📅 Refresh Demo for Today Only</option>
      <option value="clear">🗑️ Clear All & Start Fresh</option>
    </select>
  </div>
  
  <div id="warningBox" style="
    background: #fff3cd;
    border: 1px solid #ffc107;
    border-radius: 6px;
    padding: 12px;
    margin-bottom: 16px;
    font-size: 13px;
    display: none;
  ">
    <strong>⚠️ WARNING:</strong> <br/>
    "Clear All" will delete all transactions today (bills, orders, payments).
    Historical data will remain. This cannot be undone!
  </div>
  
  <div style="display: flex; gap: 10px; justify-content: flex-end;">
    <button id="cancelBtn" style="
      padding: 10px 20px;
      background: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    ">
      Cancel
    </button>
    <button id="goBtn" style="
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    ">
      Refresh Demo Data
    </button>
  </div>
</div>

<script>
window.demoRefreshOpen = function() {
  document.getElementById('demoRefreshPanel').style.display = 'block';
};

window.demoRefreshClose = function() {
  document.getElementById('demoRefreshPanel').style.display = 'none';
};

document.getElementById('cancelBtn')?.addEventListener('click', demoRefreshClose);

document.getElementById('refreshAction')?.addEventListener('change', function(e) {
  const warning = document.getElementById('warningBox');
  const btn = document.getElementById('goBtn');
  
  if (e.target.value === 'clear') {
    warning.style.display = 'block';
    btn.textContent = '🗑️ Clear All Transaction Data';
    btn.style.background = '#dc3545';
  } else {
    warning.style.display = 'none';
    btn.textContent = '📅 Refresh Demo for Today';
    btn.style.background = '#007bff';
  }
});

document.getElementById('goBtn')?.addEventListener('click', async function() {
  const action = document.getElementById('refreshAction').value;
  const statusBox = document.getElementById('refreshStatus');
  const btn = this;
  
  btn.disabled = true;
  btn.style.opacity = '0.6';
  statusBox.innerHTML = '⏳ Processing...';
  
  try {
    if (action === 'today') {
      // Call demo refresh
      const response = await bnxApi({
        action: 'REFRESH_DEMO_DATA'
      });
      
      if (response.success) {
        statusBox.innerHTML = `
          ✅ Demo data refreshed for today!<br/>
          <small>${response.generated ? `Generated ${response.billsCount} bills` : 'Demo data ready'}</small>
        `;
        
        // Reload dashboard after 1.5s
        setTimeout(() => {
          location.reload();
        }, 1500);
      } else {
        statusBox.innerHTML = `❌ Error: ${response.error}`;
      }
    } else {
      // Clear all - requires confirmation
      if (!window.confirm('⚠️ This will DELETE all transaction data for today.\n\nHistorical data will be preserved.\n\nContinue?')) {
        statusBox.innerHTML = 'Cancelled.';
        btn.disabled = false;
        btn.style.opacity = '1';
        return;
      }
      
      const response = await bnxApi({
        action: 'CLEAR_ALL_DATA',
        confirm: 'CLEAR ALL TRANSACTION DATA'
      });
      
      if (response.success) {
        statusBox.innerHTML = `
          ✅ All data cleared! Fresh start ready.<br/>
          <small>${response.message}</small>
        `;
        
        setTimeout(() => {
          location.reload();
        }, 1500);
      } else {
        statusBox.innerHTML = `❌ Error: ${response.error}`;
      }
    }
  } catch (error) {
    statusBox.innerHTML = `❌ Error: ${error.message}`;
  }
  
  btn.disabled = false;
  btn.style.opacity = '1';
});

// Also expose as global function
window.openDemoRefresh = demoRefreshOpen;
</script>

<!-- 
  USAGE IN YOUR APP:
  
  1. In the Settings/Admin panel, add this button:
     <button onclick="openDemoRefresh()">Refresh Demo Data</button>
  
  2. Or call the API directly from console:
     await bnxApi({action:'REFRESH_DEMO_DATA'})
  
  3. To clear everything:
     await bnxApi({action:'CLEAR_ALL_DATA', confirm:'CLEAR ALL TRANSACTION DATA'})
-->
