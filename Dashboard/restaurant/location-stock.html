<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}body{margin:0;font-family:'DM Sans',system-ui,Segoe UI,Arial,sans-serif;background:#f5f1ea;color:#2b211c;font-size:13px}
header{background:#3e2723;color:#ffe8c2;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}header h1{font-size:16px;margin:0}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.bar input,.bar select{padding:5px 7px;border:1px solid #d6c3a5;border-radius:6px;font-size:12px}

<body>
<header><h1>📍 Location Stock</h1><span class="note" style="color:#ffe8c2" id="co"></span><span class="sp"></span>
  <label title="Department stock is counted from this day (day of the last physical count)">From <input type="date" id="from"></label><label>To <input type="date" id="to"></label><button id="go">Show</button>
  <a href="../inventory/inventory.html">📦 Store</a> <a href="bar_module.html">🍸 Bar Module</a> <a href="food-cost-control.html">🍳 Food Cost</a></header>
<main>
  <div id="nb"></div>
  <div class="locs" id="locs"><div class="loc">Loading…</div></div>
  <div class="bar"><b id="lt"></b><span class="note" id="ln"></span><span style="flex:1"></span>
    <input id="q" placeholder="Search item / code…" style="width:220px"><select id="f"><option value="">All items</option><option value="NEG">Short (negative)</option><option value="POS">In stock</option><option value="LIQ">Liquor / beverage</option><option value="FOOD">Food & grocery</option></select>
    <button class="btn" id="xl">⬇ Excel</button></div>
  <div class="tw" id="tb"></div>
  <div class="note" style="margin-top:6px" id="foot"></div>
</main><div id="toast"></div>
<script>
var GAS_URL='https://script.google.com/macros/s/AKfycbwHdqrP4IvuVD2ZkupNybrEkiXu3kmuI6-tQoiHgYxoqr1KgUupeFsi3PIoFEbuv6XA/exec';
var CLIENT_ID=(function(){try{var u=JSON.parse(sessionStorage.getItem('ERP_USER')||localStorage.getItem('ERP_USER')||'{}');return u.CLIENT_ID||u.clientId||localStorage.getItem('ERP_CLIENT_ID')||'';}catch(e){return '';}})();
function tok(){var k=['ERP_SESSION','erp_session','ERP_TOKEN'];for(var i=0;i<k.length;i++){var v=localStorage.getItem(k[i])||sessionStorage.getItem(k[i]);if(v)return v;}
  try{var u=JSON.parse(sessionStorage.getItem('ERP_USER')||localStorage.getItem('ERP_USER')||'{}');return u.sessionToken||u.SESSION_TOKEN||u.token||'';}catch(e){return '';}}
function api(action,payload){
  var ctl=new AbortController(),tm=setTimeout(function(){ctl.abort();},120000);
  return fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},signal:ctl.signal,
    body:JSON.stringify(Object.assign({action:action,clientId:CLIENT_ID,sessionToken:tok()},payload||{}))})
    .then(function(r){return r.json();}).catch(function(e){return {success:false,error:e.name==='AbortError'?'timed out':e.message};}).finally(function(){clearTimeout(tm);});
}
function toast(m,t){var e=document.getElementById('toast');e.textContent=m;e.style.background=t==='error'?'#dc2626':'#15803d';e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none';},4000);}
function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function n2(v){var n=Number(v);return v===''||v==null||!isFinite(n)?'':n.toLocaleString('en-IN',{maximumFractionDigits:2});}
function $(id){return document.getElementById(id);}
var R=null,cur='';
var LK=function(){return 'bnx_locpage_'+CLIENT_ID+'_'+$('from').value+'_'+$('to').value;}, busy=0;
function show(data){ R=data; if(!R.locations.some(function(l){return l.id===cur;}))cur=(R.locations[0]||{}).id||''; cards(); table(); foot(); }
function load(ev){
  var force=!!(ev&&ev.type==='click'), k=LK(), t0=Date.now(), shown=false, id=++busy;
  if(!force){ try{ var c=JSON.parse(localStorage.getItem(k)||'null'); if(c&&c.data){ show(c.data); shown=true; } }catch(e){} }
  var tick=function(){ if(id!==busy) return; var s=Math.round((Date.now()-t0)/1000);
    if(shown) $('ln').textContent=' · updating… '+s+' s';
    else $('locs').innerHTML='<div class="loc wait"><i></i>Reading the stock of every area… '+s+' s'+(s>30?' — first count of this period; afterwards it opens at once':'')+'</div>';
    setTimeout(tick,1000); }; tick();
  var go=function(n){ api('LOCATION_STOCK',{from:$('from').value,to:$('to').value,force:force&&!n}).then(function(r){
    if(id!==busy) return;
    if((!r||!r.success)&&/timed out|took too long|Exceeded|SERVER_BUSY/i.test(String(r&&(r.error||r.message)||''))&&n<3){ setTimeout(function(){go(n+1);},8000); return; }
    busy++;
    if(!r||!r.success){ if(shown){ $('ln').textContent=' · could not refresh — showing the last copy'; return; } $('locs').innerHTML='<div class="loc bad">Could not load: '+esc(r&&(r.error||r.message)||'no reply')+'</div>';return;}
    try{ localStorage.setItem(k,JSON.stringify({t:Date.now(),data:r.data})); }catch(e){ try{ Object.keys(localStorage).filter(function(x){return x.indexOf('bnx_locpage_')===0;}).forEach(function(x){localStorage.removeItem(x);}); }catch(e2){} }
    show(r.data);
    if(r.data.barRegisterPending) setTimeout(function(){ if(k===LK()) load(); },60000);
  }); }; go(0);
}
function foot(){
    $('foot').innerHTML='Store = book stock (opening + receipts − issues ± adjustments). Departments = opening (issued since 1 April − used, as on '+esc(R.from)+') + issued − used by what was sold (recipes; liquor pours via the bar store mapping) − wastage. Short (negative) = used more than was issued → issue not entered, opening stock in the area, or recipe / pour size to correct.'+
      (R.notCostedSales.bar||R.notCostedSales.food?' Sales with no recipe / mapping (not deducted): bar ₹'+n2(R.notCostedSales.bar)+' · food ₹'+n2(R.notCostedSales.food)+'.':'');
  $('nb').style.display=R.note?'block':'none'; $('nb').textContent=R.note?'⚠ '+R.note:'';
}
function cards(){
  $('locs').innerHTML=R.locations.map(function(l){return '<div class="loc'+(l.id===cur?' on':'')+'" data-l="'+esc(l.id)+'"><small>'+(l.type==='STORE'?'🏬 Store / godown':l.type==='BARREG'?'🍸 Bar store · count '+esc(l.countDate||'—'):l.mode==='CONSUMED'?'📍 Consumed on issue':l.id===R.bar?'🍸 Bar (issued − sold)':/KITCHEN/.test(l.id)?'🍳 Kitchen':'📍 Department')+'</small><div style="font-weight:700">'+esc(l.name)+'</div><b class="'+(l.value<0?'bad':'')+'">₹'+n2(l.value)+'</b><small>'+l.items+' items'+(l.neg?' · <span class="bad">'+l.neg+' short</span>':'')+'</small>'+(l.mode==='CONSUMED'?'<span class="asof">consumed ₹'+n2(l.consumed||0)+' in the period</span>':(l.asOf&&l.asOf<R.to?'<span class="asof">as on '+esc(l.asOf)+'</span>':''))+'</div>';}).join('')||'<div class="loc">No stock movements yet.</div>';
  $('locs').querySelectorAll('[data-l]').forEach(function(d){d.onclick=function(){cur=d.getAttribute('data-l');cards();table();try{history.replaceState(null,'','#'+encodeURIComponent(cur));}catch(e){}};});
}
function rows(){var L=R.locations.find(function(l){return l.id===cur;});if(!L)return {L:null,a:[]};
  var q=$('q').value.toLowerCase(),f=$('f').value;
  return {L:L,a:L.rows.filter(function(r){if(q&&(r.name+' '+r.code).toLowerCase().indexOf(q)<0)return false;if(f==='NEG'&&!(r.bal<0))return false;if(f==='POS'&&!(r.bal>0))return false;
    var liq=/LIQ|BAR|BEV|BREW|BEER|WINE/i.test(r.cat);if(f==='LIQ'&&!liq)return false;if(f==='FOOD'&&liq)return false;return true;})};}
function table(){
  var x=rows(),L=x.L,a=x.a; if(!L){$('tb').innerHTML='';return;}
  $('lt').textContent=L.name; $('ln').textContent=L.type==='STORE'?' · book stock up to '+R.to:' · '+R.from+' → '+(L.asOf||R.to)+(L.asOf&&L.asOf<R.to?' (last store issue)':'');
  var T=0; a.forEach(function(r){T+=r.value;});
  var st=L.type==='STORE';
  if(L.type==='BARREG'){ $('ln').textContent=' · last bar physical count '+(L.countDate||'—')+' + store issues to the bar − sold, up to '+(L.asOf||R.to)+' · stock in ml';
    $('tb').innerHTML='<table><thead><tr><th>Code</th><th>Item</th><th>Category</th><th>Count</th><th class="r">Opening</th><th class="r">Inward</th><th class="r">Sold</th><th class="r">Stock (ml)</th><th class="r">Bottles</th><th class="r">Issue-based (ml)</th><th class="r">Difference</th><th class="r">Rate/ml</th><th class="r">Value ₹</th><th>Used in</th></tr></thead><tbody>'+
      a.slice(0,3000).map(function(r){return '<tr><td>'+esc(r.code)+'</td><td>'+esc(r.name)+(r.items&&r.items.indexOf(' / ')>0?'<div class="note">'+esc(r.items)+'</div>':'')+'</td><td>'+esc(r.cat)+'</td><td>'+esc(r.countDate||'')+'</td><td class="r">'+n2(r.open)+'</td><td class="r">'+n2(r.recv)+'</td><td class="r">'+n2(r.used)+'</td><td class="r '+(r.bal<0?'bad':'')+'"><b>'+n2(r.bal)+'</b></td><td class="r">'+n2(r.btl)+'</td><td class="r">'+n2(r.issueBal)+'</td><td class="r '+(r.diff<0?'bad':'')+'">'+n2(r.diff)+'</td><td class="r">'+n2(r.rateMl)+'</td><td class="r '+(r.value<0?'bad':'')+'">'+n2(r.value)+'</td><td class="note">'+esc(r.usedBy||'')+'</td></tr>';}).join('')+
      '</tbody><tfoot><tr><td colspan="12">'+a.length+' items</td><td class="r">'+n2(T)+'</td><td></td></tr></tfoot></table>'; return; }
  $('tb').innerHTML='<table><thead><tr><th>Code</th><th>Item</th><th>Category</th><th>UOM</th><th class="r">Rate ₹</th>'+(st?'<th class="r">In</th><th class="r">Out</th>':'<th class="r">Opening</th><th class="r">Issued to area</th><th class="r">Used (sales)</th><th class="r">Wastage</th>')+'<th class="r">Stock</th><th class="r">Value ₹</th>'+(st?'':'<th>Used in</th>')+'</tr></thead><tbody>'+
    a.slice(0,3000).map(function(r){return '<tr><td>'+esc(r.code)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.cat)+'</td><td>'+esc(r.uom)+'</td><td class="r">'+n2(r.rate)+'</td>'+
      (st?'<td class="r">'+n2(r.inQ)+'</td><td class="r">'+n2(r.outQ)+'</td>':'<td class="r">'+n2(r.open||0)+'</td><td class="r">'+n2(r.recv)+'</td><td class="r">'+n2(r.used)+'</td><td class="r">'+n2(r.waste)+'</td>')+
      '<td class="r '+(r.bal<0?'bad':'')+'"><b>'+n2(r.bal)+'</b></td><td class="r '+(r.value<0?'bad':'')+'">'+n2(r.value)+'</td>'+(st?'':'<td class="note">'+esc(r.usedBy||'')+'</td>')+'</tr>';}).join('')+
    '</tbody><tfoot><tr><td colspan="'+(st?7:9)+'">'+a.length+' items</td><td class="r">'+n2(T)+'</td>'+(st?'':'<td></td>')+'</tr></tfoot></table>';
}
(function(){ var t0=table; table=function(){ t0.apply(this,arguments); document.querySelectorAll('#tb td.r').forEach(function(td){ if(/^-?0$/.test(td.textContent.trim())) td.classList.add('z'); }); }; })();
function xl(){ if(!window.XLSX||!R){toast('Nothing to export yet','error');return;} var wb=XLSX.utils.book_new();
  R.locations.forEach(function(L){if(L.type==='BARREG'){var ab=[[L.name+' · count '+(L.countDate||'')+' · '+R.to],[],['Code','Item','Category','Count','Opening ml','Inward ml','Sold ml','Stock ml','Bottles','Issue-based ml','Difference','Rate/ml','Value','Used in']];
    L.rows.forEach(function(r){ab.push([r.code,r.name,r.cat,r.countDate,r.open,r.recv,r.used,r.bal,r.btl,r.issueBal,r.diff,r.rateMl,r.value,r.usedBy]);});XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(ab),'Bar store register');return;}
    var st=L.type==='STORE',aoa=[[L.name+(st?' · book stock up to '+R.to:' · '+R.from+' to '+R.to)],[]].concat([st?['Code','Item','Category','UOM','Rate','In','Out','Stock','Value']:['Code','Item','Category','UOM','Rate','Opening','Issued','Used (sales)','Wastage','Stock','Value','Used in']]);
    L.rows.forEach(function(r){aoa.push(st?[r.code,r.name,r.cat,r.uom,r.rate,r.inQ,r.outQ,r.bal,r.value]:[r.code,r.name,r.cat,r.uom,r.rate,r.open||0,r.recv,r.used,r.waste,r.bal,r.value,r.usedBy]);});
    var ws=XLSX.utils.aoa_to_sheet(aoa);ws['!cols']=[{wch:10},{wch:38},{wch:16}];XLSX.utils.book_append_sheet(wb,ws,String(L.name).replace(/[\\\/?*\[\]:]/g,' ').slice(0,30));});
  XLSX.writeFile(wb,'Location_Stock_'+R.to+'.xlsx');}
(function(){var t=new Date(Date.now()-6*3600e3),to=t.toISOString().slice(0,10);$('to').value=to;$('from').value=(+to.slice(5,7)>=4?to.slice(0,4):String(+to.slice(0,4)-1))+'-04-01';
  cur=decodeURIComponent(String(location.hash||'').replace('#',''));
  $('go').onclick=load;$('q').oninput=table;$('f').onchange=table;$('xl').onclick=xl;
  api('GET_COMPANY_PROFILE',{}).then(function(r){if(r&&r.success&&r.data)$('co').textContent=r.data.name||'';});load();})();
</script>
