<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Advance Sales — Balaji NextGen ERP</title>
<script src="../../Dashboard/erp-config.js"></script>
<script>
(function(){
  // Auth check
  function show(){document.body&&(document.body.style.visibility='visible');}
  if(window.location.protocol==='file:'){show();return;}
  window.addEventListener('load',function(){
    show();
    try{
      if(typeof ERP==='undefined')return;
      var u=ERP.getUser();
      if(!u){window.location.href='login.html';return;}
      if(typeof erpFillUserUI==='function')erpFillUserUI();
    }catch(e){}
  });
  setTimeout(show,2500);
})();
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',sans-serif}
body{background:#f8fafc;display:flex;align-items:center;justify-content:center;min-height:100vh;visibility:hidden}
.card{background:#fff;border-radius:16px;padding:40px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.1);max-width:400px;width:100%}
.icon{font-size:56px;margin-bottom:16px}
h1{font-size:22px;font-weight:700;color:#0f172a;margin-bottom:8px}
p{font-size:14px;color:#64748b;margin-bottom:24px;line-height:1.6}
.btn{display:inline-block;background:#0f172a;color:#fff;padding:12px 28px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:600;cursor:pointer;border:none}
.btn:hover{background:#1e293b}
.loader{width:40px;height:40px;border:3px solid #e2e8f0;border-top:3px solid #0f172a;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card">
  <div class="icon">📋</div>
  <h1>Advance Sales</h1>
  <p>Pre-order and advance booking management.</p>
  <a href="dashboard.html" class="btn">Open Advance Sales</a>
</div>
</body>
</html>
