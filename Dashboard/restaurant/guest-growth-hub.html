function csv(name,rows){
  if(!rows.length) return toast('Nothing to export');
  var keys=Object.keys(rows[0]), q=function(v){ v=String(v==null?'':v); if(/^[=+\-@]/.test(v)) v="'"+v; return '"'+v.replace(/"/g,'""')+'"'; };
  var txt=[keys.join(',')].concat(rows.map(function(r){ return keys.map(function(k){ return q(r[k]); }).join(','); })).join('\n');
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+txt],{type:'text/csv'})); a.download=name; a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); },3000);
}

function tableList(txt){
  var out=[]; String(txt||'').split(/[,\n;]+/).forEach(function(p){ p=p.trim(); if(!p) return;
    var m=/^([A-Za-z]*)(\d+)\s*-\s*\1?(\d+)$/.exec(p);
    if(m){ var a=+m[2], b=+m[3]; if(b<a){ var x=a; a=b; b=x; } for(var i=a;i<=b&&out.length<400;i++) out.push(m[1]+i); }
    else out.push(p.replace(/[^A-Za-z0-9_-]/g,'').slice(0,12)); });
  return out.filter(function(v,i,a){ return v&&a.indexOf(v)===i; }).slice(0,400);

      +'<div class="row noprint" style="justify-content:center;margin:0 0 10px"><button class="btn sm" data-dl>PNG</button><a class="btn sm" target="_blank" rel="noopener" href="'+esc(it.u)+'">Open</a></div>';

/* 2026-11-26 Auto WhatsApp: invoice PDF after every bill with a mobile · order confirmation for QR orders · "View menu" button.
   Server: WA_AUTO_GET / SAVE / TEMPLATES / TEST (zz_FINAL_ROUTER.gs). Inside the 24-h chat window → free message + PDF,
   outside → the approved UTILITY templates. */
async function autoWa(){
  var box=document.createElement('div'); box.className='card'; box.id='waaCard'; box.style.marginTop='14px';
  box.innerHTML='<div class="sec" style="margin-top:0">Auto WhatsApp — invoice · order confirmation · menu</div><div class="muted">Loading…</div>'; $('#main').appendChild(box);
  var r=await api('WA_AUTO_GET',{},60000); if(!document.body.contains(box)) return;
  if(!r||!r.success){ box.querySelector('.muted').textContent=(r&&r.error)||'Could not load (deploy the new zz_FINAL_ROUTER.gs)'; return; }
  var d=r.data||{}, c=d.cfg||{}, cb=function(k,l){ return '<label class="cb"><input type="checkbox" data-w="'+k+'"'+(c[k]?' checked':'')+'> '+l+'</label>'; };
  var tp=function(n){ var t=(d.templates||[]).filter(function(x){ return x.name===n; })[0]; return t?'<b style="color:'+(t.status==='APPROVED'?'#15803d':t.status==='REJECTED'?'#b91c1c':'#b45309')+'">'+esc(t.status)+'</b>'+(t.reason?' · '+esc(t.reason):''):'<span style="color:#b91c1c">not created</span>'; };
  box.innerHTML='<div class="f2"><div class="sec" style="margin-top:0">Auto WhatsApp — invoice · order confirmation · menu</div>'
   +cb('bill','Send the invoice (PDF) on WhatsApp after every bill that has a guest mobile')+cb('order','Send “Order confirmed” to guests who order from the QR menu')
   +cb('orderAll','Also for steward / POS orders that have a mobile')+cb('pdf','Attach the invoice PDF (same lines as the printed bill)')
   +'<div style="grid-column:1/-1;font-size:13px;line-height:1.6">'
   +'WhatsApp API: '+(d.api?'<b style="color:#15803d">connected</b>':'<b style="color:#b91c1c">not connected</b> — connect WhatsApp above first')
   +'<br>Last guest message received: '+(d.inbound?'<b>'+esc(d.inbound.at)+'</b> from '+esc(d.inbound.from)+' “'+esc(d.inbound.text)+'”':'<b style="color:#b91c1c">none in the log</b> — WhatsApp messages are not reaching the ERP (webhook): no auto reply, and PDFs can only go by template')+'<br>'
   +'Sender (every minute): '+(d.trigger?'<b style="color:#15803d">on</b>':'<b style="color:#b91c1c">off</b> — Save turns it on')+(d.queued?' · waiting: '+d.queued:'')
   +'<br>Template <code>'+esc(c.billTpl)+'</code>: '+tp(c.billTpl)+' · <code>'+esc(c.orderTpl)+'</code>: '+tp(c.orderTpl)+(d.tplError?' <span class="muted">('+esc(d.tplError)+')</span>':'')
   +'<br><span class="muted">Guests who checked in on WhatsApp in the last 24 h get the PDF + a “View menu” button at once. Others get the approved template (Meta rule) — tap <b>Create templates</b> once; Meta approves in minutes to a day.'+(d.menu?' Menu link: '+esc(d.menu):' Set the Website folder (above) so the “View menu” button works.')+'</span></div>'
   +'</div><div class="row" style="margin-top:12px;flex-wrap:wrap;gap:8px"><button class="btn p" id="waaSave">Save &amp; switch on</button><button class="btn" id="waaTpl">Create templates</button>'
   +'<input class="in" id="waaMob" type="tel" inputmode="numeric" maxlength="10" placeholder="Test mobile" style="max-width:150px"><button class="btn" id="waaTestB">Test invoice</button><button class="btn" id="waaTestO">Test order</button><button class="btn" id="waaRef">↻ Refresh status</button></div>'
   +'<div class="msg" id="waaMsg"></div>'
   +((d.log||[]).length?'<div style="overflow:auto;margin-top:10px"><table class="tbl" style="width:100%;font-size:12.5px"><tr><th>Time</th><th>Kind</th><th>Ref</th><th>Mobile</th><th>Amount</th><th>Via</th><th>Status</th><th>Delivery</th><th>Note</th></tr>'
     +d.log.map(function(x){ return '<tr><td>'+esc(x.AT)+'</td><td>'+esc(x.KIND)+'</td><td>'+esc(x.REF)+'</td><td>'+esc(x.MOBILE)+'</td><td>'+esc(x.AMOUNT)+'</td><td>'+esc(x.VIA)+'</td><td style="color:'+(x.STATUS==='SENT'?'#15803d':'#b91c1c')+'"><b>'+esc(x.STATUS)+'</b></td><td style="color:'+(/read|delivered/.test(x.DELIVERY||'')?'#15803d':/failed/.test(x.DELIVERY||'')?'#b91c1c':'#b45309')+'"><b>'+esc(x.DELIVERY||'')+'</b></td><td>'+esc(x.ERROR)+'</td></tr>'; }).join('')+'</table></div>':'');

  $('#waaTpl').onclick=async function(){ busy(this,true,'Creating…'); var x=await api('WA_AUTO_TEMPLATES',{},90000); busy(this,false); if(!x.success) return msg(x.error||'Could not create'); msg((x.data||[]).join(' · '),true); };

  $('#waaTestB').onclick=test('BILL',$('#waaTestB')); $('#waaTestO').onclick=test('ORDER',$('#waaTestO'));

   +f('gallery','Ambience photos — one https / Google Drive link per line (max 24)','ta','rows="4" placeholder="https://drive.google.com/file/d/…"',gal)

   +f('menuTagline','Menu page line under “Our Menu”','text','maxlength="140" placeholder="Dine like you\'re being spoiled — because you are."')
   +f('menuIntro','Menu page welcome line','text','maxlength="200" placeholder="A place where the ordinary ends, and the extraordinary begins!"')
