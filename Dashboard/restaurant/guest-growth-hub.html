<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Growth Hub · Balaji NextGen ERP</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<!--
  BALAJI NEXTGEN ERP · GROWTH HUB  (Guest growth suite, 2026-11-09)
  Staff page — uses the ERP login already on this browser (ERP_USER / ERP_SESSION, same as restaurant-dashboard.html).
  Overview · Feedback · Reservations (online requests → table plan) · Events & tickets (door check-in) ·
  WhatsApp campaigns (approved templates, opted-in guests only) · QR & links (table / landing / event QR) · Settings
  Backend: "Guest growth suite.gs" (GG_* actions) on the V2_CORE deployment; table plan = the ERP's own
  GET_TABLE_AVAILABILITY / SAVE_RESERVATION.
-->
<style>
:root{--bg:#f6f4f0;--card:#fff;--ink:#1d1a16;--ink2:#57514a;--ink3:#8c857c;--line:#e8e2d9;--brand:#c2570a;--brand2:#e8920a;--ok:#15803d;--okbg:#dcfce7;--warn:#92400e;--warnbg:#fef3c7;--bad:#b91c1c;--badbg:#fee2e2;--blue:#1d4ed8;--bluebg:#dbeafe;--r:14px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 'DM Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{color:var(--blue)}
header{background:#1d1a16;color:#fff;position:sticky;top:0;z-index:20}
header .hdin{max-width:1280px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;font-weight:800;letter-spacing:-.01em}
header .cl{font-size:13px;color:#d6cfc5}
header .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;border-radius:999px;padding:3px 9px;background:#2f2a24;color:#e7e0d6;white-space:nowrap}
.pill.ok{background:#14532d;color:#bbf7d0}.pill.bad{background:#7f1d1d;color:#fecaca}
nav.tabs{max-width:1280px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;color:#cfc7bb;font:700 13.5px 'DM Sans',sans-serif;padding:11px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:#fff;border-color:var(--brand2)}
nav.tabs .bd{background:var(--brand);color:#fff;border-radius:999px;font-size:10.5px;padding:1px 6px;margin-left:4px}
main{max-width:1280px;margin:0 auto;padding:16px}
.grid{display:grid;gap:12px}
.g4{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h3{margin:0 0 10px;font-size:15px}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.02em}
.kpi .l{font-size:12px;color:var(--ink3);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.kpi .s{font-size:12.5px;color:var(--ink2);margin-top:2px}
.bar{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:4px 0}
.bar i{display:block;height:10px;border-radius:5px;background:var(--brand2)}
.bar .t{flex:1;background:#f1ece5;border-radius:5px;overflow:hidden}
.tool{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.tool label{display:flex;flex-direction:column;font-size:11.5px;font-weight:800;color:var(--ink2);gap:4px}
.in,select.in,textarea.in{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:600 14px 'DM Sans',sans-serif;background:#fff;color:var(--ink);min-height:38px}
textarea.in{min-height:70px;width:100%}
.in:focus{outline:2px solid #f5c38a;border-color:var(--brand)}
.btn{appearance:none;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px 12px;font:800 13px 'DM Sans',sans-serif;cursor:pointer;min-height:38px;display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#cfc6ba}
.btn.p{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent}
.btn.g{background:var(--ok);color:#fff;border-color:transparent}
.btn.r{color:var(--bad);border-color:#f3c4c4}
.btn.wa{background:#25D366;color:#fff;border-color:transparent}
.btn.sm{min-height:30px;padding:4px 9px;font-size:12px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
table{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
th,td{padding:8px 10px;border-bottom:1px solid #f0ebe4;text-align:left;vertical-align:top;font-size:13px}
th{background:#faf7f3;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);position:sticky;top:0}
tr:last-child td{border-bottom:0}
.tw{overflow:auto;max-height:70vh;border-radius:var(--r)}
.st{display:inline-block;font-size:11px;font-weight:800;border-radius:999px;padding:2px 8px;background:#f3f4f6;color:#374151;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.st.CONFIRMED,.st.PAID,.st.CHECKED_IN,.st.SEATED,.st.RESOLVED,.st.OK,.st.DONE,.st.SENT,.st.DELIVERED,.st.READ,.st.COMPLETED{background:var(--okbg);color:#166534}
.st.PENDING,.st.RESERVED,.st.NEW,.st.RUNNING,.st.QUEUED,.st.IN_PROGRESS,.st.PAUSED{background:var(--warnbg);color:var(--warn)}
.st.DECLINED,.st.CANCELLED,.st.EXPIRED,.st.NO_SHOW,.st.FAILED{background:var(--badbg);color:#991b1b}
.stars{color:#f59e0b;letter-spacing:1px;white-space:nowrap}
.muted{color:var(--ink3)}
.msg{font-size:13px;margin-top:8px;min-height:16px}.msg.e{color:var(--bad)}.msg.o{color:var(--ok)}
.fb{border-left:4px solid var(--line)}.fb.low{border-left-color:var(--bad)}.fb.hi{border-left-color:var(--ok)}
.fb .hd{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fb .cm{margin:6px 0;font-size:14px;white-space:pre-line}
.chk{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-size:13px;border-bottom:1px dashed #eee6db}
.chk:last-child{border:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.f2 label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800;color:var(--ink2)}
.f2 label.cb{flex-direction:row;align-items:center;gap:8px}
.f2 label.cb input{width:18px;height:18px;accent-color:var(--brand)}
.sec{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand);margin:16px 0 8px;grid-column:1/-1}
.qrs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.qrc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;break-inside:avoid}
.qrc .q{display:flex;justify-content:center;margin:6px 0}
.qrc b{display:block;font-size:16px}
.qrc small{display:block;color:var(--ink3);font-size:11px;word-break:break-all}
.modal{position:fixed;inset:0;background:rgba(20,14,8,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:16px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:18px}
.tbls{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px}
.tb{border:1.5px solid #86efac;background:#f0fdf4;border-radius:10px;padding:8px;cursor:pointer;text-align:left;font:700 13px 'DM Sans',sans-serif}
.tb.so{border-color:#fca5a5;background:#fef2f2;opacity:.6;cursor:not-allowed}
.tb small{display:block;font-weight:600;color:var(--ink3);font-size:11px}
.door{display:flex;gap:8px}
.door .in{font-size:22px;letter-spacing:.2em;text-transform:uppercase;font-weight:800;flex:1;min-width:0}
.empty{padding:28px;text-align:center;color:var(--ink3)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1d1a16;color:#fff;padding:10px 16px;border-radius:12px;font-weight:700;z-index:80;display:none;max-width:90vw}
.lock{max-width:520px;margin:12vh auto;text-align:center}
@media print{header,nav,.tool,.noprint{display:none!important}body{background:#fff}main{padding:0}.qrc{border:1px solid #999}}
</style>
</head>
<body>
<header>
  <div class="hdin"><h1>🚀 Growth Hub</h1><span class="cl" id="hClient"></span><span class="sp"></span><span id="hPills"></span><button class="btn sm" id="hRefresh" title="Reload">↻ Refresh</button></div>
  <nav class="tabs" id="tabs">
    <button data-t="ov" class="on">Overview</button><button data-t="fb">Feedback<span class="bd" id="bdFb" hidden></span></button><button data-t="rv">Reservations<span class="bd" id="bdRv" hidden></span></button>
    <button data-t="tk">Events & tickets</button><button data-t="wa">WhatsApp campaigns</button><button data-t="qr">QR & links</button><button data-t="st">Settings</button>
  </nav>
</header>
<main id="main"></main>
<div class="modal" id="modal"><div class="box" id="mbox"></div></div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
'use strict';
/* ───────── session (same keys as restaurant-dashboard.html) ───────── */
function rd(k){ try{ var v=localStorage.getItem(k)||sessionStorage.getItem(k)||''; if(!v) return null; try{ return JSON.parse(v); }catch(e){ return v; } }catch(e){ return null; } }
function pickTok(v){ if(!v) return ''; if(typeof v==='string') return v.trim(); return String(v.sessionToken||v.SESSION_TOKEN||v.token||v.TOKEN||v.session||v.SESSION||v.erpSession||v.ERP_SESSION||'').trim(); }
function session(){ var c=[rd('ERP_SESSION'),rd('erp_session'),rd('erp_token'),rd('ERP_USER'),rd('erpUser')]; for(var i=0;i<c.length;i++){ var t=pickTok(c[i]); if(/^\{/.test(t)){ try{ t=pickTok(JSON.parse(t)); }catch(e){} } if(t) return t; } return ''; }
function client(){ var c=[rd('ERP_CLIENT'),rd('bnx_client_id'),rd('ERP_USER'),rd('erpUser')]; for(var i=0;i<c.length;i++){ var v=c[i]; if(v&&typeof v==='object') v=v.CLIENT_ID||v.clientId||v.client_id||v.CLIENT||v.client||''; if(v&&String(v).trim()) return String(v).trim(); } return ''; }
function userName(){ var u=rd('ERP_USER')||rd('erpUser')||{}; return typeof u==='object'?String(u.USER_NAME||u.userName||u.NAME||u.name||u.EMAIL||u.email||'').slice(0,60):''; }
var CID=client(), TOK=session(), USER=userName();
var API=(function(){ var v=''; try{ v=localStorage.getItem('bnx_api_core')||''; }catch(e){} return 'https://script.google.com/macros/s/'+(/^AKfycb[A-Za-z0-9_-]{20,}$/.test(v)?v:'AKfycbwHdqrP4IvuVD2ZkupNybrEkiXu3kmuI6-tQoiHgYxoqr1KgUupeFsi3PIoFEbuv6XA')+'/exec'; })();
async function api(action,payload,ms){
  var ctl=new AbortController(), tm=setTimeout(function(){ ctl.abort(); }, ms||90000);
  try{
    var r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},signal:ctl.signal,body:JSON.stringify(Object.assign({},payload||{},{action:action,clientId:CID,sessionToken:TOK,userName:USER}))});
    var j=await r.json();
    if(j&&/session/i.test(String(j.error||''))&&j.success===false) toast('Session expired — log in again in the ERP');
    return j||{success:false,error:'Empty reply'};
  }catch(e){ return {success:false,error:e.name==='AbortError'?'Server took too long — try again':'Network error: '+e.message}; }
  finally{ clearTimeout(tm); }
}
/* ───────── helpers ───────── */
var $=function(s,r){ return (r||document).querySelector(s); }, $$=function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };
function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function rupee(n){ return '₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2}); }
function today(){ return new Date(Date.now()+5.5*3600e3).toISOString().slice(0,10); }
function addDays(d,n){ var x=new Date(d+'T12:00:00Z'); x.setUTCDate(x.getUTCDate()+n); return x.toISOString().slice(0,10); }
function nice(d){ if(!/^\d{4}-\d{2}-\d{2}/.test(String(d||''))) return esc(d); return new Date(String(d).slice(0,10)+'T12:00:00Z').toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short',timeZone:'UTC'}); }
function t12(t){ var p=String(t||'').split(':'); if(p.length<2) return esc(t); var h=+p[0]; return ((h%12)||12)+':'+p[1]+(h<12?' AM':' PM'); }
function stars(n){ n=Math.max(0,Math.min(5,Math.round(Number(n)||0))); return '<span class="stars" aria-label="'+n+' of 5">'+'★★★★★'.slice(0,n)+'<span style="color:#e5e7eb">'+'★★★★★'.slice(n)+'</span></span>'; }
function st(s){ s=String(s||'').toUpperCase(); return '<span class="st '+esc(s)+'">'+esc(s.replace(/_/g,' '))+'</span>'; }
function wa(m,txt){ var d=String(m||'').replace(/\D/g,'').slice(-10); return /^[6-9]\d{9}$/.test(d)?'https://wa.me/91'+d+(txt?'?text='+encodeURIComponent(txt):''):''; }
function mob(v){ var d=String(v||'').replace(/\D/g,''); if(d.length===12&&d.indexOf('91')===0) d=d.slice(2); d=d.slice(-10); return /^[6-9]\d{9}$/.test(d)?d:''; }
var tT; function toast(m){ var t=$('#toast'); t.textContent=m; t.style.display='block'; clearTimeout(tT); tT=setTimeout(function(){ t.style.display='none'; },3800); }
function modal(html){ $('#mbox').innerHTML=html; $('#modal').classList.add('on'); }
function closeModal(){ $('#modal').classList.remove('on'); }
$('#modal').addEventListener('click',function(e){ if(e.target.id==='modal'||e.target.closest('[data-close]')) closeModal(); });
function busy(b,on,txt){ if(!b) return; if(on){ b.dataset.t=b.textContent; b.disabled=true; b.textContent=txt||'…'; } else { b.disabled=false; if(b.dataset.t) b.textContent=b.dataset.t; } }

/* ───────── state + tabs ───────── */
var S={tab:'ov',cfg:null,wa:null,events:[]};
$('#tabs').onclick=function(e){ var b=e.target.closest('button[data-t]'); if(!b) return; go(b.getAttribute('data-t')); };
$('#hRefresh').onclick=function(){ go(S.tab); };
function go(t){ S.tab=t; $$('#tabs button').forEach(function(b){ b.classList.toggle('on',b.getAttribute('data-t')===t); }); try{ localStorage.setItem('bnx_gg_tab',t); }catch(e){} ({ov:ov,fb:fb,rv:rv,tk:tk,wa:waTab,qr:qr,st:settings})[t](); }
function loading(){ $('#main').innerHTML='<div class="empty">Loading…</div>'; }

async function boot(){
  if(!CID||!TOK){ $('#main').innerHTML='<div class="lock card"><h2>Log in first</h2><p class="muted">Growth Hub uses your ERP login on this browser. Open the restaurant dashboard, log in, then come back.</p><a class="btn p" href="restaurant-dashboard.html">Open dashboard</a></div>'; $('#tabs').hidden=true; return; }
  $('#hClient').textContent=CID+(USER?' · '+USER:'');
  var r=await api('GG_CFG_GET');
  if(!r.success){ $('#main').innerHTML='<div class="lock card"><h2>Growth Hub is not installed on the server</h2><p class="muted">'+esc(r.error||'')+'</p><p style="font-size:13px">Add <b>Guest growth suite.gs</b> as the LAST file in the Apps Script project, run <b>RUN_GG_1_CheckSetup</b>, then Deploy → New version.</p></div>'; return; }
  S.cfg=r.data.cfg; S.wa=r.data.wa; pills();
  var t='ov'; try{ t=localStorage.getItem('bnx_gg_tab')||'ov'; }catch(e){} go(t);
}
function pills(){
  var w=S.wa||{};
  $('#hPills').innerHTML='<span class="pill '+(w.provider==='META'&&w.token&&w.phoneId?'ok':'bad')+'">WhatsApp API '+(w.provider==='META'&&w.token&&w.phoneId?'on':'off')+'</span> '
    +'<span class="pill '+(w.webhookVerified||w.webhookSeen?'ok':'bad')+'">Webhook '+(w.webhookVerified||w.webhookSeen?'live':'not verified')+'</span> '
    +'<span class="pill '+(w.checkinReady?'ok':'')+'">1-tap check-in '+(w.checkinReady?'on':'off')+'</span>';
}

/* ═════════ OVERVIEW ═════════ */
async function ov(){
  loading(); var r=await api('GG_OVERVIEW'); if(S.tab!=='ov') return;
  if(!r.success){ $('#main').innerHTML='<div class="card msg e">'+esc(r.error)+'</div>'; return; }
  var d=r.data, dist=d.fbDist||[0,0,0,0,0], mx=Math.max.apply(null,dist.concat([1]));
  $('#bdFb').hidden=!d.fbOpen; $('#bdFb').textContent=d.fbOpen||''; $('#bdRv').hidden=!d.resvPending; $('#bdRv').textContent=d.resvPending||'';
  function k(l,v,s){ return '<div class="card kpi"><div class="l">'+l+'</div><div class="v">'+v+'</div>'+(s?'<div class="s">'+s+'</div>':'')+'</div>'; }
  var w=S.wa||{};
  $('#main').innerHTML='<div class="grid g4">'
    +k('Guests in CRM',(d.guests||0).toLocaleString('en-IN'),(d.new30||0)+' new in 30 days · '+(d.repeat||0)+' repeat')
    +k('WhatsApp opt-in',(d.optedIn||0).toLocaleString('en-IN'),d.guests?Math.round(d.optedIn/d.guests*100)+'% of guests can get offers':'')
    +k('Visits today',d.visitsToday||0,'business day '+esc(d.today))
    +k('Rating (30 days)',d.fb30?d.fbAvg+' ★':'—',(d.fb30||0)+' reviews · score '+(d.fbScore>0?'+':'')+(d.fbScore||0))
    +k('Open complaints',d.fbOpen||0,'1–'+((S.cfg||{}).fbLowAlert||3)+'★ not resolved yet')
    +k('Booking requests',d.resvPending||0,(d.resvToday||0)+' bookings today · '+(d.resvCoversToday||0)+' covers')
    +k('Tickets sold (upcoming)',d.ticketsUpcoming||0,rupee(d.ticketRevenue||0)+' collected · '+(d.ticketsUnpaid||0)+' unpaid')
    +k('Campaign messages (30 d)',(d.campaignSent30||0).toLocaleString('en-IN'),(d.campaigns30||0)+' campaigns')
    +'</div><div class="grid g2" style="margin-top:12px"><div class="card"><h3>Ratings, last 30 days</h3>'
    +[5,4,3,2,1].map(function(s){ var n=dist[s-1]||0; return '<div class="bar"><span style="width:26px">'+s+'★</span><span class="t"><i style="width:'+(n/mx*100)+'%;background:'+(s<=2?'#ef4444':s===3?'#f59e0b':'#22c55e')+'"></i></span><span style="width:30px;text-align:right">'+n+'</span></div>'; }).join('')
    +'<div class="row" style="margin-top:10px"><button class="btn sm" data-go="fb">Open feedback →</button></div></div>'
    +'<div class="card"><h3>Setup</h3>'
    +[['WhatsApp Cloud API (token + phone id)',w.provider==='META'&&w.token&&w.phoneId,'Dashboard → WhatsApp setup, or Script properties META_WA_TOKEN / META_WA_PHONE_ID'],
      ['Meta webhook verified',w.webhookVerified||w.webhookSeen,'Meta → WhatsApp → Configuration → Callback URL = the /exec URL, verify token = WA_VERIFY_TOKEN'],
      ['Template list (META_WA_WABA_ID)',w.waba,'optional — Script property META_WA_WABA_ID'],
      ['Booking confirmation template',!!w.resvTemplate,'optional — META_WA_RESV_TEMPLATE (without it staff send the confirmation with one tap)'],
      ['Campaign trigger (sends with the hub closed)',w.triggerOn,'run RUN_GG_2_InstallCampaignTrigger once in Apps Script'],
      ['Low-rating e-mail alert',!!(S.cfg||{}).alertEmail,'Settings → Feedback → alert e-mail'],
      ['Google review link',!!(S.cfg||{}).reviewUrl,'Settings → Feedback → review link (4–5★ guests are sent there)']]
     .map(function(x){ return '<div class="chk"><span>'+(x[1]?'✅':'⚠️')+'</span><div><b>'+esc(x[0])+'</b>'+(x[1]?'':'<div class="muted" style="font-size:12px">'+esc(x[2])+'</div>')+'</div></div>'; }).join('')+'</div></div>';
  $$('[data-go]').forEach(function(b){ b.onclick=function(){ go(b.getAttribute('data-go')); }; });
}

/* ═════════ FEEDBACK ═════════ */
var FBF={from:addDays(today(),-30),to:today(),status:'',low:false};
async function fb(){
  $('#main').innerHTML='<div class="tool"><label>From<input class="in" type="date" id="fFrom" value="'+FBF.from+'"></label><label>To<input class="in" type="date" id="fTo" value="'+FBF.to+'"></label>'
   +'<label>Status<select class="in" id="fSt"><option value="">All</option><option value="NEW"'+(FBF.status==='NEW'?' selected':'')+'>Open (needs action)</option><option value="IN_PROGRESS"'+(FBF.status==='IN_PROGRESS'?' selected':'')+'>In progress</option><option value="RESOLVED"'+(FBF.status==='RESOLVED'?' selected':'')+'>Resolved</option><option value="OK"'+(FBF.status==='OK'?' selected':'')+'>Happy (no action)</option></select></label>'
   +'<label style="flex-direction:row;align-items:center;gap:6px;padding-bottom:8px"><input type="checkbox" id="fLow"'+(FBF.low?' checked':'')+'> 1–3★ only</label><button class="btn p" id="fGo">Show</button><span class="sp" style="flex:1"></span>'
   +'<button class="btn" id="fCsv">⬇ CSV</button></div>'

function csv(name,rows){
  if(!rows.length) return toast('Nothing to export');
  var keys=Object.keys(rows[0]), q=function(v){ v=String(v==null?'':v); if(/^[=+\-@]/.test(v)) v="'"+v; return '"'+v.replace(/"/g,'""')+'"'; };
  var txt=[keys.join(',')].concat(rows.map(function(r){ return keys.map(function(k){ return q(r[k]); }).join(','); })).join('\n');
  var a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+txt],{type:'text/csv'})); a.download=name; a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); },3000);
}

function tkResult(r){ if(!r.success) return toast(r.error||'Not saved'); if(r.notify&&!r.notify.sent&&r.notify.waLink) modal('<h3>Send the confirmation</h3><p class="muted">'+esc(r.notify.error||'')+'</p><a class="btn wa" target="_blank" rel="noopener" href="'+esc(r.notify.waLink)+'">Send on WhatsApp</a> <button class="btn" data-close>Close</button>'); else toast('Saved'); }
async function checkin(q){
  var r=await api('GG_TICKET_SET',Object.assign({status:'CHECKED_IN'},q));
  if(!r.success&&r.unpaid){ if(confirm(r.error+'\n\nCollected the money now? (OK = paid in cash and check in)')) r=await api('GG_TICKET_SET',Object.assign({status:'CHECKED_IN',collect:true,payMode:'CASH'},q)); else return r; }
  return r;
}
async function door(){
  var raw=String($('#dCode').value||'').trim().toUpperCase(), code=(raw.match(/BNXTK:[^:]*:([A-Z0-9]+)/)||[])[1]||raw.replace(/[^A-Z0-9]/g,''), m=$('#dMsg');
  if(code.length<4){ m.className='msg e'; m.textContent='Enter the entry code'; return; }
  busy($('#dGo'),true,'Checking…'); var r=await checkin({code:code}); busy($('#dGo'),false);
  if(r&&r.success){ var x=r.data; m.className='msg o'; m.innerHTML='✅ <b>'+esc(x.NAME)+'</b> — '+esc(x.QTY)+' × '+esc(x.TYPE_NAME)+' · '+esc(x.EVENT_TITLE)+' · let in'; $('#dCode').value=''; try{ navigator.vibrate&&navigator.vibrate(60); }catch(e){} }
  else { m.className='msg e'; m.innerHTML='⛔ '+esc(r&&r.error||'Not valid')+(r&&r.data?' — '+esc(r.data.NAME)+', '+esc(r.data.QTY)+' × '+esc(r.data.TYPE_NAME):''); try{ navigator.vibrate&&navigator.vibrate([80,60,80]); }catch(e){} }
  $('#dCode').focus();
}

/* ═════════ WHATSAPP CAMPAIGNS ═════════ */
var CP={tpls:null,filter:{}};
async function waTab(){
  var w=S.wa||{}, ready=w.provider==='META'&&w.token&&w.phoneId;
  $('#main').innerHTML=(ready?'':'<div class="card msg e" style="margin-bottom:12px">WhatsApp Cloud API is not configured on the server — campaigns cannot send. Set WA_PROVIDER=META, META_WA_TOKEN, META_WA_PHONE_ID.</div>')
   +'<div class="grid g2"><div class="card"><h3>1 · Message (approved template)</h3><div class="f2">'
   +'<label>Template<select class="in" id="cTpl"><option value="">Loading…</option></select></label><label>Language<input class="in" id="cLang" value="en" maxlength="10"></label>'
   +'<label style="grid-column:1/-1">Template name (if not in the list)<input class="in" id="cTplName" placeholder="e.g. weekend_offer" pattern="[a-z0-9_]+"></label></div>'
   +'<div id="cBody" class="muted" style="font-size:13px;background:#faf7f3;border-radius:10px;padding:10px;margin:10px 0;white-space:pre-line">Business-initiated WhatsApp messages must use a template approved in Meta → WhatsApp Manager → Message templates (category Marketing).</div>'
   +'<div id="cVars" class="f2"></div><label style="display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800;color:var(--ink2);margin-top:10px">Header image link (only if the template has an IMAGE header)<input class="in" id="cImg" placeholder="https://…jpg"></label>'
   +'<div class="muted" style="font-size:12px;margin-top:8px">Personalise variables with <b>{first}</b> <b>{fullname}</b> <b>{crn}</b> <b>{points}</b> <b>{visits}</b> <b>{restaurant}</b>.</div></div>'
   +'<div class="card"><h3>2 · Audience (only guests who opted in)</h3><div class="f2">'
   +'<label>Min. visits<input class="in" id="aMin" type="number" min="0" value="0"></label><label>Visited in last … days<input class="in" id="aWithin" type="number" min="0" placeholder="any"></label>'
   +'<label>Not visited for … days (win-back)<input class="in" id="aAway" type="number" min="0" placeholder="—"></label><label>Min. total spend ₹<input class="in" id="aSpend" type="number" min="0" placeholder="—"></label>'
   +'<label>Attended event<input class="in" id="aEv" placeholder="event name (optional)"></label><label class="cb"><input type="checkbox" id="aVer"> Verified numbers only</label></div>'
   +'<div class="row" style="margin-top:10px"><button class="btn" id="aPrev">Preview audience</button><span id="aOut" class="muted"></span></div><div id="aSample" style="font-size:12.5px;margin-top:6px"></div></div></div>'
   +'<div class="card" style="margin-top:12px"><h3>3 · Send</h3><div class="row"><input class="in" id="cName" placeholder="Campaign name, e.g. Diwali weekend" maxlength="80" style="min-width:240px">'
   +'<input class="in" id="cTest" placeholder="Your mobile (test)" inputmode="numeric" maxlength="14"><button class="btn" id="cTestGo">Send test</button><span style="flex:1"></span><button class="btn p" id="cGo" disabled>Send to audience</button></div>'
   +'<div class="msg" id="cMsg"></div><div class="muted" style="font-size:12px">Sends in batches (stays within Meta limits). With the campaign trigger installed it keeps going with this page closed. Daily cap: '+(w.dailyCap||1000)+' messages. Guests who replied STOP are skipped at send time.</div></div>'
   +'<div class="card" style="margin-top:12px"><div class="row" style="justify-content:space-between"><h3 style="margin:0">Campaigns</h3><button class="btn sm" id="cRef">↻</button></div><div id="cList" style="margin-top:8px"><div class="empty">Loading…</div></div></div>';
  $('#aPrev').onclick=preview; $('#cTestGo').onclick=function(){ sendCampaign(true,this); }; $('#cGo').onclick=function(){ sendCampaign(false,this); }; $('#cRef').onclick=campList;
  $('#cTpl').onchange=paintVars; $('#cTplName').oninput=function(){ if(this.value) $('#cTpl').value=''; paintVars(); };
  if(!CP.tpls){ var r=await api('GG_TEMPLATES'); CP.tpls=r.success?r.data:[]; CP.tplErr=r.success?'':r.error; }
  if(S.tab!=='wa') return;
  $('#cTpl').innerHTML='<option value="">'+(CP.tpls.length?'— choose —':'(none listed — type the name below)')+'</option>'+CP.tpls.map(function(t,i){ return '<option value="'+i+'">'+esc(t.name)+' · '+esc(t.lang)+' · '+esc(t.category)+'</option>'; }).join('');
  if(CP.tplErr) $('#cBody').textContent=CP.tplErr;
  paintVars(); campList();
}
function tplSel(){ var i=$('#cTpl').value; return i!==''&&CP.tpls[+i]?CP.tpls[+i]:null; }
function paintVars(){
  var t=tplSel(), n=t?t.vars:4, prev=$$('#cVars input').map(function(x){ return x.value; });
  if(t){ $('#cBody').textContent=t.body||'(no body text)'; $('#cLang').value=t.lang||'en'; }
  $('#cVars').innerHTML=Array.from({length:n},function(_,i){ return '<label>{{'+(i+1)+'}}'+(t?'':' (leave empty if unused)')+'<input class="in" data-v="'+i+'" value="'+esc(prev[i]!=null?prev[i]:(i===0?'{first}':''))+'"></label>'; }).join('');
}
function filt(){ var g=function(id){ return $('#'+id).value; }; return {minVisits:g('aMin'),lastVisitWithinDays:g('aWithin'),notVisitedDays:g('aAway'),minSpend:g('aSpend'),event:g('aEv'),verifiedOnly:$('#aVer').checked}; }
async function preview(){
  busy($('#aPrev'),true,'Counting…'); var r=await api('GG_AUDIENCE',{filter:filt()}); busy($('#aPrev'),false);
  if(!r.success){ $('#aOut').textContent=r.error; return; }
  CP.count=r.data.count; CP.filter=filt();
  $('#aOut').innerHTML='<b style="color:var(--ink);font-size:16px">'+r.data.count+'</b> guest(s) match · '+r.data.optedIn+' of '+r.data.totalGuests+' guests opted in';
  $('#aSample').innerHTML=(r.data.sample||[]).map(function(g){ return '<span class="st" style="text-transform:none;margin:2px">'+esc(g.name||'Guest')+' · '+esc(g.mobile)+'</span>'; }).join('');
  $('#cGo').disabled=!r.data.count; $('#cGo').textContent='Send to '+r.data.count+' guest'+(r.data.count===1?'':'s');
}
function campPayload(){
  var t=tplSel(), name=t?t.name:String($('#cTplName').value||'').trim(), vars=$$('#cVars input').map(function(x){ return x.value; });
  if(!t){ while(vars.length&&!vars[vars.length-1]) vars.pop(); }
  return {name:$('#cName').value||('Campaign '+today()),template:name,lang:$('#cLang').value||'en',params:vars,headerImage:$('#cImg').value.trim(),filter:CP.filter};
}
async function sendCampaign(test,b){
  var p=campPayload(), m=$('#cMsg'); m.className='msg e';
  if(!/^[a-z0-9_]+$/.test(p.template)) return m.textContent='Choose a template (or type its exact lower-case name)';
  if(test){ var tm=mob($('#cTest').value); if(!tm) return m.textContent='Enter your mobile for the test'; p.testMobile=tm; }
  else { if(!CP.count) return m.textContent='Preview the audience first';
    if(!confirm('Send "'+p.template+'" to '+CP.count+' guests on WhatsApp?\n\nThis cannot be undone once messages go out.')) return; p.expectCount=CP.count; }
  busy(b,true,'Creating…'); var r=await api('GG_CAMPAIGN_CREATE',p);
  if(!r.success){ busy(b,false); m.textContent=r.error; return; }
  m.className='msg o'; m.textContent='Sending…'; await runLoop(r.campaignId,m); busy(b,false); campList();
}
async function runLoop(id,m){
  for(var k=0;k<400;k++){
    var r=await api('GG_CAMPAIGN_RUN',{campaignId:id},120000);
    if(!r.success){ m.className='msg e'; m.textContent=r.error||'Stopped'; return; }
    if(r.busy){ await new Promise(function(res){ setTimeout(res,4000); }); continue; }
    var c=r.counts||{}; m.className='msg o'; m.textContent='Sent '+(c.SENT+c.DELIVERED+c.READ||0)+' · failed '+(c.FAILED||0)+' · skipped '+(c.SKIPPED||0)+' · left '+(c.QUEUED||0)+(r.lastError?' · last error: '+r.lastError:'');
    if(!c.QUEUED||r.status||/cap/i.test(r.lastError||'')||/PAUSED/.test(r.status||'')) return;
    if(r.batch&&!r.batch.sent&&!r.batch.skipped&&r.batch.failed&&/token|template/i.test(r.lastError||'')) return;
    if(S.tab!=='wa'){ return; }
  }
}
async function campList(){
  var r=await api('GG_CAMPAIGN_LIST'); var box=$('#cList'); if(!box) return;
  if(!r.success){ box.innerHTML='<div class="msg e">'+esc(r.error)+'</div>'; return; }
  var L=r.data||[]; if(!L.length){ box.innerHTML='<div class="empty">No campaigns yet.</div>'; return; }
  box.innerHTML='<div class="tw"><table><thead><tr><th>Campaign</th><th>Template</th><th>Audience</th><th>Sent</th><th>Delivered</th><th>Read</th><th>Failed</th><th>Status</th><th></th></tr></thead><tbody>'+L.map(function(c,i){ var s=String(c.STATUS).toUpperCase();
    return '<tr><td><b>'+esc(c.NAME)+'</b><div class="muted" style="font-size:11px">'+esc(c.CREATED_AT)+(c.CREATED_BY?' · '+esc(c.CREATED_BY):'')+'</div></td><td>'+esc(c.TEMPLATE)+'</td><td>'+esc(c.AUDIENCE)+'</td><td>'+esc(c.SENT||0)+'</td><td>'+esc(Math.max(Number(c.DELIVERED||0),c.DELIVERED_LIVE||0))+'</td><td>'+esc(Math.max(Number(c.READ||0),c.READ_LIVE||0))+'</td><td>'+esc(c.FAILED||0)+'</td>'
     +'<td>'+st(s)+(c.LAST_ERROR?'<div class="muted" style="font-size:11px;max-width:200px">'+esc(String(c.LAST_ERROR).slice(0,90))+'</div>':'')+'</td><td><div class="row">'
     +(s==='RUNNING'?'<button class="btn sm" data-run="'+i+'">Send now</button><button class="btn sm r" data-cc="'+i+'">Stop</button>':'')+(s==='PAUSED'?'<button class="btn sm" data-rs="'+i+'">Resume</button>':'')+'<button class="btn sm" data-rf="'+i+'">↻</button></div></td></tr>'; }).join('')+'</tbody></table></div>';
  $$('[data-run]',box).forEach(function(b){ b.onclick=async function(){ busy(b,true); await runLoop(L[+b.getAttribute('data-run')].CAMPAIGN_ID,$('#cMsg')); busy(b,false); campList(); }; });
  $$('[data-cc]',box).forEach(function(b){ b.onclick=async function(){ if(!confirm('Stop this campaign? Unsent messages are not sent.')) return; await api('GG_CAMPAIGN_CANCEL',{campaignId:L[+b.getAttribute('data-cc')].CAMPAIGN_ID}); campList(); }; });
  $$('[data-rs]',box).forEach(function(b){ b.onclick=async function(){ await api('GG_CAMPAIGN_RESUME',{campaignId:L[+b.getAttribute('data-rs')].CAMPAIGN_ID}); campList(); }; });
  $$('[data-rf]',box).forEach(function(b){ b.onclick=async function(){ busy(b,true); await api('GG_CAMPAIGN_REFRESH',{campaignId:L[+b.getAttribute('data-rf')].CAMPAIGN_ID}); campList(); }; });
}

/* ═════════ QR & LINKS ═════════ */
function baseDir(){ return new URL('.',location.href).href; }
function landingUrl(){ var u=new URL((localStorage.getItem('bnx_gg_base')||baseDir())+'restaurant-landing.html'); u.searchParams.set('client',CID); return u.href; }
function menuLink(table,ev){ var u=new URL((localStorage.getItem('bnx_gg_base')||baseDir())+'customer-order.html'); u.searchParams.set('client',CID); if(table) u.searchParams.set('table',table); if(ev) u.searchParams.set('event',ev); return u.href; }
async function qr(){
  if(!S.events.length){ var r=await api('GG_EVENTS'); if(r.success) S.events=(r.data||[]).filter(function(e){ return !e.past; }); }
  var base=localStorage.getItem('bnx_gg_base')||baseDir();
  $('#main').innerHTML='<div class="card noprint" style="margin-bottom:12px"><div class="f2"><label style="grid-column:1/-1">Website folder (where customer-order.html and restaurant-landing.html live)<input class="in" id="qBase" value="'+esc(base)+'"></label>'
   +'<label>Tables from<input class="in" id="qFrom" type="number" min="1" value="1"></label><label>to<input class="in" id="qTo" type="number" min="1" value="12"></label>'
   +'<label>Table label prefix<input class="in" id="qPre" value="Table" maxlength="20"></label><label>Event QR<select class="in" id="qEv"><option value="">—</option>'+S.events.map(function(e){ return '<option value="'+esc(e.title)+'">'+esc(e.title)+' · '+esc(e.date)+'</option>'; }).join('')+'</select></label></div>'
   +'<div class="row" style="margin-top:10px"><button class="btn p" id="qGo">Make QR codes</button><button class="btn" id="qPrint">🖨 Print</button><span style="flex:1"></span><button class="btn sm" data-copy="land">Copy booking page link</button><button class="btn sm" data-copy="menu">Copy counter menu link</button></div>'
   +'<div class="muted" style="font-size:12px;margin-top:6px">Table QR → digital menu with check-in for that table. Counter QR → takeaway / counter. Landing QR → branded page with booking, events & tickets, feedback — use it on Instagram, Google profile, flyers.</div></div><div class="qrs" id="qOut"></div>';
  $('#qGo').onclick=makeQr; $('#qPrint').onclick=function(){ window.print(); };
  $$('[data-copy]').forEach(function(b){ b.onclick=function(){ saveBase(); var u=b.getAttribute('data-copy')==='land'?landingUrl():menuLink(); copy(u); }; });
  makeQr();
}
function saveBase(){ var v=String($('#qBase').value||'').trim(); if(/^https:\/\/\S+$/i.test(v)){ if(!/\/$/.test(v)) v+='/'; try{ localStorage.setItem('bnx_gg_base',v); }catch(e){} } }
function copy(u){ try{ navigator.clipboard.writeText(u).then(function(){ toast('Link copied'); },function(){ prompt('Copy this link',u); }); }catch(e){ prompt('Copy this link',u); } }
function makeQr(){
  saveBase();
  var out=$('#qOut'); out.innerHTML=''; var a=Math.max(1,+$('#qFrom').value||1), b=Math.min(a+199,Math.max(a,+$('#qTo').value||a)), pre=$('#qPre').value||'Table';
  var items=[{t:'Book · Events · Feedback',s:'Landing page',u:landingUrl()},{t:'Counter / Takeaway',s:'Digital menu',u:menuLink()}];
  var ev=$('#qEv').value; if(ev) items.push({t:ev,s:'Event check-in + menu',u:menuLink('',ev)});
  for(var i=a;i<=b;i++) items.push({t:pre+' '+i,s:'Scan for menu',u:menuLink(String(i))});
  items.forEach(function(it){ var d=document.createElement('div'); d.className='qrc'; d.innerHTML='<b>'+esc(it.t)+'</b><div class="q"></div><small>'+esc(it.s)+'</small><small>'+esc(it.u.replace(/^https:\/\//,''))+'</small><div class="row noprint" style="justify-content:center;margin-top:6px"><button class="btn sm" data-dl>PNG</button><a class="btn sm" target="_blank" rel="noopener" href="'+esc(it.u)+'">Open</a></div>';
    out.appendChild(d);
    try{ if(window.QRCode) new QRCode(d.querySelector('.q'),{text:it.u,width:160,height:160,correctLevel:QRCode.CorrectLevel.M}); else d.querySelector('.q').textContent='(QR library loading — click Make QR codes again)'; }catch(e){}
    d.querySelector('[data-dl]').onclick=function(){ var c=d.querySelector('canvas'), im=d.querySelector('img'); var src=c?c.toDataURL('image/png'):(im&&im.src); if(!src) return; var x=document.createElement('a'); x.href=src; x.download=(CID+'-'+it.t).replace(/[^A-Za-z0-9-]+/g,'-')+'.png'; x.click(); };
  });
}

   +f('ticketHoldMin','Release unpaid tickets after … minutes (0 = never)','number','min="0"')
   +'<div class="sec">Feedback</div>'+f('fbOn','Feedback on QR menu + landing page','cb')+f('fbLowAlert','Alert at … stars or lower','number','min="1" max="5"')
   +f('alertEmail','Alert e-mail (low ratings)','email')+f('reviewUrl','Google review link (4–5★ guests)','url','placeholder="https://g.page/r/…/review"')
   +'<div class="sec">Landing page</div>'+f('tagline','Tagline','text','maxlength="120"')+f('hours','Opening hours (shown as typed)','text','placeholder="Daily 12 PM – 11:30 PM"')
   +f('coverUrl','Cover photo link (https / Google Drive)','url')+f('brandColor','Brand colour','color')+f('mapUrl','Google Maps link','url')+f('instagram','Instagram link','url')+f('facebook','Facebook link','url')
   +f('about','About / our story','ta','maxlength="1200"')
   +'</div><div class="row" style="margin-top:14px"><button class="btn p" id="sSave">Save settings</button><a class="btn" target="_blank" rel="noopener" href="'+esc(landingUrl())+'">Preview landing page ↗</a></div><div class="msg" id="sMsg"></div></div>';
  if(!c.brandColor) $('[data-k=brandColor]').value='#c2570a';
  $('#sSave').onclick=async function(){ var o={}; $$('[data-k]').forEach(function(i){ o[i.getAttribute('data-k')]=i.type==='checkbox'?i.checked:i.value; });
    busy(this,true,'Saving…'); var r=await api('GG_CFG_SAVE',{cfg:o}); busy(this,false); var m=$('#sMsg');
    if(!r.success){ m.className='msg e'; m.textContent=r.error; return; } S.cfg=r.data; m.className='msg o'; m.textContent='Saved ✓ — live on the landing page within a minute.'; settings(); };
}
boot();
})();
