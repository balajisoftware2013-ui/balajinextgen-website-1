<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balaji HR | Live client connection</title><style>body{font:15px system-ui;margin:0;background:#fff8ef;color:#30251b}header,main{padding:20px}header{background:#873b0a;color:white}button{padding:10px;margin:4px;border:1px solid #ddd;background:white;border-radius:8px}section{overflow:auto;background:white;padding:12px}td,th{padding:10px;border-bottom:1px solid #ddd;text-align:left;white-space:nowrap}#status{padding:12px}</style></head><body><header><strong>Balaji NextGen · HR Live Connection</strong><div id="company"></div></header><main><p>Read-only verification · authenticated client data</p><button data-op="OVERVIEW">Employees / users</button><button data-op="ATTENDANCE">Attendance</button><button data-op="PAYROLL">Payroll</button><div id="status" role="status"></div><section><table id="table"></table></section><button id="prev">Previous</button><button id="next">Next</button></main><script>
const $=id=>document.getElementById(id);let op='OVERVIEW',offset=0,total=0,seq=0;
function pick(v){try{return JSON.parse(v).sessionToken||JSON.parse(v).token||JSON.parse(v)||''}catch(e){return v||''}}
async function load(){const n=++seq;$('status').textContent='Connecting to ERP…';$('table').replaceChildren();$('company').textContent='';$('prev').disabled=$('next').disabled=true;try{const u=JSON.parse(sessionStorage.getItem('ERP_USER')||localStorage.getItem('ERP_USER')||'{}');const cid=String(localStorage.getItem('bnx_active_client')||u.CLIENT_ID||u.clientId||'').toUpperCase();const tok=pick(sessionStorage.getItem('ERP_SESSION')||localStorage.getItem('ERP_SESSION')||u.sessionToken);if(!/^CL\d+$/.test(cid)||typeof tok!=='string'||!tok)throw Error('Log in through ERP first');const core=localStorage.getItem('bnx_api_core')||'AKfycbwHdqrP4IvuVD2ZkupNybrEkiXu3kmuI6-tQoiHgYxoqr1KgUupeFsi3PIoFEbuv6XA';if(!/^AKfycb[\w-]+$/.test(core))throw Error('Invalid ERP deployment');const res=await fetch('https://script.google.com/macros/s/'+core+'/exec',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'HR_LIVE_VIEW',clientId:cid,sessionToken:tok,op,offset}),signal:AbortSignal.timeout(30000)});const r=await res.json();if(n!==seq)return;if(!r.success||r.clientId!==cid)throw Error(r.error||'Client mismatch');$('company').textContent=cid+' · '+(r.company.COMPANY_NAME||r.company.DISPLAY_NAME||'Company not configured')+' · '+r.mode;$('status').textContent='Connected · '+r.total+' records · GSTIN '+(r.company.GST_NUMBER||'Not configured');total=r.total;const rows=r.rows||[],keys=Object.keys(rows[0]||{});function row(vals,tag){const tr=document.createElement('tr');vals.forEach(v=>{const c=document.createElement(tag);c.textContent=v;tr.append(c)});$('table').append(tr)}if(keys.length){row(keys,'th');rows.forEach(o=>row(keys.map(k=>o[k]||''),'td'))}$('prev').disabled=offset===0;$('next').disabled=offset+100>=total;}catch(e){if(n===seq)$('status').textContent='Connection failed: '+e.message;}}
document.querySelectorAll('[data-op]').forEach(b=>b.onclick=()=>{op=b.dataset.op;offset=0;load()});$('prev').onclick=()=>{offset=Math.max(0,offset-100);load()};$('next').onclick=()=>{offset+=100;load()};load();</script></body></html>
