<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Access Control · Balaji NextGen ERP</title>
<!-- 2026-11-18: duplicate page removed. Users, roles and permissions changed here were kept only in this browser (localStorage) and never reached the server.
     Everything is now in user-control.html (live data from the ERP server). This page finds it in this folder or the usual
     Dashboard folders and opens it. -->
<style>body{font-family:system-ui,Segoe UI,sans-serif;background:#f8fafc;color:#0f172a;display:grid;place-items:center;min-height:100vh;margin:0}
.c{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:28px 32px;max-width:460px;text-align:center}a{color:#ea580c;font-weight:700}</style></head>
<body><div class="c"><h2 style="margin:0 0 8px">Opening User Control…</h2><p style="color:#64748b;margin:0 0 14px">Access Control has moved into User Control.</p><p id="l"></p></div>
<script>
(async function(){
  var name='user-control.html', q=location.search+location.hash, here=location.pathname.replace(/[^/]*$/,'');
  var c=[here+name, here+'../'+name, here+'../developer/'+name, here+'../admin/'+name, '/Dashboard/'+name, '/Dashboard/developer/'+name, '/Dashboard/admin/'+name, '/'+name];
  for(var i=0;i<c.length;i++){ try{ var r=await fetch(c[i],{method:'HEAD',cache:'no-store'}); if(r.ok){ location.replace(c[i]+q); return; } }catch(e){} }
  document.getElementById('l').innerHTML='<a href="'+name+q+'">Open '+name+'</a>';
})();
</script></body></html>
