<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Super Admin Dashboard — Balaji NextGen ERP</title>
<!-- 2026-11-18: this page used to carry a FROZEN COPY of the user list (86 users) and 1,005 login records inside the page
     itself — anyone with the link could read them, the numbers never changed, and "log out" / "lock" only changed this
     browser. It is now the Super Admin hub: every card opens the live tool (data straight from the ERP server). -->
<style>
:root{--bg:#f8fafc;--card:#fff;--ink:#0f172a;--mut:#64748b;--line:#e2e8f0;--acc:#ea580c}
@media (prefers-color-scheme:dark){:root{--bg:#0f172a;--card:#111c33;--ink:#e2e8f0;--mut:#94a3b8;--line:#1f2b46}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);background:var(--card)}
h1{font-size:20px;margin:0}small{color:var(--mut)}main{max-width:1100px;margin:0 auto;padding:24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-height:120px;transition:.15s}
a.card:hover{border-color:var(--acc);transform:translateY(-1px)}a.card b{display:block;font-size:16px;margin:6px 0 4px}a.card span{color:var(--mut);font-size:13px}
.ic{font-size:26px}.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px;font:inherit;cursor:pointer}
</style></head><body>
<header><div><h1>👑 Super Admin</h1><small id="me">Balaji NextGen ERP</small></div><button class="btn" onclick="logout()">Logout</button></header>
<main>
  <div class="grid" id="g"></div>
  <p style="color:var(--mut);font-size:13px;margin-top:18px">Clients, users, sessions and permissions are read live from the ERP server — nothing on this page is a stored copy.</p>
</main>
<script>
(function(){
  try{ var u=JSON.parse(localStorage.getItem('ERP_USER')||'{}'); if(u&&(u.USER_NAME||u.name)) document.getElementById('me').textContent=(u.USER_NAME||u.name)+' · '+(u.ROLE||u.role||''); }catch(e){}
  var T=[['🏢','Client Master','All clients, plans, status, DB health, upgrade','02_client_master_dashboard.html'],
         ['➕','New Client','Create a company with its Master / Transaction / Report DBs','01_new_company_wizard.html'],
         ['👥','User Control','Users, roles, permissions, live sessions','user-control.html'],
         ['🧭','Main Dashboard','All ERP modules','main_dashboard.html'],
         ['🍽','Restaurant Dashboard','Billing, KOT, reports','restaurant/restaurant-dashboard.html']];
  var here=location.pathname.replace(/[^/]*$/,'');
  function cands(n){ return [here+n, here+'../'+n, here+'../developer/'+n, here+'../admin/'+n, '/Dashboard/'+n, '/Dashboard/developer/'+n, '/Dashboard/admin/'+n, '/'+n]; }
  var g=document.getElementById('g');
  T.forEach(function(t){ var a=document.createElement('a'); a.className='card'; a.href=t[3];
    a.innerHTML='<div class="ic">'+t[0]+'</div><b>'+t[1]+'</b><span>'+t[2]+'</span>'; g.appendChild(a);
    (async function(){ var c=cands(t[3]); for(var i=0;i<c.length;i++){ try{ var r=await fetch(c[i],{method:'HEAD',cache:'no-store'}); if(r.ok){ a.href=c[i]; return; } }catch(e){} } })(); });
})();
function logout(){ ['ERP_USER','ERP_SESSION','ERP_ROLE','ERP_CLIENT','ERP_EXPIRY','erpUser','erpToken'].forEach(function(k){ try{localStorage.removeItem(k);}catch(e){} }); try{sessionStorage.clear();}catch(e){} location.replace('../login.html'); }
</script></body></html>
