<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1A2B">
<title>Super Admin Dashboard — Balaji NextGen ERP</title>
<style>body{visibility:hidden}</style>
<script src="../erp-config.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F5FA;--card:#fff;--ink:#0E1A2B;--sub:#5B6B80;--line:#DCE3EE;--yes:#0F9D6A;--no:#C9424A;--acc:#1D4ED8;--warn:#C77D0A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0A121D;--card:#121E2E;--ink:#E8EEF7;--sub:#8FA1B8;--line:#223249;--yes:#2FC28C;--no:#F0646C;--acc:#6C9BFF;--warn:#E8A33D}}
:root[data-theme="dark"]{--bg:#0A121D;--card:#121E2E;--ink:#E8EEF7;--sub:#8FA1B8;--line:#223249;--yes:#2FC28C;--no:#F0646C;--acc:#6C9BFF;--warn:#E8A33D}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
header h1{font-size:18px;font-weight:800}header small{color:var(--sub);display:block;font-size:12px}
main{flex:1;overflow-y:auto;padding:0 12px 96px;width:100%;max-width:820px;margin:0 auto}
.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:7px 12px;font:600 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:19px;font-weight:800}.stat span{font-size:11px;color:var(--sub)}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px}
.row.locked{border-color:var(--no)}
.top{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}.name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:12px;color:var(--sub)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--yes);flex-shrink:0}.dot.old{background:var(--warn)}.dot.off{background:var(--line)}
.tag{font-size:11px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--bg);color:var(--sub);white-space:nowrap}
.tag.bad{background:var(--no);color:#fff}.tag.ok{background:var(--yes);color:#fff}.tag.warn{background:var(--warn);color:#fff}
.sw{display:inline-flex;border:1.5px solid var(--line);border-radius:18px;overflow:hidden;flex-shrink:0;cursor:pointer;background:var(--bg)}
.sw i{font:700 12px 'Plus Jakarta Sans',sans-serif;font-style:normal;padding:7px 11px;min-width:42px;text-align:center;color:var(--sub)}
.sw.on i:first-child{background:var(--yes);color:#fff}.sw:not(.on) i:last-child{background:var(--no);color:#fff}
.sw.sm i{padding:5px 8px;min-width:34px;font-size:11px}
.fl{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px 10px;margin-top:10px}
.fl div{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px}
.btn{border:0;border-radius:10px;padding:9px 12px;font:600 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer;background:var(--acc);color:#fff}
.btn.red{background:var(--no)}.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
h2{font-size:14px;margin:14px 2px 8px;color:var(--sub);font-weight:600}
select,input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px;max-width:100%}
.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}.bar input{flex:1;min-width:140px}
details summary{list-style:none;cursor:pointer}details summary::-webkit-details-marker{display:none}
.grid{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
.grid table{border-collapse:collapse;width:100%}.grid th,.grid td{padding:8px 5px;text-align:center;border-bottom:1px solid var(--line);font-size:11px}
.grid th:first-child,.grid td:first-child{text-align:left;position:sticky;left:0;background:var(--card);font-weight:600;padding-left:10px;min-width:96px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;border:0;background:none;color:var(--sub);font:600 11px 'Plus Jakarta Sans',sans-serif;padding:6px 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:20px}nav button.on{color:var(--acc)}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}.toast.show{opacity:1}
button:focus-visible,.sw:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style></head><body>

let OV={};try{OV=JSON.parse(localStorage.getItem('BNJ_OV3')||'{}')}catch(e){}

function put(k,v,msg){OV[k]=v;save();if(msg)toast(msg);render()}

function ago(t){if(!t)return'—';const m=Math.round((Date.now()-t)/6e4);return m<1?'just now':m<60?m+' min ago':m<1440?Math.round(m/60)+' hr ago':Math.round(m/1440)+' days ago'}
const HR=36e5,DAY=864e5;

function live(){
  const rows=D.logins.filter(l=>g('l|'+l[0],l[5])==='ACTIVE'&&(win<0||Date.now()-T(l[4])<=win)).sort((a,b)=>T(b[4])-T(a[4]));

  const locked=D.users.filter(u=>g('u|'+u[0]+'|lock',u[6])==='YES').length;
  const exp=clientIds.filter(id=>{const e=T(expOf(id));return e&&e<Date.now()}).length;
  let h=`<div class="stats">${stat(rows.length,'Open logins')}${stat(fresh,'Last 8 hours')}${stat(locked,'Locked users')}${stat(exp,'Expired plans')}</div>
  <div class="bar"><select id="winSel" onchange="win=+this.value;shown=40;render()" aria-label="Time window">${[[8*HR,'Last 8 hours'],[DAY,'Last 24 hours'],[7*DAY,'Last 7 days'],[30*DAY,'Last 30 days'],[-1,'All open logins']].map(o=>`<option value="${o[0]}" ${o[0]===win?'selected':''}>${o[1]}</option>`).join('')}</select><button class="btn red" onclick="outAll()">Log out all shown</button></div>

  if(rows.length>shown)h+=`<button class="btn ghost" style="width:100%" onclick="shown+=40;render()">Show more (${rows.length-shown} left)</button>`;
  return h}
function outAll(){const rows=D.logins.filter(l=>g('l|'+l[0],l[5])==='ACTIVE'&&(win<0||Date.now()-T(l[4])<=win));if(!rows.length)return;if(!confirm('Log out '+rows.length+' open logins?'))return;rows.forEach(l=>OV['l|'+l[0]]='LOGOUT');save();toast(rows.length+' logged out');render()}

  <div class="fl">${fld('Active','u|'+id+'|st',u[5],'ACTIVE','INACTIVE')}${fld('Locked','u|'+id+'|lock',u[6])}${fld('Web access','u|'+id+'|web',u[7])}${fld('App access','u|'+id+'|app',u[8])}${fld('OTP login','u|'+id+'|otp',u[9])}</div></div>`}).join('')||'<div class="row meta">No users match.</div>';

function clients(){

    const tg=d===null?'':d<0?`<span class="tag bad">Expired ${-d} days ago</span>`:d<=7?`<span class="tag warn">${d} days left</span>`:`<span class="tag ok">${d} days left</span>`;

    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap"><button class="btn" onclick="renew('${id}')">Renew 30 days</button><button class="btn ghost" onclick="renew('${id}',365)">Renew 1 year</button></div>

  return h}
function renew(id,n){const b=Math.max(T(expOf(id))||0,Date.now());const d=new Date(b+(n||30)*DAY).toISOString().slice(0,10);OV['e|'+id]=d;OV['ls|'+id]='ACTIVE';save();toast('Renewed to '+d);render()}
