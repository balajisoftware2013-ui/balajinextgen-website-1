<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reports & Analytics — Balaji NextGen ERP</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f3ee;--card:#fff;--s2:#f0efe8;--line:rgba(0,0,0,.09);--tx:#1c1b18;--sub:#6b6a5f;--gold:#b8690e;--gold2:#d4800f;--green:#1a9456;--red:#d42b2b;--warn:#c95c10;--side:linear-gradient(160deg,#fff7ed 0%,#ffedd5 50%,#fdba74 100%);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0e0a;--card:#1a1918;--s2:#222018;--line:rgba(255,255,255,.1);--tx:#e8e5da;--sub:#9a978a;--gold:#e0a14a;--gold2:#f0b865;--green:#34c27c;--red:#f06a6a;--warn:#e89a4d;--side:linear-gradient(160deg,#2a2218,#1d1913)}}
:root[data-theme="dark"]{--bg:#0f0e0a;--card:#1a1918;--s2:#222018;--line:rgba(255,255,255,.1);--tx:#e8e5da;--sub:#9a978a;--gold:#e0a14a;--gold2:#f0b865;--green:#34c27c;--red:#f06a6a;--warn:#e89a4d;--side:linear-gradient(160deg,#2a2218,#1d1913)}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--tx);font:13px/1.45 'DM Sans','Noto Sans',system-ui,sans-serif;display:flex}
aside{width:236px;flex-shrink:0;background:var(--side);padding:16px 10px;overflow-y:auto;border-right:1px solid var(--line)}
aside h1{font-size:14px;font-weight:800;padding:2px 8px 2px}aside .who{font-size:10.5px;color:var(--sub);padding:0 8px 10px;word-break:break-all}
.grp{font-size:9.5px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--sub);padding:12px 8px 4px}
#menu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--tx);font:500 12.5px inherit;font-family:inherit;padding:8px 10px;border-radius:9px;cursor:pointer}
#menu button:hover{background:rgba(184,105,14,.1)}#menu button.on{background:rgba(184,105,14,.2);font-weight:700;color:var(--tx)}
main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.top h2{font-size:17px;font-weight:800}.top .d{color:var(--sub);font-size:11.5px;flex:1 1 100%}
.pill,.chips button{border:1px solid var(--line);background:var(--card);color:var(--tx);border-radius:18px;padding:6px 12px;font:600 12px inherit;font-family:inherit;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button.on{background:var(--gold);border-color:var(--gold);color:#fff}
input[type=date],select,#q{font:12px inherit;font-family:inherit;color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:6px 8px;max-width:100%;cursor:pointer}
#content{flex:1;overflow:auto;padding:14px 16px 40px}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:10px 12px}.kpi.g{border-left-color:var(--green)}.kpi.r{border-left-color:var(--red)}
.kl{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--sub);font-weight:700}.kv{font-size:19px;font-weight:800;margin-top:2px}.ks{font-size:11px;color:var(--sub);margin-top:2px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:12px}th{background:var(--gold);color:#fff;text-align:left;padding:8px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;position:sticky;top:0}
td{padding:7px 10px;border-top:1px solid var(--line);white-space:nowrap}tbody tr:hover{background:var(--s2)}th.r,td.r{text-align:right}.m{font-variant-numeric:tabular-nums}tfoot td{font-weight:800;background:var(--s2)}
h3{font-size:12px;color:var(--sub);text-transform:uppercase;letter-spacing:.6px;margin:14px 2px 8px}
.empty{padding:34px;text-align:center;color:var(--sub);background:var(--card);border:1px dashed var(--line);border-radius:12px}
.banner{display:none;padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:12px}.banner.bad{background:rgba(212,43,43,.1);color:var(--red);border:1px solid var(--red)}.banner.warn{background:rgba(201,92,16,.1);color:var(--warn);border:1px solid var(--warn)}
.note{font-size:11px;color:var(--sub);margin:-4px 2px 10px}.bar{margin-bottom:12px}#stamp{font-size:11px;color:var(--sub);margin-left:auto}
#menuBtn{display:none}
@media(max-width:800px){body{flex-direction:column}aside{position:fixed;inset:0 25% 0 0;width:auto;z-index:50;transform:translateX(-102%);transition:transform .2s}aside.open{transform:none;box-shadow:6px 0 30px rgba(0,0,0,.3)}#menuBtn{display:inline-block}.top{padding:10px 12px}#content{padding:10px 10px 40px}}
@media print{aside,.top .chips,.top input,.top .pill,#menuBtn,.bar{display:none!important}body{display:block}#content{overflow:visible}th{background:#eee!important;color:#000!important}}
</style></head><body>
<aside id="side"><h1>Reports & Analytics</h1><div class="who" id="who"></div><div id="menu"></div></aside>
<main>
 <div class="top">
  <button class="pill" id="menuBtn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
  <h2 id="title">Reports & Analytics</h2><span id="stamp"></span>
  <button class="pill" onclick="load()">⟳ Refresh</button><button class="pill" onclick="exportCSV()">📥 CSV</button><button class="pill" onclick="window.print()">🖨 Print</button><button class="pill" onclick="toggleTheme()" aria-label="Theme">🌓</button><button class="pill" onclick="logout()">Logout</button>
  <div class="d" id="desc">Live reports from your ERP data</div>
  <div class="chips"><button data-q="today" onclick="preset('today')">Today</button><button data-q="yesterday" onclick="preset('yesterday')">Yesterday</button><button data-q="week" onclick="preset('week')">This week</button><button data-q="month" onclick="preset('month')">This month</button><button data-q="lastmonth" onclick="preset('lastmonth')">Last month</button><button data-q="fy" onclick="preset('fy')">This FY</button></div>
  <label>From <input type="date" id="dFrom" onchange="custom()" onclick="try{this.showPicker()}catch(e){}"></label>
  <label>To <input type="date" id="dTo" onchange="custom()" onclick="try{this.showPicker()}catch(e){}"></label>
  <span id="asofnote" style="display:none;font-size:11px;color:var(--sub)">balances as on the "To" date</span>
  <input id="q" type="search" placeholder="Search customer…" oninput="load()" style="display:none">
 </div>
 <div style="padding:10px 16px 0"><div id="banner" class="banner"></div></div>
 <div id="content"></div>
</main>
<script>
const MENU=[{"id": "overview", "g": "Overview", "i": "📊", "t": "Business Overview", "view": "overview", "m": "range", "d": "Sales, profit, receivables, payables and cash for the selected dates - live"}, {"id": "pl", "g": "Financial", "i": "💹", "t": "Profit & Loss", "a": "GET_PROFIT_LOSS_REPORT", "m": "range", "d": "Net sales, cost of goods and profit"}, {"id": "cashbank", "g": "Financial", "i": "🏦", "t": "Cash & Bank", "a": "GET_CASH_BANK_REPORT", "m": "range", "d": "Opening, receipts, payments and closing by payment mode"}, {"id": "cashbook", "g": "Financial", "i": "💰", "t": "Cash Book", "a": "GET_CASHBOOK_REPORT", "m": "range", "d": "Day-wise cash in / out and closing balance"}, {"id": "petty", "g": "Financial", "i": "🧾", "t": "Petty Cash", "a": "GET_PETTY_CASH_LEDGER", "m": "range", "d": "Petty cash vouchers with running balance"}, {"id": "daybook", "g": "Financial", "i": "📒", "t": "Day Book", "a": "GET_DAY_BOOK_REPORT", "m": "range", "d": ""}, {"id": "salesdb", "g": "Financial", "i": "🧮", "t": "Sales Day Book", "a": "GET_SALES_DAY_BOOK_REPORT", "m": "range", "d": ""}, {"id": "gst", "g": "Tax", "i": "🏷", "t": "GST Report", "a": "GET_GST_REPORT", "m": "range", "d": "HSN / rate-wise taxable value and tax"}, {"id": "gstr", "g": "Tax", "i": "📑", "t": "GSTR Summary", "a": "GET_GSTR_SUMMARY", "m": "range", "d": ""}, {"id": "recv", "g": "Receivable & Payable", "i": "👥", "t": "Receivables (Customer Dues)", "view": "receivables", "m": "asof", "d": "Customer-wise outstanding with ageing - the current dues sheet"}, {"id": "payables", "g": "Receivable & Payable", "i": "🏭", "t": "Payables (Supplier Dues)", "a": "GET_SUPPLIER_DUES_REPORT_V2", "m": "asof", "d": "Supplier-wise outstanding as on the To date"}, {"id": "supplier", "g": "Receivable & Payable", "i": "📦", "t": "Supplier Purchases", "a": "GET_SUPPLIER_REPORT", "m": "range", "d": ""}, {"id": "recon", "g": "Control", "i": "⚖", "t": "Reconciliation", "a": "GET_RECONCILIATION_REPORT", "m": "range", "d": ""}, {"id": "bankrecon", "g": "Control", "i": "🏛", "t": "Bank Reconciliation (DSR)", "a": "GET_DSR_BANK_RECONCILIATION", "m": "range", "d": ""}, {"id": "nc", "g": "Control", "i": "🎁", "t": "NC (Complimentary) Report", "a": "GET_NC_REPORT", "m": "range", "d": ""}, {"id": "cancel", "g": "Control", "i": "🚫", "t": "Cancelled Items", "a": "GET_CANCELLED_ITEMS_REPORT", "m": "range", "d": ""}, {"id": "steward", "g": "Operations", "i": "🧑‍🍳", "t": "Steward Performance", "a": "GET_STEWARD_PERFORMANCE_REPORT", "m": "range", "d": ""}, {"id": "table", "g": "Operations", "i": "🪑", "t": "Table Performance", "a": "GET_TABLE_PERFORMANCE_REPORT", "m": "range", "d": ""}, {"id": "wastage", "g": "Operations", "i": "🗑", "t": "Wastage", "a": "GET_WASTAGE_REPORT", "m": "range", "d": ""}, {"id": "consumption", "g": "Operations", "i": "🍽", "t": "Consumption", "a": "GET_CONSUMPTION_REPORT", "m": "range", "d": ""}, {"id": "tips", "g": "Operations", "i": "💝", "t": "Tips", "a": "GET_TIPS_REPORT", "m": "range", "d": ""}];
/* ═══ LIVE DATA LAYER — no sample data anywhere. Every figure comes from the same backend as the Restaurant Dashboard. ═══ */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr=v=>{const n=Number(v||0);return (n<-0.004?'−':'')+'₹'+Math.abs(n).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});};
const num=v=>{const n=Number(String(v==null?'':v).replace(/[₹,\s]/g,''));return isFinite(n)?n:NaN;};
function readObj(k){try{const v=sessionStorage.getItem(k)||localStorage.getItem(k);return v?JSON.parse(v):null;}catch(e){return null;}}
function pickTok(v){if(!v)return '';if(typeof v==='string')return v.trim();if(typeof v==='object')return String(v.sessionToken||v.SESSION_TOKEN||v.token||v.TOKEN||v.session||v.SESSION||v.erpSession||v.ERP_SESSION||'').trim();return '';}
function sess(){const c=[];try{if(window.ERP&&ERP.getSession)c.push(ERP.getSession());}catch(e){}try{if(window.ERP&&ERP.getToken)c.push(ERP.getToken());}catch(e){}
  ['ERP_SESSION','erp_session','erp_token'].forEach(k=>{try{c.push(sessionStorage.getItem(k));c.push(localStorage.getItem(k));}catch(e){}});c.push(readObj('ERP_USER'));c.push(readObj('erpUser'));
  for(const v of c){const t=pickTok(v);if(t)return t;}return '';}
function cid(){const c=[];try{if(window.ERP&&ERP.getClient)c.push(ERP.getClient());}catch(e){}try{if(window.ERP&&ERP.getClientId)c.push(ERP.getClientId());}catch(e){}
  ['ERP_CLIENT','bnx_client_id'].forEach(k=>{try{c.push(localStorage.getItem(k));c.push(sessionStorage.getItem(k));}catch(e){}});c.push(readObj('ERP_USER'));c.push(readObj('erpUser'));
  for(let v of c){if(v&&typeof v==='object')v=v.CLIENT_ID||v.clientId||v.client_id||v.CLIENT||v.client||'';if(v&&String(v).trim())return String(v).trim();}return '';}
function userName(){const u=readObj('ERP_USER')||readObj('erpUser')||{};return u.FULL_NAME||u.fullName||u.name||u.USER_NAME||u.username||'';}
const IDS=(()=>{const a=[],add=u=>{const m=String(u||'').match(/AKfycb[A-Za-z0-9_-]{20,}/);if(m&&a.indexOf(m[0])<0)a.push(m[0]);};
  try{add(localStorage.getItem('bnx_api_core'));}catch(e){}
  add('AKfycbwHdqrP4IvuVD2ZkupNybrEkiXu3kmuI6-tQoiHgYxoqr1KgUupeFsi3PIoFEbuv6XA');   /* V2_CORE: reports, cash book, ledgers */
  try{add(localStorage.getItem('bnx_promo_api_ok'));}catch(e){}
  add('AKfycbz39r1zo4LGqHJXpwDsQFulHdp3qsjiLRxRiSIEBBObI_3310_n2izF_gAjofaIHgSJ');add('AKfycbxYC6C2ltrcupaEexLJlvoJkISnAtgqE2p_o2KUInn1TaFh4IA2hQeq7cC9Q9ceFrOx');return a;})();
const NOACT={};
function post(id,body,ms){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  return fetch('https://script.google.com/macros/s/'+id+'/exec',{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},credentials:'omit',redirect:'follow',signal:c.signal,body})
   .then(r=>r.text()).then(tx=>{try{return JSON.parse(tx);}catch(e){throw new Error('The server sent a page instead of data');}}).finally(()=>clearTimeout(t));}
const isNoAct=j=>/unknown action|not handled/i.test(String((j&&(j.error||j.message))||''));
/* reads go to V2_CORE (falling through to the next deployment on "Unknown action"); race=true asks every deployment at once (used for DUES_LIST). */
async function api(action,p,opt){opt=opt||{};const ms=opt.ms||90000;
  const body=JSON.stringify(Object.assign({action:action,clientId:cid(),sessionToken:sess()},p||{}));
  const ids=IDS.filter(id=>!NOACT[id+'|'+action]);if(!ids.length)return {success:false,error:'No server deployment has the action '+action+' yet'};
  const handle=j=>{if(j&&j.success===false&&(j.statusCode===401||j.statusCode===403))authFail();return j;};
  if(opt.race){return new Promise(res=>{let left=ids.length,last=null;ids.forEach(id=>post(id,body,ms).then(j=>{if(isNoAct(j)){NOACT[id+'|'+action]=1;last=j;}else res(handle(j));}).catch(e=>{last={success:false,error:e.name==='AbortError'?'The server took too long':e.message};}).finally(()=>{if(--left===0)res(last||{success:false,error:'No answer'});}));});}
  let last=null;for(const id of ids){try{const j=await post(id,body,ms);if(isNoAct(j)){NOACT[id+'|'+action]=1;last=j;continue;}return handle(j);}catch(e){last={success:false,error:e.name==='AbortError'?'The server took too long':e.message};}}
  return last||{success:false,error:'No answer'};}
function authFail(){const b=$('banner');if(b){b.className='banner bad';b.innerHTML='Your session has expired - please <a href="../login.html">log in again</a>.';b.style.display='block';}}
function logout(){if(!confirm('Log out?'))return;try{if(window.ERP&&ERP.logout)return ERP.logout('../login.html');}catch(e){}
  ['ERP_USER','ERP_SESSION','erp_session','erp_token','erpUser'].forEach(k=>{try{localStorage.removeItem(k);sessionStorage.removeItem(k);}catch(e){}});location.replace('../login.html');}
/* ── dates ── */
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const todayS=()=>iso(new Date());
const D={from:'',to:''};
function preset(q){const t=new Date(),y=t.getFullYear(),m=t.getMonth();let f,e=todayS();
  if(q==='today')f=e;else if(q==='yesterday'){const d=new Date(y,m,t.getDate()-1);f=e=iso(d);}
  else if(q==='week'){const d=new Date(y,m,t.getDate()-((t.getDay()+6)%7));f=iso(d);}
  else if(q==='month')f=iso(new Date(y,m,1));
  else if(q==='lastmonth'){f=iso(new Date(y,m-1,1));e=iso(new Date(y,m,0));}
  else if(q==='fy'){const fy=m>=3?y:y-1;f=fy+'-04-01';}
  D.from=f;D.to=e;$('dFrom').value=f;$('dTo').value=e;document.querySelectorAll('.chips button').forEach(b=>b.classList.toggle('on',b.dataset.q===q));load();}
function custom(){let f=$('dFrom').value,t=$('dTo').value;if(f&&t&&t<f){const x=f;f=t;t=x;$('dFrom').value=f;$('dTo').value=t;}D.from=f||t;D.to=t||f;document.querySelectorAll('.chips button').forEach(b=>b.classList.remove('on'));load();}
/* ── rendering ── */
const MONEY=/(AMOUNT|AMT|TOTAL|BALANCE|DUE|SALES|COST|TAX|CGST|SGST|IGST|CESS|RECEIPT|PAYMENT|OPENING|CLOSING|PROFIT|LOSS|CREDIT|DEBIT|VALUE|EXPENSE|DISCOUNT|NET|GROSS|REVENUE|COLLECTION|TIP|CASH|BANK|DEPOSIT|ADJUST|PURCHASE|OUTSTANDING|VARIANCE)/i;
const NOTMONEY=/(COUNT|QTY|QUANTITY|NO$|NUMBER|ID$|DAYS|DATE|TIME|PCT|PERCENT|BILLS$|ORDERS$|COVERS|RANK|PAX|_NO\b)/i;
const SKIP=/^(CLIENT_ID|LOCATION_ID|CREATED_AT|UPDATED_AT|CREATED_BY|UPDATED_BY|ROW_ID|__.*)$/i;
const isMoney=k=>MONEY.test(k)&&!NOTMONEY.test(k)||/^(dr|cr)$/i.test(k);
const human=k=>String(k).replace(/([a-z])([A-Z])/g,'$1 $2').replace(/_/g,' ').toLowerCase().replace(/\b\w/g,c=>c.toUpperCase());
function fmtCell(k,v){if(v==null||v==='')return '—';if(typeof v==='object')return '—';
  if(/DATE|TIME|_AT$/i.test(k)&&/^\d{4}-\d{2}-\d{2}/.test(String(v))){const s=String(v);return esc(/T|\s\d/.test(s)?s.replace('T',' ').slice(0,16):s.slice(0,10).split('-').reverse().join('-'));}
  const n=num(v);if(isFinite(n)&&String(v).trim()!==''&&/^[\s₹,\-−.\d]+$/.test(String(v))){if(isMoney(k))return inr(n);if(/PCT|PERCENT/i.test(k))return n.toFixed(2)+'%';return Number.isInteger(n)?n.toLocaleString('en-IN'):n.toLocaleString('en-IN',{maximumFractionDigits:2});}
  return esc(v);}
let LAST={head:[],rows:[],title:''};
function table(rows,opt){opt=opt||{};if(!rows.length)return '<div class="empty">No rows for this period.</div>';
  const keys=[];rows.slice(0,300).forEach(r=>Object.keys(r).forEach(k=>{if(keys.indexOf(k)<0&&!SKIP.test(k))keys.push(k);}));
  const cols=keys.filter(k=>rows.some(r=>r[k]!==''&&r[k]!=null&&typeof r[k]!=='object')).slice(0,opt.max||14);
  const tot={};cols.forEach(k=>{if(isMoney(k)){let s=0,ok=false;rows.forEach(r=>{const n=num(r[k]);if(isFinite(n)){s+=n;ok=true;}});if(ok)tot[k]=s;}});
  LAST={head:cols.map(human),rows:rows.map(r=>cols.map(k=>r[k]==null||typeof r[k]==='object'?'':r[k])),title:opt.title||''};
  let h='<div class="tw"><table><thead><tr>'+cols.map(k=>'<th class="'+(isMoney(k)?'r':'')+'">'+esc(human(k))+'</th>').join('')+'</tr></thead><tbody>';
  h+=rows.map(r=>'<tr>'+cols.map(k=>'<td class="'+(isMoney(k)?'r m':'')+'">'+fmtCell(k,r[k])+'</td>').join('')+'</tr>').join('');
  h+='</tbody>'+(Object.keys(tot).length&&rows.length>1?'<tfoot><tr>'+cols.map((k,i)=>'<td class="'+(isMoney(k)?'r m':'')+'">'+(k in tot?inr(tot[k]):(i===0?'Total':''))+'</td>').join('')+'</tr></tfoot>':'')+'</table></div>';return h;}
function kpis(items){items=items.filter(i=>i&&i.v!=null);if(!items.length)return '';return '<div class="kpis">'+items.map(i=>'<div class="kpi '+(i.c||'')+'"><div class="kl">'+esc(i.l)+'</div><div class="kv">'+i.v+'</div>'+(i.s?'<div class="ks">'+esc(i.s)+'</div>':'')+'</div>').join('')+'</div>';}
function scalarKpis(o,skip){const out=[];Object.keys(o||{}).forEach(k=>{if(skip&&skip.indexOf(k)>=0||SKIP.test(k))return;const v=o[k];
  if(v&&typeof v==='object'&&!Array.isArray(v)){Object.keys(v).forEach(k2=>{const n=num(v[k2]);if(isFinite(n)&&typeof v[k2]!=='boolean')out.push({l:human(k)+' · '+human(k2),v:isMoney(k2)||isMoney(k)?inr(n):n.toLocaleString('en-IN')});});return;}
  if(typeof v==='boolean'||Array.isArray(v))return;const n=num(v);if(isFinite(n)&&String(v).trim()!==''&&/^[\s₹,\-−.\d]+$/.test(String(v)))out.push({l:human(k),v:isMoney(k)?inr(n):(/PCT|PERCENT/i.test(k)?n.toFixed(2)+'%':n.toLocaleString('en-IN',{maximumFractionDigits:2}))});});return out;}
function genericView(r,title){const d=(r&&r.data)||{};let h='';
  if(d.note)h+='<div class="banner warn" style="display:block">'+esc(d.note)+'</div>';
  h+=kpis(scalarKpis(d,['rows','row','note']).concat(d.row?scalarKpis(d.row):[]));
  const rows=Array.isArray(d.rows)?d.rows:(Array.isArray(d)?d:[]);
  if(rows.length||!d.row)h+=table(rows,{title});else LAST={head:Object.keys(d.row).map(human),rows:[Object.values(d.row)],title};
  return h;}
/* ── current receivables: the dues sheet (same figure as Customer Credit / Due Collection / Guest Dues on the dashboard) ── */
async function duesNow(){let r=await api('DUES_LIST',{force:false},{ms:60000,race:true});
  if(!(r&&r.success&&r.data&&Array.isArray(r.data.customers)))r=await api('GET_DUE_COLLECTION',{},{ms:60000});
  if(!(r&&r.success&&r.data&&Array.isArray(r.data.customers)))return {ok:false,error:(r&&(r.error||r.message))||'Dues could not be loaded'};
  const cs=r.data.customers.map(c=>Object.assign({},c,{_o:Math.round((Number(c.outstanding)||0)*100)/100})).filter(c=>c._o>0.01);
  const ag={d0_30:0,d31_60:0,d61_90:0,d90p:0};let od=0;
  cs.forEach(c=>{const a=c.aging;if(a&&typeof a==='object'){c._a=[+a.d0_30||0,+a.d31_60||0,+a.d61_90||0,+a.d90p||0];}else{const d=Number(c.overdueDays)||0;c._a=[d>30?0:c._o,d>30&&d<=60?c._o:0,d>60&&d<=90?c._o:0,d>90?c._o:0];}
    ag.d0_30+=c._a[0];ag.d31_60+=c._a[1];ag.d61_90+=c._a[2];ag.d90p+=c._a[3];od+=c._a[1]+c._a[2]+c._a[3];});
  cs.sort((a,b)=>b._o-a._o);
  return {ok:true,customers:cs,total:Math.round(cs.reduce((t,c)=>t+c._o,0)*100)/100,ag,overdue:Math.round(od*100)/100,raw:r.data};}
async function paySum(){const r=await api('GET_SUPPLIER_DUES_REPORT_V2',{asOfDate:todayS()});if(!(r&&r.success))return {ok:false,error:r&&r.error};
  const rows=(r.data&&r.data.rows)||[];const keys=['CLOSING_DUE','CLOSING_BALANCE','CLOSING','OUTSTANDING','BALANCE','DUE_AMOUNT','DUE'];let key='';
  for(const k of keys){if(rows.some(x=>k in x)){key=k;break;}}if(!key)return {ok:true,rows,total:null};
  return {ok:true,rows,key,total:Math.round(rows.reduce((t,x)=>t+Math.max(0,num(x[key])||0),0)*100)/100};}
/* ── views ── */
const P=(a,m,extra)=>()=>api(a,Object.assign(m==='asof'?{asOfDate:D.to}:{range:'custom',from:D.from,to:D.to},extra||{}));
const VIEWS={
 overview:async()=>{const [pl,cb,du,py]=await Promise.all([api('GET_PROFIT_LOSS_REPORT',{range:'custom',from:D.from,to:D.to}),api('GET_CASH_BANK_REPORT',{range:'custom',from:D.from,to:D.to}),duesNow(),paySum()]);
   const K=[],miss=[];const row=pl&&pl.success&&pl.data&&pl.data.row;
   if(row){['NET_SALES','COST_OF_GOODS','GROSS_PROFIT','EXPENSES','TOTAL_EXPENSES','NET_PROFIT'].forEach(k=>{if(k in row)K.push({l:human(k),v:inr(num(row[k])),c:k==='NET_PROFIT'||k==='GROSS_PROFIT'?'g':''});});
     if(K.length===0)scalarKpis(row).forEach(x=>K.push(x));}else miss.push('Profit & Loss: '+((pl&&pl.error)||'no data'));
   if(du.ok){K.push({l:'Receivables (customer dues)',v:inr(du.total),s:du.customers.length+' customers · overdue 30+ '+inr(du.overdue),c:'r'});}else miss.push('Receivables: '+du.error);
   if(py.ok&&py.total!=null)K.push({l:'Payables (supplier dues)',v:inr(py.total),s:'as on today',c:'r'});else if(!py.ok)miss.push('Payables: '+(py.error||'unavailable'));
   const cr=cb&&cb.success&&cb.data&&cb.data.rows;if(cr&&cr.length){const s=k=>cr.reduce((t,x)=>t+(num(x[k])||0),0);K.push({l:'Cash & bank closing',v:inr(s('CLOSING_BALANCE')),s:cr.length+' modes · receipts '+inr(s('RECEIPTS'))+' · payments '+inr(s('PAYMENTS')),c:'g'});}else miss.push('Cash & Bank: '+((cb&&cb.error)||'no data'));
   let h=(miss.length?'<div class="banner warn" style="display:block">Some figures could not be loaded - '+miss.map(esc).join(' · ')+'</div>':'')+kpis(K);
   if(du.ok){h+='<h3>Top customer dues</h3>'+table(du.customers.slice(0,10).map(c=>({Customer:c.customer,Outstanding:c._o,'Last bill':c.lastBillDate||''})),{title:'Top dues'});}return h;},
 receivables:async()=>{const du=await duesNow();if(!du.ok)throw new Error(du.error);const q=($('q')||{}).value||'';const list=du.customers.filter(c=>!q||String(c.customer||'').toLowerCase().includes(q.toLowerCase()));
   const rows=list.map(c=>({Customer:c.customer,Outstanding:c._o,'0-30 days':c._a[0],'31-60 days':c._a[1],'61-90 days':c._a[2],'Over 90 days':c._a[3],'Last bill':c.lastBillDate||'','Last payment':c.lastPaymentDate||'','Last payment amount':c.lastPaymentAmount||''}));
   return kpis([{l:'Total outstanding',v:inr(du.total),c:'r',s:du.customers.length+' customers'},{l:'Overdue (30+ days)',v:inr(du.overdue),c:'r'},{l:'0 - 30 days',v:inr(du.ag.d0_30)},{l:'31 - 60 days',v:inr(du.ag.d31_60)},{l:'61 - 90 days',v:inr(du.ag.d61_90)},{l:'Over 90 days',v:inr(du.ag.d90p),c:'r'}])+
     '<div class="note">Same source as Customer Credit, Due Collection and Guest Dues on the dashboard (the current dues sheet).</div>'+table(rows,{title:'Receivables'});},
 ledger:async()=>{const du=await duesNow();if(!du.ok)throw new Error(du.error);const sel=window.__cust||'';
   const opts='<div class="bar"><select id="custSel" onchange="window.__cust=this.value;load()"><option value="">Select a customer…</option>'+du.customers.map(c=>'<option value="'+esc(c.customerId||'')+'" '+(String(c.customerId||'')===sel?'selected':'')+'>'+esc(c.customer)+' — '+inr(c._o)+'</option>').join('')+'</select></div>';
   if(!sel)return opts+'<div class="empty">Choose a customer to see the full ledger.</div>';
   const r=await api('GET_CUSTOMER_LEDGER',{customerId:sel,from:'',to:''});if(!(r&&r.success))throw new Error((r&&(r.error||r.message))||'Ledger unavailable');
   const rows=((r.data&&r.data.rows)||[]).slice().sort((a,b)=>String(a.date||'').localeCompare(String(b.date||'')));let bal=0;
   const out=rows.map(x=>{const dr=num(x.dr)||0,cr=num(x.cr)||0;bal+=dr-cr;const o={};Object.keys(x).forEach(k=>{if(!/^(dr|cr)$/i.test(k))o[k]=x[k];});o.dr=dr;o.cr=cr;o.Balance=Math.round(bal*100)/100;return o;});
   return opts+kpis([{l:'Closing balance',v:inr(bal),c:bal>0?'r':'g',s:rows.length+' entries'}])+table(out,{title:'Customer ledger'});},
 generic:async(v)=>{const r=await v.call();if(!(r&&r.success))throw new Error((r&&(r.error||r.message))||'Report unavailable');return genericView(r,v.t);}
};
let CUR=null;
function showView(id){CUR=MENU.find(m=>m.id===id)||MENU[0];document.querySelectorAll('#menu button').forEach(b=>b.classList.toggle('on',b.dataset.id===CUR.id));
  $('title').textContent=CUR.t;$('desc').textContent=CUR.d||'';$('asofnote').style.display=CUR.m==='asof'?'inline':'none';$('q').style.display=CUR.id==='receivables'?'':'none';$('q').value='';
  $('side').classList.remove('open');load();}
let TOKEN=0;
async function load(){if(!CUR)return;const my=++TOKEN;const c=$('content');$('banner').style.display='none';c.innerHTML='<div class="empty">⟳ Loading live data…</div>';$('stamp').textContent='';
  try{let h;if(CUR.view&&VIEWS[CUR.view])h=await VIEWS[CUR.view]();else h=await VIEWS.generic({call:P(CUR.a,CUR.m,CUR.x),t:CUR.t});
    if(my!==TOKEN)return;c.innerHTML=h;$('stamp').textContent='Live · updated '+new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'});
  }catch(e){if(my!==TOKEN)return;c.innerHTML='<div class="banner bad" style="display:block">⚠ '+esc(e.message||e)+' <button class="pill" onclick="load()">Retry</button></div>';}}
function exportCSV(){if(!LAST.rows.length){alert('Nothing to export yet');return;}const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const csv=[LAST.head].concat(LAST.rows).map(r=>r.map(q).join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download=(CUR.t+'_'+D.from+'_'+D.to).replace(/[^\w\-]+/g,'_')+'.csv';a.click();}
function toggleTheme(){const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('bnx_theme_rep',r.dataset.theme);}catch(e){}}
function boot(){try{const t=localStorage.getItem('bnx_theme_rep');if(t)document.documentElement.dataset.theme=t;}catch(e){}
  if(!cid()){$('content').innerHTML='<div class="banner bad" style="display:block">No client session found - taking you to the login page…</div>';setTimeout(()=>location.replace('../login.html'),2500);return;}
  $('who').textContent=(userName()?userName()+' · ':'')+cid();
  let g='';$('menu').innerHTML=MENU.map(m=>(m.g!==g?(g=m.g,'<div class="grp">'+esc(m.g)+'</div>'):'')+'<button data-id="'+m.id+'" onclick="showView(\''+m.id+'\')">'+esc(m.i)+' '+esc(m.t)+'</button>').join('');
  preset('month');showView(MENU[0].id);}
window.addEventListener('DOMContentLoaded',boot);
