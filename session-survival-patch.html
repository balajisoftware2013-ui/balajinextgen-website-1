<!-- ═══════════════════════════════════════════════════════════
     BALAJI NEXTGEN ERP — SESSION SURVIVAL PATCH
     Fixes: "click POS → bounced to login.html" on the live site

     WHAT THIS DOES
     Some page on your live site wipes ERP_USER / ERP_SESSION /
     ERP_EXPIRY from localStorage on 'pagehide' or 'beforeunload' —
     an event that fires on NORMAL in-app navigation, not just tab
     close. That wipe happens BEFORE the next page (e.g. the
     restaurant dashboard) loads, so it finds no session and sends
     you to login.html.

     This patch keeps a live mirror of your session in
     sessionStorage (which nothing on your site clears) and
     restores it into localStorage the instant a page loads and
     finds it missing — before any login-check code on that page
     gets a chance to run.

     HOW TO INSTALL
     Paste this ENTIRE block as the very first thing inside the
     <head> of EVERY page in the app — at minimum:
       - login.html            (so the backup starts right after login)
       - welcome.html
       - Dashboard/restaurant/restaurant-dashboard.html
       - any other Dashboard/*.html pages users navigate to
     It must load before any other script on the page, including
     enforceSession() / the Restaurant Auth Gate / erp-config.js.
     It is safe to include on every page — it does nothing harmful
     if the session is already present and valid.

     You do NOT need to remove your existing pagehide/beforeunload
     wipe code. This patch works alongside it.
   ═══════════════════════════════════════════════════════════ -->
<script>
(function(){
  var SESSION_KEYS = ['ERP_USER','ERP_SESSION','ERP_ROLE','ERP_CLIENT','ERP_EXPIRY'];
  var BACKUP_PREFIX = 'bnx_session_backup__';

  /* 1) RESTORE FIRST — runs immediately, before anything else on
        the page. If localStorage has no user but sessionStorage
        has a recent backup, restore it right now. */
  try {
    if (!localStorage.getItem('ERP_USER')) {
      SESSION_KEYS.forEach(function(key){
        var backupValue = sessionStorage.getItem(BACKUP_PREFIX + key);
        if (backupValue !== null) {
          localStorage.setItem(key, backupValue);
        }
      });
    }
  } catch(e) { /* ignore storage errors (private mode, etc.) */ }

  /* 2) KEEP MIRRORING — so the backup is always fresh, in case
        this page is the one that logs in or refreshes the session. */
  function mirrorSessionToBackup(){
    try {
      SESSION_KEYS.forEach(function(key){
        var value = localStorage.getItem(key);
        if (value !== null) {
          sessionStorage.setItem(BACKUP_PREFIX + key, value);
        }
      });
    } catch(e) { /* ignore storage errors */ }
  }

  mirrorSessionToBackup();
  setInterval(mirrorSessionToBackup, 1000);
  document.addEventListener('click', mirrorSessionToBackup, true);   // capture phase: fires before navigation starts
  window.addEventListener('pagehide', mirrorSessionToBackup, true);  // last chance, in case click handler was skipped
})();
</script>
